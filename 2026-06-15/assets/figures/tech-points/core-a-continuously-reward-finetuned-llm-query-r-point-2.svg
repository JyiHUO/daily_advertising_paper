<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">半在线 MPO：只挑两端，反复训练</text>

  <!-- Sampling pool -->
  <g>
    <rect x="30" y="60" width="170" height="290" rx="10" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="115" y="82" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">N 个候选改写</text>

    <!-- top -->
    <rect x="45" y="95" width="140" height="22" rx="4" fill="#FFE9D6" stroke="#E8915A"/>
    <text x="115" y="111" text-anchor="middle" font-size="11" fill="#1E3A5F">top-k  奖励高 ▲</text>
    <rect x="45" y="120" width="140" height="22" rx="4" fill="#FFE9D6" stroke="#E8915A"/>
    <text x="115" y="136" text-anchor="middle" font-size="11" fill="#1E3A5F">top-k</text>

    <!-- middle discarded -->
    <g opacity="0.35">
      <rect x="45" y="155" width="140" height="16" rx="4" fill="#D9DEE6"/>
      <rect x="45" y="173" width="140" height="16" rx="4" fill="#D9DEE6"/>
      <rect x="45" y="191" width="140" height="16" rx="4" fill="#D9DEE6"/>
      <rect x="45" y="209" width="140" height="16" rx="4" fill="#D9DEE6"/>
    </g>
    <text x="115" y="203" text-anchor="middle" font-size="10" fill="#3D4F65" font-style="italic">中间丢弃</text>

    <!-- bottom -->
    <rect x="45" y="245" width="140" height="22" rx="4" fill="#DCE8F7" stroke="#4B8BDA"/>
    <text x="115" y="261" text-anchor="middle" font-size="11" fill="#1E3A5F">bottom-k</text>
    <rect x="45" y="270" width="140" height="22" rx="4" fill="#DCE8F7" stroke="#4B8BDA"/>
    <text x="115" y="286" text-anchor="middle" font-size="11" fill="#1E3A5F">bottom-k 奖励低 ▼</text>

    <text x="115" y="330" text-anchor="middle" font-size="10" fill="#3D4F65">采一次，复用整阶段</text>
  </g>

  <!-- arrow to pairs -->
  <path d="M202,205 L262,205" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="232" y="197" text-anchor="middle" font-size="10" fill="#3D4F65">配对</text>

  <!-- k×k preference pairs -->
  <g>
    <rect x="265" y="130" width="155" height="150" rx="10" fill="#FFF7EC" stroke="#E8915A"/>
    <text x="342" y="151" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">k × k 偏好对</text>
    <text x="342" y="173" text-anchor="middle" font-size="11" fill="#3D4F65">▲ 胜  vs  ▼ 负</text>
    <text x="342" y="193" text-anchor="middle" font-size="11" fill="#3D4F65">奖励差 &gt; 阈值</text>
    <line x1="285" y1="210" x2="400" y2="210" stroke="#E8915A" stroke-dasharray="3,3"/>
    <text x="342" y="240" text-anchor="middle" font-size="10" fill="#3D4F65">同一批反复训 1 epoch</text>
    <text x="342" y="260" text-anchor="middle" font-size="10" fill="#3D4F65">期间不再 rollout</text>
  </g>

  <path d="M422,205 L460,205" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- MPO loss circle -->
  <g>
    <circle cx="528" cy="205" r="70" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="528" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">MPO 损失</text>

    <text x="528" y="183" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">DPO</text>
    <text x="528" y="196" text-anchor="middle" font-size="9" fill="#3D4F65">相对排序</text>

    <text x="498" y="225" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">BCO</text>
    <text x="498" y="238" text-anchor="middle" font-size="9" fill="#3D4F65">绝对校准</text>

    <text x="560" y="225" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">SFT</text>
    <text x="560" y="238" text-anchor="middle" font-size="9" fill="#3D4F65">分布锚定</text>
  </g>

  <!-- loop back arrow: phase boundary -->
  <path d="M528,275 Q528,360 300,370 Q115,378 115,355" stroke="#E8915A" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#a)"/>
  <text x="320" y="395" text-anchor="middle" font-size="11" fill="#1E3A5F">阶段边界：余弦 warm restart · 参数 per-phase 同步 · 重新 rollout</text>
</svg>
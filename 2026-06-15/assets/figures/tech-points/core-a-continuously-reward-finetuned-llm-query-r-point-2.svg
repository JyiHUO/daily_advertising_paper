<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8AA0"/>
    </marker>
  </defs>

  <text x="300" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">半在线 MPO：攒一批偏好对集中练</text>

  <!-- Phase batch barrel -->
  <rect x="40" y="80" width="190" height="260" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="135" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Phase 开头采样一次</text>
  <text x="135" y="121" text-anchor="middle" font-size="11" fill="#3D4F65">每条 query 采 N 个改写</text>

  <!-- top-k -->
  <rect x="60" y="138" width="150" height="52" rx="8" fill="#DCEBFB" stroke="#4B8BDA"/>
  <text x="135" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">Top-k  ✓ chosen</text>
  <text x="135" y="178" text-anchor="middle" font-size="10" fill="#3D4F65">高奖励样本</text>

  <!-- pair -->
  <text x="135" y="220" text-anchor="middle" font-size="14" fill="#C97B4A" font-weight="700">k × k 偏好对</text>
  <text x="135" y="238" text-anchor="middle" font-size="10" fill="#3D4F65">(奖励差 &gt; margin)</text>

  <!-- bottom-k -->
  <rect x="60" y="258" width="150" height="52" rx="8" fill="#F5E4D7" stroke="#C97B4A"/>
  <text x="135" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">Bottom-k  ✗ rejected</text>
  <text x="135" y="298" text-anchor="middle" font-size="10" fill="#3D4F65">低奖励样本</text>

  <!-- arrow to loss -->
  <line x1="232" y1="210" x2="298" y2="210" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="265" y="202" text-anchor="middle" font-size="10" fill="#3D4F65">复用</text>

  <!-- Composite loss -->
  <rect x="300" y="80" width="260" height="260" rx="14" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="430" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">整个 phase 跑一个 MPO epoch</text>
  <text x="430" y="122" text-anchor="middle" font-size="10" fill="#3D4F65">三损失加权，phase 末才同步参数</text>

  <circle cx="350" cy="195" r="32" fill="#DCEBFB" stroke="#4B8BDA"/>
  <text x="350" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">DPO</text>
  <text x="350" y="208" text-anchor="middle" font-size="9" fill="#3D4F65">相对排序</text>

  <circle cx="430" cy="195" r="32" fill="#F5E4D7" stroke="#C97B4A"/>
  <text x="430" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">BCO</text>
  <text x="430" y="208" text-anchor="middle" font-size="9" fill="#3D4F65">绝对校准</text>

  <circle cx="510" cy="195" r="32" fill="#EFF6FF" stroke="#4B8BDA"/>
  <text x="510" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">SFT</text>
  <text x="510" y="208" text-anchor="middle" font-size="9" fill="#3D4F65">锚定高奖励</text>

  <text x="430" y="262" text-anchor="middle" font-size="11" fill="#3D4F65">→ 防 chosen/rejected 一起塌陷</text>

  <!-- next phase loop -->
  <rect x="330" y="282" width="200" height="42" rx="8" fill="#F4F7FB" stroke="#7A8AA0" stroke-dasharray="4 3"/>
  <text x="430" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">epoch 末：推新权重 + cosine 重启</text>
  <text x="430" y="316" text-anchor="middle" font-size="10" fill="#3D4F65">进入下一 phase</text>

  <!-- loop back arrow -->
  <path d="M330 303 C 250 303, 230 360, 135 360 L 135 345" fill="none" stroke="#7A8AA0" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arLoop)"/>

  <!-- bottom contrast -->
  <line x1="40" y1="386" x2="560" y2="386" stroke="#C0C9D6" stroke-dasharray="3 3"/>
  <text x="170" y="406" text-anchor="middle" font-size="11" fill="#8A9AAE">GRPO：每步采样 + 同步，高频且贵</text>
  <text x="430" y="406" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">CoRe：每 phase 同步一次，奖励可批量算</text>
</svg>
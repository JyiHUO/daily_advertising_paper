<svg height="600" width="960" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">同一把尺子：训练奖励 ≡ 线上融合公式</text>

  <!-- Left: Online ranking formula -->
  <rect x="50" y="80" width="300" height="170" rx="10" fill="#FEF3E8" stroke="#E8A765" stroke-width="2"/>
  <text x="200" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">线上排序融合</text>
  <text x="200" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#3D4F65">S_pos^(1+γ) / S_neg</text>
  <text x="200" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#3D4F65">× (S_pos / S_rand)^α</text>
  <text x="200" y="222" text-anchor="middle" font-size="12" fill="#8C6A3F">乘法比值（精排 × 召回）</text>

  <!-- Right: Reward formula -->
  <rect x="450" y="80" width="300" height="170" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="600" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">改写器训练奖励</text>
  <text x="600" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#3D4F65">同样的乘法比值结构</text>
  <text x="600" y="190" text-anchor="middle" font-size="13" fill="#3D4F65">复用线上多模态打分器 s(q,d)</text>
  <text x="600" y="222" text-anchor="middle" font-size="12" fill="#4B8BDA">代数对齐 · 无仿真 gap</text>

  <!-- Equal sign between -->
  <text x="400" y="175" text-anchor="middle" font-size="38" font-weight="700" fill="#4B8BDA">≡</text>

  <!-- Three pools at bottom -->
  <text x="400" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#3D4F65">三个对比池 · 同时覆盖召回与精排</text>

  <circle cx="200" cy="375" r="52" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="200" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">正样本池</text>
  <text x="200" y="390" text-anchor="middle" font-size="11" fill="#3D4F65">点击加权 · S_pos</text>

  <circle cx="400" cy="375" r="52" fill="#FEF3E8" stroke="#E8A765" stroke-width="2"/>
  <text x="400" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">硬负池</text>
  <text x="400" y="390" text-anchor="middle" font-size="11" fill="#3D4F65">曝光未点 · S_neg</text>

  <circle cx="600" cy="375" r="52" fill="#F4ECE4" stroke="#A89078" stroke-width="2"/>
  <text x="600" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">随机池</text>
  <text x="600" y="390" text-anchor="middle" font-size="11" fill="#3D4F65">海选易负 · S_rand</text>

  <!-- Arrows from pools converging up to reward box -->
  <path d="M 220 327 Q 380 270 545 252" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M 400 322 L 560 254" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M 590 324 Q 580 290 590 254" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>

  <text x="400" y="465" text-anchor="middle" font-size="12" fill="#3D4F65" font-style="italic">奖励优化方向 = 上线后真正生效的排序方向</text>
</svg>
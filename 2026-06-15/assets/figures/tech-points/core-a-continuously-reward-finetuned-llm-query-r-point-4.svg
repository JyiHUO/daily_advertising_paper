<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9A86A"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C76B6B"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-family="Helvetica,Arial" font-size="18" font-weight="700" fill="#1E3A5F">加性叠加，而非替换</text>

  <!-- Baseline ranking layer (always-on floor) -->
  <rect x="60" y="280" width="480" height="70" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="300" y="308" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" font-weight="700" fill="#1E3A5F">原排序链路（兜底）</text>
  <text x="300" y="330" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">召回 · 粗排 · 精排  始终在线</text>

  <!-- Rewriter signal as additive layer above -->
  <rect x="170" y="170" width="260" height="60" rx="10" fill="#FFF6E5" stroke="#C9A86A" stroke-width="2"/>
  <text x="300" y="194" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="700" fill="#1E3A5F">改写信号 × 叠加</text>
  <text x="300" y="214" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">近线缓存命中即注入</text>

  <!-- Cache source -->
  <circle cx="110" cy="115" r="42" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="110" y="112" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" font-weight="700" fill="#1E3A5F">KV 缓存</text>
  <text x="110" y="130" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">命中 90%+</text>

  <!-- Fault: rewriter down -->
  <circle cx="490" cy="115" r="42" fill="#FBECEC" stroke="#C76B6B" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="490" y="112" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" font-weight="700" fill="#1E3A5F">miss / 宕机</text>
  <text x="490" y="130" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">信号缺席</text>

  <!-- Arrow: cache feeds additive layer -->
  <path d="M140,142 C175,165 195,172 215,178" fill="none" stroke="#C9A86A" stroke-width="2" marker-end="url(#arO)"/>

  <!-- Arrow: additive layer multiplies into baseline -->
  <path d="M300,230 L300,278" fill="none" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="312" y="258" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">乘法因子</text>

  <!-- Arrow: failure path skips additive, goes straight to baseline -->
  <path d="M490,158 C490,220 480,255 470,278" fill="none" stroke="#C76B6B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arR)"/>
  <text x="500" y="222" font-family="Helvetica,Arial" font-size="11" fill="#C76B6B">回退</text>

  <!-- Bottom note -->
  <text x="300" y="385" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">最坏情况：退化到 baseline，不打挂 pipeline</text>
</svg>
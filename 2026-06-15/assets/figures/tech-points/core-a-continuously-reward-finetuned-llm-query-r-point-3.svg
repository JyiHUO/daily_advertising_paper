<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A9A6B"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C44545"/>
    </marker>
  </defs>

  <text x="300" y="32" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1E3A5F">双族指标自动晋升网关</text>
  <text x="300" y="52" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">奖励涨 ≠ 可上线</text>

  <!-- Candidate model -->
  <circle cx="80" cy="210" r="48" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="80" y="206" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1E3A5F" font-weight="bold">候选 θ'</text>
  <text x="80" y="224" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">每周一只</text>

  <!-- Reward gate -->
  <rect x="210" y="105" width="190" height="90" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="305" y="130" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">奖励族 · 必须全胜</text>
  <text x="305" y="152" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">r-main · S-pos · r-rand</text>
  <text x="305" y="178" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7A8AA0" font-style="italic">"成绩有没有涨"</text>

  <!-- Stability gate -->
  <rect x="210" y="225" width="190" height="90" rx="10" fill="#FFF4EC" stroke="#E89A4C" stroke-width="2"/>
  <text x="305" y="250" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">稳定族 · 必须在区间</text>
  <text x="305" y="272" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">熵 · surprisal · 长度 · 截断率</text>
  <text x="305" y="298" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7A8AA0" font-style="italic">"有没有在薅奖励"</text>

  <!-- arrows from candidate to gates -->
  <line x1="128" y1="195" x2="208" y2="155" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="128" y1="225" x2="208" y2="265" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Promote -->
  <rect x="455" y="130" width="120" height="60" rx="8" fill="#E8F4EC" stroke="#4A9A6B" stroke-width="2"/>
  <text x="515" y="155" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#2F6B4A">晋升上线</text>
  <text x="515" y="175" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">两族都通过</text>

  <!-- Reject -->
  <rect x="455" y="230" width="120" height="60" rx="8" fill="#FBE9E9" stroke="#C44545" stroke-width="2"/>
  <text x="515" y="255" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#A02828">保留原模型</text>
  <text x="515" y="275" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">任一项不达标</text>

  <!-- Pass: both gates AND -> promote -->
  <path d="M400,145 L455,150" stroke="#4A9A6B" stroke-width="2" fill="none" marker-end="url(#arG)"/>
  <path d="M400,255 Q428,210 455,170" stroke="#4A9A6B" stroke-width="2" fill="none" marker-end="url(#arG)" stroke-dasharray="4,3"/>
  <text x="428" y="138" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2F6B4A">通过</text>

  <!-- Fail: any gate -> reject -->
  <path d="M400,175 Q428,210 455,250" stroke="#C44545" stroke-width="2" fill="none" marker-end="url(#arR)" stroke-dasharray="4,3"/>
  <path d="M400,275 L455,268" stroke="#C44545" stroke-width="2" fill="none" marker-end="url(#arR)"/>
  <text x="428" y="288" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#A02828">不达标</text>

  <text x="300" y="395" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7A8AA0">5 个月 20 次重训 · 16 次晋升 · 3 次被稳定族拦下</text>
</svg>
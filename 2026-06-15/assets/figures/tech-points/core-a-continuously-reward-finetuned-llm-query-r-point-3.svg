<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C6FBF"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3DA37A"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">双闸门：奖励涨 ≠ 可上线</text>
  <text x="300" y="54" text-anchor="middle" font-size="11" fill="#3D4F65">候选模型必须同时通过两道门</text>

  <!-- Candidate model -->
  <circle cx="70" cy="220" r="40" fill="#FEF3E7" stroke="#E8A857" stroke-width="2"/>
  <text x="70" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">候选 θ'</text>
  <text x="70" y="234" text-anchor="middle" font-size="10" fill="#3D4F65">每周重训</text>

  <!-- Arrows to gates -->
  <line x1="111" y1="210" x2="195" y2="160" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="111" y1="230" x2="195" y2="280" stroke="#8C6FBF" stroke-width="2" marker-end="url(#arrP)"/>

  <!-- Gate 1: Reward -->
  <rect x="200" y="115" width="210" height="90" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="305" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">门1 · 奖励指标（必须↑）</text>
  <text x="305" y="162" text-anchor="middle" font-size="11" fill="#3D4F65">r_main · S_pos · r_rand</text>
  <text x="305" y="190" text-anchor="middle" font-size="13" fill="#4B8BDA">▲   ▲   ▲</text>

  <!-- Gate 2: Stability -->
  <rect x="200" y="235" width="210" height="90" rx="10" fill="#F4EFFB" stroke="#8C6FBF" stroke-width="2"/>
  <text x="305" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">门2 · 稳定性（必须在区间）</text>
  <text x="305" y="282" text-anchor="middle" font-size="11" fill="#3D4F65">熵 · surprisal · 长度 · 截断率</text>
  <text x="305" y="310" text-anchor="middle" font-size="13" fill="#8C6FBF">▮—▮—▮—▮</text>

  <!-- AND junction -->
  <line x1="410" y1="160" x2="438" y2="208" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="410" y1="280" x2="438" y2="232" stroke="#8C6FBF" stroke-width="2" marker-end="url(#arrP)"/>
  <circle cx="455" cy="220" r="22" fill="#1E3A5F"/>
  <text x="455" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">AND</text>

  <!-- Output: deploy -->
  <line x1="478" y1="220" x2="520" y2="220" stroke="#3DA37A" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="555" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#3DA37A">上线</text>
  <text x="555" y="232" text-anchor="middle" font-size="10" fill="#3D4F65">16/20 次</text>

  <!-- Insight box -->
  <rect x="60" y="345" width="480" height="60" rx="8" fill="#FFF5F2" stroke="#D97757" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="300" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">关键洞察：奖励看不见自己的漏洞</text>
  <text x="300" y="388" text-anchor="middle" font-size="11" fill="#3D4F65">改写越写越长 → 奖励还在涨，但截断率飙升 → 仅门2能拦下</text>
</svg>
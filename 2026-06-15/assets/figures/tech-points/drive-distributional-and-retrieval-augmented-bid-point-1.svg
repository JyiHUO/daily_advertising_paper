<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" font-family="Helvetica,Arial" font-size="20" font-weight="bold" fill="#1E3A5F">从"平均值"到"多峰分布"：GMM 动作头</text>

  <!-- LEFT: single peak (MSE) -->
  <g>
    <text x="200" y="86" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#3D4F65">原方法 · MSE 单点</text>
    <rect x="50" y="100" width="300" height="200" rx="10" fill="#F5F1EC" stroke="#C9A87C" stroke-width="1.5"/>

    <line x1="90" y1="260" x2="320" y2="260" stroke="#3D4F65" stroke-width="1.5"/>
    <path d="M 100 260 Q 205 130 310 260" fill="none" stroke="#C9885C" stroke-width="2.5"/>
    <line x1="205" y1="260" x2="205" y2="155" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="4,3"/>
    <circle cx="205" cy="260" r="4" fill="#1E3A5F"/>
    <text x="205" y="280" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#1E3A5F">≈10 折中价</text>

    <text x="200" y="330" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#8A6B4A" font-style="italic">高价与低价被平均成中间值</text>
  </g>

  <!-- arrow between -->
  <line x1="355" y1="200" x2="445" y2="200" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="400" y="188" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="bold" fill="#4B8BDA">换成 GMM 头</text>

  <!-- RIGHT: two peaks (GMM) -->
  <g>
    <text x="600" y="86" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#3D4F65">GMM · 多峰分布</text>
    <rect x="450" y="100" width="300" height="200" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>

    <line x1="490" y1="260" x2="720" y2="260" stroke="#3D4F65" stroke-width="1.5"/>
    <path d="M 495 260 Q 545 165 595 260" fill="none" stroke="#4B8BDA" stroke-width="2.5"/>
    <path d="M 600 260 Q 660 145 720 260" fill="none" stroke="#1E3A5F" stroke-width="2.5"/>

    <circle cx="545" cy="260" r="4" fill="#4B8BDA"/>
    <circle cx="660" cy="260" r="4" fill="#1E3A5F"/>
    <text x="545" y="280" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#4B8BDA">出价≈5</text>
    <text x="660" y="280" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#1E3A5F">出价≈15</text>
  </g>

  <!-- bottom: sampling -->
  <line x1="600" y1="310" x2="600" y2="360" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="660" y="338" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">采样 L 个</text>

  <g>
    <rect x="460" y="365" width="280" height="90" rx="10" fill="#FFF6E8" stroke="#C9A87C" stroke-width="1.5"/>
    <text x="600" y="392" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#1E3A5F">候选出价集合 → critic 筛选</text>
    <text x="600" y="418" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#3D4F65">{ a₁, a₂, ... a_L }</text>
    <text x="600" y="438" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#8A6B4A" font-style="italic">由 critic 决定走激进或保守</text>
  </g>

  <!-- side note -->
  <g>
    <rect x="100" y="370" width="200" height="80" rx="10" fill="#F0F7F0" stroke="#7AA87A" stroke-width="1.2"/>
    <text x="200" y="398" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="bold" fill="#1E3A5F">单步推断 11 ms</text>
    <text x="200" y="425" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#5A7A5A">扩散动作头需 223 ms</text>
    <text x="200" y="442" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#5A7A5A">更适合实时竞价</text>
  </g>

  <text x="400" y="482" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65" font-style="italic">显式建模"多种合理策略并存"，避免平均动作陷阱</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,sans-serif">
  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">候选动作 → 价值裁判 → 最终出价</text>
  <text x="300" y="55" text-anchor="middle" font-size="12" fill="#3D4F65">IQL critic 取 min(Q₁,Q₂) 最大者</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- candidate pool -->
  <rect x="40" y="100" width="170" height="220" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="125" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">候选池 A_cand</text>

  <circle cx="80" cy="160" r="8" fill="#4B8BDA"/>
  <circle cx="115" cy="180" r="8" fill="#4B8BDA"/>
  <circle cx="155" cy="165" r="8" fill="#4B8BDA"/>
  <circle cx="90" cy="215" r="8" fill="#4B8BDA"/>
  <circle cx="170" cy="210" r="8" fill="#4B8BDA"/>

  <circle cx="75" cy="260" r="8" fill="#E89B5C"/>
  <circle cx="125" cy="275" r="8" fill="#E89B5C"/>
  <circle cx="175" cy="258" r="8" fill="#E89B5C"/>

  <text x="70" y="305" font-size="11" fill="#4B8BDA">● GMM   ● 检索</text>
  <circle cx="123" cy="301" r="4" fill="#E89B5C"/>

  <line x1="212" y1="210" x2="256" y2="210" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Judge -->
  <g transform="translate(260,130)">
    <rect width="170" height="180" rx="14" fill="#FFF4E6" stroke="#E89B5C" stroke-width="1.5"/>
    <text x="85" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">IQL 价值裁判</text>

    <line x1="85" y1="55" x2="85" y2="100" stroke="#1E3A5F" stroke-width="2"/>
    <line x1="40" y1="75" x2="130" y2="75" stroke="#1E3A5F" stroke-width="2"/>
    <rect x="28" y="78" width="28" height="18" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="42" y="91" text-anchor="middle" font-size="10" fill="#1E3A5F">Q₁</text>
    <rect x="114" y="78" width="28" height="18" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="128" y="91" text-anchor="middle" font-size="10" fill="#1E3A5F">Q₂</text>
    <polygon points="75,100 95,100 85,115" fill="#1E3A5F"/>

    <text x="85" y="140" text-anchor="middle" font-size="12" fill="#3D4F65">取 min → 选最大 · CPA 超标打折</text>
  </g>

  <line x1="432" y1="210" x2="472" y2="210" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Final bid -->
  <circle cx="525" cy="210" r="50" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="525" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">最终</text>
  <text x="525" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">bid 0.9</text>

  <text x="300" y="380" text-anchor="middle" font-size="12" fill="#3D4F65">只信数据内动作 · 安全 + 高收益</text>
</svg>
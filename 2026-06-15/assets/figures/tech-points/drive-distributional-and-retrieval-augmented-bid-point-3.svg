<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">候选很多，谁敢出手？</text>

  <!-- 候选池 -->
  <g>
    <rect x="40" y="80" width="180" height="260" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="130" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">候选 bid 池</text>
    <text x="130" y="123" text-anchor="middle" font-size="10" fill="#3D4F65">GMM 采样 + 检索 · 多峰共存</text>

    <circle cx="80"  cy="170" r="16" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="80" y="174" text-anchor="middle" font-size="11" fill="#3D4F65">4.8</text>
    <circle cx="135" cy="180" r="16" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="135" y="184" text-anchor="middle" font-size="11" fill="#3D4F65">5.0</text>
    <circle cx="185" cy="170" r="16" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="185" y="174" text-anchor="middle" font-size="11" fill="#3D4F65">5.1</text>
    <circle cx="80"  cy="245" r="16" fill="#FFFFFF" stroke="#E8A87C"/>
    <text x="80" y="249" text-anchor="middle" font-size="11" fill="#3D4F65">14.7</text>
    <circle cx="135" cy="255" r="16" fill="#FFFFFF" stroke="#E8A87C"/>
    <text x="135" y="259" text-anchor="middle" font-size="11" fill="#3D4F65">14.9</text>
    <circle cx="185" cy="245" r="16" fill="#FFFFFF" stroke="#E8A87C"/>
    <text x="185" y="249" text-anchor="middle" font-size="11" fill="#3D4F65">15.2</text>

    <text x="100" y="310" text-anchor="middle" font-size="10" fill="#4B8BDA">低价峰</text>
    <text x="165" y="310" text-anchor="middle" font-size="10" fill="#C97A3F">高价峰</text>
  </g>

  <!-- arrow to critic -->
  <path d="M225 210 L288 210" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- IQL Critic -->
  <g>
    <circle cx="370" cy="210" r="78" fill="#FFF7ED" stroke="#1E3A5F" stroke-width="2"/>
    <text x="370" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">IQL Critic</text>
    <text x="370" y="208" text-anchor="middle" font-size="11" fill="#3D4F65">打分 min(Q₁, Q₂)</text>
    <text x="370" y="227" text-anchor="middle" font-size="11" fill="#3D4F65">CPA 约束塑形奖励</text>
    <text x="370" y="246" text-anchor="middle" font-size="10" fill="#8C6A4F">避开 OOD 高估</text>
  </g>

  <!-- arrow to chosen -->
  <path d="M450 210 L503 210" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- chosen bid -->
  <g>
    <rect x="505" y="170" width="80" height="80" rx="12" fill="#1E3A5F"/>
    <text x="545" y="200" text-anchor="middle" font-size="12" fill="#EFF6FF">选中</text>
    <text x="545" y="228" text-anchor="middle" font-size="20" font-weight="700" fill="#FFF7ED">5.0</text>
    <text x="545" y="244" text-anchor="middle" font-size="9" fill="#EFF6FF">安全且有效</text>
  </g>

  <text x="300" y="390" text-anchor="middle" font-size="12" fill="#3D4F65">不取平均：用保守价值评估器在多峰候选中挑出安全又有效的那一个</text>
</svg>
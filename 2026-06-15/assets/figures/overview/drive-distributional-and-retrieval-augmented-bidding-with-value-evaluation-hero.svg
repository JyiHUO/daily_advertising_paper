<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E07A5F"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4F9D69"/>
    </marker>
    <radialGradient id="gmm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE9DC"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="620" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">DRIVE：把"生成候选"与"决策选 bid"解耦的离线出价框架</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#3D4F65">破解 Decision Transformer 的"平均动作陷阱"与长尾流量下的不可靠出价</text>

  <!-- Left: problem (averaged action trap) -->
  <g>
    <text x="150" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#B5482A">原 DT：单峰回归 → 平均陷阱</text>
    <g transform="translate(40,130)">
      <path d="M0,110 Q35,40 70,110" fill="none" stroke="#C7CCD4" stroke-width="2" stroke-dasharray="3,3"/>
      <path d="M150,110 Q185,40 220,110" fill="none" stroke="#C7CCD4" stroke-width="2" stroke-dasharray="3,3"/>
      <path d="M60,110 Q110,70 160,110" fill="none" stroke="#E07A5F" stroke-width="2.5"/>
      <line x1="0" y1="110" x2="220" y2="110" stroke="#3D4F65" stroke-width="1"/>
      <text x="35" y="128" text-anchor="middle" font-size="10" fill="#7A8494">低价</text>
      <text x="110" y="128" text-anchor="middle" font-size="10" fill="#B5482A" font-weight="600">折中价 ✗</text>
      <text x="185" y="128" text-anchor="middle" font-size="10" fill="#7A8494">高价</text>
    </g>
  </g>

  <!-- Right: long-tail issue -->
  <g>
    <text x="750" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#B5482A">长尾流量：纯参数化 → 凭空臆测</text>
    <g transform="translate(640,135)">
      <circle cx="20" cy="50" r="14" fill="#E8ECF1"/>
      <circle cx="55" cy="35" r="10" fill="#E8ECF1"/>
      <circle cx="90" cy="55" r="8" fill="#E8ECF1"/>
      <circle cx="130" cy="40" r="5" fill="#E8ECF1"/>
      <circle cx="170" cy="60" r="3" fill="#E8ECF1"/>
      <circle cx="200" cy="45" r="2" fill="#E8ECF1"/>
      <text x="110" y="100" text-anchor="middle" font-size="10" fill="#B5482A">？不靠谱出价</text>
    </g>
  </g>

  <!-- Center hub: Candidate Pool -->
  <g>
    <ellipse cx="450" cy="345" rx="120" ry="70" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="450" y="335" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">候选动作池</text>
    <text x="450" y="356" text-anchor="middle" font-size="11" fill="#3D4F65">生成候选 + 检索候选</text>
    <text x="450" y="374" text-anchor="middle" font-size="10" fill="#6B7A8F" font-style="italic">decouple generation from decision</text>
  </g>

  <!-- Left source: GMM multi-modal head -->
  <g>
    <rect x="75" y="295" width="170" height="100" rx="14" fill="#FFF4EC" stroke="#E07A5F" stroke-width="1.8"/>
    <text x="160" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#B5482A">GMM 多峰动作头</text>
    <path d="M95,372 Q117,342 140,372 Q163,342 185,372 Q200,365 220,372" fill="none" stroke="#E07A5F" stroke-width="2"/>
    <line x1="90" y1="372" x2="225" y2="372" stroke="#B5482A" stroke-width="1"/>
    <text x="160" y="388" text-anchor="middle" font-size="10" fill="#3D4F65">采样 L 个分布候选</text>
  </g>

  <!-- Right source: Retrieval -->
  <g>
    <rect x="655" y="295" width="170" height="100" rx="14" fill="#EAF6EE" stroke="#4F9D69" stroke-width="1.8"/>
    <text x="740" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#2F6B43">检索增强</text>
    <text x="740" y="340" text-anchor="middle" font-size="11" fill="#3D4F65">历史高 RTG 决策 · Top-K 近邻</text>
    <g stroke="#4F9D69" stroke-width="1.5">
      <line x1="675" y1="362" x2="805" y2="362"/>
      <line x1="675" y1="375" x2="795" y2="375"/>
      <line x1="675" y1="388" x2="780" y2="388"/>
    </g>
  </g>

  <!-- Arrows from sources into pool -->
  <path d="M245,345 L330,345" stroke="#E07A5F" stroke-width="2.2" fill="none" marker-end="url(#arrW)"/>
  <path d="M655,345 L570,345" stroke="#4F9D69" stroke-width="2.2" fill="none" marker-end="url(#arrG)"/>

  <!-- Down: IQL critic -->
  <g>
    <rect x="335" y="460" width="230" height="70" rx="14" fill="#1E3A5F"/>
    <text x="450" y="487" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">IQL Critic 价值评估</text>
    <text x="450" y="508" text-anchor="middle" font-size="11" fill="#BFD2E8">argmax min(Q₁,Q₂) · CPA 约束塑形</text>
  </g>
  <path d="M450,415 L450,458" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- Output -->
  <g>
    <circle cx="780" cy="495" r="48" fill="#FEF3E2" stroke="#E0A24B" stroke-width="2"/>
    <text x="780" y="490" text-anchor="middle" font-size="13" font-weight="700" fill="#8A5A1A">最终出价</text>
    <text x="780" y="510" text-anchor="middle" font-size="11" fill="#8A5A1A">bid*</text>
  </g>
  <path d="M565,495 L730,495" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- Bottom tags -->
  <g font-size="11" fill="#3D4F65">
    <text x="60" y="580">即插即用：BC / DT / CDT / PDiT</text>
    <text x="450" y="580" text-anchor="middle" font-weight="600" fill="#1E3A5F">AuctionNet 上 PDiT 平均回报 +19.2%</text>
    <text x="840" y="580" text-anchor="end">单步推断 11ms</text>
  </g>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <radialGradient id="gmm" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#FCE7B3"/>
      <stop offset="100%" stop-color="#F4B860" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <rect width="900" height="620" fill="#FAFBFD"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">DRIVE：从"平均出价"到"多候选 + 价值裁判"</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#3D4F65">分布式建模 · 检索增强 · IQL 价值评估，避开 Average Action 陷阱</text>

  <!-- LEFT: Problem -->
  <g>
    <text x="170" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#B85C5C">问题：单峰回归被平均</text>
    <path d="M60,260 Q110,160 160,260 Q210,360 260,260 Q280,230 295,260" fill="none" stroke="#B85C5C" stroke-width="2"/>
    <line x1="175" y1="180" x2="175" y2="290" stroke="#B85C5C" stroke-dasharray="4 3" stroke-width="1.5"/>
    <circle cx="175" cy="260" r="6" fill="#B85C5C"/>
    <text x="175" y="310" text-anchor="middle" font-size="11" fill="#B85C5C">DT 均值预测：两头都不讨好</text>
    <text x="105" y="158" font-size="11" fill="#3D4F65">激进高价</text>
    <text x="235" y="158" font-size="11" fill="#3D4F65">保守低价</text>
  </g>

  <!-- arrow to center -->
  <line x1="305" y1="245" x2="335" y2="270" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- CENTER: DRIVE core -->
  <g>
    <circle cx="475" cy="300" r="155" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="475" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">DRIVE 候选池</text>

    <!-- GMM samples cluster -->
    <ellipse cx="425" cy="250" rx="62" ry="42" fill="url(#gmm)" stroke="#E89B3C" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="425" y="215" text-anchor="middle" font-size="12" font-weight="600" fill="#A06414">GMM 多峰采样</text>
    <circle cx="400" cy="248" r="4.5" fill="#E89B3C"/>
    <circle cx="420" cy="265" r="4.5" fill="#E89B3C"/>
    <circle cx="445" cy="245" r="4.5" fill="#E89B3C"/>
    <circle cx="455" cy="265" r="4.5" fill="#E89B3C"/>
    <circle cx="410" cy="235" r="4.5" fill="#E89B3C"/>

    <!-- Retrieval cluster -->
    <ellipse cx="540" cy="355" rx="58" ry="38" fill="#E8F0FB" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="540" y="395" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">RTG 检索增强</text>
    <rect x="515" y="345" width="8" height="8" fill="#4B8BDA"/>
    <rect x="535" y="355" width="8" height="8" fill="#4B8BDA"/>
    <rect x="550" y="340" width="8" height="8" fill="#4B8BDA"/>
    <rect x="560" y="358" width="8" height="8" fill="#4B8BDA"/>

    <!-- chosen action -->
    <g transform="translate(478,308)">
      <circle r="16" fill="#1E3A5F"/>
      <path d="M0,-10 L2.9,-3.3 L10,-3.3 L4.4,1.7 L6.6,9 L0,5 L-6.6,9 L-4.4,1.7 L-10,-3.3 L-2.9,-3.3 Z" fill="#FFD66B"/>
    </g>
    <text x="478" y="295" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">最终 bid</text>
  </g>

  <!-- IQL critic -->
  <g>
    <rect x="370" y="490" width="210" height="62" rx="10" fill="#FFF4E6" stroke="#E89B3C" stroke-width="1.8"/>
    <text x="475" y="514" text-anchor="middle" font-size="13" font-weight="700" fill="#A06414">IQL 价值裁判</text>
    <text x="475" y="534" text-anchor="middle" font-size="11" fill="#3D4F65">min(Q₁,Q₂) + CPA 惩罚 → argmax</text>
  </g>
  <!-- two-way: scoring down, selected bid up -->
  <line x1="455" y1="455" x2="455" y2="487" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="495" y1="487" x2="495" y2="455" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="408" y="476" font-size="10" fill="#4B8BDA">打分</text>
  <text x="500" y="476" font-size="10" fill="#4B8BDA">选优</text>

  <!-- RIGHT: result -->
  <g>
    <text x="760" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#1E7A4E">结果：稳健且更赚</text>

    <g transform="translate(680,170)">
      <line x1="-5" y1="120" x2="155" y2="120" stroke="#3D4F65" stroke-width="1"/>
      <rect x="0" y="60" width="35" height="60" fill="#B85C5C" opacity="0.7"/>
      <text x="17" y="135" text-anchor="middle" font-size="10" fill="#3D4F65">DT</text>
      <rect x="55" y="40" width="35" height="80" fill="#4B8BDA" opacity="0.8"/>
      <text x="72" y="135" text-anchor="middle" font-size="10" fill="#3D4F65">+GMM</text>
      <rect x="110" y="15" width="35" height="105" fill="#1E7A4E"/>
      <text x="127" y="135" text-anchor="middle" font-size="10" fill="#3D4F65">DRIVE</text>
    </g>
    <text x="760" y="325" text-anchor="middle" font-size="11" fill="#3D4F65">长尾流量回报 ↑</text>

    <text x="760" y="370" text-anchor="middle" font-size="11" fill="#1E7A4E">AuctionNet ✓   D4RL ✓</text>
    <text x="760" y="390" text-anchor="middle" font-size="11" fill="#1E7A4E">CPA 约束安全</text>
  </g>

  <!-- arrow center to right -->
  <line x1="630" y1="260" x2="680" y2="225" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- bottom legend -->
  <g transform="translate(90,585)">
    <circle cx="0" cy="0" r="5" fill="#E89B3C"/>
    <text x="10" y="4" font-size="11" fill="#3D4F65">分布式采样候选</text>
    <rect x="170" y="-5" width="10" height="10" fill="#4B8BDA"/>
    <text x="186" y="4" font-size="11" fill="#3D4F65">历史高回报检索</text>
    <g transform="translate(360,0)">
      <path d="M0,-7 L2,-2 L7,-2 L3,1.5 L4.5,6.5 L0,3.5 L-4.5,6.5 L-3,1.5 L-7,-2 L-2,-2 Z" fill="#FFD66B" stroke="#1E3A5F" stroke-width="0.8"/>
    </g>
    <text x="375" y="4" font-size="11" fill="#3D4F65">价值最优出价</text>
  </g>
</svg>
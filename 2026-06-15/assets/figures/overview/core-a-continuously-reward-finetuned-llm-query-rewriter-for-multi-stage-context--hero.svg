<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E08A3C"/>
    </marker>
    <linearGradient id="ringG" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4B8BDA"/>
      <stop offset="1" stop-color="#1E3A5F"/>
    </linearGradient>
  </defs>

  <rect width="900" height="620" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">CoRe：让查询改写器与线上排序"同源同构"的周更闭环</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#3D4F65">奖励 = 生产融合代数 · 半在线 MPO · 双族晋级闸门 · 加性消费</text>

  <!-- Center: closed loop ring -->
  <g transform="translate(450,340)">
    <circle r="155" fill="none" stroke="url(#ringG)" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.55"/>
    <circle r="78" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text y="-8" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">CoRe</text>
    <text y="12" text-anchor="middle" font-size="11" fill="#3D4F65">LLM 改写器</text>
    <text y="30" text-anchor="middle" font-size="10" fill="#7A8AA0">weekly redeploy</text>
  </g>

  <!-- Node 1: Reward (top) -->
  <g transform="translate(450,150)">
    <rect x="-115" y="-42" width="230" height="74" rx="10" fill="#FFF4E6" stroke="#E08A3C" stroke-width="1.8"/>
    <text x="0" y="-20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">① 奖励 ≡ 生产融合代数</text>
    <text x="0" y="0" text-anchor="middle" font-size="11" fill="#3D4F65">乘法比值 · 复用线上多模态相关性模型</text>
    <text x="0" y="18" text-anchor="middle" font-size="10.5" fill="#7A8AA0" font-style="italic">关闭仿真—生产 gap</text>
  </g>

  <!-- Node 2: MPO training (right) -->
  <g transform="translate(770,340)">
    <rect x="-110" y="-50" width="210" height="100" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="-5" y="-28" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">② 半在线 MPO</text>
    <text x="-5" y="-9" text-anchor="middle" font-size="11" fill="#3D4F65">top-k vs bottom-k 偏好对</text>
    <text x="-5" y="9" text-anchor="middle" font-size="11" fill="#3D4F65">DPO + BCO + SFT</text>
    <text x="-5" y="30" text-anchor="middle" font-size="10.5" fill="#7A8AA0" font-style="italic">per-step → per-phase</text>
  </g>

  <!-- Node 3: Promotion gate (bottom) -->
  <g transform="translate(450,530)">
    <rect x="-160" y="-42" width="320" height="74" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="0" y="-20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">③ 双族指标晋级闸门</text>
    <text x="0" y="0" text-anchor="middle" font-size="11" fill="#3D4F65">奖励族 ∧ 稳定性族（熵 / 长度 / 截断率）</text>
    <text x="0" y="18" text-anchor="middle" font-size="10.5" fill="#7A8AA0" font-style="italic">5 个月 20 次 → 16 次晋级，抓住一次 reward hacking</text>
  </g>

  <!-- Node 4: Additive consumption (left) -->
  <g transform="translate(130,340)">
    <rect x="-110" y="-72" width="220" height="144" rx="10" fill="#FFF4E6" stroke="#E08A3C" stroke-width="1.8"/>
    <text x="0" y="-50" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">④ 加性消费</text>
    <text x="0" y="-30" text-anchor="middle" font-size="10.5" fill="#7A8AA0">近线缓存 hit &gt; 90%</text>
    <line x1="-90" y1="-20" x2="90" y2="-20" stroke="#E08A3C" stroke-dasharray="2 2" opacity="0.5"/>
    <text x="-85" y="-2" font-size="11" fill="#3D4F65">· Recall</text>
    <text x="20" y="-2" font-size="11" fill="#3D4F65">+ 一路检索</text>
    <text x="-85" y="20" font-size="11" fill="#3D4F65">· RawRank</text>
    <text x="20" y="20" font-size="11" fill="#3D4F65">× 融合因子</text>
    <text x="-85" y="42" font-size="11" fill="#3D4F65">· FineRank</text>
    <text x="20" y="42" font-size="11" fill="#3D4F65">× 相关性</text>
    <text x="0" y="62" text-anchor="middle" font-size="10" fill="#B85C1A" font-style="italic">原信号永不替换 → 爆炸半径有界</text>
  </g>

  <!-- Loop arrows (clockwise) -->
  <path d="M 565 165 Q 690 195 745 285" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 745 398 Q 690 478 615 505" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 290 505 Q 210 478 150 408" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 155 270 Q 240 190 335 162" fill="none" stroke="#E08A3C" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arO)"/>

  <!-- Loop labels -->
  <text x="678" y="212" font-size="10.5" fill="#4B8BDA" font-style="italic">训练</text>
  <text x="688" y="476" font-size="10.5" fill="#4B8BDA" font-style="italic">晋级</text>
  <text x="200" y="476" font-size="10.5" fill="#4B8BDA" font-style="italic">部署</text>
  <text x="222" y="212" font-size="10.5" fill="#B85C1A" font-style="italic">线上日志反哺</text>

  <!-- Bottom takeaway -->
  <text x="450" y="600" text-anchor="middle" font-size="11.5" fill="#1E3A5F" font-weight="600">奖励同源 → 训练廉价 → 自动晋级 → 加性上线：四步闭合，支撑周级再部署</text>
</svg>
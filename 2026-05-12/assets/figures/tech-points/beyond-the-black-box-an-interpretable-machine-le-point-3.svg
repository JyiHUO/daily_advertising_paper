<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <radialGradient id="gMet" cx="30%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#E85D5D" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E85D5D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gIns" cx="80%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#3B6FB6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3B6FB6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gMid" cx="55%" cy="55%" r="30%">
      <stop offset="0%" stop-color="#E8B84B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E8B84B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">PCA当"地图"：先看分布，再选模型</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#3D4F65">13个描述符 → 投影到 PC1-PC2，按带隙着色</text>

  <!-- Left: high-dim block -->
  <g>
    <rect x="40" y="120" width="170" height="180" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="125" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">13维描述符</text>
    <text x="125" y="178" text-anchor="middle" font-size="11" fill="#3D4F65">能量 / 几何 / 组分</text>
    <!-- mini bars representing features -->
    <g fill="#4B8BDA" opacity="0.7">
      <rect x="60" y="220" width="10" height="40"/>
      <rect x="76" y="210" width="10" height="50"/>
      <rect x="92" y="232" width="10" height="28"/>
      <rect x="108" y="200" width="10" height="60"/>
      <rect x="124" y="225" width="10" height="35"/>
      <rect x="140" y="215" width="10" height="45"/>
      <rect x="156" y="240" width="10" height="20"/>
      <rect x="172" y="208" width="10" height="52"/>
    </g>
    <text x="125" y="282" text-anchor="middle" font-size="11" fill="#3D4F65">高维、难以可视化</text>
  </g>

  <!-- Arrow with PCA label -->
  <line x1="215" y1="210" x2="303" y2="210" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="260" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">PCA</text>
  <text x="260" y="228" text-anchor="middle" font-size="10" fill="#3D4F65">前3轴≈63%</text>

  <!-- Right: PC1-PC2 plane -->
  <g>
    <rect x="310" y="100" width="320" height="320" rx="10" fill="#FBF8F2" stroke="#3B6FB6" stroke-width="1.5"/>
    <!-- axes -->
    <line x1="340" y1="390" x2="610" y2="390" stroke="#1E3A5F" stroke-width="1.5"/>
    <line x1="340" y1="390" x2="340" y2="120" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="555" y="408" font-size="11" fill="#1E3A5F" font-weight="600">PC1 (30.2%)</text>
    <text x="348" y="115" font-size="11" fill="#1E3A5F" font-weight="600">PC2 (18.7%)</text>

    <!-- region clouds -->
    <ellipse cx="400" cy="340" rx="80" ry="55" fill="url(#gMet)"/>
    <ellipse cx="565" cy="170" rx="70" ry="50" fill="url(#gIns)"/>
    <ellipse cx="475" cy="265" rx="55" ry="40" fill="url(#gMid)"/>

    <!-- points -->
    <g>
      <circle cx="380" cy="350" r="4" fill="#E85D5D"/>
      <circle cx="410" cy="330" r="4" fill="#E85D5D"/>
      <circle cx="395" cy="365" r="4" fill="#E85D5D"/>
      <circle cx="425" cy="345" r="4" fill="#E85D5D"/>
      <circle cx="370" cy="325" r="4" fill="#E85D5D"/>
      <circle cx="440" cy="360" r="4" fill="#E85D5D"/>
      <circle cx="465" cy="270" r="4" fill="#E8B84B"/>
      <circle cx="490" cy="255" r="4" fill="#E8B84B"/>
      <circle cx="455" cy="285" r="4" fill="#E8B84B"/>
      <circle cx="500" cy="280" r="4" fill="#E8B84B"/>
      <circle cx="480" cy="245" r="4" fill="#E8B84B"/>
      <circle cx="555" cy="180" r="4" fill="#3B6FB6"/>
      <circle cx="575" cy="160" r="4" fill="#3B6FB6"/>
      <circle cx="540" cy="195" r="4" fill="#3B6FB6"/>
      <circle cx="585" cy="185" r="4" fill="#3B6FB6"/>
      <circle cx="565" cy="145" r="4" fill="#3B6FB6"/>
    </g>

    <!-- region labels -->
    <text x="385" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#B33A3A">金属性 (带隙≈0)</text>
    <text x="430" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#A07820">中等带隙</text>
    <text x="580" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#2A5590">宽带隙绝缘体</text>

    <!-- non-linear boundary hint -->
    <path d="M 350 380 Q 460 310 500 230 Q 530 160 605 130" fill="none" stroke="#1E3A5F" stroke-width="1.6" stroke-dasharray="6 4" opacity="0.7"/>
  </g>

  <!-- Bottom conclusion -->
  <g>
    <rect x="80" y="445" width="640" height="55" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="400" y="468" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">结论：分布有结构但分界非线性</text>
    <text x="400" y="488" text-anchor="middle" font-size="12" fill="#3D4F65">→ 线性模型不够，改用 随机森林 / CatBoost</text>
  </g>
</svg>
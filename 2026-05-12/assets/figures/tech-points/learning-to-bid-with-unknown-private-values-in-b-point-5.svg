<svg height="600" width="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#FAF8F4"/>

  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">Regret 随轮数 T 的增长：√T 阶最优</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#3D4F65">未知价值 + 删失反馈 + 预算/RoS 约束下，仍能逼近理论下界</text>

  <!-- Chart axes -->
  <line x1="240" y1="500" x2="720" y2="500" stroke="#1E3A5F" stroke-width="2"/>
  <line x1="240" y1="500" x2="240" y2="140" stroke="#1E3A5F" stroke-width="2"/>
  <text x="732" y="505" font-size="13" fill="#1E3A5F">T</text>
  <text x="234" y="132" text-anchor="end" font-size="13" fill="#1E3A5F">Regret</text>

  <!-- Linear curve (bad) -->
  <path d="M240,500 L690,160" stroke="#C97B7B" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>
  <text x="600" y="180" font-size="13" fill="#A14545">线性失控 O(T)</text>

  <!-- sqrt curve (this paper) -->
  <path d="M240,500 Q360,370 500,320 T720,270" stroke="#4B8BDA" stroke-width="3.5" fill="none"/>
  <text x="560" y="305" font-size="14" font-weight="bold" fill="#1E3A5F">本文 Õ(d√T)</text>

  <!-- RoS curve -->
  <path d="M240,500 Q360,410 500,370 T720,330" stroke="#7AA86A" stroke-width="3" fill="none" stroke-dasharray="2,3"/>
  <text x="560" y="365" font-size="13" fill="#3D6B2E">RoS: Õ(d√T / δ_S)</text>

  <!-- Lower bound -->
  <path d="M240,500 Q380,450 540,425 T720,405" stroke="#9AA3B0" stroke-width="2" fill="none"/>
  <text x="560" y="422" font-size="12" fill="#5C6470">下界 Ω(√T)</text>

  <!-- Left module: setting -->
  <rect x="40" y="220" width="180" height="110" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="130" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">输入条件</text>
  <text x="130" y="270" text-anchor="middle" font-size="12" fill="#3D4F65">价值未知 (LTE)</text>
  <text x="130" y="290" text-anchor="middle" font-size="12" fill="#3D4F65">对手出价未知</text>
  <text x="130" y="310" text-anchor="middle" font-size="12" fill="#3D4F65">预算 / RoS 约束</text>

  <!-- Arrow from input to chart -->
  <line x1="220" y1="275" x2="238" y2="275" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Right module: example -->
  <rect x="740" y="220" width="140" height="130" rx="10" fill="#FFF4E6" stroke="#D9A55C" stroke-width="1.5"/>
  <text x="810" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">举例</text>
  <text x="810" y="270" text-anchor="middle" font-size="12" fill="#3D4F65">T = 10⁶, d = 20</text>
  <text x="810" y="290" text-anchor="middle" font-size="12" fill="#3D4F65">δ_S = 0.05</text>
  <text x="810" y="312" text-anchor="middle" font-size="12" fill="#3D4F65">预算 regret ~ 2×10⁴</text>
  <text x="810" y="332" text-anchor="middle" font-size="12" fill="#3D4F65">RoS regret ~ ×20</text>

  <!-- Arrow from chart to example -->
  <line x1="722" y1="275" x2="738" y2="275" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <text x="450" y="555" text-anchor="middle" font-size="13" fill="#1E3A5F" font-style="italic">关键：损失按 √T 增长（阶最优），约束越宽松 δ_S 越大，损失越小</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">
    RoS 出价：先 burn-in 给 λ 装天花板，再用凸包顶点出价
  </text>
  <text x="440" y="56" text-anchor="middle" font-size="13" fill="#3D4F65">
    防止价值估错被 Lagrangian 乘子 λ 放大成爆炸亏损
  </text>

  <!-- Phase 1: Burn-in -->
  <rect x="40" y="90" width="280" height="190" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="180" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">Phase 1 · Burn-in</text>
  <text x="180" y="140" text-anchor="middle" font-size="12" fill="#3D4F65">T₀ = ⌈√T⌉ 轮均匀随机出价</text>

  <rect x="62" y="155" width="236" height="50" rx="6" fill="#FFFFFF" stroke="#9CC2EE"/>
  <text x="180" y="175" text-anchor="middle" font-size="12" fill="#1E3A5F">① 设计矩阵 λ_min ≥ c·√T</text>
  <text x="180" y="194" text-anchor="middle" font-size="11" fill="#3D4F65">让价值回归不退化</text>

  <rect x="62" y="214" width="236" height="52" rx="6" fill="#FFFFFF" stroke="#9CC2EE"/>
  <text x="180" y="234" text-anchor="middle" font-size="12" fill="#1E3A5F">② 估 Slater 裕度 δ̂</text>
  <text x="180" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">→ Λ = 2C_r / δ̂</text>

  <!-- arrow phase1 -> phase2 -->
  <line x1="320" y1="185" x2="395" y2="185" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="357" y="178" text-anchor="middle" font-size="11" fill="#3D4F65">λ 上限</text>

  <!-- Phase 2: Bidding -->
  <rect x="400" y="90" width="440" height="190" rx="12" fill="#FFF5EB" stroke="#E89B5A" stroke-width="2"/>
  <text x="620" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">Phase 2 · 受约束出价</text>

  <!-- lambda projection box -->
  <rect x="420" y="135" width="180" height="130" rx="8" fill="#FFFFFF" stroke="#E89B5A"/>
  <text x="510" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">λ 投影</text>
  <text x="510" y="178" text-anchor="middle" font-size="12" fill="#3D4F65">λ_t ∈ [T^(-½), Λ]</text>
  <line x1="440" y1="220" x2="580" y2="220" stroke="#3D4F65" stroke-width="1.5"/>
  <line x1="455" y1="215" x2="455" y2="225" stroke="#C2410C" stroke-width="2.5"/>
  <line x1="565" y1="215" x2="565" y2="225" stroke="#C2410C" stroke-width="2.5"/>
  <text x="455" y="240" text-anchor="middle" font-size="11" fill="#3D4F65">下界</text>
  <text x="565" y="240" text-anchor="middle" font-size="11" fill="#3D4F65">Λ</text>
  <text x="510" y="257" text-anchor="middle" font-size="11" fill="#C2410C">不会爆</text>

  <!-- convex hull box -->
  <rect x="620" y="135" width="200" height="130" rx="8" fill="#FFFFFF" stroke="#E89B5A"/>
  <text x="720" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">下凸包顶点</text>

  <!-- mini hull -->
  <g transform="translate(640,170)">
    <line x1="0" y1="80" x2="160" y2="80" stroke="#9CA3AF" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="80" stroke="#9CA3AF" stroke-width="1"/>
    <text x="155" y="92" text-anchor="end" font-size="9" fill="#3D4F65">bid</text>
    <text x="-3" y="6" text-anchor="end" font-size="9" fill="#3D4F65">支付</text>
    <circle cx="20" cy="68" r="3.5" fill="#4B8BDA"/>
    <circle cx="60" cy="48" r="3.5" fill="#4B8BDA"/>
    <circle cx="85" cy="42" r="3.5" fill="#9CA3AF"/>
    <text x="92" y="40" font-size="9" fill="#9CA3AF">剔除</text>
    <circle cx="110" cy="28" r="3.5" fill="#4B8BDA"/>
    <circle cx="150" cy="10" r="3.5" fill="#4B8BDA"/>
    <polyline points="20,68 60,48 110,28 150,10" fill="none" stroke="#C2410C" stroke-width="2"/>
  </g>
  <text x="720" y="257" text-anchor="middle" font-size="11" fill="#C2410C">随机化两 bid 主导单 bid</text>

  <!-- Bottom outcome -->
  <rect x="140" y="340" width="600" height="170" rx="12" fill="#F0F7F4" stroke="#5BA88A" stroke-width="2"/>
  <text x="440" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">效果：RoS 后悔可控</text>

  <!-- bad path -->
  <rect x="170" y="390" width="260" height="100" rx="8" fill="#FFFFFF" stroke="#D97757"/>
  <text x="300" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C">朴素做法</text>
  <text x="300" y="441" text-anchor="middle" font-size="12" fill="#3D4F65">价值估错 ε  ×  λ 无上界</text>
  <text x="300" y="473" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C">→ regret 失控</text>

  <!-- good path -->
  <rect x="450" y="390" width="260" height="100" rx="8" fill="#FFFFFF" stroke="#5BA88A"/>
  <text x="580" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="#1E7A55">本文做法</text>
  <text x="580" y="441" text-anchor="middle" font-size="12" fill="#3D4F65">价值估错 ε  ×  λ ≤ Λ（被夹住）</text>
  <text x="580" y="473" text-anchor="middle" font-size="13" font-weight="700" fill="#1E7A55">→ 近似最优 regret</text>

  <!-- arrows down -->
  <line x1="180" y1="280" x2="260" y2="338" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="620" y1="280" x2="560" y2="338" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- example tag -->
  <text x="440" y="535" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">
    例：δ̂ ≈ 0.05  ⇒  Λ = 2·3/0.05 = 120；bid 0.5 被 (0.4, 0.55) 随机化主导而剔除
  </text>
</svg>
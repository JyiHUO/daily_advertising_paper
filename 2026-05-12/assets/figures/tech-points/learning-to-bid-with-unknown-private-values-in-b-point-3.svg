<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0504D"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E08A3C"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#F7FAFC"/>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">双分支 Lagrangian 打分 + SquareCB 混合</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#3D4F65">胜率靠近 0 或 1，挑不同分支，让 regret 被同一个 ω̂ 吸收</text>

  <!-- Branch 0 -->
  <rect x="60" y="100" width="220" height="120" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="170" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">分支 L0  (适合低胜率)</text>
  <text x="170" y="158" text-anchor="middle" font-size="13" fill="#3D4F65">F̂(b)·(s − a·b)</text>
  <text x="170" y="190" text-anchor="middle" font-size="12" fill="#3D4F65">UCB 加 F̂·ρ</text>

  <!-- Branch 1 -->
  <rect x="620" y="100" width="220" height="120" rx="10" fill="#FFF4E6" stroke="#E08A3C" stroke-width="1.8"/>
  <text x="730" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">分支 L1  (适合高胜率)</text>
  <text x="730" y="158" text-anchor="middle" font-size="13" fill="#3D4F65">−(1−F̂)s − a·b·F̂</text>
  <text x="730" y="190" text-anchor="middle" font-size="12" fill="#3D4F65">UCB 加 (1−F̂)·ρ</text>

  <!-- κ-br selector -->
  <rect x="330" y="110" width="240" height="100" rx="10" fill="#E8EEF7" stroke="#1E3A5F" stroke-width="1.8"/>
  <text x="450" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">κ-br 阈值选支</text>
  <text x="450" y="165" text-anchor="middle" font-size="12" fill="#3D4F65">F̂ &gt; κ ? 用 L1 : 用 L0</text>
  <text x="450" y="187" text-anchor="middle" font-size="12" fill="#3D4F65">取两支极大点 → 候选区间</text>

  <line x1="280" y1="160" x2="328" y2="160" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="620" y1="160" x2="572" y2="160" stroke="#E08A3C" stroke-width="2" marker-end="url(#arO)"/>

  <!-- Interval -->
  <rect x="180" y="270" width="540" height="160" rx="10" fill="#EEF7EE" stroke="#3FA34D" stroke-width="1.8"/>
  <text x="450" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">候选区间内挑两个 bid</text>

  <line x1="260" y1="360" x2="640" y2="360" stroke="#3FA34D" stroke-width="2"/>
  <line x1="260" y1="352" x2="260" y2="368" stroke="#3FA34D" stroke-width="2"/>
  <line x1="640" y1="352" x2="640" y2="368" stroke="#3FA34D" stroke-width="2"/>

  <circle cx="320" cy="360" r="15" fill="#4B8BDA"/>
  <text x="320" y="365" text-anchor="middle" font-size="12" fill="white" font-weight="bold">b̂</text>
  <text x="320" y="400" text-anchor="middle" font-size="12" fill="#1E3A5F">贪心 (利用)</text>

  <circle cx="580" cy="360" r="18" fill="#E08A3C"/>
  <text x="580" y="364" text-anchor="middle" font-size="11" fill="white" font-weight="bold">b-info</text>
  <text x="580" y="400" text-anchor="middle" font-size="12" fill="#1E3A5F">最大 ω̂ (探索)</text>

  <line x1="450" y1="210" x2="450" y2="268" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- SquareCB mix -->
  <rect x="80" y="470" width="420" height="100" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="290" y="498" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">SquareCB 概率混合</text>
  <text x="290" y="522" text-anchor="middle" font-size="12" fill="#3D4F65">p = 1 / (2 + α·(L̂(b̂) − L̂(b-info)))</text>
  <text x="290" y="545" text-anchor="middle" font-size="12" fill="#3D4F65">分差小 → 多探索；分差大 → 多利用</text>

  <!-- Fallback -->
  <rect x="540" y="470" width="280" height="100" rx="10" fill="#FDECEC" stroke="#C0504D" stroke-width="1.8"/>
  <text x="680" y="498" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">Fallback</text>
  <text x="680" y="522" text-anchor="middle" font-size="12" fill="#3D4F65">ρ 太大 / RoS 区间太宽</text>
  <text x="680" y="545" text-anchor="middle" font-size="12" fill="#C0504D">→ 直接出 b-info 探</text>

  <line x1="320" y1="418" x2="290" y2="468" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="600" y1="418" x2="660" y2="468" stroke="#C0504D" stroke-width="2" marker-end="url(#arR)"/>
</svg>
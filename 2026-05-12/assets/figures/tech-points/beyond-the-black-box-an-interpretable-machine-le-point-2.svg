<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="800" height="520" fill="#FAF7F2"/>

  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">贝叶斯优化：少试几次，找到好超参</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">297 个样本，训练贵 → 不能网格暴搜</text>

  <!-- Left: random/grid -->
  <g>
    <rect x="40" y="95" width="300" height="200" rx="10" fill="#F5E9DC" stroke="#C9A179" stroke-width="1.5"/>
    <text x="190" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">网格 / 随机搜索</text>
    <text x="190" y="140" text-anchor="middle" font-size="11" fill="#3D4F65">每个点都瞎试一次，评估次数多</text>

    <g fill="#B07A4A">
      <circle cx="80" cy="175" r="5"/><circle cx="120" cy="175" r="5"/><circle cx="160" cy="175" r="5"/>
      <circle cx="200" cy="175" r="5"/><circle cx="240" cy="175" r="5"/><circle cx="280" cy="175" r="5"/>
      <circle cx="80" cy="215" r="5"/><circle cx="120" cy="215" r="5"/><circle cx="160" cy="215" r="5"/>
      <circle cx="200" cy="215" r="5"/><circle cx="240" cy="215" r="5"/><circle cx="280" cy="215" r="5"/>
      <circle cx="80" cy="255" r="5"/><circle cx="120" cy="255" r="5"/><circle cx="160" cy="255" r="5"/>
      <circle cx="200" cy="255" r="5"/><circle cx="240" cy="255" r="5"/><circle cx="280" cy="255" r="5"/>
    </g>
  </g>

  <!-- Right: Bayesian -->
  <g>
    <rect x="460" y="95" width="300" height="200" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="610" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">贝叶斯优化</text>
    <text x="610" y="140" text-anchor="middle" font-size="11" fill="#3D4F65">挑"最可能更好"的点试，几次就够</text>

    <ellipse cx="635" cy="225" rx="75" ry="42" fill="#C7DCF5" opacity="0.9"/>
    <ellipse cx="635" cy="225" rx="44" ry="23" fill="#8FB8E8" opacity="0.9"/>
    <text x="635" y="228" text-anchor="middle" font-size="10" fill="#1E3A5F">最优区</text>

    <g font-size="10" fill="#fff" text-anchor="middle">
      <circle cx="495" cy="180" r="9" fill="#4B8BDA"/><text x="495" y="184">1</text>
      <circle cx="735" cy="265" r="9" fill="#4B8BDA"/><text x="735" y="269">2</text>
      <circle cx="555" cy="265" r="9" fill="#4B8BDA"/><text x="555" y="269">3</text>
      <circle cx="610" cy="210" r="9" fill="#D9534F"/><text x="610" y="214">4</text>
      <circle cx="648" cy="228" r="9" fill="#D9534F"/><text x="648" y="232">5</text>
    </g>
  </g>

  <!-- middle arrow -->
  <line x1="345" y1="195" x2="455" y2="195" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="400" y="188" text-anchor="middle" font-size="11" fill="#1E3A5F">用代理模型猜趋势</text>

  <!-- bottom box: loop -->
  <g>
    <rect x="60" y="320" width="680" height="170" rx="10" fill="#FFFFFF" stroke="#C9D6E2" stroke-width="1.5"/>
    <text x="400" y="348" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">CatBoost 调参循环（3 折 CV，最小化 RMSE）</text>

    <rect x="95" y="375" width="150" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="170" y="402" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">试一组超参</text>
    <text x="170" y="422" text-anchor="middle" font-size="11" fill="#3D4F65">深度 / lr / 树数</text>

    <rect x="325" y="375" width="150" height="70" rx="8" fill="#FFF4E6" stroke="#C9A179"/>
    <text x="400" y="402" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">代理模型更新</text>
    <text x="400" y="422" text-anchor="middle" font-size="11" fill="#3D4F65">超参 → 误差曲面</text>

    <rect x="555" y="375" width="150" height="70" rx="8" fill="#EAF3EA" stroke="#7BA77B"/>
    <text x="630" y="402" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">挑下一个点</text>
    <text x="630" y="422" text-anchor="middle" font-size="11" fill="#3D4F65">期望提升最大处</text>

    <line x1="245" y1="410" x2="323" y2="410" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="475" y1="410" x2="553" y2="410" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 630 445 Q 630 478 400 478 Q 170 478 170 447" fill="none" stroke="#4B8BDA" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  </g>
</svg>
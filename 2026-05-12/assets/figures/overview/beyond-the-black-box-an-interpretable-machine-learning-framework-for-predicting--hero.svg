<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F8FC"/>
      <stop offset="1" stop-color="#E8EFF7"/>
    </linearGradient>
    <linearGradient id="gFeat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DCE8F5"/>
      <stop offset="1" stop-color="#F2F6FB"/>
    </linearGradient>
    <linearGradient id="gModel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F6FA8"/>
      <stop offset="1" stop-color="#2A4E7A"/>
    </linearGradient>
    <linearGradient id="gShap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4B860"/>
      <stop offset="1" stop-color="#E08A4B"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E08A4B"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A5F"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Title -->
  <text x="640" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">从黑箱到可解释：Fe 基催化剂带隙预测的 SHAP 归因框架</text>
  <text x="640" y="74" text-anchor="middle" font-size="14" fill="#3D4F65">小数据 (n≈297) · 树模型 + 贝叶斯优化 · SHAP 把带隙分账给热力学/几何/组分描述符</text>

  <!-- LEFT: 13 microdescriptors -->
  <g filter="url(#sh)">
    <rect x="60" y="120" width="260" height="500" rx="14" fill="url(#gFeat)" stroke="#B7CCE3"/>
  </g>
  <text x="190" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">13 个材料微描述符</text>
  <text x="190" y="170" text-anchor="middle" font-size="11" fill="#5A6B82">Materials Project · Fe / Si / Al / O</text>

  <!-- feature chips with SHAP weight bars -->
  <g font-size="12" fill="#1E3A5F">
    <g transform="translate(80,190)">
      <rect width="220" height="34" rx="6" fill="#FFFFFF" stroke="#C9D8EA"/>
      <text x="10" y="15" font-weight="700">每原子形成能</text>
      <text x="10" y="28" font-size="10" fill="#5A6B82">formation energy / atom</text>
      <rect x="125" y="11" width="85" height="14" rx="3" fill="#E08A4B"/>
      <text x="167" y="22" text-anchor="middle" font-size="10" fill="#FFFFFF" font-weight="700">57%</text>
    </g>
    <g transform="translate(80,232)">
      <rect width="220" height="30" rx="6" fill="#FFFFFF" stroke="#C9D8EA"/>
      <text x="10" y="20" font-weight="600">每原子能量</text>
      <rect x="155" y="9" width="55" height="12" rx="3" fill="#EFE2CC"/>
      <rect x="155" y="9" width="29" height="12" rx="3" fill="#E08A4B"/>
      <text x="197" y="19" text-anchor="middle" font-size="9" fill="#7A4F2C" font-weight="700">19%</text>
    </g>
    <g transform="translate(80,270)">
      <rect width="220" height="28" rx="6" fill="#FFFFFF" stroke="#C9D8EA"/>
      <text x="10" y="18" font-weight="600">距凸包能量 E_hull</text>
      <rect x="160" y="8" width="50" height="12" rx="3" fill="#EFE2CC"/>
      <rect x="160" y="8" width="9" height="12" rx="3" fill="#E08A4B"/>
      <text x="195" y="18" text-anchor="middle" font-size="9" fill="#7A4F2C" font-weight="700">5.5%</text>
    </g>
    <g transform="translate(80,306)" font-size="11" fill="#3D4F65">
      <rect width="220" height="22" rx="4" fill="#FFFFFF" stroke="#D8E2EF"/>
      <text x="10" y="15">体积 / 密度 / 位点数</text>
      <text x="210" y="15" text-anchor="end" fill="#8A9AB0">几何</text>
    </g>
    <g transform="translate(80,334)" font-size="11" fill="#3D4F65">
      <rect width="220" height="22" rx="4" fill="#FFFFFF" stroke="#D8E2EF"/>
      <text x="10" y="15">Fe / Si / Al / O 元素分数</text>
      <text x="210" y="15" text-anchor="end" fill="#8A9AB0">组分</text>
    </g>
    <g transform="translate(80,362)" font-size="11" fill="#3D4F65">
      <rect width="220" height="22" rx="4" fill="#FFFFFF" stroke="#D8E2EF"/>
      <text x="10" y="15">空间群 / 对称性 等</text>
      <text x="210" y="15" text-anchor="end" fill="#8A9AB0">结构</text>
    </g>
  </g>

  <!-- PCA mini map -->
  <g transform="translate(80,408)">
    <rect width="220" height="190" rx="8" fill="#FFFFFF" stroke="#C9D8EA"/>
    <text x="110" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">PCA 探索：63% 方差</text>
    <text x="110" y="33" text-anchor="middle" font-size="10" fill="#5A6B82">PC1 能量 30% · PC2 几何 19%</text>
    <line x1="20" y1="160" x2="200" y2="160" stroke="#9CB0C8" stroke-width="1"/>
    <line x1="20" y1="50" x2="20" y2="160" stroke="#9CB0C8" stroke-width="1"/>
    <text x="200" y="175" text-anchor="end" font-size="9" fill="#7A8AA0">PC1</text>
    <text x="14" y="50" font-size="9" fill="#7A8AA0">PC2</text>
    <g>
      <circle cx="45" cy="140" r="4" fill="#2A4E7A"/>
      <circle cx="55" cy="130" r="4" fill="#2A4E7A"/>
      <circle cx="40" cy="125" r="4" fill="#3F6FA8"/>
      <circle cx="62" cy="118" r="4" fill="#3F6FA8"/>
      <circle cx="80" cy="135" r="4" fill="#2A4E7A"/>
      <circle cx="95" cy="105" r="4" fill="#6B95C2"/>
      <circle cx="110" cy="115" r="4" fill="#6B95C2"/>
      <circle cx="120" cy="92" r="4" fill="#9DB8D4"/>
      <circle cx="135" cy="100" r="4" fill="#C9A56F"/>
      <circle cx="150" cy="80" r="4" fill="#E08A4B"/>
      <circle cx="170" cy="68" r="4" fill="#E08A4B"/>
      <circle cx="155" cy="95" r="4" fill="#C9A56F"/>
      <circle cx="180" cy="78" r="4" fill="#E08A4B"/>
      <circle cx="100" cy="125" r="4" fill="#3F6FA8"/>
      <circle cx="130" cy="110" r="4" fill="#6B95C2"/>
    </g>
    <text x="40" y="155" font-size="9" fill="#2A4E7A">金属性</text>
    <text x="160" y="62" font-size="9" fill="#E08A4B">宽带隙</text>
    <text x="110" y="182" text-anchor="middle" font-size="9" fill="#5A6B82" font-style="italic">非线性可分 → 选树模型</text>
  </g>

  <!-- CENTER: Models -->
  <g transform="translate(390,180)">
    <g filter="url(#sh)">
      <rect width="240" height="70" rx="10" fill="#FFFFFF" stroke="#C9D8EA" stroke-dasharray="4 3"/>
    </g>
    <text x="120" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#8A9AB0">线性回归 baseline</text>
    <text x="120" y="50" text-anchor="middle" font-size="22" font-weight="800" fill="#B0B8C2">R² ≈ 0.32</text>
    <text x="120" y="64" text-anchor="middle" font-size="10" fill="#A0AAB8">线性不足以刻画结构-性能</text>
  </g>

  <g transform="translate(390,290)">
    <g filter="url(#sh)">
      <rect width="240" height="100" rx="12" fill="url(#gModel)"/>
    </g>
    <text x="120" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Random Forest</text>
    <text x="120" y="60" text-anchor="middle" font-size="28" font-weight="800" fill="#FFFFFF">R² = 0.77</text>
    <text x="120" y="82" text-anchor="middle" font-size="11" fill="#C8D8EC">非线性集成 · 80/20 划分</text>
  </g>

  <g transform="translate(390,420)">
    <g filter="url(#sh)">
      <rect width="240" height="100" rx="12" fill="url(#gModel)"/>
    </g>
    <text x="120" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">CatBoost + 贝叶斯优化</text>
    <text x="120" y="60" text-anchor="middle" font-size="28" font-weight="800" fill="#FFFFFF">R² = 0.73</text>
    <text x="120" y="82" text-anchor="middle" font-size="11" fill="#C8D8EC">高斯过程代理 · 3 折 CV</text>
  </g>

  <!-- BO loop annotation -->
  <g transform="translate(390,540)">
    <rect width="240" height="70" rx="8" fill="#FFF7EC" stroke="#E8C99A"/>
    <text x="120" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#7A4F2C">贝叶斯优化循环</text>
    <text x="120" y="40" text-anchor="middle" font-size="10" fill="#7A4F2C">代理猜 → 选超参 → 评估 RMSE</text>
    <text x="120" y="56" text-anchor="middle" font-size="10" fill="#7A4F2C">学习率 / 树深 / 迭代数</text>
  </g>

  <!-- BO loop arrow back to CatBoost -->
  <path d="M390,560 C360,560 350,485 388,470" stroke="#E08A4B" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrO)"/>

  <!-- Arrow features -> models -->
  <path d="M320,340 C355,340 360,335 388,335" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M320,360 C355,360 360,465 388,465" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M320,260 C355,260 360,215 388,215" stroke="#9CB0C8" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)"/>

  <!-- Arrow models -> SHAP -->
  <path d="M630,340 C700,340 720,360 760,370" stroke="#E08A4B" stroke-width="2.5" fill="none" marker-end="url(#arrO)"/>
  <path d="M630,470 C700,470 720,420 760,395" stroke="#E08A4B" stroke-width="2.5" fill="none" marker-end="url(#arrO)"/>

  <!-- RIGHT: SHAP attribution panel -->
  <g filter="url(#sh)">
    <rect x="760" y="180" width="460" height="440" rx="14" fill="#FFFFFF" stroke="#E8C99A"/>
  </g>
  <rect x="760" y="180" width="460" height="44" rx="14" fill="url(#gShap)"/>
  <rect x="760" y="210" width="460" height="14" fill="url(#gShap)"/>
  <text x="990" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">SHAP 归因：把每次带隙预测分账给特征</text>

  <!-- Sample case -->
  <text x="785" y="255" font-size="12" font-weight="700" fill="#1E3A5F">案例：某 Fe-zeolite 结构</text>
  <text x="785" y="273" font-size="11" fill="#3D4F65">基线 E[f(x)] = 1.6 eV  →  预测 f(x) = 3.0 eV</text>

  <!-- Force plot style attribution -->
  <g transform="translate(785,310)">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#B0B8C2" stroke-dasharray="3 3"/>
    <text x="0" y="-4" text-anchor="middle" font-size="9" fill="#8A9AB0">基线 1.6</text>

    <g>
      <polygon points="0,10 130,10 140,25 130,40 0,40" fill="#E08A4B"/>
      <text x="65" y="28" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">形成能  +0.85</text>
    </g>
    <g>
      <polygon points="140,10 230,10 240,25 230,40 140,40" fill="#F4B860"/>
      <text x="185" y="28" text-anchor="middle" font-size="10" fill="#FFFFFF" font-weight="700">每原子能量 +0.45</text>
    </g>
    <g>
      <polygon points="240,10 300,10 310,25 300,40 240,40" fill="#F8CD8E"/>
      <text x="270" y="28" text-anchor="middle" font-size="10" fill="#7A4F2C" font-weight="700">E_hull +0.20</text>
    </g>
    <g>
      <polygon points="310,10 360,10 370,25 360,40 310,40" fill="#FBE0B5"/>
      <text x="335" y="28" text-anchor="middle" font-size="9" fill="#7A4F2C">几何 +0.10</text>
    </g>

    <line x1="0" y1="60" x2="360" y2="60" stroke="#1E3A5F" stroke-width="1.5" marker-end="url(#arrD)"/>
    <text x="0" y="76" font-size="10" fill="#1E3A5F">低带隙</text>
    <text x="370" y="76" text-anchor="end" font-size="10" fill="#1E3A5F">高带隙 → 3.0 eV</text>

    <g>
      <polygon points="0,90 60,90 50,105 60,120 0,120" fill="#9DB8D4"/>
      <text x="30" y="108" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="700">体积 −0.20</text>
    </g>
    <g>
      <polygon points="60,90 110,90 100,105 110,120 60,120" fill="#C9D8EA"/>
      <text x="85" y="108" text-anchor="middle" font-size="9" fill="#1E3A5F">Fe 分数 −0.05</text>
    </g>
    <text x="200" y="108" font-size="10" fill="#5A6B82" font-style="italic">压低带隙的负向贡献</text>
  </g>

  <!-- Key insight -->
  <g transform="translate(785,455)">
    <rect width="410" height="148" rx="10" fill="#F5F8FC" stroke="#C9D8EA"/>
    <text x="15" y="22" font-size="12" font-weight="700" fill="#1E3A5F">核心发现</text>
    <text x="15" y="46" font-size="11" fill="#3D4F65">▸ 热力学晶格稳定性 (形成能、E_hull) 主导带隙</text>
    <text x="15" y="66" font-size="11" fill="#3D4F65">▸ 几何因子 (体积、位点数) 次要但显著</text>
    <text x="15" y="86" font-size="11" fill="#3D4F65">▸ 组分分数 (Fe/Si/Al 比例) 贡献最弱</text>
    <line x1="15" y1="98" x2="395" y2="98" stroke="#D8E2EF"/>
    <text x="15" y="120" font-size="11" fill="#1E3A5F" font-weight="700">→ 推翻"组分主导论"：带隙作为氧化还原</text>
    <text x="15" y="138" font-size="11" fill="#1E3A5F" font-weight="700">   活性代理，由稳定性 + 几何决定</text>
  </g>

  <!-- bottom note -->
  <text x="640" y="660" text-anchor="middle" font-size="11" fill="#7A8AA0" font-style="italic">注：本文为材料信息学论文；初筛因 catalytic 含 ctr 子串被误命中，与计算广告/CTR 预估无关，仅作为方法论参考</text>

  <!-- pipeline lane labels -->
  <text x="190" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#4B8BDA">① 微描述符</text>
  <text x="510" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#4B8BDA">② 非线性回归带隙</text>
  <text x="990" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#E08A4B">③ 可解释归因</text>
</svg>
<svg height="600" width="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">离线思考，在线一次查表</text>

  <!-- Dividing line -->
  <line x1="400" y1="90" x2="400" y2="370" stroke="#B8C5D6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="200" y="78" text-anchor="middle" font-size="13" fill="#3D4F65" font-style="italic">离线 (慢, LLM)</text>
  <text x="600" y="78" text-anchor="middle" font-size="13" fill="#3D4F65" font-style="italic">在线 (200ms 预算)</text>

  <!-- LEFT: brain/thinking -->
  <circle cx="160" cy="210" r="58" fill="#FEF3E8" stroke="#E8A87C" stroke-width="2"/>
  <text x="160" y="208" text-anchor="middle" font-size="30">🧠</text>
  <text x="160" y="238" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">LLM 画像</text>

  <!-- compress arrow -->
  <path d="M222,210 L298,210" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="260" y="200" text-anchor="middle" font-size="11" fill="#3D4F65">浓缩</text>

  <!-- Lookup table (the contract) -->
  <rect x="305" y="150" width="190" height="120" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="400" y="140" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="700">跨界产物（仅两件）</text>
  <line x1="320" y1="172" x2="480" y2="172" stroke="#B8C5D6"/>
  <line x1="400" y1="178" x2="400" y2="262" stroke="#B8C5D6"/>

  <text x="360" y="196" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">规则 A</text>
  <text x="360" y="220" text-anchor="middle" font-size="11" fill="#3D4F65">Boolean 几KB</text>
  <text x="360" y="240" text-anchor="middle" font-size="11" fill="#3D4F65">→ 簇号 #37</text>

  <text x="440" y="196" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">emb 表</text>
  <text x="440" y="220" text-anchor="middle" font-size="11" fill="#3D4F65">簇号 → 向量</text>
  <text x="440" y="240" text-anchor="middle" font-size="11" fill="#3D4F65">[0.2, 0.7, …]</text>

  <!-- RIGHT arrow: lookup -->
  <path d="M498,210 L558,210" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="528" y="200" text-anchor="middle" font-size="11" fill="#3D4F65">查表</text>

  <!-- Online order -->
  <rect x="565" y="160" width="190" height="100" rx="6" fill="#FFF8E8" stroke="#D4A744" stroke-width="2"/>
  <text x="660" y="186" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="700">订单到达</text>
  <text x="660" y="210" text-anchor="middle" font-size="11" fill="#3D4F65">规则匹配 → 取 emb</text>
  <text x="660" y="230" text-anchor="middle" font-size="11" fill="#3D4F65">拼接结构化特征</text>
  <text x="660" y="250" text-anchor="middle" font-size="11" fill="#3D4F65">送多任务预测模型</text>

  <!-- arrow to latency -->
  <path d="M660,262 L660,298" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- Latency badge -->
  <rect x="565" y="300" width="190" height="58" rx="29" fill="#E8F4EC" stroke="#5BA876" stroke-width="2"/>
  <text x="660" y="324" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="700">额外开销</text>
  <text x="660" y="346" text-anchor="middle" font-size="16" fill="#2F7A4D" font-weight="700">&lt; 0.01 ms</text>

  <!-- bottom note -->
  <rect x="60" y="400" width="680" height="64" rx="8" fill="#F5F0E8" stroke="#C9B89A" stroke-width="1.5"/>
  <text x="400" y="424" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">所有用户共享 |A| 个簇 embedding · 不动下游 KM 匹配</text>
  <text x="400" y="446" text-anchor="middle" font-size="11" fill="#3D4F65">LLM 的语义能力被压成一张哈希查找表</text>
</svg>
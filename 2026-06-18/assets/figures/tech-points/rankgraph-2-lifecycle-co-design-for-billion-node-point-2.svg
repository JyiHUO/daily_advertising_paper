<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E3A5F">用聚类替代在线 KNN</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">训练时把"好分簇"作为联合目标</text>

  <!-- LEFT: expensive KNN -->
  <g>
    <text x="170" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#B5651D">传统：在线 KNN</text>
    <circle cx="170" cy="220" r="85" fill="#FFF4E6" stroke="#E0A060" stroke-width="1.5"/>
    <circle cx="130" cy="190" r="4" fill="#B5651D"/>
    <circle cx="200" cy="180" r="4" fill="#B5651D"/>
    <circle cx="155" cy="230" r="4" fill="#B5651D"/>
    <circle cx="210" cy="245" r="4" fill="#B5651D"/>
    <circle cx="180" cy="210" r="4" fill="#B5651D"/>
    <circle cx="135" cy="255" r="4" fill="#B5651D"/>
    <circle cx="220" cy="205" r="4" fill="#B5651D"/>
    <circle cx="115" cy="220" r="4" fill="#B5651D"/>
    <circle cx="170" cy="220" r="28" fill="none" stroke="#1E3A5F" stroke-width="2.5"/>
    <line x1="190" y1="240" x2="210" y2="260" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round"/>
    <text x="170" y="340" text-anchor="middle" font-size="12" fill="#3D4F65">扫几亿用户 · 上千台机器</text>
  </g>

  <!-- middle arrow -->
  <line x1="275" y1="220" x2="345" y2="220" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="310" y="210" text-anchor="middle" font-size="11" fill="#1E3A5F">共训练</text>

  <!-- RIGHT: cluster lookup -->
  <g>
    <text x="560" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">RankGraph-2：簇查表</text>

    <g transform="translate(420,140)">
      <rect x="0" y="0" width="280" height="100" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
      <text x="140" y="20" text-anchor="middle" font-size="11" fill="#3D4F65">两层残差码表 · 25万簇</text>
      <g fill="#DCE9F8" stroke="#4B8BDA" stroke-width="0.8">
        <rect x="20" y="35" width="22" height="22"/>
        <rect x="50" y="35" width="22" height="22"/>
        <rect x="80" y="35" width="22" height="22" fill="#4B8BDA"/>
        <rect x="110" y="35" width="22" height="22"/>
        <rect x="140" y="35" width="22" height="22"/>
        <rect x="170" y="35" width="22" height="22"/>
        <rect x="200" y="35" width="22" height="22"/>
        <rect x="230" y="35" width="22" height="22"/>
        <rect x="20" y="65" width="22" height="22"/>
        <rect x="50" y="65" width="22" height="22"/>
        <rect x="80" y="65" width="22" height="22"/>
        <rect x="110" y="65" width="22" height="22" fill="#4B8BDA"/>
        <rect x="140" y="65" width="22" height="22"/>
        <rect x="170" y="65" width="22" height="22"/>
        <rect x="200" y="65" width="22" height="22"/>
        <rect x="230" y="65" width="22" height="22"/>
      </g>
      <text x="91" y="51" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="bold">k1</text>
      <text x="121" y="81" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="bold">k2</text>
    </g>

    <g transform="translate(420,285)">
      <rect x="0" y="0" width="280" height="80" rx="6" fill="#FFF4E6" stroke="#E0A060" stroke-width="1.5"/>
      <text x="140" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">簇(372,17) 实时队列</text>
      <g fill="#E0A060">
        <rect x="20" y="35" width="30" height="30" rx="3"/>
        <rect x="60" y="35" width="30" height="30" rx="3"/>
        <rect x="100" y="35" width="30" height="30" rx="3"/>
        <rect x="140" y="35" width="30" height="30" rx="3"/>
        <rect x="180" y="35" width="30" height="30" rx="3"/>
        <rect x="220" y="35" width="30" height="30" rx="3" opacity="0.5"/>
      </g>
    </g>
    <text x="560" y="376" text-anchor="middle" font-size="10" fill="#3D4F65">最近活跃用户的 engagement 物品</text>

    <line x1="560" y1="245" x2="560" y2="282" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <!-- bottom benefit -->
  <rect x="220" y="425" width="360" height="50" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="400" y="447" text-anchor="middle" font-size="13" fill="#1E3A5F">一次查表 = U2U2I 召回</text>
  <text x="400" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#B5651D">服务成本 −83%</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8A24A"/>
    </marker>
  </defs>

  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">用 LOGIC 规则当作画像效用的快速代理</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#3D4F65">不训模型，融合 AUC 提升 Δ 即评分</text>

  <!-- Profile card -->
  <rect x="30" y="90" width="240" height="270" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="150" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">LLM 候选画像</text>

  <rect x="48" y="128" width="204" height="40" rx="6" fill="#FFFFFF" stroke="#9DB7D6"/>
  <text x="58" y="146" font-size="11" font-weight="700" fill="#1E3A5F">ANALYSIS</text>
  <text x="58" y="161" font-size="10.5" fill="#3D4F65">行为模式分析</text>

  <rect x="48" y="176" width="204" height="40" rx="6" fill="#FFFFFF" stroke="#9DB7D6"/>
  <text x="58" y="194" font-size="11" font-weight="700" fill="#1E3A5F">PROFILE</text>
  <text x="58" y="209" font-size="10.5" fill="#3D4F65">语义画像</text>

  <rect x="48" y="224" width="204" height="124" rx="6" fill="#FFF3E0" stroke="#E8A24A" stroke-width="1.8"/>
  <text x="58" y="244" font-size="11" font-weight="700" fill="#A85A12">LOGIC (可执行规则)</text>
  <text x="58" y="266" font-size="11" fill="#3D4F65">if  Price/KM ≥ 2.5</text>
  <text x="58" y="283" font-size="11" fill="#3D4F65">and  Pick-KM ≤ 2.0</text>
  <text x="58" y="300" font-size="11" fill="#3D4F65">then predict = 1</text>
  <text x="58" y="328" font-size="10" fill="#A85A12" font-style="italic">顺手输出，免费的预测器</text>

  <!-- Arrow from LOGIC to rule pred -->
  <path d="M 252 280 C 300 280, 305 234, 345 234" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Baseline -->
  <rect x="345" y="138" width="180" height="56" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
  <text x="435" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">生产模型基线</text>
  <text x="435" y="180" text-anchor="middle" font-size="11" fill="#3D4F65">连续概率 p_base</text>

  <!-- Rule pred box -->
  <rect x="345" y="214" width="180" height="56" rx="8" fill="#FFF3E0" stroke="#E8A24A"/>
  <text x="435" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#A85A12">LOGIC 规则预测</text>
  <text x="435" y="254" text-anchor="middle" font-size="11" fill="#3D4F65">0 / 1</text>

  <!-- Fusion circle -->
  <circle cx="615" cy="200" r="42" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="615" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">凸组合</text>
  <text x="615" y="214" text-anchor="middle" font-size="11" fill="#3D4F65">λ 融合</text>

  <path d="M 525 166 L 575 184" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 525 242 L 575 218" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Output: delta AUC -->
  <path d="M 615 242 L 615 290" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="510" y="296" width="210" height="76" rx="10" fill="#E8F4EC" stroke="#4A9D6E" stroke-width="1.8"/>
  <text x="615" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">Δ AUC = 效用得分</text>
  <text x="615" y="342" text-anchor="middle" font-size="11" fill="#3D4F65">Δ &gt; 0：保留画像 ✓</text>
  <text x="615" y="360" text-anchor="middle" font-size="11" fill="#A85A12">Δ ≤ 0：淘汰 / 反馈重写</text>

  <!-- Feedback loop -->
  <path d="M 510 360 C 360 420, 200 420, 150 360" fill="none" stroke="#E8A24A" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#aro)"/>
  <text x="330" y="410" text-anchor="middle" font-size="11" fill="#A85A12" font-style="italic">错分案例反馈 · 最多迭代 3 轮</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="-apple-system,'Segoe UI',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1E3A5F">下游 AUC 即偏好信号</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#3D4F65">Utility-Aligned DPO</text>

  <!-- Left: two profiles compared -->
  <text x="145" y="96" text-anchor="middle" font-size="11" fill="#3D4F65">同簇内任务产生的偏好对</text>

  <rect x="50" y="110" width="190" height="70" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="68" y="138" font-size="13" font-weight="600" fill="#1E3A5F">画像 A</text>
  <text x="68" y="160" font-size="12" fill="#3D4F65">ΔAUC = +2.0%</text>
  <text x="226" y="152" font-size="13" font-weight="700" fill="#2E7D55" text-anchor="end">win ✓</text>

  <rect x="50" y="200" width="190" height="70" rx="10" fill="#FBF1EE" stroke="#C97B63" stroke-width="1.5"/>
  <text x="68" y="228" font-size="13" font-weight="600" fill="#1E3A5F">画像 B</text>
  <text x="68" y="250" font-size="12" fill="#3D4F65">ΔAUC = +0.3%</text>
  <text x="226" y="242" font-size="13" font-weight="700" fill="#C97B63" text-anchor="end">lose ✗</text>

  <!-- Arrow to DPO -->
  <path d="M 245 195 Q 300 215 348 220" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Center: DPO model -->
  <rect x="350" y="170" width="170" height="100" rx="14" fill="#E8EEFB" stroke="#1E3A5F" stroke-width="2"/>
  <text x="435" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">Qwen3-8B</text>
  <text x="435" y="228" text-anchor="middle" font-size="12" fill="#3D4F65">DPO 一次微调</text>
  <text x="435" y="252" text-anchor="middle" font-size="11" fill="#4B8BDA">内化"利于预测"目标</text>

  <!-- Arrow to output -->
  <path d="M 522 220 L 597 220" fill="none" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- Right: one-shot generation -->
  <rect x="600" y="170" width="100" height="100" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="650" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">新簇</text>
  <text x="650" y="228" text-anchor="middle" font-size="12" fill="#3D4F65">单次生成</text>
  <text x="650" y="252" text-anchor="middle" font-size="11" fill="#4B8BDA">免迭代</text>

  <!-- Bottom cost comparison -->
  <text x="360" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">刷新成本对比</text>

  <rect x="170" y="355" width="220" height="22" rx="4" fill="#C97B63" opacity="0.85"/>
  <text x="160" y="371" text-anchor="end" font-size="12" fill="#3D4F65">迭代探索</text>
  <text x="400" y="371" font-size="12" font-weight="700" fill="#1E3A5F">54.6</text>

  <rect x="170" y="389" width="21" height="22" rx="4" fill="#4B8BDA"/>
  <text x="160" y="405" text-anchor="end" font-size="12" fill="#3D4F65">DPO 单次</text>
  <text x="200" y="405" font-size="12" font-weight="700" fill="#1E3A5F">5.13</text>

  <text x="500" y="390" font-size="14" font-weight="700" fill="#2E7D55">10.6× 提速</text>
</svg>
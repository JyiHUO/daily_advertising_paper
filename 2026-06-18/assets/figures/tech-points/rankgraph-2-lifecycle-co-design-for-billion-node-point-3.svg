<svg height="600" width="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E07856"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1E3A5F">下游约束 倒逼 上游设计</text>
  <text x="400" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">RankGraph-2 生命周期级联协同</text>

  <!-- Three stages -->
  <g>
    <rect x="50" y="180" width="190" height="150" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="145" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1E3A5F">图构建</text>
    <text x="145" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">1 小时刷新</text>
    <text x="145" y="272" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">预计算邻居 (PPR)</text>
    <text x="145" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">自包含边数据</text>
  </g>

  <g>
    <rect x="305" y="180" width="190" height="150" rx="10" fill="#FFF4EC" stroke="#E07856" stroke-width="2"/>
    <text x="400" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1E3A5F">训练</text>
    <text x="400" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">联合学聚类索引</text>
    <text x="400" y="272" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">简单异构聚合器</text>
    <text x="400" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">用离线邻居即可</text>
  </g>

  <g>
    <rect x="560" y="180" width="190" height="150" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="655" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1E3A5F">在线服务</text>
    <text x="655" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">KNN-free</text>
    <text x="655" y="272" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">小时级物品新鲜</text>
    <text x="655" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">成本 -83%</text>
  </g>

  <!-- Forward data flow (blue, top) -->
  <text x="400" y="155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4B8BDA">数据正向流动</text>
  <line x1="240" y1="200" x2="302" y2="200" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="495" y1="200" x2="557" y2="200" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- Reverse constraint flow (orange, bottom) -->
  <line x1="560" y1="310" x2="498" y2="310" stroke="#E07856" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="305" y1="310" x2="243" y2="310" stroke="#E07856" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="400" y="355" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E07856">约束反向倒逼</text>

  <text x="400" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">服务省钱 → 训练学索引 → 构图打包邻居</text>
  <text x="400" y="445" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">复杂度被分摊到正确阶段，整体架构反而更简单</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">离线 PPR 邻居预计算</text>
  <text x="300" y="54" text-anchor="middle" font-size="12" fill="#3D4F65">把"现场随机游走"换成"打包好的邻居"</text>

  <!-- LEFT: online single-hop -->
  <g>
    <rect x="40" y="90" width="200" height="240" rx="10" fill="#FFF4E6" stroke="#E0A872" stroke-width="1.5"/>
    <text x="140" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">在线单跳采样</text>

    <circle cx="140" cy="200" r="14" fill="#4B8BDA"/>
    <text x="140" y="204" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">A</text>

    <circle cx="90" cy="170" r="7" fill="#E0A872"/>
    <circle cx="195" cy="175" r="7" fill="#E0A872"/>
    <circle cx="100" cy="240" r="7" fill="#E0A872"/>
    <circle cx="190" cy="235" r="7" fill="#E0A872"/>
    <line x1="128" y1="192" x2="98" y2="173" stroke="#3D4F65" stroke-width="1"/>
    <line x1="153" y1="194" x2="187" y2="178" stroke="#3D4F65" stroke-width="1"/>
    <line x1="130" y1="213" x2="105" y2="234" stroke="#3D4F65" stroke-width="1"/>
    <line x1="151" y1="211" x2="184" y2="231" stroke="#3D4F65" stroke-width="1"/>

    <text x="140" y="305" text-anchor="middle" font-size="11" fill="#3D4F65">只看眼前邻居，多跳协同丢失</text>
  </g>

  <!-- arrow between -->
  <line x1="250" y1="210" x2="345" y2="210" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="297" y="200" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="700">离线 PPR + 热度校正</text>

  <!-- RIGHT: offline PPR -->
  <g>
    <rect x="355" y="90" width="210" height="240" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="460" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">预存 Top-K 邻居</text>

    <circle cx="460" cy="205" r="14" fill="#4B8BDA"/>
    <text x="460" y="209" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">A</text>

    <circle cx="395" cy="155" r="6" fill="#1E3A5F"/>
    <circle cx="525" cy="150" r="6" fill="#1E3A5F"/>
    <circle cx="380" cy="220" r="6" fill="#1E3A5F"/>
    <circle cx="540" cy="200" r="6" fill="#1E3A5F"/>
    <circle cx="400" cy="270" r="6" fill="#1E3A5F"/>
    <circle cx="520" cy="265" r="6" fill="#1E3A5F"/>
    <circle cx="445" cy="155" r="6" fill="#1E3A5F"/>
    <circle cx="475" cy="260" r="6" fill="#1E3A5F"/>

    <g stroke="#4B8BDA" stroke-width="1" stroke-dasharray="3,2" fill="none">
      <line x1="449" y1="197" x2="398" y2="158"/>
      <line x1="471" y1="197" x2="522" y2="153"/>
      <line x1="447" y1="208" x2="384" y2="219"/>
      <line x1="473" y1="207" x2="537" y2="201"/>
      <line x1="451" y1="217" x2="402" y2="266"/>
      <line x1="469" y1="217" x2="517" y2="262"/>
      <line x1="455" y1="192" x2="446" y2="161"/>
      <line x1="465" y1="219" x2="474" y2="254"/>
    </g>

    <text x="460" y="305" text-anchor="middle" font-size="11" fill="#3D4F65">多跳结构相似邻居，打包成自包含样本</text>
  </g>

  <!-- bottom caption -->
  <text x="300" y="378" text-anchor="middle" font-size="11" fill="#1E3A5F">训练时直接读取 50 个预存邻居，不再现场游走</text>
  <text x="300" y="397" text-anchor="middle" font-size="10" fill="#3D4F65" font-style="italic">U-U / U-I / I-I 异构边 · 共 engagement 派生</text>
</svg>
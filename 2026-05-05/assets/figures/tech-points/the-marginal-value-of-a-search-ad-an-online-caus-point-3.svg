<svg height="600" width="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E3A5F">两个 UCB 择优：绕开 1/[Ĝ(1-Ĝ)] 的方差爆炸</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#3D4F65">θ̂ 不准没关系，只要选对"那一侧"的置信上界</text>

  <!-- Central bid axis -->
  <rect x="120" y="88" width="660" height="78" rx="8" fill="#F5F1E8" stroke="#C9A979" stroke-width="1.5"/>
  <text x="450" y="106" text-anchor="middle" font-size="13" fill="#1E3A5F">候选 bid b（按赢拍概率 Ĝ(b) 排列）</text>
  <line x1="150" y1="132" x2="750" y2="132" stroke="#3D4F65" stroke-width="1.5"/>
  <text x="150" y="156" font-size="12" fill="#3D4F65">Ĝ ≈ 0</text>
  <text x="450" y="156" text-anchor="middle" font-size="12" fill="#3D4F65">Ĝ ≈ 0.5（方差最大）</text>
  <text x="750" y="156" text-anchor="end" font-size="12" fill="#3D4F65">Ĝ ≈ 1</text>
  <circle cx="210" cy="132" r="6" fill="#4B8BDA"/>
  <text x="210" y="124" text-anchor="middle" font-size="11" fill="#1E3A5F">b=0.2</text>
  <circle cx="690" cy="132" r="6" fill="#D97757"/>
  <text x="690" y="124" text-anchor="middle" font-size="11" fill="#1E3A5F">b=0.9</text>

  <!-- Left branch: low G -->
  <rect x="70" y="210" width="330" height="190" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="235" y="238" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">左侧：Ĝ 接近 0</text>
  <text x="235" y="268" text-anchor="middle" font-size="13" fill="#3D4F65">用 r̂_t,0 这一版</text>
  <text x="235" y="292" text-anchor="middle" font-size="13" fill="#3D4F65">宽度 w_0 ∝ Ĝ → 很紧</text>
  <text x="235" y="316" text-anchor="middle" font-size="13" fill="#3D4F65">另一版 w_1 会爆炸，丢掉</text>
  <rect x="95" y="345" width="280" height="36" rx="6" fill="#4B8BDA"/>
  <text x="235" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">UCB = r̂_t,0 + w_0</text>

  <!-- Right branch: high G -->
  <rect x="500" y="210" width="330" height="190" rx="12" fill="#FBEFE8" stroke="#D97757" stroke-width="2"/>
  <text x="665" y="238" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">右侧：Ĝ 接近 1</text>
  <text x="665" y="268" text-anchor="middle" font-size="13" fill="#3D4F65">用 r̂_t,1 这一版</text>
  <text x="665" y="292" text-anchor="middle" font-size="13" fill="#3D4F65">宽度 w_1 ∝ (1-Ĝ) → 很紧</text>
  <text x="665" y="316" text-anchor="middle" font-size="13" fill="#3D4F65">另一版 w_0 会爆炸，丢掉</text>
  <rect x="525" y="345" width="280" height="36" rx="6" fill="#D97757"/>
  <text x="665" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">UCB = r̂_t,1 + w_1</text>

  <!-- arrows from axis to branches -->
  <path d="M 210,166 L 230,208" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arB)"/>
  <path d="M 690,166 L 670,208" stroke="#D97757" stroke-width="2" fill="none" marker-end="url(#arR)"/>

  <!-- arrows from branches to conclusion -->
  <path d="M 235,402 L 320,448" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arB)"/>
  <path d="M 665,402 L 580,448" stroke="#D97757" stroke-width="2" fill="none" marker-end="url(#arR)"/>

  <!-- Bottom conclusion -->
  <rect x="180" y="450" width="540" height="120" rx="12" fill="#1E3A5F"/>
  <text x="450" y="482" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFF4D6">Algorithm 2：按 Ĝ 剪枝，只保留"紧的那一侧"</text>
  <text x="450" y="512" text-anchor="middle" font-size="13" fill="#EFF6FF">瞬时后悔 = O(min(w_0, w_1))，不受 1/[Ĝ(1-Ĝ)] 爆炸拖累</text>
  <text x="450" y="540" text-anchor="middle" font-size="13" fill="#EFF6FF">整体 regret 达到 √(dT) 量级</text>
</svg>
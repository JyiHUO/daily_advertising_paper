<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E07A3C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E3A5F">目标感知的频谱过滤</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#3D4F65">让 target 先告诉模型「该关注哪些频率」，再去过滤用户行为</text>

  <!-- Target branch (top) -->
  <rect x="40" y="90" width="170" height="60" rx="10" fill="#FFF1E6" stroke="#E07A3C" stroke-width="1.8"/>
  <text x="125" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">Target · 行为</text>
  <text x="125" y="135" text-anchor="middle" font-size="12" fill="#3D4F65">注意力分数序列</text>

  <rect x="260" y="90" width="170" height="60" rx="10" fill="#FFF1E6" stroke="#E07A3C" stroke-width="1.8"/>
  <text x="345" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">FFT + Softmax</text>
  <text x="345" y="135" text-anchor="middle" font-size="12" fill="#3D4F65">→ 频率权重 (掩码)</text>

  <!-- User branch (bottom) -->
  <rect x="40" y="340" width="170" height="60" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="125" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">用户行为序列</text>
  <text x="125" y="385" text-anchor="middle" font-size="12" fill="#3D4F65">FFT → 用户频谱</text>

  <!-- Multiply node -->
  <circle cx="475" cy="250" r="28" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="475" y="258" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">×</text>
  <text x="475" y="300" text-anchor="middle" font-size="11" fill="#3D4F65">频率维加权</text>

  <!-- Complex MLP -->
  <rect x="560" y="210" width="170" height="80" rx="10" fill="#E8EEF7" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="645" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">复数 MLP</text>
  <text x="645" y="262" text-anchor="middle" font-size="12" fill="#3D4F65">可学习频谱滤波器</text>
  <text x="645" y="280" text-anchor="middle" font-size="11" fill="#3D4F65">保持幅度-相位耦合</text>

  <!-- IFFT output -->
  <rect x="770" y="220" width="100" height="60" rx="10" fill="#EAF4EC" stroke="#4C9A6B" stroke-width="1.8"/>
  <text x="820" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">IFFT</text>
  <text x="820" y="265" text-anchor="middle" font-size="11" fill="#3D4F65">提纯兴趣</text>

  <!-- Arrows top path -->
  <line x1="210" y1="120" x2="258" y2="120" stroke="#E07A3C" stroke-width="2" marker-end="url(#arrO)"/>
  <path d="M 345 150 L 345 200 L 445 235" fill="none" stroke="#E07A3C" stroke-width="2" marker-end="url(#arrO)"/>

  <!-- Arrows bottom path -->
  <path d="M 210 370 L 345 370 L 445 270" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- × to MLP to IFFT -->
  <line x1="503" y1="250" x2="558" y2="250" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="730" y1="250" x2="768" y2="250" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Mini spectra row -->
  <!-- user spectrum (noisy) -->
  <g transform="translate(55,430)">
    <line x1="0" y1="55" x2="150" y2="55" stroke="#3D4F65" stroke-width="1"/>
    <rect x="10" y="30" width="10" height="25" fill="#4B8BDA"/>
    <rect x="30" y="15" width="10" height="40" fill="#4B8BDA"/>
    <rect x="50" y="38" width="10" height="17" fill="#4B8BDA"/>
    <rect x="70" y="10" width="10" height="45" fill="#4B8BDA"/>
    <rect x="90" y="32" width="10" height="23" fill="#4B8BDA"/>
    <rect x="110" y="20" width="10" height="35" fill="#4B8BDA"/>
    <rect x="130" y="40" width="10" height="15" fill="#4B8BDA"/>
    <text x="75" y="75" text-anchor="middle" font-size="10" fill="#3D4F65">原始：混有噪声频率</text>
  </g>

  <!-- target mask spectrum -->
  <g transform="translate(275,430)">
    <line x1="0" y1="55" x2="150" y2="55" stroke="#3D4F65" stroke-width="1"/>
    <rect x="10" y="48" width="10" height="7" fill="#E07A3C"/>
    <rect x="30" y="45" width="10" height="10" fill="#E07A3C"/>
    <rect x="50" y="15" width="10" height="40" fill="#E07A3C"/>
    <rect x="70" y="8" width="10" height="47" fill="#E07A3C"/>
    <rect x="90" y="47" width="10" height="8" fill="#E07A3C"/>
    <rect x="110" y="46" width="10" height="9" fill="#E07A3C"/>
    <rect x="130" y="49" width="10" height="6" fill="#E07A3C"/>
    <text x="75" y="75" text-anchor="middle" font-size="10" fill="#7A4A1F">Target 掩码：锁定 f3</text>
  </g>

  <!-- filtered spectrum -->
  <g transform="translate(500,430)">
    <line x1="0" y1="55" x2="150" y2="55" stroke="#3D4F65" stroke-width="1"/>
    <rect x="10" y="52" width="10" height="3" fill="#4C9A6B"/>
    <rect x="30" y="50" width="10" height="5" fill="#4C9A6B"/>
    <rect x="50" y="18" width="10" height="37" fill="#4C9A6B"/>
    <rect x="70" y="5" width="10" height="50" fill="#4C9A6B"/>
    <rect x="90" y="51" width="10" height="4" fill="#4C9A6B"/>
    <rect x="110" y="50" width="10" height="5" fill="#4C9A6B"/>
    <rect x="130" y="53" width="10" height="2" fill="#4C9A6B"/>
    <text x="75" y="75" text-anchor="middle" font-size="10" fill="#2F6B48">加权后：主谐波突出</text>
  </g>

  <!-- final output illustration -->
  <g transform="translate(720,430)">
    <path d="M0,40 Q 15,10 30,40 T 60,40 T 90,40 T 120,40 T 150,40" stroke="#4C9A6B" stroke-width="2" fill="none"/>
    <text x="75" y="75" text-anchor="middle" font-size="10" fill="#2F6B48">提纯的周期性兴趣</text>
  </g>

  <!-- footer caption -->
  <text x="450" y="540" text-anchor="middle" font-size="12" fill="#3D4F65" font-style="italic">不是盲目滤波整段用户序列，而是"看着 target"去滤</text>
</svg>
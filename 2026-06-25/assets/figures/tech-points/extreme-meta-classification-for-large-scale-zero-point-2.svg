<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E3A5F">为新物品即时合成分类器</text>
  <text x="300" y="60" text-anchor="middle" font-size="12" fill="#3D4F65">轻量 Transformer 学会"听谁、忽略谁"</text>

  <!-- New item -->
  <circle cx="80" cy="220" r="36" fill="#FFE8D6" stroke="#D98E5B" stroke-width="2"/>
  <text x="80" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">新物品</text>
  <text x="80" y="234" text-anchor="middle" font-size="10" fill="#3D4F65">无日志</text>

  <!-- ANN neighbors -->
  <text x="260" y="92" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">ANN 取 Top-K（冻结）</text>

  <rect x="200" y="110" width="120" height="42" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="260" y="136" text-anchor="middle" font-size="12" fill="#1E3A5F">邻居 w₁ ✓</text>

  <rect x="200" y="200" width="120" height="42" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="260" y="226" text-anchor="middle" font-size="12" fill="#1E3A5F">邻居 w₂ ?</text>

  <rect x="200" y="290" width="120" height="42" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="260" y="316" text-anchor="middle" font-size="12" fill="#1E3A5F">邻居 w₃ ✗</text>

  <!-- arrows from new item to neighbors -->
  <path d="M112,200 Q155,160 198,135" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M116,221 L198,221" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M112,240 Q155,285 198,308" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- Transformer -->
  <rect x="380" y="170" width="130" height="100" rx="14" fill="#1E3A5F"/>
  <text x="445" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFE8D6">Transformer</text>
  <text x="445" y="220" text-anchor="middle" font-size="11" fill="#EFF6FF">注意力加权</text>
  <text x="445" y="255" text-anchor="middle" font-size="10" fill="#9FC4F0">仅训这一层</text>

  <!-- neighbor -> transformer arrows -->
  <path d="M320,135 Q350,155 380,185" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M320,221 L378,221" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M320,308 Q350,285 380,257" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- Output classifier -->
  <polygon points="560,220 525,195 525,245" fill="#D98E5B"/>
  <text x="542" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">新分类器 u</text>
  <path d="M510,220 L524,220" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- Footer note -->
  <text x="300" y="385" text-anchor="middle" font-size="11" fill="#3D4F65">编码器与老分类器全部冻结 · 毫秒级上线</text>
</svg>
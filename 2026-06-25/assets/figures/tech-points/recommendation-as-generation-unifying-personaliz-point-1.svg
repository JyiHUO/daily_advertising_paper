<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9627A"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="300" y="34" font-size="17" font-weight="700" fill="#1E3A5F" text-anchor="middle">解耦语义ID：内容 ⊥ 创意</text>
  <text x="300" y="56" font-size="12" fill="#3D4F65" text-anchor="middle">一个视频 → 两条正交标签线</text>

  <!-- video source -->
  <circle cx="80" cy="220" r="38" fill="#FFF4E6" stroke="#E6A55C" stroke-width="2"/>
  <polygon points="68,206 68,234 100,220" fill="#E6A55C"/>
  <text x="80" y="282" font-size="12" fill="#1E3A5F" text-anchor="middle" font-weight="600">视频</text>

  <!-- content branch -->
  <rect x="260" y="100" width="200" height="80" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="360" y="128" font-size="14" font-weight="700" fill="#1E3A5F" text-anchor="middle">内容 D-SIDs（讲什么）</text>
  <text x="360" y="152" font-size="11" fill="#3D4F65" text-anchor="middle">母婴 · 护肤 · 家居</text>
  <text x="360" y="170" font-size="10" fill="#3D4F65" text-anchor="middle">RQ-KMeans · 4层 × 8192码</text>

  <!-- creative branch -->
  <rect x="260" y="260" width="200" height="80" rx="10" fill="#FDECEF" stroke="#D9627A" stroke-width="2"/>
  <text x="360" y="288" font-size="14" font-weight="700" fill="#1E3A5F" text-anchor="middle">创意 D-SIDs（怎么讲）</text>
  <text x="360" y="312" font-size="11" fill="#3D4F65" text-anchor="middle">温馨 · 开箱 · 节奏</text>
  <text x="360" y="330" font-size="10" fill="#3D4F65" text-anchor="middle">RQ-KMeans · 4层 × 8192码</text>

  <!-- arrows from video to two branches -->
  <path d="M115,205 L258,140" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M115,235 L258,300" fill="none" stroke="#D9627A" stroke-width="2" marker-end="url(#ar)"/>

  <!-- orthogonality symbol between two branches -->
  <g transform="translate(200,220)">
    <circle r="22" fill="#ffffff" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="0" y="8" font-size="22" fill="#1E3A5F" text-anchor="middle" font-weight="700">⊥</text>
  </g>
  <text x="200" y="262" font-size="10" fill="#3D4F65" text-anchor="middle">正交约束</text>

  <!-- GRM output -->
  <rect x="495" y="180" width="90" height="80" rx="10" fill="#E8F1E8" stroke="#5A9A6E" stroke-width="2"/>
  <text x="540" y="212" font-size="13" font-weight="700" fill="#1E3A5F" text-anchor="middle">GRM</text>
  <text x="540" y="232" font-size="10" fill="#3D4F65" text-anchor="middle">独立预测</text>
  <text x="540" y="248" font-size="10" fill="#3D4F65" text-anchor="middle">两套码</text>

  <path d="M460,140 L495,195" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ab)"/>
  <path d="M460,300 L495,245" fill="none" stroke="#D9627A" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- bottom note -->
  <text x="300" y="395" font-size="11" fill="#3D4F65" text-anchor="middle" font-style="italic">内容与风格各自量化 · 互不泄漏 · 可独立生成</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1E3A5F">EMMETT：为新物品即时合成分类器</text>
  <text x="300" y="52" text-anchor="middle" font-size="11" fill="#3D4F65">无需点击数据 · 无需重训</text>

  <!-- New item on the left -->
  <g>
    <circle cx="75" cy="220" r="40" fill="#FEF3E7" stroke="#E8A05C" stroke-width="2"/>
    <text x="75" y="218" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">新物品</text>
    <text x="75" y="234" text-anchor="middle" font-size="10" fill="#3D4F65">无日志</text>
  </g>

  <!-- Neighbor classifiers -->
  <rect x="215" y="95" width="120" height="48" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="275" y="125" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">邻居分类器 w₁</text>

  <rect x="215" y="196" width="120" height="48" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="275" y="226" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">邻居分类器 w₂</text>

  <rect x="215" y="297" width="120" height="48" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="275" y="327" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">邻居分类器 w₃</text>

  <!-- Selector S arrows -->
  <line x1="115" y1="205" x2="213" y2="125" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="115" y1="220" x2="213" y2="220" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="115" y1="235" x2="213" y2="315" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="135" y="155" font-size="11" fill="#4B8BDA" font-style="italic" font-weight="600">S: 选K个邻居</text>

  <!-- Fusion node G -->
  <circle cx="435" cy="220" r="46" fill="#E8F0FE" stroke="#1E3A5F" stroke-width="2"/>
  <text x="435" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">融合器 G</text>
  <text x="435" y="234" text-anchor="middle" font-size="10" fill="#3D4F65">揉成新知识包</text>

  <line x1="335" y1="125" x2="395" y2="195" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="335" y1="220" x2="389" y2="220" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="335" y1="315" x2="395" y2="245" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- New item also feeds G directly -->
  <path d="M 95 250 Q 240 380 395 250" fill="none" stroke="#E8A05C" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ar)"/>
  <text x="245" y="365" font-size="10" fill="#E8A05C" font-style="italic">新物品编码也送入 G</text>

  <!-- Output: synthesized classifier -->
  <rect x="515" y="190" width="75" height="60" rx="8" fill="#FEF3E7" stroke="#E8A05C" stroke-width="2"/>
  <text x="552" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">u</text>
  <text x="552" y="234" text-anchor="middle" font-size="10" fill="#3D4F65">新分类器</text>
  <line x1="481" y1="220" x2="513" y2="220" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- Bottom: query scoring -->
  <text x="300" y="402" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">检索时：score = query · u  →  召回新物品</text>
</svg>
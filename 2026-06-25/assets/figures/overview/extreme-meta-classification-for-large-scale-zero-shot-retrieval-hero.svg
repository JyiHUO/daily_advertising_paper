<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ahO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E89B4A"/>
    </marker>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE9C9"/>
      <stop offset="100%" stop-color="#F4B870"/>
    </radialGradient>
  </defs>

  <rect width="900" height="620" fill="#FAFBFD"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">为新广告"即时合成"分类器：零样本大规模召回</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#3D4F65">EMMETT / IRENE · 不重训也能拿到 Extreme Classification 级精度</text>

  <!-- LEFT: observed items (classifier bank) -->
  <g>
    <text x="125" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">已观察广告 · 分类器库</text>
    <g fill="#DCE9F7" stroke="#4B8BDA" stroke-width="1.2">
      <rect x="60"  y="140" width="60" height="36" rx="6"/>
      <rect x="130" y="140" width="60" height="36" rx="6"/>
      <rect x="60"  y="186" width="60" height="36" rx="6"/>
      <rect x="130" y="186" width="60" height="36" rx="6"/>
      <rect x="60"  y="232" width="60" height="36" rx="6"/>
      <rect x="130" y="232" width="60" height="36" rx="6"/>
    </g>
    <g font-size="11" fill="#3D4F65" text-anchor="middle">
      <text x="90"  y="163">w₁</text><text x="160" y="163">w₂</text>
      <text x="90"  y="209">w₃</text><text x="160" y="209">w₄</text>
      <text x="90"  y="255">…</text><text x="160" y="255">w_L</text>
    </g>
    <text x="125" y="290" text-anchor="middle" font-size="11" fill="#6B7B90">每个老广告一个分类器（冻结）</text>
  </g>

  <!-- Selector S: pick K neighbors -->
  <g>
    <path d="M195,205 C 260,230 290,260 348,290" stroke="#4B8BDA" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
    <path d="M195,205 C 260,205 290,250 348,310" stroke="#4B8BDA" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
    <path d="M195,205 C 260,210 290,240 348,330" stroke="#4B8BDA" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
    <text x="248" y="178" font-size="11" fill="#4B8BDA" font-weight="600">S: ANN 选 K 个邻居</text>
  </g>

  <!-- CENTER: IRENE core (meta-classifier synthesizer) -->
  <g>
    <circle cx="450" cy="320" r="110" fill="url(#core)" opacity="0.45"/>
    <circle cx="450" cy="320" r="86"  fill="#F8C988" stroke="#E89B4A" stroke-width="2"/>
    <text x="450" y="300" text-anchor="middle" font-size="17" font-weight="700" fill="#7A3E10">IRENE</text>
    <text x="450" y="320" text-anchor="middle" font-size="11" fill="#7A3E10">单层 Transformer 生成器 G</text>
    <text x="450" y="338" text-anchor="middle" font-size="11" fill="#7A3E10">融合邻居 w + 新广告 z</text>
    <text x="450" y="356" text-anchor="middle" font-size="11" fill="#7A3E10">→ 新分类器 u</text>
  </g>

  <!-- New item input from top -->
  <g>
    <rect x="395" y="125" width="110" height="44" rx="22" fill="#E7F1FC" stroke="#4B8BDA" stroke-width="1.4"/>
    <text x="450" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">新广告文本</text>
    <text x="450" y="163" text-anchor="middle" font-size="10" fill="#3D4F65">编码器 E（冻结）→ z</text>
    <path d="M450,170 L450,232" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  </g>

  <!-- RIGHT: query scoring &amp; ANN -->
  <g>
    <path d="M540,320 L660,320" stroke="#E89B4A" stroke-width="2.4" fill="none" marker-end="url(#ahO)"/>
    <text x="600" y="310" text-anchor="middle" font-size="11" fill="#B36419" font-weight="600">合成分类器 u</text>

    <rect x="660" y="285" width="180" height="80" rx="10" fill="#FFF4E5" stroke="#E89B4A" stroke-width="1.4"/>
    <text x="750" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#7A3E10">x · u 打分</text>
    <text x="750" y="330" text-anchor="middle" font-size="11" fill="#7A3E10">写入 ANN 索引</text>
    <text x="750" y="350" text-anchor="middle" font-size="11" fill="#7A3E10">新广告秒级可召回</text>

    <!-- query -->
    <rect x="685" y="200" width="130" height="34" rx="17" fill="#E7F1FC" stroke="#4B8BDA" stroke-width="1.2"/>
    <text x="750" y="222" text-anchor="middle" font-size="12" fill="#1E3A5F">用户 query x</text>
    <path d="M750,236 L750,283" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
  </g>

  <!-- side caption -->
  <text x="450" y="440" text-anchor="middle" font-size="10" fill="#6B7B90">训练时冻结 E 和 W，仅训 G（伪零样本 + 加权 BCE）</text>

  <!-- BOTTOM: outcome / online A/B -->
  <g>
    <line x1="80" y1="475" x2="820" y2="475" stroke="#D6DEE8" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="80" y="468" font-size="12" font-weight="700" fill="#1E3A5F">线上收益（Bing 赞助搜索 A/B）</text>

    <g transform="translate(120,530)">
      <circle r="34" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
      <text y="-2" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">+4.2%</text>
      <text y="15" text-anchor="middle" font-size="10" fill="#3D4F65">CTR</text>
    </g>
    <g transform="translate(260,530)">
      <circle r="34" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
      <text y="-2" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">−0.9%</text>
      <text y="15" text-anchor="middle" font-size="10" fill="#3D4F65">快速关闭</text>
    </g>
    <g transform="translate(400,530)">
      <circle r="34" fill="#FFF4E5" stroke="#E89B4A" stroke-width="1.6"/>
      <text y="-2" text-anchor="middle" font-size="14" font-weight="700" fill="#7A3E10">+15pt</text>
      <text y="15" text-anchor="middle" font-size="10" fill="#3D4F65">Recall@10</text>
    </g>
    <g transform="translate(540,530)">
      <circle r="34" fill="#FFF4E5" stroke="#E89B4A" stroke-width="1.6"/>
      <text y="-2" text-anchor="middle" font-size="14" font-weight="700" fill="#7A3E10">+13%</text>
      <text y="15" text-anchor="middle" font-size="10" fill="#3D4F65">好关键词</text>
    </g>
    <g transform="translate(710,530)">
      <rect x="-90" y="-32" width="180" height="64" rx="10" fill="#F4F7FB" stroke="#B8C6D9" stroke-width="1"/>
      <text y="-12" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">不重训 · 不等点击日志</text>
      <text y="6" text-anchor="middle" font-size="11" fill="#3D4F65">XC 精度 + Siamese 时效</text>
      <text y="22" text-anchor="middle" font-size="10" fill="#6B7B90">弥合两条路线的鸿沟</text>
    </g>
  </g>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C98A3F"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">县级随机：按县切分，避免溢出污染</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">用户共享岗位池，用户级 A/B 会互相抢工 → 整县作为实验单元</text>

  <!-- Aomori : Treatment -->
  <g>
    <ellipse cx="200" cy="160" rx="120" ry="60" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2.5"/>
    <text x="200" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">青森县（处理）</text>
    <text x="200" y="178" text-anchor="middle" font-size="13" fill="#3D4F65">新推荐 TEC（自适应配额）</text>
  </g>

  <!-- Iwate : Control -->
  <g>
    <ellipse cx="600" cy="160" rx="120" ry="60" fill="#FBF1E6" stroke="#C98A3F" stroke-width="2.5"/>
    <text x="600" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">岩手县（对照）</text>
    <text x="600" y="178" text-anchor="middle" font-size="13" fill="#3D4F65">原推荐算法</text>
  </g>

  <!-- vertical separator -->
  <line x1="400" y1="90" x2="400" y2="250" stroke="#B7C5D6" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- arrows down -->
  <line x1="200" y1="222" x2="200" y2="318" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="600" y1="222" x2="600" y2="318" stroke="#C98A3F" stroke-width="2.5" marker-end="url(#aro)"/>

  <!-- outcome boxes -->
  <rect x="70" y="320" width="260" height="120" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="200" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">处理组结果</text>
  <text x="200" y="372" text-anchor="middle" font-size="13" fill="#3D4F65">匹配数 ↑，零订阅模板比例 ↓</text>
  <text x="200" y="394" text-anchor="middle" font-size="13" fill="#3D4F65">曝光长尾被削薄，多样性 ↑</text>
  <text x="200" y="416" text-anchor="middle" font-size="13" fill="#3D4F65">日均收藏总量基本不变</text>

  <rect x="470" y="320" width="260" height="120" rx="10" fill="#FBF1E6" stroke="#C98A3F" stroke-width="1.5"/>
  <text x="600" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">对照组基线</text>
  <text x="600" y="380" text-anchor="middle" font-size="13" fill="#3D4F65">曝光集中于热门但少开班的模板</text>
  <text x="600" y="404" text-anchor="middle" font-size="13" fill="#3D4F65">相当比例模板当天 0 订阅</text>

  <!-- diff bracket -->
  <path d="M340,380 L370,380 M370,355 L370,405 M370,380 L430,380 M430,355 L430,405 M430,380 L460,380" stroke="#1E3A5F" stroke-width="1.5" fill="none"/>
  <text x="400" y="475" text-anchor="middle" font-size="13" font-style="italic" fill="#1E3A5F">县 × 日面板 + 双向固定效应 → ITT 效应（2026-01-12 至 02-11）</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA5B1"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">按地区随机，避免市场内串扰</text>
  <text x="400" y="60" text-anchor="middle" font-size="13" fill="#3D4F65">用户级 A/B 会互抢供给；整县切换才能干净评估</text>

  <!-- Aomori: Treatment -->
  <g>
    <ellipse cx="220" cy="160" rx="95" ry="60" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2.5"/>
    <text x="220" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">青森（处理组）</text>
    <text x="220" y="172" text-anchor="middle" font-size="12" fill="#3D4F65">上线 TEC 新算法</text>
  </g>

  <!-- Iwate: Control -->
  <g>
    <ellipse cx="580" cy="160" rx="95" ry="60" fill="#FBF1E6" stroke="#D89B5B" stroke-width="2.5"/>
    <text x="580" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">岩手（对照组）</text>
    <text x="580" y="172" text-anchor="middle" font-size="12" fill="#3D4F65">维持旧推荐</text>
  </g>

  <!-- DID arrow between -->
  <line x1="318" y1="160" x2="482" y2="160" stroke="#4B8BDA" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="400" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">DID 差分中差分</text>
  <text x="400" y="200" text-anchor="middle" font-size="11" fill="#3D4F65">实验期 2026/01/12 – 02/11</text>

  <!-- Outcomes Aomori -->
  <g transform="translate(100,260)">
    <rect width="240" height="170" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="120" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">青森：尾部被看见</text>
    <text x="120" y="58" text-anchor="middle" font-size="12" fill="#3D4F65">零订阅模板占比 ↓</text>
    <text x="120" y="82" text-anchor="middle" font-size="12" fill="#3D4F65">单次曝光收藏率 ↑</text>
    <text x="120" y="106" text-anchor="middle" font-size="12" fill="#3D4F65">岗位匹配率 ↑</text>
    <text x="120" y="142" text-anchor="middle" font-size="11" font-style="italic" fill="#4B8BDA">曝光分布向中间集中</text>
  </g>

  <!-- Outcomes Iwate -->
  <g transform="translate(460,260)">
    <rect width="240" height="170" rx="10" fill="#F5F5F5" stroke="#9AA5B1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="120" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">岩手：维持原状</text>
    <text x="120" y="58" text-anchor="middle" font-size="12" fill="#3D4F65">热门模板继续霸屏</text>
    <text x="120" y="82" text-anchor="middle" font-size="12" fill="#3D4F65">尾部模板继续沉没</text>
    <text x="120" y="142" text-anchor="middle" font-size="11" font-style="italic" fill="#3D4F65">作为反事实基线</text>
  </g>

  <line x1="220" y1="222" x2="220" y2="256" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="580" y1="222" x2="580" y2="256" stroke="#9AA5B1" stroke-width="2" marker-end="url(#arg)"/>

  <text x="400" y="465" text-anchor="middle" font-size="11" fill="#3D4F65">→ 启示：广告曝光实验也应在市场级随机，避免预算/库存级串扰</text>
</svg>
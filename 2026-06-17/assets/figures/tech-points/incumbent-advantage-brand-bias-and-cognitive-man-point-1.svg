<svg height="600" width="960" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">条件性垄断：信号一出，光环即灭</text>

  <!-- LEFT: Tie scenario -->
  <g>
    <rect x="50" y="70" width="320" height="360" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="210" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">参数完全相同</text>
    <text x="210" y="120" text-anchor="middle" font-size="12" fill="#3D4F65">10 件商品 · 同分同价</text>

    <!-- Crown over known brand -->
    <g transform="translate(210,170)">
      <path d="M-28,-10 L-20,-26 L-8,-14 L0,-30 L8,-14 L20,-26 L28,-10 Z" fill="#E8B547" stroke="#B8862E" stroke-width="1"/>
      <rect x="-30" y="-8" width="60" height="6" fill="#E8B547" stroke="#B8862E"/>
    </g>
    <rect x="160" y="180" width="100" height="46" rx="8" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="210" y="209" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">真实品牌</text>

    <!-- 9 small unknown -->
    <g fill="#FFFFFF" stroke="#9AA8B8" stroke-width="1">
      <rect x="70"  y="260" width="56" height="28" rx="5"/>
      <rect x="135" y="260" width="56" height="28" rx="5"/>
      <rect x="200" y="260" width="56" height="28" rx="5"/>
      <rect x="265" y="260" width="56" height="28" rx="5"/>
      <rect x="70"  y="298" width="56" height="28" rx="5"/>
      <rect x="135" y="298" width="56" height="28" rx="5"/>
      <rect x="200" y="298" width="56" height="28" rx="5"/>
      <rect x="265" y="298" width="56" height="28" rx="5"/>
      <rect x="167" y="336" width="56" height="28" rx="5"/>
    </g>
    <text x="210" y="388" text-anchor="middle" font-size="12" fill="#3D4F65">9 个虚构品牌</text>

    <text x="210" y="418" text-anchor="middle" font-size="16" font-weight="700" fill="#C0392B">IAI = 10.0（100% 被推）</text>
  </g>

  <!-- Arrow: tiny signal -->
  <g>
    <line x1="375" y1="250" x2="435" y2="250" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="405" y="238" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">+0.075 星</text>
    <text x="405" y="270" text-anchor="middle" font-size="11" fill="#1E3A5F">一丝信号</text>
  </g>

  <!-- RIGHT: signal scenario -->
  <g>
    <rect x="440" y="70" width="320" height="360" rx="14" fill="#FFF4E6" stroke="#E8A547" stroke-width="1.5"/>
    <text x="600" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">出现微小差异</text>
    <text x="600" y="120" text-anchor="middle" font-size="12" fill="#3D4F65">某虚构品牌 +0.1 星</text>

    <!-- Faded known brand, no crown -->
    <rect x="470" y="175" width="100" height="46" rx="8" fill="#FFFFFF" stroke="#9AA8B8" stroke-width="1" opacity="0.6"/>
    <text x="520" y="204" text-anchor="middle" font-size="13" fill="#9AA8B8">真实品牌</text>

    <!-- Highlighted unknown brand with star -->
    <g transform="translate(680,175)">
      <polygon points="-50,-18 -46,-6 -34,-6 -44,1 -40,13 -50,6 -60,13 -56,1 -66,-6 -54,-6" fill="#E8B547" stroke="#B8862E"/>
      <rect x="-60" y="0" width="100" height="46" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
      <text x="-10" y="29" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">虚构品牌</text>
    </g>

    <!-- mode switch label -->
    <rect x="490" y="250" width="220" height="36" rx="18" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="600" y="273" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">切换为「看参数模式」</text>

    <text x="600" y="320" text-anchor="middle" font-size="12" fill="#3D4F65">参数差异解释 82.4% 排名方差</text>
    <text x="600" y="342" text-anchor="middle" font-size="12" fill="#3D4F65">品牌身份仅解释 1.2%</text>

    <text x="600" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#2E7D5B">胜率 5% → 70%</text>
    <text x="600" y="414" text-anchor="middle" font-size="11" fill="#3D4F65">阶跃式跳变</text>
  </g>

  <text x="400" y="470" text-anchor="middle" font-size="13" fill="#1E3A5F" font-style="italic">品牌光环只在「无信号」时生效</text>
</svg>
<svg height="600" width="960" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E3A5F">权威话术 ≈ +0.17 ★</text>
  <text x="400" y="65" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3D4F65">一句"伪临床声明" = 真材实料多打磨</text>

  <!-- Left: words bubble -->
  <g>
    <rect x="60" y="130" width="220" height="190" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="170" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1E3A5F" font-weight="bold">一句话（零成本）</text>
    <text x="170" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">"同行评审临床试验，</text>
    <text x="170" y="222" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">n=120, p&lt;0.01，</text>
    <text x="170" y="244" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">7天改善率 87%"</text>
    <text x="170" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8B6F47" font-style="italic">权威感语言</text>
  </g>

  <!-- Balance / equivalence -->
  <g transform="translate(400,225)">
    <circle r="42" fill="#FFF4E6" stroke="#D9933F" stroke-width="2"/>
    <text y="0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E3A5F">≈</text>
    <text y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8B6F47">BSV 等价</text>
  </g>

  <!-- Right: real quality -->
  <g>
    <rect x="520" y="130" width="220" height="190" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="630" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">真材实料（昂贵）</text>
    <text x="630" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3D4F65">+0.17 ★ 评分</text>
    <text x="630" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3D4F65">−15.3% 降价</text>
    <text x="630" y="252" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3D4F65">×1.9 评论数</text>
    <text x="630" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8B6F47" font-style="italic">同等胜率所需</text>
  </g>

  <!-- Arrows to balance -->
  <line x1="282" y1="225" x2="356" y2="225" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="518" y1="225" x2="444" y2="225" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Down arrow -->
  <line x1="400" y1="272" x2="400" y2="385" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Bottom outcome -->
  <g transform="translate(400,420)">
    <rect x="-260" y="-30" width="520" height="60" rx="12" fill="#1E3A5F"/>
    <text y="-5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">LLM 推荐率：5% → 69%</text>
    <text y="18" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#A8C5E8">权威类话术突破率 73%，远超促销/稀缺 10–13%</text>
  </g>
</svg>
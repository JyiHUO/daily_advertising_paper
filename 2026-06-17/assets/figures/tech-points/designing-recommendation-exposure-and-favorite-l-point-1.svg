<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8553D"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">收藏率最高 ≠ 能匹配上工作</text>
  <text x="300" y="56" text-anchor="middle" font-size="12" fill="#3D4F65">贪心推荐把曝光堆给"好看但缺货"的模板</text>

  <!-- Left: Hot template (popular but no supply) -->
  <g>
    <rect x="60" y="80" width="220" height="270" rx="10" fill="#FFF1ED" stroke="#C8553D" stroke-width="1.5"/>
    <text x="170" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#C8553D">热门模板：高收藏率 · 岗位极少</text>

    <!-- big crowd of workers -->
    <g fill="#4B8BDA">
      <circle cx="95" cy="150" r="7"/><circle cx="120" cy="150" r="7"/><circle cx="145" cy="150" r="7"/><circle cx="170" cy="150" r="7"/><circle cx="195" cy="150" r="7"/><circle cx="220" cy="150" r="7"/><circle cx="245" cy="150" r="7"/>
      <circle cx="107" cy="172" r="7"/><circle cx="132" cy="172" r="7"/><circle cx="158" cy="172" r="7"/><circle cx="183" cy="172" r="7"/><circle cx="208" cy="172" r="7"/><circle cx="233" cy="172" r="7"/>
      <circle cx="120" cy="194" r="7"/><circle cx="145" cy="194" r="7"/><circle cx="170" cy="194" r="7"/><circle cx="195" cy="194" r="7"/><circle cx="220" cy="194" r="7"/>
    </g>
    <text x="170" y="222" text-anchor="middle" font-size="11" fill="#3D4F65">Top10% 模板拿到 36.7% 曝光</text>

    <!-- tiny slot -->
    <rect x="145" y="246" width="50" height="22" fill="#fff" stroke="#C8553D" stroke-width="1.5"/>
    <text x="170" y="261" text-anchor="middle" font-size="11" fill="#C8553D">仅 1 个岗</text>

    <text x="170" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="#C8553D">先到先得 → 多数人空收藏</text>
    <text x="170" y="326" text-anchor="middle" font-size="11" fill="#3D4F65">边际收益递减被忽略</text>
  </g>

  <!-- Right: Cold template (real demand) -->
  <g>
    <rect x="320" y="80" width="220" height="270" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="430" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">真缺人模板：收藏率低 · 岗位充足</text>

    <!-- few workers -->
    <g fill="#4B8BDA">
      <circle cx="395" cy="170" r="7"/><circle cx="430" cy="170" r="7"/><circle cx="465" cy="170" r="7"/>
    </g>
    <text x="430" y="200" text-anchor="middle" font-size="11" fill="#3D4F65">曝光被挤走，订阅者寥寥</text>

    <!-- many slots -->
    <g fill="#fff" stroke="#4B8BDA" stroke-width="1.5">
      <rect x="358" y="226" width="28" height="20"/>
      <rect x="392" y="226" width="28" height="20"/>
      <rect x="426" y="226" width="28" height="20"/>
      <rect x="460" y="226" width="28" height="20"/>
      <rect x="494" y="226" width="28" height="20"/>
      <rect x="375" y="252" width="28" height="20"/>
      <rect x="409" y="252" width="28" height="20"/>
      <rect x="443" y="252" width="28" height="20"/>
      <rect x="477" y="252" width="28" height="20"/>
    </g>

    <text x="430" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">岗位空着 → 招不到人</text>
    <text x="430" y="326" text-anchor="middle" font-size="11" fill="#3D4F65">实际供给信号未被利用</text>
  </g>

  <!-- diagnosis arrows: from problem regions pointing inward to highlight mismatch -->
  <path d="M 280 220 Q 300 220 320 200" stroke="#C8553D" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="300" y="212" text-anchor="middle" font-size="10" fill="#3D4F65">错配</text>

  <text x="300" y="385" text-anchor="middle" font-size="12" font-style="italic" fill="#3D4F65">仿真匹配率仅 57.6% — 中间指标与最终目标系统性错位</text>
</svg>
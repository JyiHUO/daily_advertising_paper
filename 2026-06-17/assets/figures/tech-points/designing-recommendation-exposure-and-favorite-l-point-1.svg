<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9D6E2"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">错配性集中：曝光给错了对象</text>

  <!-- Greedy recommender at top -->
  <g>
    <rect x="290" y="50" width="140" height="42" rx="8" fill="#1E3A5F"/>
    <text x="360" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Greedy 推荐</text>
    <text x="360" y="84" text-anchor="middle" font-size="10" fill="#BFD4EC">只看收藏概率</text>
  </g>

  <!-- Arrows from recommender -->
  <path d="M310,92 Q230,120 200,140" fill="none" stroke="#4B8BDA" stroke-width="5" marker-end="url(#ar)"/>
  <path d="M410,92 Q500,120 525,140" fill="none" stroke="#C9D6E2" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arGray)"/>

  <text x="220" y="115" font-size="10" fill="#4B8BDA" font-weight="700">大量曝光</text>
  <text x="470" y="115" font-size="10" fill="#8AA0B5">几乎不曝光</text>

  <!-- LEFT: Hot template, oversubscribed -->
  <g>
    <rect x="60" y="140" width="280" height="290" rx="12" fill="#FFF4E6" stroke="#E8A857" stroke-width="1.5"/>
    <text x="200" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">热门模板（很少开班）</text>

    <!-- crowd of subscribers -->
    <g fill="#E8A857">
      <circle cx="100" cy="200" r="8"/><circle cx="125" cy="195" r="8"/>
      <circle cx="150" cy="200" r="8"/><circle cx="175" cy="195" r="8"/>
      <circle cx="200" cy="200" r="8"/><circle cx="225" cy="195" r="8"/>
      <circle cx="250" cy="200" r="8"/><circle cx="275" cy="195" r="8"/>
      <circle cx="110" cy="225" r="8"/><circle cx="135" cy="230" r="8"/>
      <circle cx="160" cy="225" r="8"/><circle cx="185" cy="230" r="8"/>
      <circle cx="210" cy="225" r="8"/><circle cx="235" cy="230" r="8"/>
      <circle cx="260" cy="225" r="8"/><circle cx="285" cy="230" r="8"/>
      <circle cx="120" cy="255" r="8"/><circle cx="145" cy="260" r="8"/>
      <circle cx="170" cy="255" r="8"/><circle cx="195" cy="260" r="8"/>
      <circle cx="220" cy="255" r="8"/><circle cx="245" cy="260" r="8"/>
      <circle cx="270" cy="255" r="8"/>
    </g>
    <text x="200" y="295" text-anchor="middle" font-size="11" fill="#3D4F65">数千订阅者</text>

    <!-- one slot -->
    <rect x="175" y="320" width="50" height="34" rx="4" fill="#fff" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="200" y="342" text-anchor="middle" font-size="11" fill="#1E3A5F">1 个班</text>
    <text x="200" y="385" text-anchor="middle" font-size="12" font-style="italic" font-weight="700" fill="#B7472A">抢不到</text>
    <text x="200" y="410" text-anchor="middle" font-size="10" fill="#3D4F65">订阅者 &gt;&gt; 开放岗位</text>
  </g>

  <!-- RIGHT: Cold template, undersubscribed -->
  <g>
    <rect x="380" y="140" width="280" height="290" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="520" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">缺人模板（每日开班）</text>

    <!-- one subscriber -->
    <circle cx="520" cy="205" r="9" fill="#4B8BDA"/>
    <text x="520" y="240" text-anchor="middle" font-size="11" fill="#3D4F65">几乎没人看见</text>

    <!-- many empty slots -->
    <g fill="#fff" stroke="#1E3A5F" stroke-width="1.2">
      <rect x="420" y="260" width="36" height="26" rx="3"/>
      <rect x="462" y="260" width="36" height="26" rx="3"/>
      <rect x="504" y="260" width="36" height="26" rx="3"/>
      <rect x="546" y="260" width="36" height="26" rx="3"/>
      <rect x="588" y="260" width="36" height="26" rx="3"/>
      <rect x="420" y="292" width="36" height="26" rx="3"/>
      <rect x="462" y="292" width="36" height="26" rx="3"/>
      <rect x="504" y="292" width="36" height="26" rx="3"/>
      <rect x="546" y="292" width="36" height="26" rx="3"/>
      <rect x="588" y="292" width="36" height="26" rx="3"/>
    </g>
    <text x="520" y="345" text-anchor="middle" font-size="11" fill="#3D4F65">岗位空着</text>
    <text x="520" y="385" text-anchor="middle" font-size="12" font-style="italic" font-weight="700" fill="#B7472A">无人申请</text>
    <text x="520" y="410" text-anchor="middle" font-size="10" fill="#3D4F65">开放岗位 &gt;&gt; 订阅者</text>
  </g>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97A7A"/>
    </marker>
  </defs>

  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">自适应配额 AQ：按"缺人程度"分配曝光座位</text>

  <!-- Template A: hot but full -->
  <g>
    <rect x="50" y="70" width="220" height="150" rx="10" fill="#FBEFEF" stroke="#C97A7A" stroke-width="1.5"/>
    <text x="160" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">模板 A · 热门但满员</text>
    <text x="160" y="120" text-anchor="middle" font-size="12" fill="#3D4F65">高收藏率 · 发岗 1</text>
    <g>
      <rect x="120" y="150" width="22" height="22" rx="3" fill="#C97A7A"/>
      <rect x="150" y="150" width="22" height="22" rx="3" fill="#E8C7C7"/>
      <rect x="180" y="150" width="22" height="22" rx="3" fill="#E8C7C7"/>
    </g>
    <text x="160" y="200" text-anchor="middle" font-size="12" fill="#8B4444">少量配额</text>
  </g>

  <!-- Template B: real shortage -->
  <g>
    <rect x="450" y="70" width="220" height="150" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="560" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">模板 B · 真缺人</text>
    <text x="560" y="120" text-anchor="middle" font-size="12" fill="#3D4F65">发岗 50 · 空缺 30</text>
    <g fill="#4B8BDA">
      <rect x="470" y="142" width="18" height="18" rx="2"/>
      <rect x="494" y="142" width="18" height="18" rx="2"/>
      <rect x="518" y="142" width="18" height="18" rx="2"/>
      <rect x="542" y="142" width="18" height="18" rx="2"/>
      <rect x="566" y="142" width="18" height="18" rx="2"/>
      <rect x="590" y="142" width="18" height="18" rx="2"/>
      <rect x="614" y="142" width="18" height="18" rx="2"/>
      <rect x="638" y="142" width="18" height="18" rx="2"/>
      <rect x="470" y="165" width="18" height="18" rx="2"/>
      <rect x="494" y="165" width="18" height="18" rx="2"/>
      <rect x="518" y="165" width="18" height="18" rx="2"/>
      <rect x="542" y="165" width="18" height="18" rx="2"/>
    </g>
    <text x="560" y="205" text-anchor="middle" font-size="12" fill="#1E3A5F">更多配额</text>
  </g>

  <!-- Score formula in middle -->
  <g>
    <rect x="295" y="105" width="130" height="80" rx="8" fill="#FFF7E6" stroke="#D9A441" stroke-width="1.3"/>
    <text x="360" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">配额分数 p_k</text>
    <text x="360" y="148" text-anchor="middle" font-size="11" fill="#3D4F65">w₀ · 发岗容量</text>
    <text x="360" y="166" text-anchor="middle" font-size="11" fill="#3D4F65">+ w₁ · 未填补</text>
  </g>

  <!-- Worker queue -->
  <g>
    <text x="60" y="280" font-size="13" font-weight="700" fill="#1E3A5F">工人随机排队，轮流挑仍有票的最爱</text>
    <g>
      <circle cx="80" cy="315" r="11" fill="#3D4F65"/>
      <circle cx="115" cy="315" r="11" fill="#3D4F65"/>
      <circle cx="150" cy="315" r="11" fill="#3D4F65"/>
      <circle cx="185" cy="315" r="11" fill="#9AAEC4"/>
      <circle cx="220" cy="315" r="11" fill="#9AAEC4"/>
    </g>
    <text x="250" y="319" font-size="13" fill="#3D4F65">…</text>
  </g>

  <!-- Thick arrow to B (most workers) -->
  <path d="M 270 310 Q 400 290 455 220" stroke="#4B8BDA" stroke-width="2.6" fill="none" marker-end="url(#ah)"/>
  <text x="380" y="278" font-size="12" fill="#1E3A5F" font-weight="600">多数 → B</text>

  <!-- Thin arrow to A -->
  <path d="M 200 295 Q 190 260 180 222" stroke="#C97A7A" stroke-width="1.4" fill="none" marker-end="url(#ahr)" stroke-dasharray="4,3" opacity="0.8"/>
  <text x="120" y="260" font-size="11" fill="#8B4444">少数 → A</text>

  <!-- Outcome -->
  <g>
    <rect x="200" y="385" width="320" height="55" rx="10" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="360" y="407" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">曝光从"满员热门"引向"真缺人"</text>
    <text x="360" y="426" text-anchor="middle" font-size="12" fill="#3D4F65">整体匹配率 ↑（约 69.5%）</text>
  </g>

  <path d="M 360 348 L 360 383" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ah)"/>
</svg>
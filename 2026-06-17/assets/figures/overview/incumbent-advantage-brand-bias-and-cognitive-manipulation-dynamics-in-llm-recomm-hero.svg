<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
    <radialGradient id="crown" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FCE8C2"/>
      <stop offset="100%" stop-color="#F0B860" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="640" fill="#FAFBFD"/>

  <!-- Title -->
  <text x="450" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">LLM 推荐里的在位优势：何时崩、何时复活</text>
  <text x="450" y="70" text-anchor="middle" font-size="13" fill="#3D4F65">Brand Bias &amp; GEO Dynamics in LLM Recommendations</text>

  <!-- Stage 1: Conditional Monopoly -->
  <g transform="translate(80,140)">
    <text x="100" y="0" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">① 条件性垄断</text>
    <circle cx="100" cy="110" r="80" fill="url(#crown)"/>
    <circle cx="100" cy="110" r="38" fill="#F0B860" stroke="#C8851F" stroke-width="2"/>
    <text x="100" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">知名品牌</text>
    <text x="100" y="122" text-anchor="middle" font-size="11" fill="#1E3A5F">IAI = 10.0</text>
    <g fill="#C9D2DC">
      <circle cx="40" cy="60" r="6"/><circle cx="160" cy="60" r="6"/>
      <circle cx="30" cy="110" r="6"/><circle cx="170" cy="110" r="6"/>
      <circle cx="40" cy="160" r="6"/><circle cx="160" cy="160" r="6"/>
      <circle cx="70" cy="40" r="6"/><circle cx="130" cy="40" r="6"/>
      <circle cx="100" cy="180" r="6"/>
    </g>
    <text x="100" y="225" text-anchor="middle" font-size="11" fill="#3D4F65">参数全同 → 100% 推荐知名品牌</text>
    <text x="100" y="242" text-anchor="middle" font-size="11" fill="#D97757" font-weight="600">+0.1 星即崩塌</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M270,250 L355,250" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="312" y="240" text-anchor="middle" font-size="10" fill="#4B8BDA">挑战者注入话术</text>

  <!-- Stage 2: GEO breaks monopoly -->
  <g transform="translate(370,140)">
    <text x="80" y="0" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">② 权威话术撬动</text>
    <rect x="-10" y="20" width="180" height="200" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    
    <g transform="translate(80,80)">
      <path d="M-28,-12 L8,-22 L8,22 L-28,12 Z" fill="#D97757"/>
      <rect x="-40" y="-8" width="14" height="16" fill="#D97757"/>
      <path d="M14,-14 Q26,0 14,14" stroke="#D97757" stroke-width="2.5" fill="none"/>
    </g>
    <text x="80" y="128" text-anchor="middle" font-size="10" fill="#3D4F65">"同行评审 n=120, p&lt;0.01"</text>
    
    <rect x="10" y="148" width="140" height="28" rx="6" fill="#FFF" stroke="#D97757" stroke-width="1.5"/>
    <text x="80" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#D97757">BSV ≈ +0.17 星</text>
    <text x="80" y="193" text-anchor="middle" font-size="10" fill="#3D4F65">≈ 15% 降价 ≈ 1.9× 评论数</text>
    <text x="80" y="210" text-anchor="middle" font-size="10" fill="#3D4F65">突破率 73%</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M545,250 L635,250" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="590" y="240" text-anchor="middle" font-size="10" fill="#4B8BDA">所有品牌跟进</text>

  <!-- Stage 3: Prisoner's dilemma -->
  <g transform="translate(640,140)">
    <text x="100" y="0" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">③ GEO 囚徒困境</text>
    <rect x="0" y="20" width="200" height="200" rx="14" fill="#FDF2EC" stroke="#D97757" stroke-width="1.5"/>
    
    <g fill="#D97757" opacity="0.55">
      <path d="M30,55 l16,-5 l0,18 l-16,-5 z"/>
      <path d="M70,50 l16,-5 l0,18 l-16,-5 z"/>
      <path d="M110,55 l16,-5 l0,18 l-16,-5 z"/>
      <path d="M150,50 l16,-5 l0,18 l-16,-5 z"/>
      <path d="M50,85 l16,-5 l0,18 l-16,-5 z"/>
      <path d="M90,82 l16,-5 l0,18 l-16,-5 z"/>
      <path d="M130,85 l16,-5 l0,18 l-16,-5 z"/>
    </g>
    <text x="100" y="125" text-anchor="middle" font-size="10" fill="#3D4F65">信号同质化 → 模型忽略</text>
    
    <circle cx="100" cy="160" r="22" fill="#F0B860" stroke="#C8851F" stroke-width="2"/>
    <text x="100" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A5F">在位</text>
    <text x="100" y="200" text-anchor="middle" font-size="11" fill="#D97757" font-weight="600">个体收益 0.802 → 0.007</text>
    <text x="100" y="214" text-anchor="middle" font-size="10" fill="#3D4F65">不参与者 = 0 次推荐</text>
  </g>

  <!-- bottom return loop -->
  <path d="M740,360 Q740,410 460,410 Q200,410 180,400 L180,395" stroke="#C8851F" stroke-width="1.8" fill="none" stroke-dasharray="5,4" marker-end="url(#arO)"/>
  <text x="460" y="402" text-anchor="middle" font-size="11" fill="#C8851F" font-weight="600">老牌重夺垄断（U 形回归）</text>

  <!-- bottom finding panel -->
  <g transform="translate(80,460)">
    <rect x="0" y="0" width="740" height="140" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.2"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#1E3A5F">核心张力</text>
    
    <g transform="translate(20,50)">
      <circle cx="8" cy="6" r="4" fill="#F0B860"/>
      <text x="22" y="10" font-size="11" fill="#3D4F65">品牌身份只解释 1.2% 排名方差，参数差异占 82.4%</text>
    </g>
    <g transform="translate(20,76)">
      <circle cx="8" cy="6" r="4" fill="#D97757"/>
      <text x="22" y="10" font-size="11" fill="#3D4F65">权威话术 &gt; 社会证明 &gt; 稀缺/锚定/损失厌恶</text>
    </g>
    <g transform="translate(20,102)">
      <circle cx="8" cy="6" r="4" fill="#4B8BDA"/>
      <text x="22" y="10" font-size="11" fill="#3D4F65">RAG 不救场：护城河迁移到「描述与 query 的语义匹配」</text>
    </g>

    <line x1="400" y1="42" x2="400" y2="125" stroke="#C9D2DC" stroke-dasharray="3,3"/>
    
    <text x="420" y="60" font-size="11" fill="#1E3A5F" font-weight="700">三家模型反应不同</text>
    <text x="420" y="80" font-size="10" fill="#3D4F65">• Claude：中等强度最有效，过强反弹</text>
    <text x="420" y="98" font-size="10" fill="#3D4F65">• GPT-4o-mini：随强度线性提升</text>
    <text x="420" y="116" font-size="10" fill="#3D4F65">• Gemini 3 Flash：几乎全程饱和 ≈ 100%</text>
  </g>
</svg>
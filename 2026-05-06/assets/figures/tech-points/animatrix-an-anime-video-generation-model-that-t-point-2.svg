<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8833A"/>
    </marker>
    <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C74F2E"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#FAF7F2"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">双通道双路径条件注入</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">硬约束走全局调制，软指导走交叉注意力 — 各司其职</text>

  <!-- Tag input -->
  <rect x="40" y="100" width="230" height="110" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="155" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">结构化标签 (硬约束)</text>
  <text x="155" y="147" text-anchor="middle" font-size="11" fill="#3D4F65">camera: dolly zoom</text>
  <text x="155" y="165" text-anchor="middle" font-size="11" fill="#3D4F65">motion: sakuga combat</text>
  <text x="155" y="183" text-anchor="middle" font-size="11" fill="#3D4F65">vfx: speed lines</text>
  <text x="155" y="201" text-anchor="middle" font-size="10" fill="#7A8599" font-style="italic">像分镜表，必须执行</text>

  <!-- Text input -->
  <rect x="40" y="380" width="230" height="100" rx="10" fill="#FFF2E6" stroke="#E8833A" stroke-width="1.5"/>
  <text x="155" y="403" text-anchor="middle" font-size="13" font-weight="700" fill="#8B4513">自由文本 (软指导)</text>
  <text x="155" y="427" text-anchor="middle" font-size="11" fill="#3D4F65">“樱花下忧郁的告别，</text>
  <text x="155" y="445" text-anchor="middle" font-size="11" fill="#3D4F65">新海诚式光影”</text>
  <text x="155" y="465" text-anchor="middle" font-size="10" fill="#7A8599" font-style="italic">像口头指导，自由发挥</text>

  <!-- Tag encoder -->
  <rect x="310" y="110" width="150" height="90" rx="8" fill="#DCE9F7" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="385" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">Tag Encoder</text>
  <text x="385" y="154" text-anchor="middle" font-size="10" fill="#3D4F65">3-layer Transformer (可训练)</text>
  <text x="385" y="178" text-anchor="middle" font-size="11" fill="#1E3A5F">→ 4 tokens + CLS</text>

  <!-- T5 -->
  <rect x="310" y="390" width="150" height="80" rx="8" fill="#FCE4CE" stroke="#E8833A" stroke-width="1.5"/>
  <text x="385" y="414" text-anchor="middle" font-size="12" font-weight="700" fill="#8B4513">umT5-XXL (frozen)</text>
  <text x="385" y="440" text-anchor="middle" font-size="11" fill="#1E3A5F">→ ~50 tokens</text>

  <!-- Arrows input to encoders -->
  <line x1="270" y1="155" x2="308" y2="155" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="270" y1="430" x2="308" y2="430" stroke="#E8833A" stroke-width="2" marker-end="url(#ah2)"/>

  <!-- DiT block -->
  <rect x="560" y="150" width="300" height="310" rx="12" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="710" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">DiT Block (每一层)</text>

  <!-- Path 1: Cross Attn -->
  <rect x="590" y="200" width="240" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="710" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">① Cross-Attention</text>
  <text x="710" y="242" text-anchor="middle" font-size="10" fill="#3D4F65">tag tokens ⊕ text tokens</text>
  <text x="710" y="258" text-anchor="middle" font-size="10" fill="#7A8599">细粒度局部控制</text>

  <!-- Path 2: AdaLN -->
  <rect x="590" y="300" width="240" height="80" rx="8" fill="#FFE8D6" stroke="#C74F2E" stroke-width="1.8"/>
  <text x="710" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#8B2E0F">② AdaLN 全局调制</text>
  <text x="710" y="342" text-anchor="middle" font-size="10" fill="#3D4F65">CLS + timestep → γ, β</text>
  <text x="710" y="358" text-anchor="middle" font-size="10" fill="#3D4F65">scale &amp; shift 每个子层</text>
  <text x="710" y="374" text-anchor="middle" font-size="10" fill="#C74F2E" font-weight="600">硬约束不被长文本稀释</text>

  <rect x="590" y="400" width="240" height="40" rx="6" fill="#F5F0E8" stroke="#7A8599" stroke-width="1"/>
  <text x="710" y="425" text-anchor="middle" font-size="11" fill="#3D4F65">视频潜变量输出</text>

  <!-- Tag tokens → Cross Attn -->
  <path d="M 460 170 Q 520 185 588 225" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="495" y="180" font-size="10" fill="#4B8BDA">tag tokens</text>

  <!-- Text tokens → Cross Attn -->
  <path d="M 460 420 Q 530 380 588 255" stroke="#E8833A" stroke-width="2" fill="none" marker-end="url(#ah2)"/>
  <text x="498" y="360" font-size="10" fill="#E8833A">text tokens</text>

  <!-- CLS → AdaLN -->
  <path d="M 420 200 Q 430 340 588 340" stroke="#C74F2E" stroke-width="2.5" fill="none" marker-end="url(#ah3)" stroke-dasharray="5,3"/>
  <text x="440" y="285" font-size="11" fill="#C74F2E" font-weight="700">CLS 向量 (全局锚)</text>

  <!-- Bottom note -->
  <rect x="40" y="520" width="820" height="60" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1"/>
  <text x="450" y="545" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">为什么两条路径？</text>
  <text x="450" y="565" text-anchor="middle" font-size="11" fill="#3D4F65">5 个标签 token 若只走注意力，会被 50 个文本 token 淹没 → AdaLN 保底把“必须推镜头”刻进每一层归一化</text>
</svg>
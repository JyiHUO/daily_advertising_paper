<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ahr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">形变感知偏好优化：懂动漫的打分器</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">通用奖励 = 物理正确   →   专用奖励 = 艺术正确</text>

  <!-- Candidate A -->
  <g>
    <rect x="50" y="100" width="260" height="170" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="180" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">候选 A · Smear Frame</text>
    <path d="M95 200 Q 160 150 230 210 Q 260 225 275 240" stroke="#4B8BDA" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="95" cy="200" r="13" fill="#1E3A5F"/>
    <circle cx="275" cy="240" r="8" fill="#1E3A5F"/>
    <text x="180" y="258" text-anchor="middle" font-size="12" fill="#3D4F65">意图清晰 · 回弹自然</text>
  </g>

  <!-- Candidate B -->
  <g>
    <rect x="590" y="100" width="260" height="170" rx="10" fill="#FDF1EC" stroke="#D97757" stroke-width="2"/>
    <text x="720" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">候选 B · 结构崩坏</text>
    <path d="M625 200 L 680 175 L 650 215 L 720 195 L 690 235 L 760 220 L 815 245" stroke="#D97757" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="625" cy="200" r="13" fill="#1E3A5F"/>
    <circle cx="815" cy="245" r="8" fill="#1E3A5F"/>
    <text x="720" y="258" text-anchor="middle" font-size="12" fill="#3D4F65">肢体扭曲 · 无法恢复</text>
  </g>

  <!-- Scores -->
  <rect x="120" y="285" width="90" height="28" rx="14" fill="#4B8BDA"/>
  <text x="165" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="white">✓ 高分</text>

  <rect x="690" y="285" width="90" height="28" rx="14" fill="#D97757"/>
  <text x="735" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="white">✗ 低分</text>

  <!-- Reward Model -->
  <rect x="280" y="335" width="340" height="95" rx="12" fill="#1E3A5F"/>
  <text x="450" y="365" text-anchor="middle" font-size="17" font-weight="700" fill="#EFF6FF">动漫领域奖励模型</text>
  <text x="450" y="390" text-anchor="middle" font-size="12" fill="#BFD4EC">~500K S-tier 专家偏好对训练</text>
  <text x="450" y="410" text-anchor="middle" font-size="12" fill="#BFD4EC">区分「艺术夸张」 vs 「结构崩坏」</text>

  <!-- Arrows from scores to reward -->
  <line x1="180" y1="315" x2="310" y2="360" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="720" y1="315" x2="590" y2="360" stroke="#D97757" stroke-width="2.5" marker-end="url(#ahr)"/>

  <!-- DPO output -->
  <rect x="300" y="470" width="300" height="62" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="450" y="498" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">DPO 更新生成器</text>
  <text x="450" y="518" text-anchor="middle" font-size="12" fill="#3D4F65">向「艺术夸张 + 结构完整」方向收敛</text>

  <line x1="450" y1="430" x2="450" y2="468" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ah)"/>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, Segoe UI, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">先专精，再统一</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">单域 RL 让"思考"真正有用，再融合成通才</text>

  <!-- Stage 1 label -->
  <text x="115" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#B5651D">Stage 1 · 分域专精</text>

  <!-- Four single-domain experts -->
  <g font-size="12" fill="#1E3A5F" text-anchor="middle">
    <rect x="60" y="125" width="110" height="50" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="115" y="155">广告 RL（思考 ✓）</text>

    <rect x="60" y="195" width="110" height="50" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="115" y="225">电商 RL（思考 ✓）</text>

    <rect x="60" y="265" width="110" height="50" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="115" y="295">直播 RL（思考 ✓）</text>

    <rect x="60" y="335" width="110" height="50" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="115" y="365">短视频 RL（思考 ✓）</text>
  </g>

  <!-- Convergence to funnel top edge -->
  <line x1="170" y1="150" x2="430" y2="190" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="170" y1="220" x2="430" y2="200" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="170" y1="290" x2="430" y2="215" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="170" y1="360" x2="430" y2="225" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Stage 2: distillation funnel -->
  <text x="500" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#B5651D">Stage 2 · 跨域融合</text>

  <polygon points="395,170 605,170 555,260 445,260" fill="#FFF4E6" stroke="#D89A4E" stroke-width="1.5"/>
  <text x="500" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">高质量 CoT 汇聚</text>
  <text x="500" y="232" text-anchor="middle" font-size="11" fill="#3D4F65">拒绝采样 / 多教师蒸馏</text>

  <!-- Arrow to unified model -->
  <line x1="500" y1="262" x2="500" y2="320" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Unified model -->
  <rect x="380" y="325" width="240" height="70" rx="12" fill="#1E3A5F"/>
  <text x="500" y="358" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">统一生成推荐模型</text>
  <text x="500" y="380" text-anchor="middle" font-size="11" fill="#BCD4EE">Thinking &gt; Non-Thinking</text>

  <!-- Side note: contrast -->
  <g>
    <rect x="660" y="145" width="120" height="115" rx="8" fill="#FBECEC" stroke="#C97A7A" stroke-dasharray="4 3"/>
    <text x="720" y="170" text-anchor="middle" font-size="11" font-weight="600" fill="#9C3B3B">直接多域混合 RL</text>
    <text x="720" y="205" text-anchor="middle" font-size="22">⚠</text>
    <text x="720" y="230" text-anchor="middle" font-size="10" fill="#7A2E2E">信号冲突，思考反而变差</text>
  </g>

  <text x="400" y="445" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">先让每个域的"思考"被奖励充分塑形，再把多位专家的习惯收敛进一个学生</text>
</svg>
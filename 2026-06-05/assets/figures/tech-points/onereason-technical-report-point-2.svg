<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E3A5F">由细到粗的推理脚手架</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">不让模型直接猜下一步，先逐级想清楚</text>

  <!-- R0 -->
  <rect x="60" y="340" width="150" height="70" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="135" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">R0 感知</text>
  <text x="135" y="388" text-anchor="middle" font-size="11" fill="#3D4F65">item 是什么 (token↔语义)</text>

  <!-- R1 -->
  <rect x="230" y="260" width="150" height="70" rx="10" fill="#E3EEFB" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="305" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">R1 推导</text>
  <text x="305" y="308" text-anchor="middle" font-size="11" fill="#3D4F65">item 与 item 为何相关</text>

  <!-- R2 -->
  <rect x="400" y="180" width="150" height="70" rx="10" fill="#D6E5F7" stroke="#3A75C4" stroke-width="1.5"/>
  <text x="475" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">R2 演化</text>
  <text x="475" y="228" text-anchor="middle" font-size="11" fill="#3D4F65">兴趣如何演化 (入门→进阶)</text>

  <!-- R3 -->
  <rect x="570" y="100" width="170" height="70" rx="10" fill="#F4B860" stroke="#C97A2B" stroke-width="1.5"/>
  <text x="655" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">R3 推荐</text>
  <text x="655" y="148" text-anchor="middle" font-size="11" fill="#3D4F65">所以下一步推什么</text>

  <!-- Arrows along the ladder -->
  <path d="M 210,355 Q 225,330 230,310" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 380,275 Q 395,250 400,230" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 550,195 Q 565,170 570,150" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Side labels -->
  <text x="60" y="430" font-size="11" fill="#3D4F65">细粒度 · token 级</text>
  <text x="740" y="92" text-anchor="end" font-size="11" fill="#3D4F65">粗粒度 · 用户级</text>

  <!-- Bottom note -->
  <text x="400" y="450" text-anchor="middle" font-size="12" fill="#1E3A5F" font-style="italic">溯因式 CoT：固定的四级阶梯，而非自由发挥</text>
</svg>
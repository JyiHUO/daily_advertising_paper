<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,sans-serif">
  <text x="300" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">算力如何切：embedder 应保持精简</text>
  <text x="300" y="52" text-anchor="middle" font-size="11" fill="#3D4F65">同样总算力预算下，对比两种参数切法</text>

  <!-- Bad split -->
  <text x="150" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="#B45F3C">✗ 20% / 80%</text>
  <rect x="80" y="98" width="28" height="50" fill="#F5C6A8" stroke="#B45F3C" stroke-width="1.5"/>
  <rect x="108" y="98" width="112" height="50" fill="#FCE9D8" stroke="#B45F3C" stroke-width="1.5"/>
  <text x="94" y="125" text-anchor="middle" font-size="9" fill="#1E3A5F">emb</text>
  <text x="164" y="125" text-anchor="middle" font-size="10" fill="#1E3A5F">transformer 80%</text>
  <text x="150" y="166" text-anchor="middle" font-size="10" fill="#B45F3C">embedder 太大，每步开销暴涨</text>

  <!-- Good split -->
  <text x="450" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">✓ 约 2% / 98%</text>
  <rect x="380" y="98" width="4" height="50" fill="#4B8BDA" stroke="#1E3A5F" stroke-width="1"/>
  <rect x="384" y="98" width="136" height="50" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="452" y="125" text-anchor="middle" font-size="10" fill="#1E3A5F">transformer 98%</text>
  <text x="450" y="166" text-anchor="middle" font-size="10" fill="#1E3A5F">算力主要留给上下文 transformer</text>

  <!-- Why: workload asymmetry -->
  <text x="300" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">为什么？参数"工作强度"不对称</text>

  <!-- embedder workload heavy -->
  <g>
    <circle cx="160" cy="300" r="58" fill="#FCE9D8" stroke="#B45F3C" stroke-width="1.8"/>
    <text x="160" y="285" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">embedder</text>
    <text x="160" y="305" text-anchor="middle" font-size="10" fill="#3D4F65">每参数触碰 B·L 次</text>
    <text x="160" y="322" text-anchor="middle" font-size="10" fill="#3D4F65">热门 item 重复百千次</text>
    <text x="160" y="380" text-anchor="middle" font-size="10" fill="#B45F3C">→ 易过拟合，需精简</text>
  </g>

  <!-- transformer workload light per param -->
  <g>
    <circle cx="440" cy="300" r="58" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="440" y="290" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">transformer</text>
    <text x="440" y="310" text-anchor="middle" font-size="10" fill="#3D4F65">每序列只跑 1 次</text>
    <text x="440" y="380" text-anchor="middle" font-size="10" fill="#1E3A5F">→ 值得多分配算力</text>
  </g>

  <!-- arrow: tilt compute toward transformer -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>
  <path d="M 222 300 L 378 300" stroke="#4B8BDA" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="300" y="294" text-anchor="middle" font-size="10" fill="#4B8BDA">算力倾斜</text>
</svg>
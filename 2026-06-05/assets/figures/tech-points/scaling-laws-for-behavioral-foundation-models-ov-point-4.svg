<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">瓶颈翻转：算力够 → 显存爆</text>

  <!-- K growth arrow on top -->
  <text x="300" y="74" text-anchor="middle" font-size="12" fill="#3D4F65">负采样数 K ↑（candidate 数线性增长）</text>
  <line x1="160" y1="92" x2="440" y2="92" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>

  <!-- candidate dots scaling -->
  <circle cx="180" cy="115" r="3" fill="#4B8BDA"/>
  <circle cx="220" cy="115" r="4" fill="#4B8BDA"/>
  <circle cx="265" cy="115" r="6" fill="#4B8BDA"/>
  <circle cx="320" cy="115" r="8" fill="#D97A3C"/>
  <circle cx="385" cy="115" r="11" fill="#D97A3C"/>
  <text x="430" y="119" font-size="11" fill="#D97A3C" font-weight="700">K=2M</text>

  <!-- Seesaw fulcrum -->
  <polygon points="300,330 280,362 320,362" fill="#1E3A5F"/>
  <line x1="255" y1="362" x2="345" y2="362" stroke="#1E3A5F" stroke-width="3"/>

  <!-- Seesaw beam: tilted, compute side up, memory side down -->
  <line x1="110" y1="250" x2="490" y2="318" stroke="#1E3A5F" stroke-width="4" stroke-linecap="round"/>

  <!-- Compute side (light, up) -->
  <rect x="55" y="178" width="130" height="62" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="120" y="203" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">FLOPs 轻松</text>
  <text x="120" y="224" text-anchor="middle" font-size="11" fill="#3D4F65">每多1个负样本=1次内积</text>

  <!-- Memory side (heavy, down) -->
  <rect x="405" y="262" width="160" height="62" rx="10" fill="#FCE8D5" stroke="#D97A3C" stroke-width="2"/>
  <text x="485" y="287" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">Logit 显存爆</text>
  <text x="485" y="308" text-anchor="middle" font-size="11" fill="#3D4F65">候选维随 K 线性涨</text>

  <!-- Bottom note -->
  <text x="300" y="390" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">解法：candidate sharding / 层级 softmax，而不是再加卡</text>
</svg>
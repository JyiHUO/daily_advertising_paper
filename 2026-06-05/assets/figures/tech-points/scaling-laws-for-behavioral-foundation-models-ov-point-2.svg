<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E3A5F">数据/参数比 D/N：从"喂饭多"到 Chinchilla</text>
  <text x="400" y="62" text-anchor="middle" font-size="12" fill="#3D4F65">算力变大 → 把算力更多分给"模型"而不是"数据"</text>

  <!-- Left scene: low compute -->
  <g>
    <text x="185" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">低算力 C = 10¹⁵ FLOPs</text>

    <!-- small N circle -->
    <circle cx="130" cy="200" r="22" fill="#DBEAFE" stroke="#4B8BDA" stroke-width="2"/>
    <text x="130" y="205" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="bold">N</text>
    <text x="130" y="252" text-anchor="middle" font-size="11" fill="#3D4F65">小模型 ~0.5M</text>

    <!-- big D bowl -->
    <ellipse cx="245" cy="200" rx="60" ry="38" fill="#FDE6C8" stroke="#D97A3A" stroke-width="2"/>
    <text x="245" y="206" text-anchor="middle" font-size="15" fill="#1E3A5F" font-weight="bold">D</text>
    <text x="245" y="252" text-anchor="middle" font-size="11" fill="#3D4F65">大量数据 ~84M</text>

    <!-- ratio -->
    <text x="185" y="310" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="bold">D / N ≈ 344</text>
    <text x="185" y="332" text-anchor="middle" font-size="11" fill="#3D4F65">"饭多 · 人少"</text>
  </g>

  <!-- Arrow: compute grows -->
  <line x1="340" y1="200" x2="460" y2="200" stroke="#4B8BDA" stroke-width="3" marker-end="url(#arr)"/>
  <text x="400" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">算力 ↑ 10⁴×</text>
  <text x="400" y="225" text-anchor="middle" font-size="11" fill="#3D4F65">N ∝ C⁰·⁶²   D ∝ C⁰·³⁸</text>

  <!-- Right scene: high compute -->
  <g>
    <text x="640" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">高算力 C = 10¹⁹ FLOPs</text>

    <!-- big N circle -->
    <circle cx="600" cy="200" r="48" fill="#DBEAFE" stroke="#4B8BDA" stroke-width="2"/>
    <text x="600" y="206" text-anchor="middle" font-size="17" fill="#1E3A5F" font-weight="bold">N</text>
    <text x="600" y="270" text-anchor="middle" font-size="11" fill="#3D4F65">大模型 ~250M</text>

    <!-- D bowl moderate -->
    <ellipse cx="705" cy="200" rx="40" ry="30" fill="#FDE6C8" stroke="#D97A3A" stroke-width="2"/>
    <text x="705" y="206" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="bold">D</text>
    <text x="705" y="252" text-anchor="middle" font-size="11" fill="#3D4F65">数据 ~3.65B</text>

    <!-- ratio -->
    <text x="645" y="310" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="bold">D / N ≈ 36</text>
    <text x="645" y="332" text-anchor="middle" font-size="11" fill="#3D4F65">接近 Chinchilla</text>
  </g>

  <!-- bottom takeaway -->
  <line x1="120" y1="395" x2="680" y2="395" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="400" y="425" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="bold">行为模型早期靠"重复样本"吃饱，规模够大后才回到 LM 经验比例</text>
  <text x="400" y="450" text-anchor="middle" font-size="11" fill="#3D4F65">下次扩算力：少加数据，多加参数</text>
</svg>
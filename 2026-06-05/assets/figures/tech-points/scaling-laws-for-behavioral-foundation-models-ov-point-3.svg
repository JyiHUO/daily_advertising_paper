<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="38" text-anchor="middle" font-family="Helvetica,Arial" font-size="19" font-weight="700" fill="#1E3A5F">同一份训练，指标不同 → 最优配方不同</text>

  <!-- Same checkpoint icon -->
  <circle cx="300" cy="115" r="42" fill="#FEF3E2" stroke="#D89A4B" stroke-width="2"/>
  <text x="300" y="110" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#1E3A5F">同一份 checkpoint</text>
  <text x="300" y="128" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#6B7280">C = 10^17 FLOPs</text>

  <!-- Left lens: loss -->
  <circle cx="155" cy="280" r="68" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2.5"/>
  <text x="155" y="262" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="700" fill="#1E3A5F">val-loss 视角</text>
  <text x="155" y="285" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">最优 K ≈ 1M</text>
  <text x="155" y="304" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">Bcrit ≈ 570</text>

  <!-- Right lens: NDCG -->
  <circle cx="445" cy="280" r="68" fill="#FDECEC" stroke="#C95B5B" stroke-width="2.5"/>
  <text x="445" y="262" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="700" fill="#1E3A5F">NDCG@10 视角</text>
  <text x="445" y="285" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">最优 K ≈ 65k</text>
  <text x="445" y="304" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">Bcrit ≈ 250</text>

  <!-- arrows from checkpoint to lenses -->
  <path d="M270,140 L200,228" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M330,140 L400,228" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- bottom message -->
  <text x="300" y="385" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-style="italic" fill="#1E3A5F">先选上线指标，再拟合 scaling law</text>
  <text x="300" y="405" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">Stage 2 中 loss 与 recall 的 Spearman 相关性可从 +0.93 翻到 −1.00</text>
</svg>
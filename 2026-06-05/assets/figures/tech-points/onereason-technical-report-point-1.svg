<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">从陌生代号到读懂用户：四级阶梯</text>
  <text x="400" y="68" text-anchor="middle" font-size="13" fill="#3D4F65">把 item token 与自然语言逐层对齐</text>

  <!-- Token -->
  <g>
    <rect x="60" y="180" width="150" height="170" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
    <text x="135" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">① Token 粒度 · 认偏旁</text>
    <text x="135" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">⟨a⟩⟨b⟩ = 鞋类</text>
    <text x="135" y="298" text-anchor="middle" font-size="11" fill="#3D4F65">子 token → 语义</text>
  </g>

  <!-- Item -->
  <g>
    <rect x="230" y="180" width="150" height="170" rx="10" fill="#FFF4E6" stroke="#E89B4C" stroke-width="1.6"/>
    <text x="305" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">② Item 粒度 · 认字</text>
    <text x="305" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">跑鞋</text>
    <text x="305" y="280" text-anchor="middle" font-size="11" fill="#3D4F65">国产·透气·男</text>
    <text x="305" y="318" text-anchor="middle" font-size="11" fill="#7A8AA0">长描述 → 浓缩</text>
  </g>

  <!-- Relation -->
  <g>
    <rect x="400" y="180" width="150" height="170" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
    <text x="475" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">③ 关系粒度 · 词组</text>
    <text x="475" y="258" text-anchor="middle" font-size="12" fill="#1E3A5F">视频 → 搜索 → 跑鞋</text>
    <text x="475" y="298" text-anchor="middle" font-size="11" fill="#7A8AA0">item 间共现链</text>
  </g>

  <!-- User -->
  <g>
    <rect x="570" y="180" width="170" height="170" rx="10" fill="#FFF4E6" stroke="#E89B4C" stroke-width="1.6"/>
    <text x="655" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">④ 用户粒度 · 整段文章</text>
    <text x="655" y="258" text-anchor="middle" font-size="12" fill="#1E3A5F">画像 + 时间线</text>
    <text x="655" y="280" text-anchor="middle" font-size="12" fill="#1E3A5F">item ⇄ 文字</text>
    <text x="655" y="318" text-anchor="middle" font-size="11" fill="#7A8AA0">跨模态融通</text>
  </g>

  <!-- arrows between -->
  <line x1="212" y1="265" x2="228" y2="265" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="382" y1="265" x2="398" y2="265" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="552" y1="265" x2="568" y2="265" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- bottom axis -->
  <line x1="80" y1="410" x2="715" y2="410" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="80" y="435" font-size="12" fill="#1E3A5F" font-weight="600">细粒度 · 子 token 语义</text>
  <text x="720" y="435" font-size="12" fill="#1E3A5F" font-weight="600" text-anchor="end">粗粒度 · 用户行为</text>

  <text x="400" y="475" text-anchor="middle" font-size="12" fill="#3D4F65" font-style="italic">item token 与语言逐级对齐，正负样本相似度分布整体右移</text>
</svg>
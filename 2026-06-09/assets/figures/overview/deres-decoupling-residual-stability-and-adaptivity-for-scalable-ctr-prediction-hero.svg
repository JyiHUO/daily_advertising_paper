<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ahO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E89B5C"/>
    </marker>
    <linearGradient id="gateGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#E89B5C"/>
      <stop offset="1" stop-color="#4B8BDA"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">DeRes：把残差连接拆成两条互补的路</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#3D4F65">解决深层 CTR Transformer 的"早期兴趣稀释 · 无法遗忘 · 只见上层"</text>

  <!-- Layer stack indicator -->
  <text x="80" y="138" font-size="11" fill="#6B7A8F">早期层</text>
  <text x="80" y="298" font-size="11" fill="#6B7A8F">当前层 ℓ</text>

  <!-- Block summaries (left side) -->
  <g>
    <rect x="120" y="120" width="90" height="28" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="165" y="138" text-anchor="middle" font-size="12" fill="#1E3A5F">Block 0</text>
    <rect x="120" y="160" width="90" height="28" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="165" y="178" text-anchor="middle" font-size="12" fill="#1E3A5F">Block 1</text>
    <rect x="120" y="200" width="90" height="28" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="165" y="218" text-anchor="middle" font-size="12" fill="#1E3A5F">Block 2</text>
    <rect x="120" y="240" width="90" height="28" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="165" y="258" text-anchor="middle" font-size="12" fill="#1E3A5F">⋯</text>
    <rect x="120" y="280" width="90" height="28" rx="6" fill="#FFF3E6" stroke="#E89B5C"/>
    <text x="165" y="298" text-anchor="middle" font-size="12" fill="#8B4513">Block ℓ-1</text>
  </g>
  <text x="165" y="328" text-anchor="middle" font-size="11" fill="#6B7A8F" font-style="italic">所有更早层的压缩摘要</text>

  <!-- Path 2: Block Attention (top route) -->
  <path d="M 215 215 Q 360 130 498 200" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
  <path d="M 215 175 Q 360 115 495 195" stroke="#4B8BDA" stroke-width="2" fill="none" opacity="0.45"/>
  <path d="M 215 135 Q 360 100 495 190" stroke="#4B8BDA" stroke-width="2" fill="none" opacity="0.35"/>

  <rect x="500" y="170" width="200" height="80" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="600" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">Block Attention</text>
  <text x="600" y="216" text-anchor="middle" font-size="11" fill="#3D4F65">SiLU 替代 Softmax · 负权重遗忘</text>
  <text x="600" y="234" text-anchor="middle" font-size="11" fill="#3D4F65">多兴趣并行跨层召回</text>
  <text x="500" y="162" font-size="11" font-weight="600" fill="#4B8BDA">路径 ② 高阶跨层</text>

  <!-- Path 1: Identity (bottom route) -->
  <path d="M 215 294 Q 360 360 498 360" stroke="#E89B5C" stroke-width="2.5" fill="none" marker-end="url(#ahO)"/>
  <rect x="500" y="330" width="200" height="60" rx="14" fill="#FFF3E6" stroke="#E89B5C" stroke-width="2"/>
  <text x="600" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#8B4513">Identity 残差</text>
  <text x="600" y="376" text-anchor="middle" font-size="11" fill="#5C3A1E">一阶复用 · 梯度直通</text>
  <text x="500" y="322" font-size="11" font-weight="600" fill="#E89B5C">路径 ① 稳定传送</text>

  <!-- Gate inputs -->
  <path d="M 700 210 Q 742 240 745 250" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M 700 360 Q 742 325 745 318" stroke="#E89B5C" stroke-width="2" fill="none" marker-end="url(#ahO)"/>

  <circle cx="780" cy="285" r="40" fill="url(#gateGrad)" opacity="0.92"/>
  <text x="780" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">向量门</text>
  <text x="780" y="300" text-anchor="middle" font-size="11" fill="#fff">γ ⊙ · (1-γ)</text>
  <text x="780" y="345" text-anchor="middle" font-size="10" fill="#6B7A8F">逐维度独立融合</text>

  <!-- Output -->
  <path d="M 780 355 L 780 432" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
  <rect x="680" y="438" width="200" height="42" rx="10" fill="#1E3A5F"/>
  <text x="780" y="465" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">第 ℓ 层输出</text>

  <!-- Result panel -->
  <g transform="translate(70,510)">
    <rect x="0" y="0" width="760" height="80" rx="12" fill="#F5F8FC" stroke="#C9D6E8"/>
    <text x="20" y="46" font-size="13" font-weight="700" fill="#1E3A5F">收益</text>

    <text x="80" y="26" font-size="12" fill="#3D4F65">scaling 斜率</text>
    <text x="80" y="50" font-size="18" font-weight="700" fill="#4B8BDA">0.118</text>
    <text x="148" y="50" font-size="11" fill="#6B7A8F">vs OneTrans 0.071</text>
    <text x="80" y="68" font-size="11" fill="#6B7A8F">每单位算力买到更多 AUC</text>

    <line x1="300" y1="14" x2="300" y2="68" stroke="#C9D6E8"/>

    <text x="320" y="26" font-size="12" fill="#3D4F65">同等 AUC 下</text>
    <text x="320" y="50" font-size="18" font-weight="700" fill="#E89B5C">8 层 ≈ 16 层</text>
    <text x="320" y="68" font-size="11" fill="#6B7A8F">DeRes ≈ OneTrans，算力省 ~2×</text>

    <line x1="540" y1="14" x2="540" y2="68" stroke="#C9D6E8"/>

    <text x="560" y="26" font-size="12" fill="#3D4F65">额外开销</text>
    <text x="560" y="50" font-size="18" font-weight="700" fill="#1E3A5F">&lt; 5% FLOPs</text>
    <text x="560" y="68" font-size="11" fill="#6B7A8F">+0.32% AUC（331M 工业数据）</text>
  </g>
</svg>
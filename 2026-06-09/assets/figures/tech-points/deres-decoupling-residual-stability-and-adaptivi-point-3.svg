<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E08A4B"/>
    </marker>
  </defs>

  <text x="300" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A5F">每单位算力能买到多少 AUC</text>

  <!-- Axes -->
  <line x1="80" y1="340" x2="540" y2="340" stroke="#3D4F65" stroke-width="1.5"/>
  <line x1="80" y1="340" x2="80" y2="90" stroke="#3D4F65" stroke-width="1.5"/>
  <text x="540" y="362" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3D4F65">Compute</text>
  <text x="60" y="85" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3D4F65">AUC</text>

  <!-- Flat curve: OneTrans -->
  <path d="M 95 295 Q 220 245 360 230 T 530 222" fill="none" stroke="#E08A4B" stroke-width="3" stroke-linecap="round"/>
  <text x="395" y="215" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#B8682E" font-weight="600">OneTrans · γ=0.071</text>

  <!-- Steeper curve: DeRes -->
  <path d="M 95 290 Q 200 200 340 145 T 530 105" fill="none" stroke="#4B8BDA" stroke-width="3.5" stroke-linecap="round"/>
  <text x="360" y="130" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E3A5F" font-weight="700">DeRes · γ=0.118</text>

  <!-- Same compute marker -->
  <line x1="300" y1="340" x2="300" y2="160" stroke="#9AA8BC" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="300" cy="237" r="5" fill="#E08A4B"/>
  <circle cx="300" cy="160" r="5" fill="#4B8BDA"/>

  <!-- Gap arrow -->
  <line x1="320" y1="235" x2="320" y2="170" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="328" y="207" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E3A5F">同算力 · 更高AUC</text>

  <!-- Save compute illustration -->
  <text x="300" y="395" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">8 层 DeRes  ≈  16 层 OneTrans</text>
  <text x="300" y="413" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">换连接方式 &gt; 单纯加深</text>
</svg>
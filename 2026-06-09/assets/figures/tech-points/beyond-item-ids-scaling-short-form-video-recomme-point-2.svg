<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E3A5F">Temporal Folding：把 4 个 token 拼成 1 个 super-token</text>

  <!-- Before: long thin sequence -->
  <text x="40" y="108" font-size="13" fill="#3D4F65">Before:  L = 800,  d = 128</text>
  <g>
    <rect x="40" y="125" width="22" height="46" fill="#EFF6FF" stroke="#4B8BDA"/>
    <rect x="64" y="125" width="22" height="46" fill="#EFF6FF" stroke="#4B8BDA"/>
    <rect x="88" y="125" width="22" height="46" fill="#EFF6FF" stroke="#4B8BDA"/>
    <rect x="112" y="125" width="22" height="46" fill="#EFF6FF" stroke="#4B8BDA"/>
    <rect x="136" y="125" width="22" height="46" fill="#FEF3E7" stroke="#E89B4A"/>
    <rect x="160" y="125" width="22" height="46" fill="#FEF3E7" stroke="#E89B4A"/>
    <rect x="184" y="125" width="22" height="46" fill="#FEF3E7" stroke="#E89B4A"/>
    <rect x="208" y="125" width="22" height="46" fill="#FEF3E7" stroke="#E89B4A"/>
    <text x="244" y="155" font-size="20" fill="#3D4F65">···</text>
    <rect x="278" y="125" width="22" height="46" fill="#EFF6FF" stroke="#4B8BDA"/>
    <rect x="302" y="125" width="22" height="46" fill="#EFF6FF" stroke="#4B8BDA"/>
    <rect x="326" y="125" width="22" height="46" fill="#EFF6FF" stroke="#4B8BDA"/>
    <rect x="350" y="125" width="22" height="46" fill="#EFF6FF" stroke="#4B8BDA"/>
  </g>

  <!-- group brackets -->
  <path d="M40,180 Q87,196 134,180" fill="none" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="87" y="210" text-anchor="middle" font-size="11" fill="#3D4F65">k = 4 个一组</text>

  <!-- arrow down to after -->
  <line x1="200" y1="225" x2="200" y2="305" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="212" y="270" font-size="12" fill="#1E3A5F" font-style="italic">channel concat</text>
  <text x="212" y="286" font-size="11" fill="#3D4F65">无参数 reshape</text>

  <!-- After: short fat sequence -->
  <text x="40" y="334" font-size="13" fill="#3D4F65">After:  L/k = 200,  k·d = 512</text>
  <g>
    <rect x="40" y="348" width="56" height="76" fill="#DCE9F8" stroke="#1E3A5F" stroke-width="1.5"/>
    <rect x="100" y="348" width="56" height="76" fill="#FBE0BF" stroke="#E89B4A" stroke-width="1.5"/>
    <text x="200" y="392" font-size="22" fill="#3D4F65">···</text>
    <rect x="244" y="348" width="56" height="76" fill="#DCE9F8" stroke="#1E3A5F" stroke-width="1.5"/>
    <rect x="304" y="348" width="56" height="76" fill="#DCE9F8" stroke="#1E3A5F" stroke-width="1.5"/>
  </g>
  <text x="68" y="392" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">super-token</text>
  <text x="128" y="392" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">super-token</text>

  <!-- Right side: cost panel -->
  <line x1="420" y1="70" x2="420" y2="450" stroke="#C9D4E0" stroke-dasharray="4 4"/>

  <text x="600" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">自注意力代价</text>

  <!-- big square -->
  <rect x="455" y="140" width="130" height="130" fill="#FCE6E6" stroke="#C75B5B" stroke-width="1.5"/>
  <text x="520" y="200" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="600">L × L</text>
  <text x="520" y="220" text-anchor="middle" font-size="12" fill="#3D4F65">800 × 800</text>

  <!-- arrow -->
  <line x1="595" y1="205" x2="665" y2="205" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- small square -->
  <rect x="675" y="178" width="55" height="55" fill="#DCE9F8" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="702" y="204" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">(L/k)²</text>
  <text x="702" y="221" text-anchor="middle" font-size="11" fill="#3D4F65">200²</text>

  <!-- gains -->
  <text x="600" y="320" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">step time   −83.9%</text>
  <text x="600" y="345" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">peak mem   −92.2%</text>
  <text x="600" y="380" text-anchor="middle" font-size="13" fill="#C75B5B" font-weight="600">AUC   +0.06% ~ +0.15%</text>
  <text x="600" y="408" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">无信息丢失，反而略升</text>
</svg>
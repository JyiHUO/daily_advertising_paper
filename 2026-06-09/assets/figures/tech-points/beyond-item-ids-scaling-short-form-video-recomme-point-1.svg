<svg height="600" width="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">Semantic ID: 只留前两层</text>

  <!-- Full code stack (left) -->
  <g>
    <text x="160" y="90" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">完整语义码</text>
    <rect x="100" y="105" width="120" height="42" rx="4" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="160" y="131" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1E3A5F">c₁  大类</text>

    <rect x="100" y="152" width="120" height="42" rx="4" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="160" y="178" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1E3A5F">c₂  子类</text>

    <rect x="100" y="199" width="120" height="42" rx="4" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="160" y="225" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#9AA3AD">c₃  细粒</text>

    <rect x="100" y="246" width="120" height="42" rx="4" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="160" y="272" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#9AA3AD">c₄  更细</text>

    <line x1="235" y1="220" x2="285" y2="220" stroke="#C0392B" stroke-width="2.5"/>
    <line x1="235" y1="267" x2="285" y2="267" stroke="#C0392B" stroke-width="2.5"/>
    <text x="260" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#C0392B">截断</text>
  </g>

  <!-- Arrow to bigram -->
  <line x1="225" y1="170" x2="375" y2="170" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Bi-gram ID -->
  <g>
    <rect x="380" y="138" width="200" height="64" rx="8" fill="#FFF4E6" stroke="#E8954B" stroke-width="2.5"/>
    <text x="480" y="165" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1E3A5F">Bi-gram ID</text>
    <text x="480" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65" font-style="italic">c₁ × K + c₂</text>
  </g>

  <!-- Arrow to embedding -->
  <line x1="580" y1="170" x2="635" y2="170" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>

  <g>
    <rect x="640" y="138" width="130" height="64" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="705" y="165" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1E3A5F">Embedding 表</text>
    <text x="705" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">大小被码本卡死</text>
  </g>

  <!-- Bottom: outcomes -->
  <g>
    <text x="400" y="370" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">语义前缀复用 → 新视频天然冷启动</text>

    <rect x="120" y="395" width="180" height="60" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="210" y="420" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">参数</text>
    <text x="210" y="442" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#1E3A5F">−38%</text>

    <rect x="310" y="395" width="180" height="60" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="400" y="420" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">满意观看</text>
    <text x="400" y="442" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#1E3A5F">+0.86%</text>

    <rect x="500" y="395" width="180" height="60" rx="6" fill="#FFF4E6" stroke="#E8954B" stroke-width="2"/>
    <text x="590" y="420" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">新鲜内容</text>
    <text x="590" y="442" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#C0392B">+6.81%</text>
  </g>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E29547"/>
    </marker>
  </defs>

  <text x="360" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E3A5F">双路径残差：稳定 与 回溯 的解耦</text>

  <!-- Input -->
  <rect x="40" y="200" width="90" height="60" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="85" y="226" text-anchor="middle" font-size="13" fill="#1E3A5F">第 l 层输入</text>
  <text x="85" y="248" text-anchor="middle" font-size="11" fill="#3D4F65">按通道切两半</text>

  <!-- Path 1: conveyor (identity) -->
  <rect x="200" y="90" width="230" height="110" rx="10" fill="#FFF3E6" stroke="#E29547" stroke-width="1.8"/>
  <text x="315" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">路径 1 · 传送带 (identity)</text>
  <text x="315" y="140" text-anchor="middle" font-size="12" fill="#3D4F65">梯度直通 · 一阶递归 · 稳定近信号</text>
  <line x1="232" y1="178" x2="398" y2="178" stroke="#E29547" stroke-width="2"/>
  <circle cx="245" cy="178" r="4" fill="#E29547"/>
  <circle cx="285" cy="178" r="4" fill="#E29547"/>
  <circle cx="325" cy="178" r="4" fill="#E29547"/>
  <circle cx="365" cy="178" r="4" fill="#E29547"/>

  <!-- Path 2: retriever (block attention) -->
  <rect x="200" y="270" width="230" height="120" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="315" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">路径 2 · 检索员 (Block Attn)</text>
  <text x="315" y="318" text-anchor="middle" font-size="12" fill="#3D4F65">query 回溯早期 block summary</text>
  <!-- block bank -->
  <rect x="232" y="340" width="20" height="22" fill="#4B8BDA" opacity="0.4"/>
  <rect x="258" y="340" width="20" height="22" fill="#4B8BDA" opacity="0.6"/>
  <rect x="284" y="340" width="20" height="22" fill="#4B8BDA" opacity="0.3"/>
  <rect x="310" y="340" width="20" height="22" fill="#4B8BDA" opacity="0.85"/>
  <rect x="336" y="340" width="20" height="22" fill="#4B8BDA" opacity="0.5"/>
  <rect x="362" y="340" width="20" height="22" fill="#4B8BDA" opacity="0.35"/>
  <text x="315" y="378" text-anchor="middle" font-size="10" fill="#3D4F65">早期层 block bank</text>

  <!-- input split arrows -->
  <line x1="130" y1="218" x2="197" y2="160" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="130" y1="244" x2="197" y2="310" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Gate -->
  <circle cx="525" cy="240" r="50" fill="#FFF3E6" stroke="#1E3A5F" stroke-width="1.8"/>
  <text x="525" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">门控 γ_l</text>
  <text x="525" y="254" text-anchor="middle" font-size="10" fill="#3D4F65">逐维 sigmoid 融合</text>

  <!-- arrows to gate -->
  <line x1="430" y1="160" x2="492" y2="216" stroke="#E29547" stroke-width="2" marker-end="url(#aro)"/>
  <line x1="430" y1="320" x2="492" y2="266" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Output -->
  <rect x="615" y="210" width="80" height="60" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="655" y="236" text-anchor="middle" font-size="13" fill="#1E3A5F">下一层</text>
  <text x="655" y="254" text-anchor="middle" font-size="13" fill="#1E3A5F">输入</text>

  <line x1="575" y1="240" x2="613" y2="240" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- bottom note -->
  <text x="360" y="445" text-anchor="middle" font-size="12" fill="#3D4F65" font-style="italic">稳定的"近"信号 与 可回溯的"远"兴趣 · 按维度共存</text>
</svg>
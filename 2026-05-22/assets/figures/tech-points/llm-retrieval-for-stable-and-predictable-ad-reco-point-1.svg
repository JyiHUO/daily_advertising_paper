<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">同一广告的两个"马甲"</text>
  <text x="300" y="58" text-anchor="middle" font-size="12" fill="#3D4F65">只改 ID，不改语义 — 投放差多少？</text>

  <!-- Primary ad A -->
  <g>
    <rect x="70" y="100" width="160" height="100" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="150" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">广告 A (primary)</text>
    <text x="150" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">1000 转化</text>
  </g>

  <!-- Shadow ad A' -->
  <g>
    <rect x="370" y="100" width="160" height="100" rx="10" fill="#FFF4E6" stroke="#E89B4A" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="450" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">广告 A′ (shadow)</text>
    <text x="450" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">200 转化</text>
  </g>

  <!-- Gap arrow -->
  <text x="300" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#C0504D">Δ 差距</text>
  <line x1="232" y1="160" x2="368" y2="160" stroke="#C0504D" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Down arrow into filter -->
  <line x1="300" y1="202" x2="300" y2="238" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Filter: confidence threshold -->
  <g transform="translate(180,242)">
    <polygon points="0,0 240,0 180,40 60,40" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="120" y="26" text-anchor="middle" font-size="12" fill="#1E3A5F">90% 置信区间过滤随机噪声</text>
  </g>

  <!-- Down arrow into metric -->
  <line x1="300" y1="284" x2="300" y2="324" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Final metric -->
  <rect x="150" y="330" width="300" height="64" rx="10" fill="#1E3A5F"/>
  <text x="300" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">StatSigDiff (按收入加权)</text>
  <text x="300" y="378" text-anchor="middle" font-size="11" fill="#BFD4EC">衡量系统"认 ID 不认语义"的不稳定度</text>
</svg>
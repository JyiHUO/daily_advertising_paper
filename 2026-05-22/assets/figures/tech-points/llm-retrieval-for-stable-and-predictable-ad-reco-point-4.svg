<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E3A5F">叠加一路 LLM 召回 · 不替换原栈</text>

  <!-- existing stack -->
  <g>
    <rect x="60" y="90" width="200" height="210" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="160" y="115" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="bold">现有召回栈（不动）</text>
    <rect x="80" y="135" width="160" height="36" rx="6" fill="#ffffff" stroke="#A8C4E8"/>
    <text x="160" y="158" text-anchor="middle" font-size="12" fill="#3D4F65">Two-Tower</text>
    <rect x="80" y="183" width="160" height="36" rx="6" fill="#ffffff" stroke="#A8C4E8"/>
    <text x="160" y="206" text-anchor="middle" font-size="12" fill="#3D4F65">Embedding</text>
    <rect x="80" y="231" width="160" height="36" rx="6" fill="#ffffff" stroke="#A8C4E8"/>
    <text x="160" y="254" text-anchor="middle" font-size="12" fill="#3D4F65">Graph</text>
  </g>

  <!-- plus -->
  <text x="295" y="205" text-anchor="middle" font-size="36" fill="#E8A33D" font-weight="bold">+</text>

  <!-- LLM new lane -->
  <g>
    <rect x="330" y="155" width="210" height="90" rx="10" fill="#FFF4E0" stroke="#E8A33D" stroke-width="2"/>
    <text x="435" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">LLM 召回（新增一路）</text>
    <text x="435" y="212" text-anchor="middle" font-size="11" fill="#3D4F65">语义补齐：头部对齐 + 长尾增量</text>
    <text x="435" y="230" text-anchor="middle" font-size="11" fill="#3D4F65">Top-5 0.51× · Top-200 0.07×</text>
  </g>

  <!-- arrows -->
  <line x1="260" y1="200" x2="328" y2="200" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="4 3"/>

  <!-- outcomes -->
  <g>
    <rect x="60" y="335" width="220" height="65" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="170" y="358" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="bold">线上收益</text>
    <text x="170" y="380" text-anchor="middle" font-size="12" fill="#3D4F65">Top-line +0.45% · Recall +1.2%</text>
  </g>

  <g>
    <rect x="320" y="335" width="220" height="65" rx="8" fill="#FFF4E0" stroke="#E8A33D"/>
    <text x="430" y="358" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="bold">稳定性提升</text>
    <text x="430" y="380" text-anchor="middle" font-size="12" fill="#3D4F65">A/A′ −8.62% · MAD −45%</text>
  </g>

  <line x1="435" y1="246" x2="430" y2="333" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="200" y1="301" x2="175" y2="333" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
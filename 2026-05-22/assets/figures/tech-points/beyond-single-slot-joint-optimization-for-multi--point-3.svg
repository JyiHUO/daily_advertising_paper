<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <rect width="600" height="440" fill="#FAFBFD"/>
  
  <!-- Title -->
  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">合约轮盘 + 页面级互斥</text>
  <text x="300" y="56" text-anchor="middle" font-size="12" fill="#3D4F65">紧迫度加权抽签，同一合约一页只出现一次</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Roulette wheel -->
  <g transform="translate(140,230)">
    <circle r="78" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <path d="M0,0 L78,0 A78,78 0 0,1 24.1,74.2 Z" fill="#F4B860" opacity="0.85"/>
    <path d="M0,0 L24.1,74.2 A78,78 0 0,1 -63.1,45.9 Z" fill="#88B7E0" opacity="0.7"/>
    <path d="M0,0 L-63.1,45.9 A78,78 0 0,1 -70.4,-33.5 Z" fill="#88B7E0" opacity="0.55"/>
    <path d="M0,0 L-70.4,-33.5 A78,78 0 0,1 78,0 Z" fill="#88B7E0" opacity="0.4"/>
    <polygon points="0,-95 -7,-78 7,-78" fill="#1E3A5F"/>
    <circle r="5" fill="#1E3A5F"/>
    <text x="38" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">A 紧迫</text>
    <text x="-28" y="-4" font-size="10" fill="#3D4F65">B</text>
    <text x="-46" y="32" font-size="10" fill="#3D4F65">C</text>
    <text x="40" y="-22" font-size="10" fill="#3D4F65">D</text>
  </g>
  <text x="140" y="345" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">交付权重 w(a) 加权抽签</text>
  <text x="140" y="362" text-anchor="middle" font-size="10.5" fill="#3D4F65">紧迫合约更易上，但不垄断</text>

  <!-- Arrow -->
  <line x1="222" y1="230" x2="354" y2="230" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="288" y="222" text-anchor="middle" font-size="10.5" fill="#1E3A5F">页面去重</text>

  <!-- Page with slots -->
  <g transform="translate(360,140)">
    <rect width="180" height="200" rx="8" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="90" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">一个页面 (PV)</text>
    
    <rect x="14" y="36" width="152" height="38" rx="4" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="26" y="60" font-size="11" fill="#1E3A5F">坑1</text>
    <rect x="60" y="44" width="96" height="22" rx="3" fill="#F4B860"/>
    <text x="108" y="59" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">合约 A ✓</text>
    
    <rect x="14" y="84" width="152" height="38" rx="4" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="26" y="108" font-size="11" fill="#1E3A5F">坑2</text>
    <rect x="60" y="92" width="46" height="22" rx="3" fill="#E8E8E8"/>
    <text x="83" y="107" text-anchor="middle" font-size="10" fill="#9A9A9A" text-decoration="line-through">A</text>
    <rect x="110" y="92" width="46" height="22" rx="3" fill="#88B7E0"/>
    <text x="133" y="107" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">B</text>
    
    <rect x="14" y="132" width="152" height="38" rx="4" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="26" y="156" font-size="11" fill="#1E3A5F">坑3</text>
    <rect x="60" y="140" width="96" height="22" rx="3" fill="#88B7E0" opacity="0.7"/>
    <text x="108" y="155" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">合约 C</text>
    
    <text x="90" y="190" text-anchor="middle" font-size="10.5" fill="#3D4F65">同一合约不重复出现</text>
  </g>

  <text x="300" y="408" text-anchor="middle" font-size="11" fill="#3D4F65">冲突时只保留排名最优的坑位 · 防止头部合约垄断 + 页面去重</text>
</svg>
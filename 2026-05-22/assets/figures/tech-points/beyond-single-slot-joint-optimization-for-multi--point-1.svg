<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" font-family="Helvetica,Arial" font-size="20" font-weight="bold" fill="#1E3A5F">单坑独立 vs PV 级联合分配</text>

  <!-- LEFT -->
  <text x="200" y="78" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" fill="#3D4F65">单坑独立优化</text>

  <rect x="140" y="100" width="120" height="55" rx="4" fill="#FCE8E6" stroke="#D97766" stroke-width="1.5"/>
  <text x="200" y="133" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#1E3A5F">合约 A</text>

  <rect x="140" y="165" width="120" height="55" rx="4" fill="#FCE8E6" stroke="#D97766" stroke-width="1.5"/>
  <text x="200" y="198" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#1E3A5F">合约 A</text>

  <rect x="140" y="230" width="120" height="55" rx="4" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="200" y="263" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" fill="#1E3A5F">合约 C</text>

  <text x="200" y="310" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#D97766">头部合约垄断 · 重复曝光</text>

  <!-- divider -->
  <line x1="400" y1="70" x2="400" y2="360" stroke="#C8D2DD" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT -->
  <text x="600" y="78" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" fill="#3D4F65">PV 级联合分配</text>

  <rect x="490" y="92" width="220" height="220" rx="8" fill="none" stroke="#1E3A5F" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="600" y="110" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#1E3A5F">页面容量 pv=3</text>

  <rect x="510" y="122" width="180" height="50" rx="4" fill="#FCE8E6" stroke="#D97766" stroke-width="1.5"/>
  <text x="600" y="144" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="bold" fill="#1E3A5F">合约 A</text>
  <text x="600" y="161" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">x ≈ 0.6</text>

  <rect x="510" y="182" width="180" height="50" rx="4" fill="#E8F0E0" stroke="#7BA05B" stroke-width="1.5"/>
  <text x="600" y="204" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="bold" fill="#1E3A5F">合约 B</text>
  <text x="600" y="221" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">x ≈ 0.3</text>

  <rect x="510" y="242" width="180" height="50" rx="4" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="600" y="264" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="bold" fill="#1E3A5F">合约 C</text>
  <text x="600" y="281" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">x ≈ 0.1</text>

  <text x="600" y="335" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#7BA05B">页面级互斥 · 流量均铺</text>

  <!-- arrow from left to right -->
  <line x1="265" y1="195" x2="487" y2="195" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="376" y="187" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#4B8BDA">PV 二部图联合优化</text>

  <!-- bottom: joint objective -->
  <rect x="120" y="380" width="560" height="90" rx="6" fill="#F5F8FB" stroke="#C8D2DD" stroke-width="1"/>
  <text x="400" y="403" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="bold" fill="#1E3A5F">联合目标与约束</text>
  <text x="200" y="430" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">保量 θⱼ</text>
  <text x="333" y="430" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">优先级 wⱼ</text>
  <text x="466" y="430" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">兴趣 cᵢⱼ</text>
  <text x="600" y="430" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">坑位上限 pvᵢ</text>
  <text x="400" y="455" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#6B7A8C">决策变量 xᵢⱼ：请求 i 分给合约 j 的概率</text>
</svg>
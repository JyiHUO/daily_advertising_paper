<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">环境漂移下重新拟合响应曲线</text>

  <!-- Left: shifted environment -->
  <g>
    <rect x="30" y="70" width="160" height="110" rx="10" fill="#FFF1E6" stroke="#E0A06A" stroke-width="1.5"/>
    <text x="110" y="98" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">环境变化</text>
    <text x="110" y="128" text-anchor="middle" font-size="12" fill="#3D4F65">竞争加剧 ×1.1</text>
    <text x="110" y="150" text-anchor="middle" font-size="12" fill="#3D4F65">CPA 收紧 ×0.8</text>
  </g>

  <!-- Middle: refit curve every tick -->
  <g>
    <rect x="220" y="60" width="180" height="130" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="310" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">每 tick 重拟合响应曲线</text>
    <path d="M240 165 Q280 140 310 120 T380 95" fill="none" stroke="#B0B7C2" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M240 155 Q275 120 310 100 T380 70" fill="none" stroke="#4B8BDA" stroke-width="2.5"/>
    <text x="310" y="183" text-anchor="middle" font-size="11" fill="#3D4F65">旧曲线（灰）→ 新曲线（蓝）</text>
  </g>

  <!-- Right: solver -->
  <g>
    <rect x="430" y="70" width="140" height="110" rx="10" fill="#E8F0E4" stroke="#6B9B5A" stroke-width="1.5"/>
    <text x="500" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">重解 α，自动收敛</text>
    <text x="500" y="128" text-anchor="middle" font-size="12" fill="#3D4F65">α-C: 1.4 → 1.1</text>
    <text x="500" y="150" text-anchor="middle" font-size="12" fill="#3D4F65">出价立即压低</text>
  </g>

  <!-- arrows -->
  <line x1="190" y1="125" x2="218" y2="125" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="400" y1="125" x2="428" y2="125" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Bottom: robustness comparison -->
  <text x="300" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">分布漂移下的分数下降（深=竞争加剧，浅=CPA 收紧）</text>

  <g font-size="11" fill="#3D4F65">
    <!-- GRM -->
    <text x="80" y="272" text-anchor="middle" fill="#1E3A5F" font-weight="600">GRM</text>
    <rect x="40" y="282" width="40" height="22" fill="#4B8BDA"/>
    <text x="86" y="298" fill="#1E3A5F">−7.2%</text>
    <rect x="40" y="312" width="28" height="22" fill="#9CC2EE"/>
    <text x="74" y="328" fill="#1E3A5F">−5.0%</text>

    <!-- FTRL -->
    <text x="260" y="272" text-anchor="middle" fill="#1E3A5F" font-weight="600">FTRL</text>
    <rect x="220" y="282" width="50" height="22" fill="#E0A06A"/>
    <text x="276" y="298">−9.0%</text>
    <rect x="220" y="312" width="38" height="22" fill="#F0C9A4"/>
    <text x="264" y="328">−6.9%</text>

    <!-- DT -->
    <text x="470" y="272" text-anchor="middle" fill="#1E3A5F" font-weight="600">Decision Transformer</text>
    <rect x="410" y="282" width="120" height="22" fill="#C26A6A"/>
    <text x="536" y="298">−22.6%</text>
    <rect x="410" y="312" width="74" height="22" fill="#E2A8A8"/>
    <text x="490" y="328">−13.9%</text>
  </g>

  <text x="300" y="378" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">在线感知环境 → 显式重解约束，鲁棒性优势明显</text>
</svg>
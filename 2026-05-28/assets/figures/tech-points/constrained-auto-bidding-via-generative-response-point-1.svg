<svg height="500" width="800" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1E3A5F">学响应曲线，不学动作</text>
  <text x="400" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3D4F65">把跳变的最优动作换成平滑的环境响应</text>

  <!-- LEFT: traditional, learn action -->
  <g>
    <rect x="40" y="105" width="320" height="345" rx="12" fill="#FBF3EC" stroke="#D9A26B" stroke-width="1.5"/>
    <text x="200" y="135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">传统：直接学 α*</text>

    <!-- axes -->
    <line x1="80" y1="380" x2="330" y2="380" stroke="#3D4F65" stroke-width="1.2"/>
    <line x1="80" y1="180" x2="80" y2="380" stroke="#3D4F65" stroke-width="1.2"/>
    <text x="74" y="180" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">α*</text>
    <text x="330" y="398" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">state</text>

    <!-- step jumps -->
    <path d="M 90 360 L 160 360 L 160 240 L 220 240 L 220 330 L 280 330 L 280 200 L 325 200"
          fill="none" stroke="#D9743D" stroke-width="2.5" stroke-linejoin="miter"/>

    <text x="200" y="425" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#A0522D">约束边界处跳变，难拟合</text>
  </g>

  <!-- Arrow between -->
  <line x1="370" y1="280" x2="430" y2="280" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="400" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E3A5F">改换视角</text>

  <!-- RIGHT: GRM, learn response curve -->
  <g>
    <rect x="440" y="105" width="320" height="345" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="600" y="135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">GRM：学 cost(α) / value(α)</text>

    <!-- axes -->
    <line x1="480" y1="380" x2="730" y2="380" stroke="#3D4F65" stroke-width="1.2"/>
    <line x1="480" y1="180" x2="480" y2="380" stroke="#3D4F65" stroke-width="1.2"/>
    <text x="474" y="180" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">cost / value</text>
    <text x="730" y="398" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">α</text>

    <!-- log-sigmoid curve (saturating) -->
    <path d="M 485 370 Q 555 365 595 300 Q 635 230 695 215 Q 715 213 725 213"
          fill="none" stroke="#4B8BDA" stroke-width="3"/>
    <!-- supervision dots -->
    <circle cx="530" cy="368" r="4" fill="#1E3A5F"/>
    <circle cx="580" cy="320" r="4" fill="#1E3A5F"/>
    <circle cx="625" cy="255" r="4" fill="#1E3A5F"/>
    <circle cx="690" cy="216" r="4" fill="#1E3A5F"/>

    <!-- saturation hint -->
    <line x1="700" y1="205" x2="725" y2="205" stroke="#D9A26B" stroke-dasharray="3,3" stroke-width="1.2"/>
    <text x="722" y="200" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#A0522D">饱和</text>

    <text x="600" y="425" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E3A5F">单调 · 平滑 · 易回归</text>
  </g>

  <!-- bottom note -->
  <text x="400" y="478" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">控制器再在曲线上解析地求满足约束的 α</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">预测"广告主名字"，而不是稀疏 ID</text>

  <!-- LEFT: user signals as prompt -->
  <rect x="50" y="110" width="230" height="290" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="165" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">用户画像 + 行为</text>
  <text x="75" y="172" font-size="13" fill="#3D4F65">· 搜索词</text>
  <text x="75" y="198" font-size="13" fill="#3D4F65">· 浏览 URL</text>
  <text x="75" y="224" font-size="13" fill="#3D4F65">· 转化品牌 / 类目</text>
  <text x="75" y="250" font-size="13" fill="#3D4F65">· 历史活跃广告主</text>
  <line x1="75" y1="272" x2="255" y2="272" stroke="#B8CCE4" stroke-dasharray="3,3"/>
  <text x="165" y="296" text-anchor="middle" font-size="12" fill="#7A8A9E" font-style="italic">压成结构化 prompt</text>

  <!-- LLM in middle -->
  <circle cx="400" cy="255" r="78" fill="#FFF4E6" stroke="#E89B4A" stroke-width="2"/>
  <text x="400" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">LLM</text>
  <text x="400" y="272" text-anchor="middle" font-size="12" fill="#3D4F65">世界知识</text>

  <!-- arrow left -> LLM -->
  <line x1="285" y1="255" x2="318" y2="255" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- RIGHT: output advertisers -->
  <rect x="520" y="110" width="230" height="290" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="635" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">下一个转化广告主</text>

  <rect x="545" y="160" width="180" height="34" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
  <text x="635" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Wayfair</text>

  <rect x="545" y="202" width="180" height="34" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
  <text x="635" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Article</text>

  <rect x="545" y="244" width="180" height="34" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
  <text x="635" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Nike</text>

  <text x="635" y="304" text-anchor="middle" font-size="12" fill="#7A8A9E">（带语义的实体名）</text>

  <!-- mapping layer -->
  <rect x="545" y="328" width="180" height="46" rx="6" fill="#FDECEC" stroke="#C97070" stroke-dasharray="4,3"/>
  <text x="635" y="348" text-anchor="middle" font-size="12" fill="#1E3A5F">name → advertiser ID</text>
  <text x="635" y="365" text-anchor="middle" font-size="11" fill="#7A8A9E">回到广告系统</text>

  <!-- arrow LLM -> right -->
  <line x1="480" y1="255" x2="517" y2="255" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- bottom contrast -->
  <text x="400" y="450" text-anchor="middle" font-size="13" fill="#3D4F65">
    <tspan font-weight="700" fill="#1E3A5F">关键直觉：</tspan> 用 "Nike / Wayfair" 这种语义名做预测目标，比稀疏 itemID 更易学
  </text>
</svg>
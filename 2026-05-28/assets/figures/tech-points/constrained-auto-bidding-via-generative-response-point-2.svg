<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E08B4B"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A5F"/>
    </marker>
  </defs>

  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">两把闸门，谁先紧，谁说了算</text>

  <!-- Budget gate -->
  <g>
    <rect x="70" y="90" width="240" height="150" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="190" y="122" text-anchor="middle" font-size="16" font-weight="600" fill="#1E3A5F">预算闸门 (剩余 B−t)</text>
    <text x="190" y="180" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">α_B = 1.8</text>
    <text x="190" y="215" text-anchor="middle" font-size="12" fill="#3D4F65">还撑得住</text>
  </g>

  <!-- CPA gate -->
  <g>
    <rect x="490" y="90" width="240" height="150" rx="14" fill="#FDF1E6" stroke="#E08B4B" stroke-width="2"/>
    <text x="610" y="122" text-anchor="middle" font-size="16" font-weight="600" fill="#1E3A5F">CPA 闸门 (松弛 Δ−t)</text>
    <text x="610" y="180" text-anchor="middle" font-size="24" font-weight="700" fill="#A85A1F">α_C = 1.3</text>
    <text x="610" y="215" text-anchor="middle" font-size="12" fill="#A85A1F">已经吃紧</text>
  </g>

  <!-- min selector -->
  <g>
    <circle cx="400" cy="340" r="60" fill="#1E3A5F"/>
    <text x="400" y="338" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">min</text>
    <text x="400" y="362" text-anchor="middle" font-size="12" fill="#BCD3EC">取较紧者</text>
  </g>

  <!-- Arrows from gates to min -->
  <path d="M 230 240 L 358 305" stroke="#4B8BDA" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
  <path d="M 570 240 L 442 305" stroke="#E08B4B" stroke-width="2.2" fill="none" marker-end="url(#arO)"/>

  <!-- Output -->
  <rect x="290" y="430" width="220" height="55" rx="10" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="400" y="453" text-anchor="middle" font-size="13" fill="#1E3A5F">本 tick 出价</text>
  <text x="400" y="473" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">α_t = min(α_B, α_C) = 1.3</text>
  <path d="M 400 402 L 400 428" stroke="#1E3A5F" stroke-width="2.2" fill="none" marker-end="url(#arD)"/>

  <!-- rolling loop back -->
  <path d="M 510 457 C 760 457 770 170 732 165" stroke="#7A8A9E" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#arD)"/>
  <path d="M 290 457 C 40 457 30 170 68 165" stroke="#7A8A9E" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#arD)"/>
  <text x="400" y="278" text-anchor="middle" font-size="12" fill="#7A8A9E">每 tick 重新预测 · 重新求解</text>
</svg>
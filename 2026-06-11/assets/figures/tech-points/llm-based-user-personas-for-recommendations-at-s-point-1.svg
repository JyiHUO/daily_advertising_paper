<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">一次 Prompt，两种兴趣</text>

  <!-- User watch history (clustered) -->
  <g>
    <rect x="40" y="170" width="170" height="160" rx="10" fill="#FEF3E7" stroke="#E8A86B" stroke-width="1.5"/>
    <text x="125" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">观看历史（按主题聚类）</text>
    <circle cx="75" cy="250" r="14" fill="#F4C892"/>
    <circle cx="125" cy="258" r="18" fill="#F4C892"/>
    <circle cx="175" cy="250" r="12" fill="#F4C892"/>
    <text x="125" y="310" text-anchor="middle" font-size="11" fill="#3D4F65">标题列表 · 分组喂入</text>
  </g>

  <!-- LLM core -->
  <g>
    <rect x="320" y="180" width="160" height="140" rx="70" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="400" y="240" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">LLM</text>
    <text x="400" y="265" text-anchor="middle" font-size="11" fill="#3D4F65">统一 Prompt</text>
  </g>

  <!-- arrow in -->
  <line x1="215" y1="250" x2="315" y2="250" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Output 1: Exploitation -->
  <g>
    <rect x="560" y="100" width="210" height="110" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="665" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">利用 · 已有兴趣</text>
    <text x="665" y="160" text-anchor="middle" font-size="11" fill="#3D4F65">细粒度标签：孟加拉语剧</text>
    <text x="665" y="182" text-anchor="middle" font-size="11" fill="#3D4F65">"Mon Di Ey Chai"</text>
  </g>

  <!-- Output 2: Exploration -->
  <g>
    <rect x="560" y="290" width="210" height="110" rx="10" fill="#FDECEC" stroke="#D67878" stroke-width="1.5"/>
    <text x="665" y="320" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">探索 · 衍生话题</text>
    <text x="665" y="350" text-anchor="middle" font-size="11" fill="#3D4F65">+3 个相关新话题</text>
    <text x="665" y="372" text-anchor="middle" font-size="11" fill="#3D4F65">打破反馈回路</text>
  </g>

  <!-- arrows out -->
  <line x1="480" y1="215" x2="555" y2="165" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="480" y1="285" x2="555" y2="335" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <text x="400" y="465" text-anchor="middle" font-size="12" fill="#7A8AA0">一份输入 → 稳住主兴趣 + 拓展新边界</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CB4CC"/>
    </marker>
  </defs>

  <text x="300" y="38" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#1E3A5F">谁从 LLM 画像中受益最多？</text>

  <!-- Casual user -->
  <g>
    <circle cx="160" cy="195" r="85" fill="#FFF4E6" stroke="#E89B4A" stroke-width="2"/>
    <text x="160" y="140" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">低活用户</text>
    <circle cx="135" cy="175" r="4" fill="#E89B4A"/>
    <circle cx="180" cy="185" r="4" fill="#E89B4A"/>
    <circle cx="160" cy="210" r="4" fill="#E89B4A"/>
    <text x="160" y="240" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">行为稀疏 · 兴趣集中</text>
    <text x="160" y="305" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#C0392B">↑ 主要增量</text>
  </g>

  <!-- Active user -->
  <g>
    <circle cx="440" cy="195" r="85" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="440" y="140" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">高活用户</text>
    <circle cx="412" cy="170" r="3" fill="#4B8BDA"/>
    <circle cx="432" cy="178" r="3" fill="#4B8BDA"/>
    <circle cx="455" cy="172" r="3" fill="#4B8BDA"/>
    <circle cx="468" cy="192" r="3" fill="#4B8BDA"/>
    <circle cx="418" cy="198" r="3" fill="#4B8BDA"/>
    <circle cx="442" cy="208" r="3" fill="#4B8BDA"/>
    <circle cx="458" cy="220" r="3" fill="#4B8BDA"/>
    <circle cx="425" cy="218" r="3" fill="#4B8BDA"/>
    <circle cx="445" cy="188" r="3" fill="#4B8BDA"/>
    <text x="440" y="240" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">行为密集 · ID 已够用</text>
    <text x="440" y="305" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#3D4F65">→ 增量较小</text>
  </g>

  <!-- LLM persona -->
  <rect x="240" y="335" width="120" height="46" rx="8" fill="#1E3A5F"/>
  <text x="300" y="358" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">LLM 兴趣画像</text>
  <text x="300" y="373" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#BFD4EE">从稀疏行为推断</text>

  <path d="M 255 335 Q 210 315 188 295" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 345 335 Q 390 315 412 295" stroke="#9CB4CC" stroke-width="2" fill="none" stroke-dasharray="4,4" marker-end="url(#arGray)"/>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9B7FB8"/>
    </marker>
  </defs>

  <text x="300" y="30" text-anchor="middle" font-family="Helvetica,Arial" font-size="16" font-weight="bold" fill="#1E3A5F">读缓存即返回，LLM 在后台慢慢更新</text>

  <!-- User request -->
  <circle cx="70" cy="180" r="34" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="70" y="178" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#1E3A5F">用户请求</text>
  <text x="70" y="193" text-anchor="middle" font-family="Helvetica,Arial" font-size="10" fill="#7A8CA0">在线</text>

  <!-- Persona Cache (central) -->
  <rect x="200" y="130" width="200" height="100" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="300" y="156" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="bold" fill="#1E3A5F">画像缓存（毫秒读取）</text>
  <text x="300" y="182" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">利用：喜欢家庭烹饪</text>
  <text x="300" y="202" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">探索：分子料理入门</text>
  <text x="300" y="220" text-anchor="middle" font-family="Helvetica,Arial" font-size="10" fill="#7A8CA0">命中即用，不等 LLM</text>

  <!-- Downstream -->
  <rect x="460" y="145" width="110" height="70" rx="8" fill="#FFF3E0" stroke="#E8A04C" stroke-width="2"/>
  <text x="515" y="175" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="bold" fill="#1E3A5F">召回</text>
  <text x="515" y="195" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">利用 + 探索</text>

  <!-- Fast path arrows -->
  <line x1="106" y1="180" x2="196" y2="180" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#ar)"/>
  <line x1="402" y1="180" x2="456" y2="180" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="151" y="172" text-anchor="middle" font-family="Helvetica,Arial" font-size="10" fill="#3D4F65">查询</text>
  <text x="429" y="172" text-anchor="middle" font-family="Helvetica,Arial" font-size="10" fill="#3D4F65">取出</text>

  <!-- Async LLM background -->
  <rect x="210" y="305" width="180" height="60" rx="8" fill="#FAF3FF" stroke="#9B7FB8" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="300" y="328" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" font-weight="bold" fill="#1E3A5F">LLM 后台任务（异步）</text>
  <text x="300" y="350" text-anchor="middle" font-family="Helvetica,Arial" font-size="10" fill="#7A6080">拉历史 → 生成 → 安全过滤 → 写回</text>

  <!-- async loop arrows: down (trigger) and up (write back) -->
  <path d="M 250 230 Q 215 270 240 305" fill="none" stroke="#9B7FB8" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arP)"/>
  <path d="M 360 305 Q 385 270 350 230" fill="none" stroke="#9B7FB8" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arP)"/>
  <text x="190" y="272" font-family="Helvetica,Arial" font-size="10" fill="#7A6080">过期触发</text>
  <text x="370" y="272" font-family="Helvetica,Arial" font-size="10" fill="#7A6080">写回新画像</text>

  <!-- Safety gate note -->
  <text x="300" y="386" text-anchor="middle" font-family="Helvetica,Arial" font-size="10" fill="#7A8CA0">安全分类器命中不合规 → 回退到上次合格画像</text>
</svg>
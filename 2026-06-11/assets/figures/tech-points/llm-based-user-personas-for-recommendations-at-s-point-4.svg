<svg height="500" width="800" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97B5C"/>
    </marker>
  </defs>

  <text x="400" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1E3A5F">随机采样 · 跳出舒适区</text>

  <!-- Persona jar -->
  <g>
    <ellipse cx="160" cy="130" rx="95" ry="20" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <path d="M65,130 L75,360 Q160,385 245,360 L255,130" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <ellipse cx="160" cy="130" rx="95" ry="20" fill="none" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="160" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E3A5F">兴趣画像</text>

    <circle cx="115" cy="190" r="16" fill="#4B8BDA" opacity="0.85"/>
    <text x="115" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#fff">总结</text>
    <circle cx="200" cy="220" r="16" fill="#4B8BDA" opacity="0.55"/>
    <text x="200" y="224" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#fff">总结</text>
    <circle cx="135" cy="265" r="16" fill="#C97B5C" opacity="0.85"/>
    <text x="135" y="269" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#fff">探索</text>
    <circle cx="210" cy="305" r="16" fill="#C97B5C" opacity="0.55"/>
    <text x="210" y="309" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#fff">探索</text>
    <circle cx="150" cy="340" r="16" fill="#4B8BDA" opacity="0.7"/>
    <text x="150" y="344" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#fff">总结</text>
  </g>

  <!-- Dice -->
  <g transform="translate(390,225)">
    <rect x="-32" y="-32" width="64" height="64" rx="10" fill="#FFF7ED" stroke="#C97B5C" stroke-width="2" transform="rotate(15)"/>
    <g transform="rotate(15)">
      <circle cx="-10" cy="-10" r="4" fill="#C97B5C"/>
      <circle cx="10" cy="0" r="4" fill="#C97B5C"/>
      <circle cx="-2" cy="14" r="4" fill="#C97B5C"/>
    </g>
    <text x="0" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">随机各抽一条</text>
  </g>

  <!-- Arrows from jar to dice -->
  <path d="M250,210 L350,218" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M250,290 L350,238" stroke="#C97B5C" stroke-width="2" fill="none" marker-end="url(#arrW)"/>

  <!-- Output -->
  <g>
    <rect x="560" y="120" width="200" height="80" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="660" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">总结兴趣召回</text>
    <text x="660" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">利用 · 稳定偏好</text>

    <rect x="560" y="240" width="200" height="80" rx="10" fill="#FFF7ED" stroke="#C97B5C" stroke-width="1.8"/>
    <text x="660" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">探索兴趣召回</text>
    <text x="660" y="298" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">曝光 -41% · 观看 +13.6%</text>
  </g>

  <path d="M430,210 L555,165" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M430,240 L555,275" stroke="#C97B5C" stroke-width="2" fill="none" marker-end="url(#arrW)"/>

  <text x="400" y="445" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3D4F65">不取 Top 分，避免近因偏置 · 让沉睡兴趣有机会上场</text>
</svg>
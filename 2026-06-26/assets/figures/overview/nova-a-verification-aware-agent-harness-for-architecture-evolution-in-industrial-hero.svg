<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#4B8BDA"/>
    </radialGradient>
  </defs>

  <rect width="960" height="640" fill="#FAFAF7"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">NOVA：让 Agent 安全地演进工业广告推荐架构</text>
  <text x="480" y="62" text-anchor="middle" font-size="12" fill="#3D4F65">用"架构梯度 + 级联校验"挡住静默失败，把论文搬进产线</text>

  <!-- LEFT: problem -->
  <g>
    <text x="120" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#8B5A3C">通用代码 Agent</text>
    <rect x="35" y="135" width="170" height="56" rx="6" fill="#FDF2E9" stroke="#D97757" stroke-width="1.2"/>
    <text x="120" y="156" text-anchor="middle" font-size="12" fill="#1E3A5F">代码能跑 ✓ 单测过 ✓</text>
    <text x="120" y="178" text-anchor="middle" font-size="12" fill="#D97757">但架构语义已悄悄崩</text>

    <text x="120" y="222" text-anchor="middle" font-size="11" fill="#8B5A3C">mask 反向 · attention 退化为 MLP</text>
    <text x="120" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#D97757">Silent Failure</text>
  </g>

  <!-- arrow into core (blocked) -->
  <path d="M205,200 Q290,260 360,300" stroke="#D97757" stroke-width="1.6" fill="none" marker-end="url(#arRed)" stroke-dasharray="4,3"/>
  <text x="260" y="248" font-size="11" fill="#8B5A3C">被屏蔽</text>

  <!-- CORE: gradient + cascade -->
  <g transform="translate(480,360)">
    <circle r="150" fill="#EFF6FF" opacity="0.7"/>
    <circle r="118" fill="url(#core)" opacity="0.35"/>

    <!-- inner: architecture gradient -->
    <circle r="70" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.8"/>
    <text y="-10" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">架构梯度 g</text>
    <text y="10" text-anchor="middle" font-size="10" fill="#3D4F65">SGD 式离散更新</text>
    <text y="26" text-anchor="middle" font-size="10" fill="#3D4F65">薄弱 · 方向 · 雷区</text>

    <!-- cascade ring labels (4 gates) -->
    <g font-size="11" fill="#1E3A5F" font-weight="600">
      <text x="0" y="-128" text-anchor="middle">① 结构语义</text>
      <text x="132" y="4" text-anchor="start">② 本地可跑</text>
      <text x="0" y="142" text-anchor="middle">③ 离线 AUC</text>
      <text x="-132" y="4" text-anchor="end">④ 在线 A/B</text>
    </g>

    <!-- small gate dots on ring -->
    <circle cx="0" cy="-108" r="7" fill="#4B8BDA"/>
    <circle cx="108" cy="0" r="7" fill="#4B8BDA"/>
    <circle cx="0" cy="108" r="7" fill="#4B8BDA"/>
    <circle cx="-108" cy="0" r="7" fill="#4B8BDA"/>

    <!-- cascade arrows forming a closed loop -->
    <path d="M 0,-100 A 100,100 0 0,1 100,0" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 100,0 A 100,100 0 0,1 0,100" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 0,100 A 100,100 0 0,1 -100,0" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M -100,0 A 100,100 0 0,1 0,-100" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)" stroke-dasharray="3,3"/>
  </g>

  <!-- feedback loop label -->
  <text x="480" y="535" text-anchor="middle" font-size="11" fill="#4B8BDA" font-style="italic">失败模式 → 写回轨迹记忆 → 成为下一轮的"禁止方向"</text>

  <!-- L1-L4 stripe on top of core -->
  <g transform="translate(380,140)">
    <rect width="200" height="32" rx="16" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.2"/>
    <text x="100" y="21" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">L1 · L2 · L3 · L4  分级人机协同</text>
  </g>
  <path d="M480,172 L480,283" stroke="#4B8BDA" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- RIGHT: outcomes -->
  <g>
    <text x="840" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">产线收益</text>

    <rect x="745" y="135" width="190" height="58" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.2"/>
    <text x="840" y="155" text-anchor="middle" font-size="12" fill="#1E3A5F">L3 论文到产线 EPR</text>
    <text x="840" y="182" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">60.0%<tspan font-size="11" fill="#3D4F65" font-weight="400">  vs 通用 agent 10%</tspan></text>

    <rect x="745" y="208" width="190" height="58" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.2"/>
    <text x="840" y="228" text-anchor="middle" font-size="12" fill="#1E3A5F">在线 A/B  GMV 提升</text>
    <text x="840" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">+1.25% / +1.70% / +2.02%</text>

    <rect x="745" y="281" width="190" height="58" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.2"/>
    <text x="840" y="301" text-anchor="middle" font-size="12" fill="#1E3A5F">pCVR Bias 降幅</text>
    <text x="840" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">58.8% / 66.7% / 37.3%</text>

    <rect x="745" y="354" width="190" height="40" rx="6" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="840" y="379" text-anchor="middle" font-size="12" fill="#1E3A5F">人工值守时间 ↓ 13×</text>
  </g>

  <!-- arrow from core to outcome -->
  <path d="M610,335 Q680,300 745,255" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="680" y="290" font-size="11" fill="#4B8BDA">通过</text>

  <!-- bottom legend -->
  <g transform="translate(0,600)" font-size="11" fill="#3D4F65">
    <rect x="70" y="0" width="14" height="10" fill="#4B8BDA"/>
    <text x="90" y="9">校验通过 / 信息流</text>
    <rect x="250" y="0" width="14" height="10" fill="#D97757"/>
    <text x="270" y="9">静默失败 / 禁止方向</text>
    <rect x="445" y="0" width="14" height="10" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="465" y="9">NOVA 核心闭环</text>
    <text x="615" y="9" font-style="italic" fill="#8B5A3C">输入：RankMixer / TokenMixer-L / MixFormer</text>
  </g>
</svg>
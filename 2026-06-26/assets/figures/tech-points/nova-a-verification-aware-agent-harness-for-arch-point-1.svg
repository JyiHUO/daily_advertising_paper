<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97064"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1E3A5F">Architecture Gradient g_t</text>
  <text x="300" y="54" text-anchor="middle" font-size="12" fill="#3D4F65">a notebook that guides the next edit</text>

  <!-- Notebook / Memory -->
  <g>
    <rect x="50" y="90" width="220" height="250" rx="8" fill="#FFF7E6" stroke="#D6A85F" stroke-width="1.6"/>
    <rect x="50" y="90" width="220" height="28" rx="8" fill="#F0C674"/>
    <text x="160" y="109" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Trajectory Memory  H</text>

    <text x="68" y="142" font-size="11" font-weight="600" fill="#1E3A5F">inputs aggregated:</text>
    <text x="72" y="162" font-size="11" fill="#3D4F65">· last edit e_{t-1}</text>
    <text x="72" y="180" font-size="11" fill="#3D4F65">· verify diagnostics</text>
    <text x="72" y="198" font-size="11" fill="#3D4F65">· ΔAUC offline</text>
    <text x="72" y="216" font-size="11" fill="#3D4F65">· past failures</text>

    <line x1="68" y1="232" x2="252" y2="232" stroke="#D6A85F" stroke-dasharray="2,3"/>

    <text x="68" y="252" font-size="11" font-weight="600" fill="#1E3A5F">outputs from g_t:</text>
    <text x="72" y="272" font-size="11" fill="#C97064">✗ forbid: drop mask</text>
    <text x="72" y="292" font-size="11" fill="#4A7C59">✓ explore: token mixer</text>
    <text x="72" y="312" font-size="11" fill="#1E3A5F">◎ weak: attention module</text>
  </g>

  <!-- gradient arrow -->
  <path d="M 275 215 L 355 215" stroke="#4B8BDA" stroke-width="2.4" fill="none" marker-end="url(#ar)"/>
  <text x="315" y="207" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">g_t</text>

  <!-- Next edit candidate -->
  <g>
    <rect x="360" y="140" width="190" height="160" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
    <text x="455" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Next Edit  e*</text>
    <text x="455" y="194" text-anchor="middle" font-size="11" fill="#3D4F65">argmax score over</text>
    <text x="455" y="212" text-anchor="middle" font-size="11" fill="#3D4F65">feasible candidates</text>
    <text x="455" y="234" text-anchor="middle" font-size="10.5" fill="#3D4F65">(shape / dtype / latency / params)</text>
    <text x="455" y="270" text-anchor="middle" font-size="12" font-style="italic" fill="#4A7C59">+ AttentionRes residual</text>
    <text x="455" y="288" text-anchor="middle" font-size="10.5" fill="#3D4F65">(keep mask, not drop it)</text>
  </g>

  <!-- Feedback loop -->
  <path d="M 455 305 Q 455 380 260 385 Q 130 388 110 345" stroke="#C97064" stroke-width="1.8" fill="none" stroke-dasharray="5,4" marker-end="url(#arRed)"/>
  <text x="300" y="410" text-anchor="middle" font-size="11" fill="#C97064">verify result writes back to memory</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9543E"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#1E3A5F">训练之前的语义体检：能跑 ≠ 语义正确</text>

  <!-- candidate -->
  <circle cx="75" cy="225" r="44" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="75" y="222" text-anchor="middle" font-size="12" fill="#1E3A5F">候选架构</text>
  <text x="75" y="240" text-anchor="middle" font-size="11" fill="#3D4F65">code OK</text>

  <!-- sieve / gate -->
  <path d="M205,150 L395,150 L345,235 L345,305 L255,305 L255,235 Z" fill="#FFF4E6" stroke="#D89A4E" stroke-width="2"/>
  <text x="300" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">语义门</text>
  <text x="300" y="202" text-anchor="middle" font-size="10" fill="#3D4F65">mask 方向 / 特征→token 路由 / logit 融合</text>
  <text x="300" y="222" text-anchor="middle" font-size="10" fill="#3D4F65">shape · dtype · aux loss 索引</text>

  <!-- arrow in -->
  <line x1="120" y1="225" x2="250" y2="225" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- pass down -->
  <line x1="300" y1="305" x2="300" y2="343" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="312" y="328" font-size="11" fill="#3D4F65">通过</text>
  <rect x="225" y="348" width="150" height="44" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="300" y="368" text-anchor="middle" font-size="12" fill="#1E3A5F">昂贵训练 → 离线 AUC</text>
  <text x="300" y="384" text-anchor="middle" font-size="11" fill="#3D4F65">在线 A/B：GMV · Bias</text>

  <!-- reject right -->
  <line x1="345" y1="225" x2="465" y2="225" stroke="#C9543E" stroke-width="2" marker-end="url(#arRed)"/>
  <text x="405" y="216" text-anchor="middle" font-size="11" fill="#C9543E">silent fail</text>

  <!-- blacklist memory -->
  <rect x="468" y="180" width="118" height="92" rx="6" fill="#FCE9E4" stroke="#C9543E" stroke-width="1.8"/>
  <text x="527" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#7A2E1E">禁忌方向</text>
  <text x="527" y="226" text-anchor="middle" font-size="10" fill="#7A2E1E">写回轨迹记忆 H</text>
  <text x="527" y="246" text-anchor="middle" font-size="10" fill="#7A2E1E">屏蔽同类 pattern</text>
  <text x="527" y="264" text-anchor="middle" font-size="10" fill="#7A2E1E">架构梯度规避</text>

  <!-- feedback loop -->
  <path d="M468,200 Q360,90 200,90 Q110,90 80,182" fill="none" stroke="#C9543E" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arRed)"/>
  <text x="285" y="80" text-anchor="middle" font-size="11" fill="#C9543E">下一轮搜索绕开</text>
</svg>
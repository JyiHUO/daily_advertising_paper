<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9633F"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-family="Helvetica,Arial" font-size="20" font-weight="bold" fill="#1E3A5F">Silent Failure: 跑得通 ≠ 语义对</text>

  <!-- Candidate -->
  <circle cx="100" cy="240" r="46" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="100" y="236" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#1E3A5F">候选架构</text>
  <text x="100" y="254" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#1E3A5F">改动</text>

  <!-- Semantic Gate -->
  <rect x="260" y="170" width="200" height="140" rx="10" fill="#FFF3E6" stroke="#C9633F" stroke-width="2.5"/>
  <text x="360" y="198" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#1E3A5F">语义门 (懂推荐的审稿人)</text>
  <text x="360" y="228" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">检查 mask 方向</text>
  <text x="360" y="252" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">检查 attention 交互</text>
  <text x="360" y="276" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">检查 logit 融合路径</text>

  <line x1="146" y1="240" x2="256" y2="240" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Pass -->
  <rect x="560" y="150" width="180" height="64" rx="8" fill="#E8F1E8" stroke="#5A8A5A" stroke-width="2"/>
  <text x="650" y="176" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="bold" fill="#1E3A5F">✓ 通过 → 训练</text>
  <text x="650" y="197" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">离线 AUC / 在线 A/B</text>

  <line x1="464" y1="210" x2="556" y2="190" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Reject -->
  <rect x="560" y="266" width="180" height="64" rx="8" fill="#FBE8E0" stroke="#C9633F" stroke-width="2"/>
  <text x="650" y="292" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="bold" fill="#1E3A5F">✗ 拒绝 + 记忆</text>
  <text x="650" y="313" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">forbidden pattern</text>

  <line x1="464" y1="270" x2="556" y2="290" stroke="#C9633F" stroke-width="2" marker-end="url(#arrRed)"/>

  <!-- Feedback loop -->
  <path d="M 650 330 Q 650 420 360 420 Q 100 420 100 290" fill="none" stroke="#C9633F" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrRed)"/>
  <text x="380" y="412" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#C9633F" font-style="italic">失败模式 → 下一轮的禁止方向</text>

  <text x="400" y="470" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">在烧 GPU 之前，先挡住语义错误</text>
</svg>
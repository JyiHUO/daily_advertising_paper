    <text x="300" y="146" text-anchor="middle" font-size="10.5" fill="#3D4F65">ETDC 校准</text>
  </g>

  <line x1="270" y1="168" x2="120" y2="246" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="288" y1="177" x2="240" y2="246" stroke="#4B8BDA" stroke-width="2.6" marker-end="url(#arr)"/>
  <line x1="312" y1="177" x2="360" y2="246" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="330" y1="168" x2="480" y2="246" stroke="#4B8BDA" stroke-width="1.4" marker-end="url(#arr)"/>

  <text x="175" y="208" text-anchor="middle" font-size="11" fill="#4B8BDA" font-weight="600">w=0.2</text>
  <text x="250" y="222" text-anchor="middle" font-size="11" fill="#4B8BDA" font-weight="700">w=0.5</text>
  <text x="350" y="222" text-anchor="middle" font-size="11" fill="#4B8BDA" font-weight="600">w=0.2</text>
  <text x="425" y="208" text-anchor="middle" font-size="11" fill="#4B8BDA" font-weight="600">w=0.1</text>

  <rect x="75" y="250" width="80" height="90" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>

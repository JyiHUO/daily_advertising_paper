<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="310" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">HCA：一桶水，按倾向分到杯子</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#3D4F65">总量守恒 · 各杯不溢出 · 只在兄弟间分</text>

  <!-- Left side annotation -->
  <g font-size="11">
    <text x="20" y="200" fill="#3D4F65">渠道-天粒度</text>
    <text x="20" y="218" fill="#3D4F65">沿业务层级下沉</text>
    <text x="20" y="236" font-weight="700" fill="#1E3A5F">到 campaign 层</text>
    <text x="20" y="254" fill="#3D4F65">不重新估因果</text>
  </g>

  <!-- Bucket (parent total) -->
  <g>
    <ellipse cx="160" cy="110" rx="55" ry="11" fill="#DCEBFB" stroke="#4B8BDA" stroke-width="2"/>
    <path d="M105 110 L215 110 L203 185 L117 185 Z" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <ellipse cx="160" cy="110" rx="55" ry="11" fill="#DCEBFB" stroke="#4B8BDA" stroke-width="2"/>
    <text x="160" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">H = 300</text>
    <text x="160" y="205" text-anchor="middle" font-size="11" fill="#3D4F65">渠道级蚕食总量</text>
  </g>

  <!-- Weights label -->
  <g>
    <rect x="255" y="130" width="150" height="38" rx="6" fill="#FFF4E5" stroke="#E8A04A" stroke-width="1.5"/>
    <text x="330" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">倾向得分 → 权重</text>
    <text x="330" y="162" text-anchor="middle" font-size="10" fill="#3D4F65">0.4 / 0.3 / 0.2 / 0.1</text>
  </g>

  <!-- Arrows splitting from bucket through weights to cups -->
  <g stroke="#4B8BDA" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M200 175 Q 260 220 360 268"/>
    <path d="M200 175 Q 290 220 432 268"/>
    <path d="M200 175 Q 320 220 504 268"/>
    <path d="M200 175 Q 350 220 576 268"/>
  </g>

  <!-- Cups (children) -->
  <g font-size="11" fill="#1E3A5F">
    <g>
      <path d="M340 275 L390 275 L385 345 L345 345 Z" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
      <rect x="345" y="313" width="40" height="32" fill="#DCEBFB"/>
      <text x="365" y="268" text-anchor="middle" font-weight="700">120</text>
      <text x="365" y="365" text-anchor="middle" font-size="10" fill="#3D4F65">归因 500</text>
    </g>
    <g>
      <path d="M412 275 L462 275 L457 345 L417 345 Z" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
      <rect x="417" y="321" width="40" height="24" fill="#DCEBFB"/>
      <text x="437" y="268" text-anchor="middle" font-weight="700">90</text>
      <text x="437" y="365" text-anchor="middle" font-size="10" fill="#3D4F65">归因 400</text>
    </g>
    <g>
      <path d="M484 275 L534 275 L529 345 L489 345 Z" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
      <rect x="489" y="331" width="40" height="14" fill="#DCEBFB"/>
      <text x="509" y="268" text-anchor="middle" font-weight="700">60</text>
      <text x="509" y="365" text-anchor="middle" font-size="10" fill="#3D4F65">归因 300</text>
    </g>
    <g>
      <path d="M556 275 L606 275 L601 345 L561 345 Z" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
      <rect x="561" y="338" width="40" height="7" fill="#DCEBFB"/>
      <text x="581" y="268" text-anchor="middle" font-weight="700">30</text>
      <text x="581" y="365" text-anchor="middle" font-size="10" fill="#3D4F65">归因 200</text>
    </g>
  </g>

  <!-- Sum check -->
  <g>
    <rect x="345" y="385" width="260" height="26" rx="13" fill="#E8F3EA" stroke="#5BA86E" stroke-width="1.5"/>
    <text x="475" y="402" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">120 + 90 + 60 + 30 = 300  ✓ 聚合一致</text>
  </g>
</svg>
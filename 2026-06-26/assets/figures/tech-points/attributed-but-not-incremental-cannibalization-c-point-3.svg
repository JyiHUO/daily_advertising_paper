  <text x="115" y="270" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">子渠道 1</text>
  <text x="115" y="357" text-anchor="middle" font-size="10.5" fill="#3D4F65">分得 800</text>

  <rect x="200" y="250" width="80" height="90" rx="6" fill="#EFF6FF" stroke="#E15B5B" stroke-width="2"/>
  <rect x="200" y="268" width="80" height="72" fill="#E15B5B" opacity="0.45"/>
  <text x="240" y="262" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">子渠道 2（封顶）</text>
  <text x="240" y="305" text-anchor="middle" font-size="10.5" fill="#1E3A5F">上界 1500</text>
  <text x="240" y="357" text-anchor="middle" font-size="10" fill="#E15B5B" font-weight="600">溢出 500</text>

  <rect x="325" y="250" width="80" height="90" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>

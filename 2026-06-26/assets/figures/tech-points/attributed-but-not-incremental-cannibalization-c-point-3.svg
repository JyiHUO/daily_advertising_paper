  <text x="365" y="357" text-anchor="middle" font-size="10.5" fill="#3D4F65">800 + Δ</text>

  <rect x="450" y="250" width="80" height="90" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <rect x="450" y="331" width="80" height="9" fill="#4B8BDA" opacity="0.55"/>
  <text x="490" y="270" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">子渠道 4</text>
  <text x="490" y="357" text-anchor="middle" font-size="10.5" fill="#3D4F65">400 + Δ</text>

  <path d="M 280 305 Q 330 380 405 335" fill="none" stroke="#E15B5B" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
  <path d="M 280 290 Q 400 385 490 335" fill="none" stroke="#E15B5B" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrR)"/>

  <text x="300" y="402" text-anchor="middle" font-size="11.5" fill="#1E3A5F" font-weight="600">Σ 子节点 = 父节点 H</text>

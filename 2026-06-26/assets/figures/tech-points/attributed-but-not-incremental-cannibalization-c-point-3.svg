<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">HCA：把因果总量按层级切下去</text>
  <text x="300" y="54" text-anchor="middle" font-size="11" fill="#3D4F65">总和恒等 · 不越上界 · 局部隔离</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E15B5B"/>
    </marker>
  </defs>

  <g>
    <circle cx="300" cy="130" r="48" fill="#FEF3E2" stroke="#E8A547" stroke-width="2"/>

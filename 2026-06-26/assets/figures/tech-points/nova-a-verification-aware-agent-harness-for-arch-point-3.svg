<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">风险越高 · 人越靠近方向盘</text>

  <!-- Ladder bars -->
  <rect x="80" y="80" width="180" height="56" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
  <text x="100" y="114" font-size="15" font-weight="700" fill="#1E3A5F">L1</text>
  <text x="140" y="107" font-size="12" fill="#3D4F65">原子调参</text>
  <text x="140" y="125" font-size="11" fill="#7A8A9E">低风险</text>

  <rect x="80" y="146" width="240" height="56" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
  <text x="100" y="180" font-size="15" font-weight="700" fill="#1E3A5F">L2</text>
  <text x="140" y="173" font-size="12" fill="#3D4F65">约束感知 ScaleUp</text>
  <text x="140" y="191" font-size="11" fill="#7A8A9E">预算守门</text>

  <rect x="80" y="212" width="320" height="56" rx="8" fill="#FFF4E6" stroke="#E89B4C"/>
  <text x="100" y="246" font-size="15" font-weight="700" fill="#1E3A5F">L3</text>
  <text x="140" y="239" font-size="12" fill="#3D4F65">论文 → 生产迁移</text>
  <text x="140" y="257" font-size="11" fill="#A66A2C">语义易破</text>

  <rect x="80" y="278" width="420" height="56" rx="8" fill="#FBE4E4" stroke="#C9504C"/>
  <text x="100" y="312" font-size="15" font-weight="700" fill="#1E3A5F">L4</text>
  <text x="140" y="305" font-size="12" fill="#3D4F65">开放式架构创新</text>
  <text x="140" y="323" font-size="11" fill="#9A3A36">未知边界</text>

  <!-- Right column: mode -->
  <text x="540" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">执行模式</text>

  <circle cx="540" cy="108" r="18" fill="#4B8BDA"/>
  <text x="540" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">AUTO</text>

  <circle cx="540" cy="174" r="18" fill="#4B8BDA"/>
  <text x="540" y="178" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">AUTO</text>

  <circle cx="540" cy="240" r="18" fill="#E89B4C"/>
  <text x="540" y="244" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">±人</text>

  <circle cx="540" cy="306" r="18" fill="#C9504C"/>
  <text x="540" y="310" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">人</text>

  <!-- Skill spec gauge arrow -->
  <line x1="50" y1="90" x2="50" y2="330" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>
  <text x="30" y="210" font-size="11" fill="#1E3A5F" transform="rotate(-90 30 210)" text-anchor="middle">Skill Spec 覆盖收缩</text>

  <!-- Bottom note -->
  <text x="300" y="385" text-anchor="middle" font-size="12" fill="#3D4F65">覆盖到 → AutoRun ·  覆盖外 → Copilot</text>
  <text x="300" y="405" text-anchor="middle" font-size="11" fill="#7A8A9E">能力边界随 skill spec 完善而渐进扩展</text>
</svg>
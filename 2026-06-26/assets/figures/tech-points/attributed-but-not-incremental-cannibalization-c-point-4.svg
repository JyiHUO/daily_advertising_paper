<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#4B8BDA"/>
    </marker>
    <marker id="aho" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#E89B3C"/>
    </marker>
  </defs>

  <text x="300" y="36" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#1E3A5F">过去做老师，未来做考官</text>
  <text x="300" y="58" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">Forward-in-time rolling evaluation</text>

  <!-- Time axis -->
  <line x1="60" y1="200" x2="540" y2="200" stroke="#1E3A5F" stroke-width="2"/>
  <polygon points="540,200 532,196 532,204" fill="#1E3A5F"/>
  <line x1="300" y1="188" x2="300" y2="212" stroke="#1E3A5F" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="300" y="226" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">时间 T</text>

  <!-- Past experiments: calibration -->
  <rect x="80" y="105" width="180" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="170" y="135" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">过去实验 → 校准</text>
  <text x="170" y="156" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">用作训练，拟合纠偏参数</text>

  <circle cx="110" cy="200" r="5" fill="#4B8BDA"/>
  <circle cx="160" cy="200" r="5" fill="#4B8BDA"/>
  <circle cx="210" cy="200" r="5" fill="#4B8BDA"/>
  <circle cx="260" cy="200" r="5" fill="#4B8BDA"/>

  <!-- Future experiments: evaluation -->
  <rect x="340" y="105" width="180" height="70" rx="8" fill="#FFF4E6" stroke="#E89B3C" stroke-width="1.5"/>
  <text x="430" y="135" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">未来实验 → 考核</text>
  <text x="430" y="156" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">作为真值，评估纠偏效果</text>

  <circle cx="340" cy="200" r="5" fill="#E89B3C"/>
  <circle cx="390" cy="200" r="5" fill="#E89B3C"/>
  <circle cx="440" cy="200" r="5" fill="#E89B3C"/>
  <circle cx="490" cy="200" r="5" fill="#E89B3C"/>

  <!-- Arrows linking experiments to roles -->
  <path d="M170 245 L170 260" stroke="#4B8BDA" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>

  <!-- Result comparison: Market A / Channel 2 / Round 1 -->
  <text x="80" y="275" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1E3A5F">切片签名误差（Market A · Channel 2 · Round 1）</text>

  <rect x="80" y="288" width="320" height="18" fill="#F6CBCB" stroke="#C75450" stroke-width="1"/>
  <text x="88" y="302" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1E3A5F">原始归因</text>
  <text x="410" y="302" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#C75450">+200% 严重高估</text>

  <rect x="80" y="313" width="200" height="18" fill="#E0DCEF" stroke="#7E6FB0" stroke-width="1"/>
  <text x="88" y="327" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1E3A5F">Device ML</text>
  <text x="290" y="327" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#7E6FB0">−63% 反向低估</text>

  <rect x="80" y="338" width="22" height="18" fill="#CDE6CF" stroke="#3F8B49" stroke-width="1"/>
  <text x="112" y="352" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1E3A5F">ETDC+HCA</text>
  <text x="200" y="352" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#3F8B49">+3% 基本对齐</text>

  <text x="300" y="378" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">整体：ETDC+HCA 误差较原始归因降低 91%；线上蚕食率下降约 15 个百分点</text>

  <!-- Arrow from past block down to calibration use -->
  <path d="M170 175 L170 200" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M430 175 L430 200" stroke="#E89B3C" stroke-width="1.5" fill="none" marker-end="url(#aho)"/>
</svg>
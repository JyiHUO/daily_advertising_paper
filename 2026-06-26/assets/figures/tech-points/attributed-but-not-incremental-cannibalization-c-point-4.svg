<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Helvetica, Arial, sans-serif">
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E3A5F">用时间隔开：过去当老师，未来当考卷</text>

  <!-- Time axis -->
  <line x1="80" y1="180" x2="710" y2="180" stroke="#3D4F65" stroke-width="2"/>
  <polygon points="720,180 708,174 708,186" fill="#3D4F65"/>
  <text x="728" y="184" font-size="13" fill="#3D4F65">time</text>

  <!-- T marker -->
  <line x1="400" y1="155" x2="400" y2="310" stroke="#C77D3D" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="400" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#C77D3D">T</text>

  <!-- Left: training experiments (calibration) -->
  <rect x="110" y="200" width="240" height="90" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="230" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">历史实验（T 之前）</text>
  <text x="230" y="258" text-anchor="middle" font-size="13" fill="#3D4F65">校准信号 · 教模型</text>

  <!-- Right: evaluation experiments -->
  <rect x="450" y="200" width="240" height="90" rx="10" fill="#FFF4E6" stroke="#C77D3D" stroke-width="2"/>
  <text x="570" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">未来实验（T 之后）</text>
  <text x="570" y="258" text-anchor="middle" font-size="13" fill="#3D4F65">评估读数 · 打分</text>

  <!-- Experiment dots -->
  <circle cx="160" cy="180" r="6" fill="#4B8BDA"/>
  <circle cx="230" cy="180" r="6" fill="#4B8BDA"/>
  <circle cx="310" cy="180" r="6" fill="#4B8BDA"/>
  <circle cx="490" cy="180" r="6" fill="#C77D3D"/>
  <circle cx="570" cy="180" r="6" fill="#C77D3D"/>
  <circle cx="650" cy="180" r="6" fill="#C77D3D"/>

  <!-- Arrow from left to right (knowledge flow) -->
  <path d="M 350 170 Q 400 120 448 168" fill="none" stroke="#4B8BDA" stroke-width="2"/>
  <polygon points="450,170 440,164 442,174" fill="#4B8BDA"/>

  <!-- Results section -->
  <text x="400" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">渠道-实验级相对误差对比（市场A 渠道2）</text>

  <!-- Bottom comparison: three small bars -->
  <g transform="translate(140,375)">
    <text x="60" y="0" text-anchor="middle" font-size="12" fill="#3D4F65">原始归因</text>
    <rect x="10" y="10" width="100" height="14" fill="#E8B4B4"/>
    <text x="115" y="22" font-size="11" fill="#3D4F65">+200%</text>
  </g>
  <g transform="translate(340,375)">
    <text x="60" y="0" text-anchor="middle" font-size="12" fill="#3D4F65">设备级 ML</text>
    <rect x="10" y="10" width="65" height="14" fill="#D4A574"/>
    <text x="80" y="22" font-size="11" fill="#3D4F65">-64%</text>
  </g>
  <g transform="translate(540,375)">
    <text x="60" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">ETDC+HCA</text>
    <rect x="10" y="10" width="6" height="14" fill="#4B8BDA"/>
    <text x="22" y="22" font-size="11" fill="#3D4F65">≈ 0</text>
  </g>

  <!-- Bottom outcome -->
  <text x="400" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#C77D3D">上线后多市场蚕食率 ↓ ~15 个百分点</text>
</svg>
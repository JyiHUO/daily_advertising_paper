<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#FAFBFD"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">价值引导个性化 Beam Search</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#3D4F65">个性化 Trie 剪枝 + 融合分自带价值信号 → 单遍解码既生成又排序</text>

  <!-- LEFT: global trie -->
  <g>
    <rect x="40" y="90" width="220" height="270" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="150" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">全局 SID Trie（离线）</text>

    <circle cx="150" cy="158" r="9" fill="#4B8BDA"/>
    <line x1="150" y1="167" x2="80" y2="200" stroke="#7FA8D4" stroke-width="1.5"/>
    <line x1="150" y1="167" x2="150" y2="200" stroke="#7FA8D4" stroke-width="1.5"/>
    <line x1="150" y1="167" x2="220" y2="200" stroke="#7FA8D4" stroke-width="1.5"/>
    <circle cx="80" cy="208" r="7" fill="#7FA8D4"/>
    <circle cx="150" cy="208" r="7" fill="#7FA8D4"/>
    <circle cx="220" cy="208" r="7" fill="#7FA8D4"/>

    <line x1="80" y1="215" x2="55" y2="250" stroke="#B7CEE6" stroke-width="1.2"/>
    <line x1="80" y1="215" x2="105" y2="250" stroke="#B7CEE6" stroke-width="1.2"/>
    <line x1="150" y1="215" x2="130" y2="250" stroke="#B7CEE6" stroke-width="1.2"/>
    <line x1="150" y1="215" x2="170" y2="250" stroke="#B7CEE6" stroke-width="1.2"/>
    <line x1="220" y1="215" x2="195" y2="250" stroke="#B7CEE6" stroke-width="1.2"/>
    <line x1="220" y1="215" x2="245" y2="250" stroke="#B7CEE6" stroke-width="1.2"/>
    <g fill="#B7CEE6">
      <circle cx="55" cy="258" r="5"/><circle cx="105" cy="258" r="5"/>
      <circle cx="130" cy="258" r="5"/><circle cx="170" cy="258" r="5"/>
      <circle cx="195" cy="258" r="5"/><circle cx="245" cy="258" r="5"/>
    </g>

    <text x="150" y="310" text-anchor="middle" font-size="11" fill="#3D4F65">包含全部合法广告 SID 路径</text>
    <text x="150" y="334" text-anchor="middle" font-size="11" fill="#3D4F65">（多数对某用户不可投）</text>
  </g>

  <!-- arrow: prune -->
  <g>
    <rect x="275" y="188" width="100" height="44" rx="6" fill="#FFF4E6" stroke="#E8A355" stroke-width="1.2"/>
    <text x="325" y="207" text-anchor="middle" font-size="11" font-weight="700" fill="#8A5A1E">按用户 u 裁剪</text>
    <text x="325" y="222" text-anchor="middle" font-size="10" fill="#8A5A1E">定向/库存/素材</text>
    <path d="M260,210 L275,210" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M375,210 L390,210" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- MIDDLE: personalized sub-trie -->
  <g>
    <rect x="390" y="90" width="220" height="270" rx="12" fill="#E8F1FB" stroke="#2F6FB8" stroke-width="1.8"/>
    <text x="500" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">个性化子树 T_u</text>

    <circle cx="500" cy="158" r="9" fill="#2F6FB8"/>
    <line x1="500" y1="167" x2="450" y2="200" stroke="#2F6FB8" stroke-width="1.8"/>
    <line x1="500" y1="167" x2="550" y2="200" stroke="#2F6FB8" stroke-width="1.8"/>
    <circle cx="450" cy="208" r="7" fill="#2F6FB8"/>
    <circle cx="550" cy="208" r="7" fill="#2F6FB8"/>

    <line x1="450" y1="215" x2="430" y2="250" stroke="#2F6FB8" stroke-width="1.5"/>
    <line x1="450" y1="215" x2="475" y2="250" stroke="#2F6FB8" stroke-width="1.5"/>
    <line x1="550" y1="215" x2="535" y2="250" stroke="#2F6FB8" stroke-width="1.5"/>
    <line x1="550" y1="215" x2="575" y2="250" stroke="#2F6FB8" stroke-width="1.5"/>
    <g fill="#2F6FB8">
      <circle cx="430" cy="258" r="5"/><circle cx="475" cy="258" r="5"/>
      <circle cx="535" cy="258" r="5"/><circle cx="575" cy="258" r="5"/>
    </g>

    <!-- highlight value-aware beam path -->
    <path d="M500,158 L550,208 L575,258" stroke="#E04B5A" stroke-width="3" fill="none" opacity="0.85"/>
    <text x="500" y="310" text-anchor="middle" font-size="11" fill="#1E3A5F">Beam 每步只扩展合法 token</text>
    <text x="500" y="334" text-anchor="middle" font-size="11" fill="#E04B5A" font-weight="700">红线 = 融合 logits 累积分最高</text>
  </g>

  <!-- arrow to output -->
  <g>
    <path d="M610,210 L735,210" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
    <text x="672" y="202" text-anchor="middle" font-size="11" fill="#3D4F65">单遍解码</text>
  </g>

  <!-- RIGHT: output comparison -->
  <g>
    <rect x="740" y="100" width="135" height="110" rx="10" fill="#FDECEE" stroke="#E04B5A" stroke-width="1.5"/>
    <text x="807" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#8A2530">无 Trie</text>
    <text x="807" y="158" text-anchor="middle" font-size="26" font-weight="800" fill="#E04B5A">48</text>
    <text x="807" y="180" text-anchor="middle" font-size="11" fill="#8A2530">条有效路径</text>
    <text x="807" y="198" text-anchor="middle" font-size="10" fill="#8A2530">（大量被过滤）</text>

    <rect x="740" y="230" width="135" height="120" rx="10" fill="#E4F4E8" stroke="#2E9E55" stroke-width="1.8"/>
    <text x="807" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#1E5E34">有个性化 Trie</text>
    <text x="807" y="290" text-anchor="middle" font-size="26" font-weight="800" fill="#2E9E55">300</text>
    <text x="807" y="312" text-anchor="middle" font-size="11" fill="#1E5E34">条全合法路径</text>
    <text x="807" y="332" text-anchor="middle" font-size="10" fill="#1E5E34">高 eCPM 优先保留</text>
  </g>

  <!-- BOTTOM: key insight -->
  <g>
    <rect x="60" y="395" width="780" height="140" rx="12" fill="#F3F6FB" stroke="#4B8BDA" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="450" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">一次解码同时完成「生成 + 排序」</text>

    <rect x="95" y="438" width="230" height="82" rx="8" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="210" y="461" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">① Trie 剪枝</text>
    <text x="210" y="484" text-anchor="middle" font-size="11" fill="#3D4F65">提前砍掉不能投的分支</text>
    <text x="210" y="504" text-anchor="middle" font-size="11" fill="#3D4F65">省算力、候选全合法</text>

    <rect x="335" y="438" width="230" height="82" rx="8" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="450" y="461" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">② 融合 logits 累积分</text>
    <text x="450" y="484" text-anchor="middle" font-size="11" fill="#3D4F65">Dual-head 已含价值信号</text>
    <text x="450" y="504" text-anchor="middle" font-size="11" fill="#3D4F65">无需外挂价值排序模块</text>

    <rect x="575" y="438" width="230" height="82" rx="8" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="690" y="461" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">③ 线上收益</text>
    <text x="690" y="484" text-anchor="middle" font-size="11" fill="#3D4F65">有效候选 6× 增长</text>
    <text x="690" y="504" text-anchor="middle" font-size="11" fill="#3D4F65">高 eCPM 更易进入最终集</text>
  </g>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E89B5A"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A066B8"/>
    </marker>
  </defs>

  <text x="440" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">一次检索，两份产出：上下文 + 复杂度</text>
  <text x="440" y="62" text-anchor="middle" font-size="14" fill="#3D4F65">检索不是终点，它同时是路由器的传感器</text>

  <!-- Query -->
  <rect x="40" y="230" width="150" height="90" rx="10" fill="#FFF3E6" stroke="#E89B5A" stroke-width="2"/>
  <text x="115" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">用户查询</text>
  <text x="115" y="290" text-anchor="middle" font-size="12" fill="#3D4F65">"把鉴权改成 OAuth"</text>

  <!-- Central retrieval engine -->
  <rect x="260" y="180" width="240" height="190" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2.5"/>
  <text x="380" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">层级代码检索</text>
  <text x="380" y="230" text-anchor="middle" font-size="12" fill="#3D4F65">仓库树索引 · tree-sitter</text>

  <rect x="278" y="248" width="90" height="30" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
  <text x="323" y="268" text-anchor="middle" font-size="11" fill="#1E3A5F">5类查询路由</text>

  <rect x="392" y="248" width="90" height="30" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
  <text x="437" y="268" text-anchor="middle" font-size="11" fill="#1E3A5F">三路并行+RRF</text>

  <rect x="278" y="288" width="90" height="30" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
  <text x="323" y="308" text-anchor="middle" font-size="11" fill="#1E3A5F">7信号打分</text>

  <rect x="392" y="288" width="90" height="30" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
  <text x="437" y="308" text-anchor="middle" font-size="11" fill="#1E3A5F">1-hop依赖扩展</text>

  <text x="380" y="352" text-anchor="middle" font-size="11" fill="#7A6A4F" font-style="italic">共用一份索引与打分 · 开销摊销</text>

  <!-- arrow query -> engine -->
  <line x1="190" y1="275" x2="256" y2="275" stroke="#E89B5A" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- Output 1: context -->
  <rect x="590" y="110" width="250" height="110" rx="12" fill="#E8F3EC" stroke="#5BA876" stroke-width="2"/>
  <text x="715" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">产出① 上下文</text>
  <text x="715" y="162" text-anchor="middle" font-size="12" fill="#3D4F65">20 个相关符号 / 5 个文件</text>
  <text x="715" y="182" text-anchor="middle" font-size="12" fill="#3D4F65">→ 喂给编码 Agent</text>
  <text x="715" y="205" text-anchor="middle" font-size="11" fill="#5BA876" font-weight="600">"要看哪些代码"</text>

  <!-- Output 2: complexity vector -->
  <rect x="590" y="330" width="250" height="110" rx="12" fill="#F3E8F5" stroke="#A066B8" stroke-width="2"/>
  <text x="715" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">产出② 复杂度向量</text>
  <text x="715" y="382" text-anchor="middle" font-size="12" fill="#3D4F65">(5 文件, 20 符号, 深度 6,</text>
  <text x="715" y="400" text-anchor="middle" font-size="12" fill="#3D4F65">耦合 0.5, ...)</text>
  <text x="715" y="425" text-anchor="middle" font-size="11" fill="#A066B8" font-weight="600">→ 路由器选拓扑</text>

  <!-- arrows engine -> outputs -->
  <path d="M500,230 Q545,195 588,170" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M500,320 Q545,355 588,385" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <!-- bottom downstream topologies -->
  <rect x="590" y="475" width="110" height="38" rx="8" fill="#FFFFFF" stroke="#A066B8" stroke-dasharray="3,3"/>
  <text x="645" y="499" text-anchor="middle" font-size="11" fill="#1E3A5F">单体 / 流水线</text>

  <rect x="730" y="475" width="110" height="38" rx="8" fill="#FFFFFF" stroke="#A066B8" stroke-dasharray="3,3"/>
  <text x="785" y="499" text-anchor="middle" font-size="11" fill="#1E3A5F">多阶段深研</text>

  <line x1="680" y1="442" x2="655" y2="473" stroke="#A066B8" stroke-width="1.5" marker-end="url(#a3)" opacity="0.8"/>
  <line x1="750" y1="442" x2="775" y2="473" stroke="#A066B8" stroke-width="1.5" marker-end="url(#a3)" opacity="0.8"/>
</svg>
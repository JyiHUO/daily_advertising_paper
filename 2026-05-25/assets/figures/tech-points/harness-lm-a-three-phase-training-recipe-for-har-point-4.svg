<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97064"/>
    </marker>
  </defs>

  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">非对称双塔：保住文档侧的天花板</text>

  <!-- LEFT: Naive CL -->
  <g>
    <text x="200" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#C97064">朴素联合训练 · P@100 = 56.2</text>

    <!-- Small query tower -->
    <rect x="100" y="115" width="80" height="90" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="140" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">0.6B</text>
    <text x="140" y="170" text-anchor="middle" font-size="11" fill="#3D4F65">query 塔</text>
    <text x="140" y="190" text-anchor="middle" font-size="11" fill="#3D4F65">(小)</text>

    <!-- Big doc tower compromised -->
    <rect x="240" y="115" width="80" height="90" rx="6" fill="#FBE9E7" stroke="#C97064" stroke-width="2"/>
    <text x="280" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">8B 文档塔</text>
    <text x="280" y="172" text-anchor="middle" font-size="11" fill="#C97064">向下妥协</text>
    <text x="280" y="190" text-anchor="middle" font-size="11" fill="#3D4F65">(被拉低)</text>

    <!-- compromise arrow: doc compromises toward query -->
    <path d="M 240 160 L 185 160" stroke="#C97064" stroke-width="2" marker-end="url(#arRed)"/>

    <!-- coarse result -->
    <text x="200" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#3D4F65">文档向量只学到粗粒度</text>
    <circle cx="160" cy="295" r="24" fill="#FBE9E7" stroke="#C97064"/>
    <circle cx="205" cy="305" r="22" fill="#FBE9E7" stroke="#C97064"/>
    <circle cx="248" cy="290" r="24" fill="#FBE9E7" stroke="#C97064"/>
    <text x="200" y="365" text-anchor="middle" font-size="12" fill="#C97064">混在一起，分不开</text>
  </g>

  <!-- divider -->
  <line x1="400" y1="70" x2="400" y2="400" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- RIGHT: HLM -->
  <g>
    <text x="600" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">HLM 三段式 · P@100 = 64.3</text>

    <!-- Small query tower adapts -->
    <rect x="490" y="115" width="80" height="90" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="530" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">0.6B</text>
    <text x="530" y="170" text-anchor="middle" font-size="11" fill="#3D4F65">query 塔</text>
    <text x="530" y="190" text-anchor="middle" font-size="11" fill="#4B8BDA">主动对齐</text>

    <!-- Frozen big doc tower -->
    <rect x="640" y="115" width="80" height="90" rx="6" fill="#E8F4EA" stroke="#5B8C5A" stroke-width="2"/>
    <text x="680" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">8B 文档塔</text>
    <text x="680" y="172" text-anchor="middle" font-size="11" fill="#5B8C5A">❄ 冻结</text>
    <text x="680" y="190" text-anchor="middle" font-size="11" fill="#3D4F65">最优空间</text>

    <!-- adapt arrow: query -> fixed doc -->
    <path d="M 575 160 L 635 160" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

    <!-- fine result -->
    <text x="600" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#3D4F65">文档向量保留细粒度</text>
    <circle cx="540" cy="295" r="20" fill="#E8F4EA" stroke="#5B8C5A"/>
    <text x="540" y="299" text-anchor="middle" font-size="10" fill="#1E3A5F">免费</text>
    <circle cx="600" cy="320" r="20" fill="#E8F4EA" stroke="#5B8C5A"/>
    <text x="600" y="324" text-anchor="middle" font-size="10" fill="#1E3A5F">付费</text>
    <circle cx="660" cy="295" r="20" fill="#E8F4EA" stroke="#5B8C5A"/>
    <text x="660" y="299" text-anchor="middle" font-size="10" fill="#1E3A5F">在线</text>
    <text x="600" y="365" text-anchor="middle" font-size="12" fill="#5B8C5A">细类清晰可分</text>
  </g>

  <!-- bottom takeaway -->
  <rect x="120" y="420" width="560" height="60" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="400" y="445" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">先把文档塔练到最好再冻住，让小 query 塔单向适配</text>
  <text x="400" y="466" text-anchor="middle" font-size="11" fill="#3D4F65">+8 点 P@100：文档侧不再被小模型拖累</text>
</svg>
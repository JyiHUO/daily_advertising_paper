<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="-apple-system,Segoe UI,Helvetica,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2603A"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">渐进剪枝 + 每档重对齐</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#3D4F65">每次只挪一小步，模型始终留在教师附近</text>

  <!-- Top path: progressive -->
  <text x="60" y="118" font-size="13" fill="#1E3A5F" font-weight="600">渐进式</text>

  <g>
    <circle cx="130" cy="170" r="42" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="130" y="166" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">28层</text>
    <text x="130" y="184" text-anchor="middle" font-size="11" fill="#3D4F65">教师对齐</text>
  </g>

  <g>
    <circle cx="280" cy="170" r="34" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="280" y="166" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">14层</text>
    <text x="280" y="184" text-anchor="middle" font-size="10" fill="#3D4F65">再对齐</text>
  </g>

  <g>
    <circle cx="420" cy="170" r="28" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="420" y="167" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">7层</text>
    <text x="420" y="183" text-anchor="middle" font-size="10" fill="#3D4F65">再对齐</text>
  </g>

  <g>
    <circle cx="540" cy="170" r="22" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="540" y="167" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">4层</text>
    <text x="540" y="183" text-anchor="middle" font-size="9" fill="#3D4F65">再对齐</text>
  </g>

  <path d="M172,170 L246,170" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M314,170 L392,170" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M448,170 L518,170" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <g>
    <rect x="600" y="148" width="160" height="46" rx="6" fill="#E8F1E4" stroke="#5A8C4A" stroke-width="2"/>
    <text x="680" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#2F5028">P@100 = 63.1</text>
    <text x="680" y="184" text-anchor="middle" font-size="11" fill="#3D4F65">190M · 6.8ms</text>
  </g>
  <path d="M562,170 L598,170" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- Divider -->
  <line x1="80" y1="260" x2="720" y2="260" stroke="#CBD5E0" stroke-dasharray="4 4"/>

  <!-- Bottom path: one-shot -->
  <text x="60" y="310" font-size="13" fill="#C2603A" font-weight="600">一刀切</text>

  <g>
    <circle cx="170" cy="370" r="46" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="170" y="367" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="600">28层</text>
    <text x="170" y="386" text-anchor="middle" font-size="11" fill="#3D4F65">教师对齐</text>
  </g>

  <g>
    <circle cx="430" cy="370" r="22" fill="#FBEAE0" stroke="#C2603A" stroke-width="2"/>
    <text x="430" y="368" text-anchor="middle" font-size="11" fill="#7A3A1F" font-weight="600">4层</text>
    <text x="430" y="384" text-anchor="middle" font-size="9" fill="#7A3A1F">已脱离</text>
  </g>

  <path d="M218,370 L406,370" stroke="#C2603A" stroke-width="2" fill="none" marker-end="url(#arRed)" stroke-dasharray="6 4"/>
  <text x="312" y="358" text-anchor="middle" font-size="11" fill="#C2603A" font-style="italic">直接砍掉大半</text>

  <g>
    <rect x="540" y="348" width="180" height="46" rx="6" fill="#FBEAE0" stroke="#C2603A" stroke-width="2"/>
    <text x="630" y="368" text-anchor="middle" font-size="13" font-weight="600" fill="#7A3A1F">P@100 = 50.2</text>
    <text x="630" y="384" text-anchor="middle" font-size="11" fill="#3D4F65">再练也回不来</text>
  </g>
  <path d="M454,370 L538,370" stroke="#C2603A" stroke-width="2" fill="none" marker-end="url(#arRed)"/>

  <text x="400" y="455" text-anchor="middle" font-size="12" fill="#3D4F65" font-style="italic">关键差距：+13 P@100，仅靠"分档走"</text>
</svg>
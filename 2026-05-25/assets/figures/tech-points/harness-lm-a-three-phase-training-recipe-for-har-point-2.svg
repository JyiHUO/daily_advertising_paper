<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97064"/>
    </marker>
  </defs>

  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">学生向量要落进教师的坐标系</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">文档索引冻结，只能用 L2 对齐绝对坐标</text>

  <!-- Teacher anchor (center) -->
  <g>
    <text x="400" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">教师向量 (冻结)</text>
    <circle cx="400" cy="260" r="10" fill="#1E3A5F"/>
    <text x="400" y="290" text-anchor="middle" font-size="11" fill="#3D4F65">(0.12, -0.03, …)</text>
  </g>

  <!-- KL / kernel: relative order matches but offset -->
  <g>
    <rect x="50" y="120" width="220" height="290" rx="10" fill="#FBEFEC" stroke="#C97064" stroke-width="1.5"/>
    <text x="160" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#C97064">KL / 核对齐</text>
    <text x="160" y="168" text-anchor="middle" font-size="11" fill="#3D4F65">只保证"相对关系像"</text>

    <circle cx="130" cy="320" r="9" fill="#C97064" opacity="0.85"/>
    <text x="130" y="345" text-anchor="middle" font-size="10" fill="#3D4F65">学生 (0.40, 0.10)</text>

    <line x1="180" y1="225" x2="142" y2="305" stroke="#C97064" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arRed)"/>
    <text x="210" y="275" font-size="11" fill="#C97064">坐标偏移</text>

    <text x="160" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#C97064">P@100 = 56.4 / 58.7</text>
  </g>

  <!-- L2: absolute coords align -->
  <g>
    <rect x="530" y="120" width="220" height="290" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="640" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">L2 对齐</text>
    <text x="640" y="168" text-anchor="middle" font-size="11" fill="#3D4F65">逼近"坐标值一致"</text>

    <circle cx="640" cy="260" r="9" fill="#4B8BDA"/>
    <text x="640" y="288" text-anchor="middle" font-size="10" fill="#3D4F65">学生 (0.12, -0.03)</text>

    <line x1="500" y1="260" x2="625" y2="260" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar)"/>
    <text x="562" y="252" text-anchor="middle" font-size="11" fill="#4B8BDA">同位重合</text>

    <text x="640" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">P@100 = 61.9</text>
  </g>

  <!-- guides from center anchor (no text overlap) -->
  <line x1="385" y1="260" x2="280" y2="260" stroke="#9AA5B5" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="415" y1="260" x2="520" y2="260" stroke="#9AA5B5" stroke-width="1" stroke-dasharray="2,3"/>

  <text x="400" y="455" text-anchor="middle" font-size="12" fill="#3D4F65">L2 直接复用冻结的教师文档索引，无需重建 ANN</text>
  <text x="400" y="478" text-anchor="middle" font-size="12" fill="#3D4F65">非对称双塔约束下，越简单的目标越契合部署</text>
</svg>
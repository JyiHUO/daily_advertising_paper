<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3FA776"/>
    </marker>
  </defs>

  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">三段式训练：一次只解决一件事</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">把 语义 / 对齐 / 区分 拆开学，避免挤在一起学不好</text>

  <!-- Phase 1 -->
  <g>
    <rect x="50" y="100" width="220" height="260" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="160" y="128" text-anchor="middle" font-size="13" fill="#4B8BDA" font-weight="700">Phase 1</text>
    <text x="160" y="150" text-anchor="middle" font-size="15" fill="#1E3A5F" font-weight="700">立标杆</text>

    <circle cx="160" cy="220" r="46" fill="#1E3A5F"/>
    <text x="160" y="216" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">4B / 8B</text>
    <text x="160" y="234" text-anchor="middle" font-size="11" fill="#fff">Teacher</text>

    <text x="160" y="300" text-anchor="middle" font-size="12" fill="#3D4F65">训练对称双塔，得到上限向量空间</text>
    <text x="160" y="335" text-anchor="middle" font-size="11" fill="#9AA7B8" font-style="italic">— 跑不动，但是天花板 —</text>
  </g>

  <!-- Phase 2 -->
  <g>
    <rect x="290" y="100" width="220" height="260" rx="14" fill="#FFF4E6" stroke="#E8954A" stroke-width="1.5"/>
    <text x="400" y="128" text-anchor="middle" font-size="13" fill="#C97320" font-weight="700">Phase 2</text>
    <text x="400" y="150" text-anchor="middle" font-size="15" fill="#1E3A5F" font-weight="700">小模型对齐老师</text>

    <circle cx="350" cy="225" r="22" fill="#E8954A"/>
    <text x="350" y="229" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">0.6B</text>

    <circle cx="450" cy="225" r="32" fill="none" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="450" y="229" text-anchor="middle" font-size="10" fill="#1E3A5F">teacher v</text>

    <line x1="374" y1="225" x2="416" y2="225" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
    <text x="395" y="215" text-anchor="middle" font-size="10" fill="#4B8BDA">L2</text>

    <text x="400" y="300" text-anchor="middle" font-size="12" fill="#3D4F65">query 向量回归对齐</text>
    <text x="400" y="320" text-anchor="middle" font-size="12" fill="#3D4F65">直接复用教师文档塔</text>
    <text x="400" y="345" text-anchor="middle" font-size="11" fill="#9AA7B8" font-style="italic">— 只学"长得像老师" —</text>
  </g>

  <!-- Phase 3 -->
  <g>
    <rect x="530" y="100" width="220" height="260" rx="14" fill="#EAF6EF" stroke="#3FA776" stroke-width="1.5"/>
    <text x="640" y="128" text-anchor="middle" font-size="13" fill="#2F8B5E" font-weight="700">Phase 3</text>
    <text x="640" y="150" text-anchor="middle" font-size="15" fill="#1E3A5F" font-weight="700">在对齐空间里拉开</text>

    <polygon points="640,200 644,212 656,212 646,219 650,231 640,224 630,231 634,219 624,212 636,212" fill="#E8954A"/>

    <circle cx="595" cy="250" r="9" fill="#3FA776"/>
    <circle cx="685" cy="250" r="9" fill="#C9554A"/>

    <line x1="636" y1="226" x2="606" y2="244" stroke="#3FA776" stroke-width="2" marker-end="url(#arG)"/>
    <line x1="644" y1="226" x2="676" y2="244" stroke="#C9554A" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="582" y="275" text-anchor="middle" font-size="10" fill="#2F8B5E">pull</text>
    <text x="698" y="275" text-anchor="middle" font-size="10" fill="#C9554A">push</text>

    <text x="640" y="305" text-anchor="middle" font-size="12" fill="#3D4F65">对比损失精调 query 塔</text>
    <text x="640" y="325" text-anchor="middle" font-size="12" fill="#3D4F65">区分难负样本（文档塔冻结）</text>
  </g>

  <!-- flow arrows between phases -->
  <line x1="272" y1="225" x2="287" y2="225" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="512" y1="225" x2="527" y2="225" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- outcome -->
  <text x="400" y="410" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="700">190M 在线 query 塔 ≈ 8B 教师质量</text>
  <text x="400" y="432" text-anchor="middle" font-size="12" fill="#3D4F65">Bing Ads A/B：Revenue +1%  ·  Impression +0.6%  ·  Click +0.4%</text>
</svg>
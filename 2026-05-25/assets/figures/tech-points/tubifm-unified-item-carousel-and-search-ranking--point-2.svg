<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">同一模型 · Prompt 切换三任务</text>
  <text x="300" y="56" text-anchor="middle" font-size="12" fill="#3D4F65">把"排序"改写成"下一个 token 是什么"</text>

  <!-- Central model -->
  <circle cx="300" cy="220" r="62" fill="#FFF4E6" stroke="#E8A85C" stroke-width="2"/>
  <text x="300" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">统一 LM</text>
  <text x="300" y="234" text-anchor="middle" font-size="11" fill="#3D4F65">next-token</text>

  <!-- Item -->
  <rect x="40" y="115" width="180" height="60" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="130" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Item 排序</text>
  <text x="130" y="160" text-anchor="middle" font-size="11" fill="#3D4F65">…&lt;watch&gt; [?item]</text>
  <line x1="220" y1="160" x2="250" y2="195" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>

  <!-- Carousel -->
  <rect x="40" y="265" width="180" height="60" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="130" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Carousel 排序</text>
  <text x="130" y="310" text-anchor="middle" font-size="11" fill="#3D4F65">…&lt;surface&gt; [?carousel]</text>
  <line x1="220" y1="285" x2="250" y2="248" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>

  <!-- Search -->
  <rect x="380" y="190" width="180" height="60" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="470" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">搜索排序</text>
  <text x="470" y="235" text-anchor="middle" font-size="11" fill="#3D4F65">…&lt;query&gt;&lt;watch&gt; [?item]</text>
  <line x1="380" y1="220" x2="364" y2="220" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>

  <!-- Output -->
  <text x="300" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">一次 forward → 全量 catalog logits</text>

  <!-- Items dots -->
  <circle cx="240" cy="350" r="5" fill="#E8A85C"/>
  <circle cx="270" cy="350" r="5" fill="#E8A85C" opacity="0.7"/>
  <circle cx="300" cy="350" r="5" fill="#E8A85C" opacity="0.5"/>
  <circle cx="330" cy="350" r="5" fill="#E8A85C" opacity="0.35"/>
  <circle cx="360" cy="350" r="5" fill="#E8A85C" opacity="0.2"/>

  <text x="300" y="385" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">无任务专属 head · 无 beam search</text>
</svg>
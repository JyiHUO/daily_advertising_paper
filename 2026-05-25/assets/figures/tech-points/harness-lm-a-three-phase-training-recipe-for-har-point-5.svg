<svg height="600" width="960" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">用更小的塔，换更多的钱</text>
  <text x="400" y="66" text-anchor="middle" font-size="13" fill="#3D4F65">HARNESS-LM · Bing Ads 线上 A/B</text>

  <!-- LEFT: Big teacher -->
  <g>
    <circle cx="150" cy="230" r="70" fill="#E8EEF6" stroke="#7892AE" stroke-width="1.5"/>
    <text x="150" y="222" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">8B</text>
    <text x="150" y="244" text-anchor="middle" font-size="12" fill="#3D4F65">教师模型</text>
    <text x="150" y="324" text-anchor="middle" font-size="12" fill="#3D4F65">延迟高 · 吞吐低</text>
  </g>

  <!-- Arrow shrink -->
  <line x1="225" y1="230" x2="378" y2="230" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="301" y="220" text-anchor="middle" font-size="12" fill="#4B8BDA" font-style="italic">蒸馏 + 剪枝</text>

  <!-- MIDDLE: Small student -->
  <g>
    <circle cx="410" cy="230" r="30" fill="#FFE9CC" stroke="#D89A55" stroke-width="1.8"/>
    <text x="410" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">190M</text>
    <text x="410" y="244" text-anchor="middle" font-size="10" fill="#3D4F65">HLM</text>
    <text x="410" y="290" text-anchor="middle" font-size="12" fill="#3D4F65">6.8ms · 6808 QPS</text>
    <text x="410" y="308" text-anchor="middle" font-size="11" fill="#C77024">×27 更快 · ×20 吞吐</text>
  </g>

  <!-- Arrow to gains -->
  <line x1="445" y1="230" x2="578" y2="230" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="511" y="220" text-anchor="middle" font-size="12" fill="#4B8BDA" font-style="italic">线上 A/B</text>

  <!-- RIGHT: Gains panel -->
  <g>
    <rect x="585" y="150" width="180" height="160" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="675" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">真金白银收益</text>

    <text x="605" y="212" font-size="13" fill="#1E3A5F">Revenue</text>
    <text x="745" y="212" text-anchor="end" font-size="15" font-weight="700" fill="#0E7C46">+1.0%</text>

    <text x="605" y="240" font-size="13" fill="#1E3A5F">Click</text>
    <text x="745" y="240" text-anchor="end" font-size="15" font-weight="700" fill="#0E7C46">+0.4%</text>

    <text x="605" y="268" font-size="13" fill="#1E3A5F">Impression</text>
    <text x="745" y="268" text-anchor="end" font-size="15" font-weight="700" fill="#0E7C46">+0.38%</text>

    <line x1="600" y1="282" x2="750" y2="282" stroke="#B8C8DC" stroke-width="1"/>
    <text x="675" y="300" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">质量指标持平</text>
  </g>

  <!-- Bottom takeaway -->
  <rect x="140" y="400" width="520" height="56" rx="8" fill="#FFF7EC" stroke="#D89A55" stroke-width="1.2"/>
  <text x="400" y="424" text-anchor="middle" font-size="13" fill="#1E3A5F">小塔在线编码 query · 大塔离线编码广告库</text>
  <text x="400" y="444" text-anchor="middle" font-size="12" fill="#3D4F65">不牺牲用户体验，单换召回模型 → 营收 +1%</text>
</svg>
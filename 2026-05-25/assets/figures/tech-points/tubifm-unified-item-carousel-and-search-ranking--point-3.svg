<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="-apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">遮住容器，看清内容本身</text>

  <!-- Left: original sample -->
  <g>
    <rect x="50" y="100" width="240" height="120" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="170" y="128" text-anchor="middle" font-size="13" fill="#3D4F65">训练样本</text>
    <text x="170" y="158" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="600">[home]</text>
    <text x="170" y="182" text-anchor="middle" font-size="14" fill="#C9472F" font-weight="600">[rainy-nights]</text>
    <text x="170" y="206" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="600">[片A]</text>
  </g>

  <!-- Mask icon -->
  <g transform="translate(335,140)">
    <circle cx="25" cy="25" r="26" fill="#FFF4E6" stroke="#E8954A" stroke-width="1.8"/>
    <text x="25" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#E8954A">MASK</text>
    <text x="25" y="76" text-anchor="middle" font-size="11" fill="#3D4F65">10% 概率遮住 carousel</text>
  </g>

  <!-- Arrows -->
  <line x1="295" y1="160" x2="332" y2="160" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="390" y1="160" x2="427" y2="160" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Right: masked sample -->
  <g>
    <rect x="430" y="100" width="240" height="120" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="550" y="128" text-anchor="middle" font-size="13" fill="#3D4F65">改写后</text>
    <text x="550" y="158" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="600">[home]</text>
    <text x="550" y="182" text-anchor="middle" font-size="14" fill="#8A8A8A" font-weight="600">[MASK]</text>
    <text x="550" y="206" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="600">[片A]</text>
  </g>

  <!-- Bottom takeaway -->
  <g>
    <rect x="120" y="280" width="480" height="150" rx="12" fill="#F5F0E8" stroke="#E8954A" stroke-width="1.5"/>
    <text x="360" y="312" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">模型被迫从用户历史推断兴趣</text>
    <text x="160" y="350" font-size="13" fill="#3D4F65">✓ 容器无关的稳健打分</text>
    <text x="160" y="378" font-size="13" fill="#3D4F65">✓ 新 carousel 上线不崩</text>
    <text x="160" y="406" font-size="13" fill="#3D4F65">✓ 推理时用 MASK 也能给分</text>
  </g>

  <text x="360" y="460" text-anchor="middle" font-size="11" fill="#8A8A8A">carousel 边缘化 · 一个模型统一三任务</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="880" height="560" fill="#FAFBFD"/>

  <text x="440" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">伪轮速 PWS：踩踏节奏 = 速度计</text>
  <text x="440" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">不加传感器，从加速度里听出蹬车周期 T，再换算车速</text>

  <!-- Step 1: acceleration waveform -->
  <g>
    <rect x="40" y="100" width="220" height="120" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="150" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">前向加速度</text>
    <path d="M55 180 Q72 150 90 180 T125 180 T160 180 T195 180 T245 180" fill="none" stroke="#E8A87C" stroke-width="2"/>
    <text x="150" y="208" text-anchor="middle" font-size="11" fill="#3D4F65">蹬一下 松一下 蹬一下…</text>
  </g>

  <!-- Step 2: find period T -->
  <g>
    <rect x="330" y="100" width="220" height="120" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="440" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">低通 + MWI + 自相关</text>
    <line x1="350" y1="185" x2="535" y2="185" stroke="#B8C5D6" stroke-width="1"/>
    <path d="M355 185 L380 160 L405 185 L455 185 L480 160 L505 185" fill="none" stroke="#4B8BDA" stroke-width="2"/>
    <line x1="380" y1="195" x2="480" y2="195" stroke="#1E3A5F" stroke-width="1.2"/>
    <text x="430" y="210" text-anchor="middle" font-size="11" fill="#1E3A5F">T = 1s</text>
  </g>

  <!-- Step 3: v formula -->
  <g>
    <rect x="620" y="100" width="220" height="120" rx="10" fill="#FFF4E6" stroke="#E8A87C" stroke-width="1.5"/>
    <text x="730" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">伪轮速</text>
    <text x="730" y="162" text-anchor="middle" font-size="18" fill="#1E3A5F">v = 2π r K / T</text>
    <text x="730" y="190" text-anchor="middle" font-size="12" fill="#3D4F65">传动比 K · 轮半径 r</text>
    <text x="730" y="210" text-anchor="middle" font-size="12" fill="#C97C5D">→ v ≈ 3 m/s</text>
  </g>

  <line x1="260" y1="160" x2="328" y2="160" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="550" y1="160" x2="618" y2="160" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Validity gate -->
  <g>
    <rect x="40" y="270" width="380" height="90" rx="10" fill="#FFFFFF" stroke="#B8C5D6" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="230" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">有效性判据（在踩才用）</text>
    <text x="230" y="322" text-anchor="middle" font-size="12" fill="#3D4F65">Pearson 相关 + 峰数比 → 滑行/倒蹬/下坡丢弃</text>
  </g>

  <!-- Fusion -->
  <g>
    <rect x="460" y="270" width="380" height="90" rx="10" fill="#EAF3FE" stroke="#4B8BDA" stroke-width="2"/>
    <text x="650" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">方差倒数加权融合</text>
    <text x="650" y="322" text-anchor="middle" font-size="12" fill="#3D4F65">模型位移 ⊕ 伪轮速位移，谁更确定听谁的</text>
  </g>

  <line x1="420" y1="315" x2="458" y2="315" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Example -->
  <g>
    <rect x="80" y="400" width="720" height="130" rx="10" fill="#FFF8EE" stroke="#E8A87C" stroke-width="1.5"/>
    <text x="440" y="426" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">这一秒发生了什么</text>

    <rect x="115" y="445" width="200" height="65" rx="6" fill="#FFFFFF" stroke="#B8C5D6"/>
    <text x="215" y="467" text-anchor="middle" font-size="12" fill="#3D4F65">模型估计</text>
    <text x="215" y="490" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">2.80 m  (σ²=0.04)</text>

    <rect x="340" y="445" width="200" height="65" rx="6" fill="#FFFFFF" stroke="#B8C5D6"/>
    <text x="440" y="467" text-anchor="middle" font-size="12" fill="#3D4F65">伪轮速</text>
    <text x="440" y="490" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">3.10 m  (σ²=0.09)</text>

    <rect x="565" y="445" width="200" height="65" rx="6" fill="#EAF3FE" stroke="#4B8BDA" stroke-width="2"/>
    <text x="665" y="467" text-anchor="middle" font-size="12" fill="#1E3A5F">融合输出（更贴近真值）</text>
    <text x="665" y="494" text-anchor="middle" font-size="17" font-weight="bold" fill="#C97C5D">≈ 2.89 m</text>

    <line x1="315" y1="478" x2="338" y2="478" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="540" y1="478" x2="563" y2="478" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
</svg>
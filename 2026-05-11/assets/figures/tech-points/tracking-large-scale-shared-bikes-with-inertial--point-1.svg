<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E48A5A"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#FAF7F2"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">MMoE 式惯性多任务网络：8 个专家，按任务各挑 2 个</text>

  <!-- IMU input -->
  <rect x="40" y="240" width="130" height="80" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="105" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">IMU 1s</text>
  <text x="105" y="292" text-anchor="middle" font-size="12" fill="#3D4F65">100 帧加速度</text>
  <text x="105" y="308" text-anchor="middle" font-size="12" fill="#3D4F65">+ 角速度</text>

  <line x1="170" y1="280" x2="216" y2="280" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- 8 experts pool -->
  <rect x="220" y="150" width="220" height="260" rx="14" fill="#FFF4E8" stroke="#E48A5A" stroke-width="2"/>
  <text x="330" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">8 个共享专家 (特征顾问)</text>

  <g font-size="13" fill="#1E3A5F" font-weight="600">
    <circle cx="265" cy="210" r="20" fill="#FFE2C7" stroke="#E48A5A"/><text x="265" y="215" text-anchor="middle">E1</text>
    <circle cx="330" cy="210" r="20" fill="#FFE2C7" stroke="#E48A5A"/><text x="330" y="215" text-anchor="middle">E2</text>
    <circle cx="395" cy="210" r="20" fill="#FFE2C7" stroke="#E48A5A"/><text x="395" y="215" text-anchor="middle">E3</text>
    <circle cx="265" cy="270" r="20" fill="#FFE2C7" stroke="#E48A5A"/><text x="265" y="275" text-anchor="middle">E4</text>
    <circle cx="330" cy="270" r="20" fill="#FFE2C7" stroke="#E48A5A"/><text x="330" y="275" text-anchor="middle">E5</text>
    <circle cx="395" cy="270" r="20" fill="#FFE2C7" stroke="#E48A5A"/><text x="395" y="275" text-anchor="middle">E6</text>
    <circle cx="297" cy="330" r="20" fill="#FFE2C7" stroke="#E48A5A"/><text x="297" y="335" text-anchor="middle">E7</text>
    <circle cx="362" cy="330" r="20" fill="#FFE2C7" stroke="#E48A5A"/><text x="362" y="335" text-anchor="middle">E8</text>
  </g>
  <text x="330" y="385" text-anchor="middle" font-size="12" fill="#3D4F65" font-style="italic">擅长不同模式：颠簸 / 转弯 / 匀速…</text>

  <!-- Task A: displacement -->
  <g>
    <rect x="510" y="100" width="160" height="70" rx="10" fill="#E8F0FA" stroke="#4B8BDA" stroke-width="2"/>
    <text x="590" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">门控 A · 位移</text>
    <text x="590" y="150" text-anchor="middle" font-size="12" fill="#3D4F65">挑 E3 + E7 (平稳)</text>

    <rect x="710" y="100" width="150" height="70" rx="10" fill="#D9E8F8" stroke="#1E3A5F" stroke-width="2"/>
    <text x="785" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">位移头</text>
    <text x="785" y="150" text-anchor="middle" font-size="12" fill="#3D4F65">→ 前进 2.3 m</text>
    <line x1="670" y1="135" x2="710" y2="135" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#ar)"/>
  </g>

  <!-- Task B: heading -->
  <g>
    <rect x="510" y="200" width="160" height="70" rx="10" fill="#E8F0FA" stroke="#4B8BDA" stroke-width="2"/>
    <text x="590" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">门控 B · 航向</text>
    <text x="590" y="250" text-anchor="middle" font-size="12" fill="#3D4F65">挑 E1 + E5 (转弯)</text>

    <rect x="710" y="200" width="150" height="70" rx="10" fill="#D9E8F8" stroke="#1E3A5F" stroke-width="2"/>
    <text x="785" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">航向头</text>
    <text x="785" y="250" text-anchor="middle" font-size="12" fill="#3D4F65">→ 转 5°</text>
    <line x1="670" y1="235" x2="710" y2="235" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#ar)"/>
  </g>

  <!-- Task C: residual / uncertainty -->
  <g>
    <rect x="510" y="300" width="160" height="70" rx="10" fill="#E8F0FA" stroke="#4B8BDA" stroke-width="2"/>
    <text x="590" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">门控 C · 残差/不确定性</text>
    <text x="590" y="350" text-anchor="middle" font-size="12" fill="#3D4F65">挑另外 2 个专家</text>

    <rect x="710" y="300" width="150" height="70" rx="10" fill="#D9E8F8" stroke="#1E3A5F" stroke-width="2"/>
    <text x="785" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">误差头</text>
    <text x="785" y="350" text-anchor="middle" font-size="12" fill="#3D4F65">→ σ, 偏置</text>
    <line x1="670" y1="335" x2="710" y2="335" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#ar)"/>
  </g>

  <!-- arrows from expert pool to gates -->
  <line x1="440" y1="210" x2="508" y2="135" stroke="#E48A5A" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arO)"/>
  <line x1="440" y1="270" x2="508" y2="235" stroke="#E48A5A" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arO)"/>
  <line x1="440" y1="330" x2="508" y2="335" stroke="#E48A5A" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arO)"/>

  <!-- bottom note -->
  <rect x="80" y="450" width="740" height="80" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="450" y="478" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">关键创新：专家与任务解耦</text>
  <text x="450" y="500" text-anchor="middle" font-size="12.5" fill="#3D4F65">不是「共享主干 + 多头」，而是 8 个 task-agnostic 特征池</text>
  <text x="450" y="518" text-anchor="middle" font-size="12.5" fill="#3D4F65">每个任务用自己的门控只取 Top-2 专家 → 共享底层 + 任务间不打架</text>
</svg>
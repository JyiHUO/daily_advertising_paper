<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">LLM 语义灯塔：把"相关性"锚回语义</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#3D4F65">用 BGE 固化的两个原型，纠正被点击反馈污染的相关性向量</text>

  <!-- LLM box -->
  <rect x="40" y="110" width="200" height="90" rx="10" fill="#FFF4E6" stroke="#D97757" stroke-width="2"/>
  <text x="140" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">BGE 文本编码器</text>
  <text x="140" y="165" text-anchor="middle" font-size="12" fill="#3D4F65">固定 · 离线编码</text>
  <text x="140" y="184" text-anchor="middle" font-size="12" fill="#3D4F65">输出"相关 / 不相关"原型</text>

  <!-- Two prototypes -->
  <circle cx="720" cy="160" r="58" fill="#E6F4EA" stroke="#3DA45C" stroke-width="2.5"/>
  <text x="720" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">r⁺ 原型</text>
  <text x="720" y="178" text-anchor="middle" font-size="12" fill="#3D4F65">"相关"灯塔</text>

  <circle cx="720" cy="400" r="58" fill="#FCE8E8" stroke="#C0504D" stroke-width="2.5"/>
  <text x="720" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">r⁻ 原型</text>
  <text x="720" y="418" text-anchor="middle" font-size="12" fill="#3D4F65">"不相关"灯塔</text>

  <!-- LLM to prototypes -->
  <path d="M240,140 Q470,100 662,150" fill="none" stroke="#D97757" stroke-width="2" marker-end="url(#arrR)"/>
  <path d="M240,180 Q470,420 662,400" fill="none" stroke="#D97757" stroke-width="2" marker-end="url(#arrR)"/>

  <!-- Model r vector -->
  <rect x="320" y="260" width="200" height="80" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="420" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">模型相关性向量 r</text>
  <text x="420" y="312" text-anchor="middle" font-size="12" fill="#3D4F65">易被点击反馈带偏</text>
  <text x="420" y="330" text-anchor="middle" font-size="12" fill="#3D4F65">投影 → r_proto</text>

  <!-- Arrows: r to prototypes (cosine sim) -->
  <line x1="520" y1="280" x2="665" y2="185" stroke="#4B8BDA" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="600" y="218" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">cos → s⁺</text>

  <line x1="520" y1="320" x2="665" y2="378" stroke="#4B8BDA" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="600" y="365" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">cos → s⁻</text>

  <!-- Hinge loss -->
  <rect x="290" y="430" width="260" height="80" rx="10" fill="#F3EFFB" stroke="#7B61C9" stroke-width="2"/>
  <text x="420" y="460" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">Margin Hinge Loss</text>
  <text x="420" y="482" text-anchor="middle" font-size="12" fill="#3D4F65">正样本：s⁺ − s⁻ ≥ γ ；负样本反向</text>
  <text x="420" y="500" text-anchor="middle" font-size="12" fill="#3D4F65">梯度回传，把 r 拉向对应灯塔</text>

  <!-- arrow r to loss -->
  <line x1="420" y1="340" x2="420" y2="428" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Feedback loop arrow: loss back to r (closing the loop) -->
  <path d="M290,470 Q230,400 290,340" fill="none" stroke="#7B61C9" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="232" y="408" text-anchor="middle" font-size="11" fill="#7B61C9">修正 r</text>

  <!-- Example callout -->
  <rect x="40" y="260" width="200" height="170" rx="10" fill="#F7FAFC" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="140" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">例子</text>
  <text x="55" y="308" font-size="12" fill="#3D4F65">query: 儿童保温杯</text>
  <text x="55" y="326" font-size="12" fill="#3D4F65">item:  成人马克杯</text>
  <text x="55" y="354" font-size="12" fill="#C0504D">点击多 → r 误偏"相关"</text>
  <text x="55" y="380" font-size="12" fill="#3DA45C">原型把 r 拽回"不相关"</text>
  <text x="55" y="408" font-size="12" font-weight="600" fill="#1E3A5F">语义先验 &gt; 行为噪声</text>

  <!-- bottom note -->
  <text x="450" y="545" text-anchor="middle" font-size="12" fill="#3D4F65" font-style="italic">外部 LLM 先验作为锚点，对抗反馈循环导致的相关性语义漂移</text>
</svg>
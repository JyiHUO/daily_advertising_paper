<svg height="600" width="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E89B6C"/>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E0A91B"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">偏好矫正：把曝光偏置从用户偏好里挤出去</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">小步残差修正 + 双重正则刹车</text>

  <!-- Original preference p -->
  <rect x="50" y="120" width="200" height="120" rx="12" fill="#FFF1E6" stroke="#E89B6C" stroke-width="2"/>
  <text x="150" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">原始偏好 p</text>
  <text x="150" y="185" text-anchor="middle" font-size="12" fill="#3D4F65">真实兴趣 + 曝光偏置混杂</text>
  <text x="150" y="212" text-anchor="middle" font-size="11" fill="#9B5B2C">("因为热门所以点")</text>

  <!-- Attention self-weight box -->
  <rect x="330" y="115" width="240" height="130" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="450" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">注意力自保权重</text>
  <text x="450" y="180" text-anchor="middle" font-size="20" font-weight="700" fill="#4B8BDA">α_pp · V(p) → p_clean</text>
  <text x="450" y="215" text-anchor="middle" font-size="11" fill="#3D4F65">挤出相关性带来的成分</text>

  <!-- Edited preference -->
  <rect x="650" y="120" width="200" height="120" rx="12" fill="#E8F4EC" stroke="#4CAF7F" stroke-width="2"/>
  <text x="750" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">编辑后偏好 p_edit</text>
  <text x="750" y="185" text-anchor="middle" font-size="13" fill="#2E7D5B">= p + Δp</text>
  <text x="750" y="215" text-anchor="middle" font-size="11" fill="#3D4F65">小步修正，保留真实兴趣</text>

  <!-- arrows top row -->
  <line x1="250" y1="180" x2="325" y2="180" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="570" y1="180" x2="645" y2="180" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="607" y="170" text-anchor="middle" font-size="11" fill="#3D4F65">Δp 残差</text>

  <!-- residual loop from p to edit -->
  <path d="M 150 240 Q 150 310 450 310 Q 750 310 750 245" fill="none" stroke="#E89B6C" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrR)"/>
  <text x="450" y="302" text-anchor="middle" font-size="11" fill="#9B5B2C">原偏好走捷径加回 (残差连接)</text>

  <!-- Regularizers (brakes) -->
  <rect x="120" y="370" width="290" height="130" rx="12" fill="#FFF8E1" stroke="#E0A91B" stroke-width="2"/>
  <text x="265" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">刹车一 · 幅度正则</text>
  <text x="265" y="432" text-anchor="middle" font-size="14" fill="#3D4F65">‖Δp‖₂ 不能太大</text>
  <text x="265" y="465" text-anchor="middle" font-size="11" fill="#3D4F65">改动幅度有限，不许"大改"</text>

  <rect x="490" y="370" width="290" height="130" rx="12" fill="#FFF8E1" stroke="#E0A91B" stroke-width="2"/>
  <text x="635" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">刹车二 · 方向正则</text>
  <text x="635" y="432" text-anchor="middle" font-size="14" fill="#3D4F65">cos(p_edit, p) → 1</text>
  <text x="635" y="465" text-anchor="middle" font-size="11" fill="#3D4F65">方向不许偏，仍是"这个用户"</text>

  <!-- arrows from brakes to edit box -->
  <path d="M 265 370 Q 400 300 700 240" fill="none" stroke="#E0A91B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrY)"/>
  <path d="M 635 370 Q 720 320 760 245" fill="none" stroke="#E0A91B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrY)"/>

</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D89545"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">Sharp 认证前沿：两个世界，同一份报表</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#3D4F65">信息论意义上的不可识别</text>

  <!-- World A -->
  <g>
    <circle cx="150" cy="180" r="92" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="150" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">世界 A（真增量）</text>
    <text x="150" y="186" text-anchor="middle" font-size="12" fill="#3D4F65">真实 lift = 0.002</text>
    <text x="150" y="206" text-anchor="middle" font-size="12" fill="#3D4F65">留存率 0.5</text>
  </g>

  <!-- World B -->
  <g>
    <circle cx="150" cy="370" r="92" fill="#FFF4E6" stroke="#D89545" stroke-width="2"/>
    <text x="150" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">世界 B（几乎无增量）</text>
    <text x="150" y="376" text-anchor="middle" font-size="12" fill="#3D4F65">真实 lift = 0.0004</text>
    <text x="150" y="396" text-anchor="middle" font-size="12" fill="#3D4F65">留存率 ≈ 1</text>
  </g>

  <!-- Report -->
  <g>
    <rect x="450" y="225" width="240" height="100" rx="10" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
    <text x="570" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">退化报表（同分布）</text>
    <text x="570" y="283" text-anchor="middle" font-size="13" fill="#3D4F65">观测 lift = 0.001</text>
    <text x="570" y="306" text-anchor="middle" font-size="11" fill="#3D4F65">业务阈值 = 0.0008</text>
  </g>

  <!-- Arrows converging to report -->
  <path d="M 242 200 Q 360 220 450 258" fill="none" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#ar)"/>
  <path d="M 242 350 Q 360 330 450 298" fill="none" stroke="#D89545" stroke-width="2.2" marker-end="url(#aro)"/>

  <!-- Decision: undecidable -->
  <g>
    <rect x="440" y="395" width="260" height="70" rx="35" fill="#1E3A5F"/>
    <text x="570" y="425" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">无法判定 (Undecidable)</text>
    <text x="570" y="448" text-anchor="middle" font-size="11" fill="#BFD4EC">阈值落入 sharp 区间，最坏错误率 ≥ 1/2</text>
  </g>

  <!-- Connecting from report to decision -->
  <line x1="570" y1="325" x2="570" y2="392" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
</svg>
<svg height="600" width="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">信号留存 q 决定样本代价</text>
  <text x="400" y="58" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">n ∝ 1 / q²   （达到半径 ε = 0.02）</text>

  <!-- baseline ground -->
  <line x1="60" y1="390" x2="590" y2="390" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- q=0.9 -->
  <g>
    <rect x="90" y="330" width="120" height="60" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="150" y="356" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">q = 0.9</text>
    <text x="150" y="378" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">≈ 19 万 / 臂</text>
  </g>

  <!-- q=0.5 -->
  <g>
    <rect x="240" y="250" width="120" height="140" rx="6" fill="#FFF4E6" stroke="#E8A04A" stroke-width="2"/>
    <text x="300" y="276" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">q = 0.5</text>
    <text x="300" y="298" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">≈ 60 万 / 臂</text>
    <text x="300" y="320" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8A6433">约 ×3</text>
  </g>

  <!-- q=0.15 -->
  <g>
    <rect x="400" y="110" width="160" height="280" rx="6" fill="#FBE9E7" stroke="#D9534F" stroke-width="2"/>
    <text x="480" y="138" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">q = 0.15</text>
    <text x="480" y="160" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">≈ 672 万 / 臂</text>
    <text x="480" y="182" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#9B3A36">约 ×35</text>
  </g>

  <!-- arrow showing escalation: from q=0.9 box top to q=0.15 box left -->
  <path d="M 210 340 Q 320 240 400 200" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="295" y="230" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4B8BDA">q 越低，n 暴涨</text>

  <!-- Identification floor -->
  <g>
    <rect x="605" y="170" width="170" height="140" rx="6" fill="#F3EFFB" stroke="#7A5BC2" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="690" y="198" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1E3A5F">q ∈ [q̲, q̄]</text>
    <text x="690" y="224" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">识别下限</text>
    <text x="690" y="250" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#7A5BC2">B/4 · (1 − q̲/q̄)</text>
    <text x="690" y="285" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7A5BC2">堆样本无法消除</text>
  </g>

  <!-- bottom note -->
  <text x="400" y="445" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1E3A5F">低留存场景：靠堆量堆不出认证</text>
  <text x="400" y="468" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">必须从匹配 / 归因质量侧收紧不确定集 U</text>
</svg>
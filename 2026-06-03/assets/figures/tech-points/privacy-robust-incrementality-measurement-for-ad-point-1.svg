<svg height="600" width="960" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">兼容性纤维 → Lift 区间 → 三态决策</text>

  <!-- Left: blurred report -->
  <g>
    <rect x="50" y="100" width="180" height="130" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="140" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">退化报表</text>
    <line x1="75" y1="148" x2="205" y2="148" stroke="#B8C9DC" stroke-width="6" stroke-dasharray="3,4"/>
    <line x1="75" y1="168" x2="205" y2="168" stroke="#B8C9DC" stroke-width="6" stroke-dasharray="3,4"/>
    <line x1="75" y1="188" x2="180" y2="188" stroke="#B8C9DC" stroke-width="6" stroke-dasharray="3,4"/>
    <text x="140" y="217" text-anchor="middle" font-size="11" fill="#3D4F65">匹配率 / 噪声 / 阈值</text>
  </g>

  <!-- Middle: fiber set -->
  <g>
    <rect x="290" y="80" width="220" height="170" rx="14" fill="#FFF7EC" stroke="#D89B4A" stroke-width="1.5"/>
    <text x="400" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">兼容性纤维</text>
    <text x="400" y="122" text-anchor="middle" font-size="11" fill="#3D4F65">所有可能的干净世界</text>
    <circle cx="340" cy="160" r="14" fill="#FDE2BD" stroke="#D89B4A"/>
    <circle cx="380" cy="190" r="14" fill="#FDE2BD" stroke="#D89B4A"/>
    <circle cx="420" cy="155" r="14" fill="#FDE2BD" stroke="#D89B4A"/>
    <circle cx="460" cy="195" r="14" fill="#FDE2BD" stroke="#D89B4A"/>
    <circle cx="400" cy="225" r="14" fill="#FDE2BD" stroke="#D89B4A"/>
  </g>

  <!-- Arrow report -> fiber -->
  <line x1="232" y1="165" x2="286" y2="165" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>

  <!-- Right: lift interval -->
  <g transform="translate(570,130)">
    <text x="90" y="0" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Lift 区间</text>
    <line x1="20" y1="50" x2="160" y2="50" stroke="#1E3A5F" stroke-width="2"/>
    <line x1="20" y1="42" x2="20" y2="58" stroke="#1E3A5F" stroke-width="2"/>
    <line x1="160" y1="42" x2="160" y2="58" stroke="#1E3A5F" stroke-width="2"/>
    <text x="20" y="78" text-anchor="middle" font-size="11" fill="#3D4F65">ℓ*</text>
    <text x="160" y="78" text-anchor="middle" font-size="11" fill="#3D4F65">u*</text>
    <line x1="95" y1="28" x2="95" y2="68" stroke="#C44545" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="95" y="22" text-anchor="middle" font-size="10" fill="#C44545">阈值</text>
  </g>

  <!-- Arrow fiber -> lift -->
  <line x1="512" y1="165" x2="568" y2="165" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>

  <!-- Three outcomes at bottom -->
  <g font-size="13" font-weight="600">
    <rect x="60" y="350" width="200" height="90" rx="10" fill="#E8F4EC" stroke="#4A9D6F" stroke-width="1.5"/>
    <text x="160" y="380" text-anchor="middle" fill="#2E6B47">✓ 认证</text>
    <text x="160" y="408" text-anchor="middle" font-size="11" font-weight="400" fill="#3D4F65">ℓ* &gt; 阈值，最坏情况仍正向</text>

    <rect x="300" y="350" width="200" height="90" rx="10" fill="#FFF7EC" stroke="#D89B4A" stroke-width="1.5"/>
    <text x="400" y="380" text-anchor="middle" fill="#A66A1F">? 无法判定</text>
    <text x="400" y="408" text-anchor="middle" font-size="11" font-weight="400" fill="#3D4F65">区间跨越阈值，不强下结论</text>

    <rect x="540" y="350" width="200" height="90" rx="10" fill="#FBEAEA" stroke="#C44545" stroke-width="1.5"/>
    <text x="640" y="380" text-anchor="middle" fill="#933030">✗ 拒绝</text>
    <text x="640" y="408" text-anchor="middle" font-size="11" font-weight="400" fill="#3D4F65">u* &lt; 阈值，最好情况也不够</text>
  </g>

  <!-- Arrows from interval down to three outcomes -->
  <line x1="640" y1="220" x2="640" y2="346" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="620" y1="215" x2="420" y2="346" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="600" y1="215" x2="180" y2="346" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
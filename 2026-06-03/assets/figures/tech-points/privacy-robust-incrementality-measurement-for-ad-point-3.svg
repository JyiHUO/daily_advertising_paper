<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">粒度-异质性权衡</text>
  <text x="400" y="62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">调显微镜：粗看模糊，细看屏蔽</text>

  <!-- LEFT: coarse -->
  <g>
    <rect x="60" y="100" width="240" height="300" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="180" y="128" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">粗 cell（低倍）</text>

    <circle cx="180" cy="225" r="55" fill="none" stroke="#1E3A5F" stroke-width="3"/>
    <line x1="220" y1="265" x2="252" y2="297" stroke="#1E3A5F" stroke-width="5" stroke-linecap="round"/>
    <text x="160" y="220" text-anchor="middle" font-size="22" fill="#D97757" font-weight="bold">+</text>
    <text x="200" y="240" text-anchor="middle" font-size="22" fill="#3D4F65" font-weight="bold">−</text>

    <text x="180" y="345" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">子群一正一负被平均</text>
    <text x="180" y="370" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#D97757">异质性惩罚 H·diam 大</text>
  </g>

  <!-- RIGHT: fine -->
  <g>
    <rect x="500" y="100" width="240" height="300" rx="10" fill="#FDF2EC" stroke="#D97757" stroke-width="1.5"/>
    <text x="620" y="128" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">细 cell（高倍）</text>

    <circle cx="620" cy="225" r="35" fill="none" stroke="#1E3A5F" stroke-width="3"/>
    <line x1="645" y1="250" x2="677" y2="282" stroke="#1E3A5F" stroke-width="5" stroke-linecap="round"/>
    <line x1="595" y1="200" x2="645" y2="250" stroke="#D97757" stroke-width="3"/>
    <line x1="645" y1="200" x2="595" y2="250" stroke="#D97757" stroke-width="3"/>

    <text x="620" y="345" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">样本不足 → 聚合阈值压制</text>
    <text x="620" y="370" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#D97757">进入"无法判定"</text>
  </g>

  <!-- middle: certification box -->
  <rect x="335" y="190" width="130" height="80" rx="8" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="400" y="212" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">认证条件</text>
  <text x="400" y="234" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">LB − H·diam &gt; b</text>
  <text x="400" y="254" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">下界 / 噪声 / 异质</text>

  <!-- arrows pointing inward -->
  <line x1="305" y1="230" x2="333" y2="230" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="495" y1="230" x2="467" y2="230" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- bottom verdict -->
  <rect x="240" y="435" width="320" height="46" rx="23" fill="#1E3A5F"/>
  <text x="400" y="464" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#EFF6FF">三关全过 → 该粒度可认证</text>
</svg>
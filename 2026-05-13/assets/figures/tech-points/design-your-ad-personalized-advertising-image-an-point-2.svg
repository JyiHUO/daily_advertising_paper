<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E07856"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E3A5F">双重锚点：让模型不跑偏</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">前景视觉锚 + 卖点词汇锚</text>

  <!-- LEFT: Image side -->
  <g>
    <rect x="60" y="90" width="320" height="350" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="220" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">图像侧 · 形态锚定</text>

    <!-- Product watch -->
    <circle cx="130" cy="230" r="36" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
    <circle cx="130" cy="230" r="20" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>
    <line x1="130" y1="230" x2="130" y2="218" stroke="#1E3A5F" stroke-width="2"/>
    <line x1="130" y1="230" x2="140" y2="230" stroke="#1E3A5F" stroke-width="2"/>
    <rect x="123" y="184" width="14" height="12" fill="#1E3A5F"/>
    <rect x="123" y="264" width="14" height="12" fill="#1E3A5F"/>
    <text x="130" y="298" text-anchor="middle" font-size="11" fill="#3D4F65">商品透明图</text>
    <text x="130" y="316" text-anchor="middle" font-size="10" fill="#3D4F65">patchify + DINOv2</text>

    <!-- Injection arrows -->
    <g stroke="#E07856" stroke-width="2" fill="none">
      <path d="M 172 200 L 258 184" marker-end="url(#a1)"/>
      <path d="M 172 230 L 258 244" marker-end="url(#a1)"/>
      <path d="M 172 260 L 258 304" marker-end="url(#a1)"/>
    </g>

    <!-- Decoder stack -->
    <rect x="260" y="170" width="90" height="24" fill="#FFFFFF" stroke="#4B8BDA"/>
    <rect x="260" y="200" width="90" height="24" fill="#FFFFFF" stroke="#4B8BDA"/>
    <rect x="260" y="230" width="90" height="24" fill="#FFFFFF" stroke="#4B8BDA"/>
    <rect x="260" y="260" width="90" height="24" fill="#FFFFFF" stroke="#4B8BDA"/>
    <rect x="260" y="290" width="90" height="24" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="305" y="186" text-anchor="middle" font-size="10" fill="#E07856">layer (注入)</text>
    <text x="305" y="216" text-anchor="middle" font-size="10" fill="#3D4F65">layer</text>
    <text x="305" y="246" text-anchor="middle" font-size="10" fill="#E07856">layer (注入)</text>
    <text x="305" y="276" text-anchor="middle" font-size="10" fill="#3D4F65">layer</text>
    <text x="305" y="306" text-anchor="middle" font-size="10" fill="#E07856">layer (注入)</text>

    <text x="220" y="365" text-anchor="middle" font-size="11" fill="#E07856">每 4 层逐元素相加注入视觉嵌入</text>
    <text x="220" y="408" text-anchor="middle" font-size="12" fill="#1E3A5F" font-style="italic">"主角长这样，别画歪"</text>
  </g>

  <!-- RIGHT: Text side -->
  <g>
    <rect x="420" y="90" width="320" height="350" rx="14" fill="#FDF4ED" stroke="#E07856" stroke-width="1.5"/>
    <text x="580" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">文本侧 · 词汇锚定</text>

    <!-- Selling points box -->
    <rect x="455" y="150" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="580" y="172" text-anchor="middle" font-size="11" fill="#3D4F65">卖点词库（指令模板硬约束）</text>
    <text x="580" y="200" text-anchor="middle" font-size="13" fill="#1E3A5F">钢带 · 机械 · 瑞士</text>
    <text x="580" y="222" text-anchor="middle" font-size="13" fill="#1E3A5F">征服者潜水系列</text>
    <text x="580" y="248" text-anchor="middle" font-size="10" fill="#E07856">文案只能从这里挑词</text>

    <!-- Lock icon -->
    <g transform="translate(550, 285)">
      <rect x="10" y="14" width="40" height="30" rx="4" fill="#E07856"/>
      <path d="M 18 14 V 6 a 12 12 0 0 1 24 0 V 14" fill="none" stroke="#1E3A5F" stroke-width="3"/>
      <circle cx="30" cy="29" r="3" fill="#FFFFFF"/>
    </g>

    <text x="580" y="365" text-anchor="middle" font-size="11" fill="#3D4F65">+ LLM 清洗：剔除推不出真实文案的脏样本</text>
    <text x="580" y="408" text-anchor="middle" font-size="12" fill="#1E3A5F" font-style="italic">"按卖点说话，别胡编"</text>
  </g>

  <!-- Bottom caption -->
  <text x="400" y="475" text-anchor="middle" font-size="13" fill="#1E3A5F">统一自回归模型 · 形态稳定 + 文案不跑题</text>
</svg>
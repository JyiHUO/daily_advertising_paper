<svg height="600" width="960" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">PBS：把目光从商品移到背景</text>
  <text x="400" y="65" text-anchor="middle" font-size="13" fill="#3D4F65">同一商品 · 不同背景</text>

  <defs>
    <marker id="arBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E07B5F"/>
    </marker>
  </defs>

  <!-- Left scene: pink background -->
  <rect x="60" y="110" width="200" height="200" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="2"/>
  <text x="160" y="135" text-anchor="middle" font-size="12" fill="#9D174D">粉色梦幻背景</text>
  <rect x="140" y="190" width="40" height="90" rx="6" fill="#4B8BDA" stroke="#1E3A5F" stroke-width="1.5"/>
  <rect x="148" y="178" width="24" height="14" rx="2" fill="#1E3A5F"/>

  <!-- Right scene: gold background -->
  <rect x="540" y="110" width="200" height="200" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
  <text x="640" y="135" text-anchor="middle" font-size="12" fill="#92400E">金色奢华背景</text>
  <rect x="620" y="190" width="40" height="90" rx="6" fill="#4B8BDA" stroke="#1E3A5F" stroke-width="1.5"/>
  <rect x="628" y="178" width="24" height="14" rx="2" fill="#1E3A5F"/>

  <!-- CLIP verdict box -->
  <rect x="320" y="160" width="160" height="80" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="400" y="185" text-anchor="middle" font-size="13" fill="#3D4F65">CLIP / DINOv3</text>
  <text x="400" y="213" text-anchor="middle" font-size="20" font-weight="700" fill="#9CA3AF">≈ 0.95</text>
  <text x="400" y="231" text-anchor="middle" font-size="11" fill="#6B7280">分不出差别</text>

  <line x1="260" y1="200" x2="318" y2="200" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arBlue)"/>
  <line x1="540" y1="200" x2="482" y2="200" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arBlue)"/>

  <!-- PBS verdict box -->
  <rect x="320" y="380" width="160" height="80" rx="10" fill="#FFF7ED" stroke="#E07B5F" stroke-width="2"/>
  <text x="400" y="405" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">PBS（本文指标）</text>
  <text x="400" y="433" text-anchor="middle" font-size="20" font-weight="700" fill="#E07B5F">Δ 0.42</text>
  <text x="400" y="451" text-anchor="middle" font-size="11" fill="#6B7280">背景差异被看见</text>

  <line x1="160" y1="310" x2="330" y2="380" stroke="#E07B5F" stroke-width="2.5" marker-end="url(#arOrange)"/>
  <line x1="640" y1="310" x2="470" y2="380" stroke="#E07B5F" stroke-width="2.5" marker-end="url(#arOrange)"/>
</svg>
<svg height="500" width="800" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">粗到细的偏好理解</text>
  <text x="400" y="56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3D4F65">两层漏斗：先筛历史，再筛 token</text>

  <!-- Stage 1: messy history -->
  <g>
    <text x="100" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E3A5F" font-weight="bold">用户历史 M 条</text>
    <circle cx="60" cy="140" r="10" fill="#FBD38D"/>
    <circle cx="95" cy="135" r="10" fill="#4B8BDA"/>
    <circle cx="130" cy="148" r="10" fill="#CBD5E0"/>
    <circle cx="55" cy="180" r="10" fill="#4B8BDA"/>
    <circle cx="100" cy="190" r="10" fill="#FBD38D"/>
    <circle cx="140" cy="180" r="10" fill="#4B8BDA"/>
    <circle cx="75" cy="220" r="10" fill="#CBD5E0"/>
    <circle cx="115" cy="225" r="10" fill="#FBD38D"/>
    <circle cx="150" cy="215" r="10" fill="#4B8BDA"/>
    <text x="100" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">样本噪声 + 模态噪声</text>
  </g>

  <!-- Funnel 1: coarse -->
  <g>
    <polygon points="220,120 360,120 320,200 260,200" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="290" y="155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">粗筛</text>
    <text x="290" y="173" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">语义相似度 Top-N=10</text>
  </g>

  <!-- Mid: filtered items -->
  <g>
    <circle cx="420" cy="140" r="10" fill="#4B8BDA"/>
    <circle cx="455" cy="160" r="10" fill="#4B8BDA"/>
    <circle cx="420" cy="180" r="10" fill="#4B8BDA"/>
    <circle cx="455" cy="200" r="10" fill="#4B8BDA"/>
    <text x="438" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">同类历史</text>
  </g>

  <!-- Funnel 2: fine -->
  <g>
    <polygon points="510,120 650,120 615,200 545,200" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/>
    <text x="580" y="155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">细筛</text>
    <text x="580" y="173" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">token Top-K 保留 40%</text>
  </g>

  <!-- Output: style tokens -->
  <g>
    <rect x="690" y="125" width="95" height="35" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="737" y="148" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E3A5F">image-ph</text>
    <rect x="690" y="170" width="95" height="35" rx="6" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="737" y="193" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E3A5F">text-ph</text>
  </g>

  <!-- Arrows -->
  <line x1="170" y1="170" x2="216" y2="160" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="362" y1="160" x2="405" y2="160" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="473" y1="165" x2="506" y2="160" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="652" y1="160" x2="688" y2="160" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Bottom: instruction template -->
  <g>
    <rect x="220" y="370" width="360" height="70" rx="10" fill="#1E3A5F"/>
    <text x="400" y="398" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FBD38D">指令模板</text>
    <text x="400" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#EFF6FF">"为他生成 [image-ph] 风格的 [text-ph] 广告"</text>
  </g>

  <!-- arrow from output to template -->
  <path d="M 737 210 Q 737 330 582 400" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <text x="400" y="468" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">个体级风格描述符 → 驱动图文联合生成</text>
</svg>
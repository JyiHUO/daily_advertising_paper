<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,sans-serif">
  <rect width="600" height="420" fill="#FAFBFC"/>
  
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>
  
  <text x="300" y="36" text-anchor="middle" font-size="17" font-weight="600" fill="#1E3A5F">一句话续写：文案与图像同源</text>
  
  <!-- 输入 prompt -->
  <rect x="30" y="180" width="130" height="70" rx="10" fill="#FFF4E6" stroke="#E8A857" stroke-width="1.5"/>
  <text x="95" y="210" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">商品 + 卖点</text>
  <text x="95" y="230" text-anchor="middle" font-size="11" fill="#3D4F65">指令 prompt</text>
  
  <!-- 中央：统一自回归 -->
  <rect x="195" y="185" width="210" height="60" rx="30" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="300" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">单一自回归模型</text>
  <text x="300" y="229" text-anchor="middle" font-size="11" fill="#3D4F65">next-token 续写</text>
  
  <!-- 输入箭头 -->
  <line x1="160" y1="215" x2="192" y2="215" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  
  <!-- text 段 -->
  <rect x="445" y="125" width="130" height="60" rx="8" fill="#E8F0FE" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="510" y="150" text-anchor="middle" font-size="11" fill="#4B8BDA" font-family="monospace">&lt;text&gt; ... &lt;/text&gt;</text>
  <text x="510" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">广告文案 tokens</text>
  
  <!-- image 段 -->
  <rect x="445" y="245" width="130" height="60" rx="8" fill="#FDEEEC" stroke="#D97757" stroke-width="1.5"/>
  <text x="510" y="270" text-anchor="middle" font-size="11" fill="#D97757" font-family="monospace">&lt;image&gt; ... &lt;/image&gt;</text>
  <text x="510" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">广告图像 tokens</text>
  
  <!-- 同一序列的连接线 -->
  <path d="M 405 208 Q 425 208 425 155 L 443 155" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 405 222 Q 425 222 425 275 L 443 275" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  
  <!-- 同源标注 -->
  <line x1="430" y1="185" x2="430" y2="245" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="422" y="218" text-anchor="end" font-size="10" fill="#1E3A5F" font-style="italic">同一次解码</text>
  
  <!-- 底部对比注释 -->
  <text x="300" y="360" text-anchor="middle" font-size="12" fill="#3D4F65">不再是 LLM 写文案 + T2I 画图 各干各的</text>
  <text x="300" y="382" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">图文风格天然一致</text>
</svg>
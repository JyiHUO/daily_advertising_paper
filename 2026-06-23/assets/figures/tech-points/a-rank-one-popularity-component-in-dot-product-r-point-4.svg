<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <!-- Title -->
  <text x="300" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E3A5F">精度 — 覆盖 的可调权衡</text>
  <text x="300" y="60" text-anchor="middle" font-size="12" fill="#3D4F65">推断时用 β 把流行度按需加回</text>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Fulcrum -->
  <polygon points="300,330 280,370 320,370" fill="#1E3A5F"/>
  <line x1="240" y1="370" x2="360" y2="370" stroke="#1E3A5F" stroke-width="2"/>

  <!-- Beam, tilted slightly -->
  <g transform="rotate(-6 300 230)">
    <line x1="100" y1="230" x2="500" y2="230" stroke="#1E3A5F" stroke-width="4" stroke-linecap="round"/>
    <line x1="300" y1="230" x2="300" y2="330" stroke="#1E3A5F" stroke-width="3"/>

    <!-- Left pan: β=0 -->
    <line x1="100" y1="230" x2="100" y2="180" stroke="#4B8BDA" stroke-width="1.5"/>
    <rect x="35" y="128" width="130" height="62" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="100" y="154" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">β = 0</text>
    <text x="100" y="175" text-anchor="middle" font-size="11" fill="#3D4F65">纯 PMI · 覆盖高</text>

    <!-- Right pan: β=1 -->
    <line x1="500" y1="230" x2="500" y2="180" stroke="#D97757" stroke-width="1.5"/>
    <rect x="435" y="128" width="130" height="62" rx="8" fill="#FDF1EC" stroke="#D97757" stroke-width="1.8"/>
    <text x="500" y="154" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">β = 1</text>
    <text x="500" y="175" text-anchor="middle" font-size="11" fill="#3D4F65">还原流行度 · NLL 好</text>
  </g>

  <!-- Slider arrow at bottom -->
  <text x="300" y="388" text-anchor="middle" font-size="11" fill="#3D4F65">推断时一个旋钮 β ∈ [0, 1]</text>
  <line x1="170" y1="400" x2="430" y2="400" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah2)"/>

  <!-- Side labels -->
  <text x="100" y="415" text-anchor="middle" font-size="10" fill="#3D4F65">长尾 / novelty</text>
  <text x="500" y="415" text-anchor="middle" font-size="10" fill="#3D4F65">业务指标</text>
</svg>
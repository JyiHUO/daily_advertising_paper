<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="38" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">谱坍缩 = 热门偏置</text>
  <text x="400" y="62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">一个奇异值方向吞噬了所有推荐</text>

  <!-- Left: healthy spectrum -->
  <g>
    <text x="187" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">浅层模型 (2层)</text>
    <text x="187" y="128" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">多方向均衡，长尾可见</text>

    <rect x="90"  y="290" width="30" height="80"  fill="#4B8BDA" opacity="0.85"/>
    <rect x="130" y="300" width="30" height="70"  fill="#4B8BDA" opacity="0.7"/>
    <rect x="170" y="312" width="30" height="58"  fill="#4B8BDA" opacity="0.55"/>
    <rect x="210" y="322" width="30" height="48"  fill="#4B8BDA" opacity="0.4"/>
    <rect x="250" y="332" width="30" height="38"  fill="#4B8BDA" opacity="0.3"/>
    <line x1="80" y1="370" x2="295" y2="370" stroke="#1E3A5F" stroke-width="1.2"/>
    <text x="187" y="395" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">奇异值谱</text>
    <text x="187" y="425" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1E3A5F">σ₁能量占比 ≈ 70%</text>
  </g>

  <!-- middle arrow -->
  <text x="400" y="240" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">层数加深</text>
  <line x1="320" y1="255" x2="480" y2="255" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="400" y="278" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">SASRec++ 2层 → 8层</text>

  <!-- Right: collapsed spectrum -->
  <g>
    <text x="620" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#C2410C">深层模型 (8层)</text>
    <text x="620" y="128" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">谱坍缩：σ₁独大</text>

    <rect x="530" y="150" width="30" height="220" fill="#E07B4A"/>
    <rect x="570" y="358" width="30" height="12" fill="#4B8BDA" opacity="0.4"/>
    <rect x="610" y="362" width="30" height="8"  fill="#4B8BDA" opacity="0.3"/>
    <rect x="650" y="364" width="30" height="6"  fill="#4B8BDA" opacity="0.25"/>
    <rect x="690" y="365" width="30" height="5"  fill="#4B8BDA" opacity="0.2"/>
    <line x1="520" y1="370" x2="735" y2="370" stroke="#1E3A5F" stroke-width="1.2"/>

    <text x="545" y="143" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#C2410C">99.9%</text>
    <text x="627" y="395" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">奇异值谱</text>
    <text x="627" y="425" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#C2410C">长尾曝光 0.23 → 0.18</text>
  </g>

  <text x="400" y="475" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1E3A5F" font-style="italic">最大奇异值方向 ≈ 物品流行度向量</text>
</svg>
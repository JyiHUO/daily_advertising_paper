<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">解码 SID 前，先在心里"想"几步</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">类目引导的潜在意图推理（不输出文字，只走隐向量）</text>

  <!-- Query bubble -->
  <rect x="30" y="185" width="150" height="70" rx="35" fill="#FFF4E6" stroke="#E89B4C" stroke-width="2"/>
  <text x="105" y="215" text-anchor="middle" font-size="12" fill="#1E3A5F">查询</text>
  <text x="105" y="236" text-anchor="middle" font-size="11" fill="#3D4F65">"MacBook 保护壳"</text>

  <!-- Thought cloud -->
  <ellipse cx="400" cy="220" rx="190" ry="80" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="400" y="155" text-anchor="middle" font-size="12" fill="#4B8BDA" font-style="italic">潜在思考（不出声）</text>

  <!-- Latent steps h1..hL -->
  <circle cx="295" cy="220" r="22" fill="#DCEAFB" stroke="#4B8BDA"/>
  <text x="295" y="224" text-anchor="middle" font-size="12" fill="#1E3A5F">h₁ · 电子</text>

  <circle cx="400" cy="220" r="22" fill="#C5DCF6" stroke="#4B8BDA"/>
  <text x="400" y="224" text-anchor="middle" font-size="12" fill="#1E3A5F">h₂ · 电脑</text>

  <circle cx="505" cy="220" r="22" fill="#A8CDF1" stroke="#4B8BDA"/>
  <text x="505" y="224" text-anchor="middle" font-size="12" fill="#1E3A5F">h_L · 壳</text>

  <!-- Inner arrows -->
  <path d="M 317 220 L 378 220" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M 422 220 L 483 220" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#a)"/>

  <!-- Query to cloud -->
  <path d="M 180 220 L 208 220" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- Cloud to SID -->
  <path d="M 590 220 L 618 220" stroke="#4B8BDA" stroke-width="2.2" fill="none" marker-end="url(#a)"/>

  <!-- SID output -->
  <rect x="620" y="185" width="155" height="70" rx="10" fill="#E8F3EC" stroke="#4A9B6E" stroke-width="2"/>
  <text x="697" y="212" text-anchor="middle" font-size="12" fill="#1E3A5F">SID 解码</text>
  <text x="697" y="238" text-anchor="middle" font-size="12" fill="#2E6B4A" font-family="monospace">⟨a₁⟩⟨b₂⟩⟨c₃⟩⟨d₄⟩</text>

  <!-- Bottom contrast -->
  <line x1="180" y1="370" x2="620" y2="370" stroke="#CBD5E0" stroke-width="1"/>
  <text x="400" y="398" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">对比显式 CoT：免去逐 token 文字生成开销</text>

  <text x="260" y="432" text-anchor="middle" font-size="12" fill="#B0524C">显式 CoT：说出每个字，慢</text>
  <text x="540" y="432" text-anchor="middle" font-size="12" fill="#2E6B4A">潜在推理：心里想，快</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Helvetica, Arial, sans-serif">
  <!-- Title -->
  <text x="360" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">主播身份证 + 直播间实时脉搏</text>
  <text x="360" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">Static SID 长期画像 ＋ Dynamic SID 实时状态</text>

  <!-- Static SID: ID card -->
  <g>
    <rect x="80" y="120" width="220" height="150" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="190" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">静态 SID · 身份证</text>
    <!-- avatar -->
    <circle cx="120" cy="200" r="22" fill="#C9DCF5" stroke="#4B8BDA" stroke-width="1.5"/>
    <circle cx="120" cy="193" r="7" fill="#4B8BDA"/>
    <path d="M104 215 Q120 202 136 215" fill="none" stroke="#4B8BDA" stroke-width="2"/>
    <!-- text -->
    <text x="160" y="198" font-size="13" fill="#3D4F65">主播长期画像</text>
    <text x="160" y="248" font-size="12" font-family="monospace" fill="#1E3A5F">(1512, 646, 631)</text>
    <!-- lock icon -->
    <rect x="270" y="138" width="18" height="14" rx="2" fill="#B89968"/>
    <path d="M274 138 v-5 a5 5 0 0 1 10 0 v5" fill="none" stroke="#B89968" stroke-width="2"/>
  </g>

  <!-- Dynamic SID: pulse -->
  <g>
    <rect x="420" y="120" width="220" height="150" rx="10" fill="#FFF3E6" stroke="#E89B4A" stroke-width="2"/>
    <text x="530" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">动态 SID · 实时脉搏</text>
    <!-- heartbeat -->
    <polyline points="438,205 458,205 466,185 476,225 486,195 496,210 516,210"
              fill="none" stroke="#E89B4A" stroke-width="2.5"/>
    <text x="565" y="198" text-anchor="middle" font-size="13" fill="#3D4F65">观看热度 / 即时切片</text>
    <text x="530" y="248" text-anchor="middle" font-size="11" font-family="monospace" fill="#1E3A5F">(111,1559) → (111,1194)</text>
  </g>

  <!-- merge arrows: end on top edge of merged box (y=365) -->
  <path d="M250 285 Q300 330 340 360" fill="none" stroke="#4B8BDA" stroke-width="2.2"/>
  <polygon points="333,353 343,363 335,366" fill="#4B8BDA"/>
  <path d="M470 285 Q420 330 380 360" fill="none" stroke="#E89B4A" stroke-width="2.2"/>
  <polygon points="385,353 375,363 383,366" fill="#E89B4A"/>

  <!-- merged room -->
  <rect x="260" y="365" width="200" height="80" rx="10" fill="#1E3A5F"/>
  <text x="360" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">完整刻画直播间</text>
  <text x="360" y="418" text-anchor="middle" font-size="12" fill="#C9DCF5">是谁 ＋ 此刻在干嘛</text>
  <text x="360" y="436" text-anchor="middle" font-size="11" fill="#9FBDE0">EMA 在线更新码本</text>
</svg>
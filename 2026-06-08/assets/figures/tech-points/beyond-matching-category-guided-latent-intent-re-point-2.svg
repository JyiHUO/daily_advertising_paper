<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="Helvetica, Arial, sans-serif">
  <rect width="600" height="480" fill="#FBF8F3"/>
  
  <text x="300" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E3A5F">HSR 逐层对齐 + QRE 多正例对比</text>
  
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>
  
  <!-- Query node -->
  <circle cx="70" cy="240" r="40" fill="#FFE8D6" stroke="#D97757" stroke-width="2"/>
  <text x="70" y="237" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="bold">查询 q</text>
  <text x="70" y="254" text-anchor="middle" font-size="10" fill="#3D4F65">跑步鞋 男</text>
  
  <!-- Hierarchical levels (HSR) -->
  <rect x="200" y="85" width="140" height="56" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="270" y="108" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="bold">L1 鞋类（粗）</text>
  <text x="270" y="126" text-anchor="middle" font-size="10" fill="#3D4F65">h₁ → 第1层分类器</text>
  
  <rect x="200" y="212" width="140" height="56" rx="6" fill="#DCEBFB" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="270" y="235" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="bold">L2 运动鞋</text>
  <text x="270" y="253" text-anchor="middle" font-size="10" fill="#3D4F65">父类 mask 约束子类</text>
  
  <rect x="200" y="339" width="140" height="56" rx="6" fill="#C8DEF7" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="270" y="362" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="bold">L3 叶子类目（细）</text>
  <text x="270" y="380" text-anchor="middle" font-size="10" fill="#3D4F65">h₃ → 多正例对比</text>
  
  <!-- HSR arrows from query to each level -->
  <line x1="108" y1="220" x2="198" y2="120" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="110" y1="240" x2="198" y2="240" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="108" y1="260" x2="198" y2="365" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <text x="120" y="170" font-size="11" fill="#4B8BDA" font-weight="bold">HSR</text>
  <text x="120" y="184" font-size="9" fill="#3D4F65">逐层对齐 L_cls</text>
  
  <!-- Multi-positive targets on the right -->
  <circle cx="470" cy="270" r="28" fill="#FFE8D6" stroke="#D97757" stroke-width="2"/>
  <text x="470" y="268" text-anchor="middle" font-size="10" fill="#1E3A5F">慢跑鞋</text>
  <text x="470" y="282" text-anchor="middle" font-size="9" fill="#D97757">正例原型</text>
  
  <circle cx="500" cy="367" r="28" fill="#FFE8D6" stroke="#D97757" stroke-width="2"/>
  <text x="500" y="365" text-anchor="middle" font-size="10" fill="#1E3A5F">训练鞋</text>
  <text x="500" y="379" text-anchor="middle" font-size="9" fill="#D97757">正例原型</text>
  
  <circle cx="465" cy="440" r="24" fill="#F0F0F0" stroke="#999" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="465" y="438" text-anchor="middle" font-size="10" fill="#888">女鞋</text>
  <text x="465" y="452" text-anchor="middle" font-size="9" fill="#888">负例（推开）</text>
  
  <!-- QRE pull arrows from L3 to multi-positives -->
  <line x1="340" y1="358" x2="442" y2="272" stroke="#D97757" stroke-width="1.8" marker-end="url(#arrO)"/>
  <line x1="340" y1="372" x2="472" y2="365" stroke="#D97757" stroke-width="1.8" marker-end="url(#arrO)"/>
  <line x1="340" y1="385" x2="442" y2="435" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3"/>
  
  <text x="370" y="320" font-size="11" fill="#D97757" font-weight="bold">QRE</text>
  <text x="370" y="334" font-size="9" fill="#3D4F65">多正例 InfoNCE L_con</text>
  
  <!-- Total loss -->
  <rect x="180" y="430" width="240" height="34" rx="6" fill="#FFF" stroke="#1E3A5F" stroke-width="1.2"/>
  <text x="300" y="452" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="bold">L_total = L_gen + α·L_cls + β·L_con</text>
</svg>
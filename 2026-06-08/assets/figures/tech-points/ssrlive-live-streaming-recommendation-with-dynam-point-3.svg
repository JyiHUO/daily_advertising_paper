<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">把生成开销藏进 IO 等待</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">用户侧只依赖用户 — 可与候选数据准备并行</text>

  <!-- Timeline axis -->
  <line x1="80" y1="430" x2="720" y2="430" stroke="#3D4F65" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="730" y="434" font-size="12" fill="#3D4F65">time</text>

  <!-- Naive serial -->
  <text x="80" y="125" font-size="13" font-weight="700" fill="#1E3A5F">原始串行</text>
  <rect x="80" y="140" width="180" height="46" rx="6" fill="#FFF1E0" stroke="#E89A4A" stroke-width="1.5"/>
  <text x="170" y="168" text-anchor="middle" font-size="13" fill="#1E3A5F">候选数据 IO</text>
  <rect x="260" y="140" width="220" height="46" rx="6" fill="#FFE1C2" stroke="#E89A4A" stroke-width="1.5"/>
  <text x="370" y="168" text-anchor="middle" font-size="13" fill="#1E3A5F">用户生成式前向</text>
  <rect x="480" y="140" width="140" height="46" rx="6" fill="#FFF1E0" stroke="#E89A4A" stroke-width="1.5"/>
  <text x="550" y="168" text-anchor="middle" font-size="13" fill="#1E3A5F">交互 + MLP</text>
  <text x="660" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#C9610F">+4.41%</text>

  <!-- Partial Run parallel -->
  <text x="80" y="255" font-size="13" font-weight="700" fill="#1E3A5F">Partial Run</text>

  <rect x="80" y="270" width="180" height="46" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="170" y="298" text-anchor="middle" font-size="13" fill="#1E3A5F">候选数据 IO</text>

  <rect x="80" y="326" width="220" height="46" rx="6" fill="#DCEBFB" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="190" y="354" text-anchor="middle" font-size="13" fill="#1E3A5F">用户生成式前向（提前）</text>

  <rect x="300" y="270" width="180" height="46" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="390" y="298" text-anchor="middle" font-size="13" fill="#1E3A5F">Beam 融合</text>

  <rect x="480" y="270" width="140" height="46" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="550" y="298" text-anchor="middle" font-size="13" fill="#1E3A5F">交互 + MLP</text>
  <text x="660" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">+1.33%</text>

  <!-- bracket showing overlap -->
  <path d="M80,388 L80,398 L300,398 L300,388" fill="none" stroke="#4B8BDA" stroke-width="1.3"/>
  <text x="190" y="414" text-anchor="middle" font-size="12" fill="#4B8BDA" font-style="italic">并行重叠 · 开销被隐藏</text>

  <!-- subtle key label -->
  <text x="400" y="475" text-anchor="middle" font-size="12" fill="#3D4F65">用户隐状态独立于候选 → 可在候选准备完成前先跑</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E08B4A"/>
    </marker>
  </defs>

  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">同一个 Mixer，两种粒度的 argmax</text>
  <text x="360" y="60" text-anchor="middle" font-size="13" fill="#3D4F65">召回 = token 空间搜索；排序 = 物品空间打分</text>

  <!-- Central shared Mixer -->
  <rect x="295" y="195" width="130" height="70" rx="10" fill="#FFE8D6" stroke="#E08B4A" stroke-width="2"/>
  <text x="360" y="225" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">同一 Mixer</text>
  <text x="360" y="247" text-anchor="middle" font-size="12" fill="#3D4F65">共享参数</text>

  <!-- Left: token-level beam search (recall) -->
  <rect x="40" y="120" width="200" height="220" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="140" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">召回：token 空间</text>

  <!-- beam tree mini -->
  <circle cx="140" cy="170" r="6" fill="#4B8BDA"/>
  <line x1="140" y1="176" x2="95" y2="205" stroke="#4B8BDA" stroke-width="1.2"/>
  <line x1="140" y1="176" x2="140" y2="205" stroke="#4B8BDA" stroke-width="1.2"/>
  <line x1="140" y1="176" x2="185" y2="205" stroke="#4B8BDA" stroke-width="1.2"/>
  <circle cx="95" cy="210" r="5" fill="#4B8BDA"/>
  <circle cx="140" cy="210" r="5" fill="#4B8BDA"/>
  <circle cx="185" cy="210" r="5" fill="#4B8BDA"/>
  <line x1="95" y1="215" x2="80" y2="240" stroke="#4B8BDA" stroke-width="1.2"/>
  <line x1="140" y1="215" x2="140" y2="240" stroke="#4B8BDA" stroke-width="1.2"/>
  <line x1="185" y1="215" x2="200" y2="240" stroke="#4B8BDA" stroke-width="1.2"/>
  <circle cx="80" cy="245" r="4" fill="#4B8BDA"/>
  <circle cx="140" cy="245" r="4" fill="#4B8BDA"/>
  <circle cx="200" cy="245" r="4" fill="#4B8BDA"/>
  <text x="140" y="270" text-anchor="middle" font-size="10" fill="#3D4F65">L=4 层，每层 256 → top-B</text>

  <rect x="70" y="288" width="140" height="34" rx="4" fill="#FFFFFF" stroke="#4B8BDA" stroke-dasharray="3,2"/>
  <text x="140" y="302" text-anchor="middle" font-size="11" fill="#3D4F65">SID 路径 → 倒排</text>
  <text x="140" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">候选物品集</text>

  <!-- Right: item-level ranking -->
  <rect x="480" y="120" width="200" height="220" rx="10" fill="#FFF4E6" stroke="#E08B4A" stroke-width="1.5"/>
  <text x="580" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">排序：物品空间</text>

  <!-- items -->
  <g font-size="11" fill="#1E3A5F">
    <rect x="510" y="170" width="140" height="22" rx="4" fill="#FFFFFF" stroke="#E08B4A"/>
    <text x="580" y="186" text-anchor="middle">item A · 真实 u2i</text>
    <rect x="510" y="200" width="140" height="22" rx="4" fill="#FFFFFF" stroke="#E08B4A"/>
    <text x="580" y="216" text-anchor="middle">item B · 真实 u2i</text>
    <rect x="510" y="230" width="140" height="22" rx="4" fill="#FFFFFF" stroke="#E08B4A"/>
    <text x="580" y="246" text-anchor="middle">item C · 真实 u2i</text>
  </g>
  <rect x="510" y="288" width="140" height="34" rx="4" fill="#FFFFFF" stroke="#E08B4A" stroke-dasharray="3,2"/>
  <text x="580" y="302" text-anchor="middle" font-size="11" fill="#3D4F65">精排 top-N</text>
  <text x="580" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">最终结果</text>

  <!-- Arrows from Mixer to both sides -->
  <path d="M295,225 L245,225" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M425,235 L480,235" stroke="#E08B4A" stroke-width="2" fill="none" marker-end="url(#b)"/>

  <!-- bridging arrow recall -> rank -->
  <path d="M210,305 Q360,400 510,305" stroke="#4B8BDA" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#a)"/>
  <text x="360" y="395" text-anchor="middle" font-size="11" fill="#3D4F65">候选交给排序，复用同一 Mixer</text>

  <text x="140" y="355" text-anchor="middle" font-size="10" fill="#6B7280">粒度：token 前缀</text>
  <text x="580" y="355" text-anchor="middle" font-size="10" fill="#6B7280">粒度：完整物品</text>
</svg>
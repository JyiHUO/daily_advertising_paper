<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E3A5F">EG-GRPO: 给策略梯度装一个保底正样本</text>

  <!-- Group container -->
  <rect x="40" y="60" width="520" height="250" rx="14" fill="#F7FAFC" stroke="#B8CADF" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="300" y="82" text-anchor="middle" font-size="12" fill="#3D4F65" font-style="italic">同一 group 内一起算 advantage</text>

  <!-- Policy samples (left) -->
  <g>
    <text x="160" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">策略采样 G 个</text>
    <circle cx="100" cy="170" r="20" fill="#FDECEC" stroke="#D97878"/>
    <text x="100" y="174" text-anchor="middle" font-size="13" fill="#A03A3A">0</text>
    <circle cx="160" cy="170" r="20" fill="#FDECEC" stroke="#D97878"/>
    <text x="160" y="174" text-anchor="middle" font-size="13" fill="#A03A3A">0</text>
    <circle cx="220" cy="170" r="20" fill="#FDECEC" stroke="#D97878"/>
    <text x="220" y="174" text-anchor="middle" font-size="13" fill="#A03A3A">0</text>
    <text x="160" y="220" text-anchor="middle" font-size="11" fill="#A03A3A">奖励几乎全 0，梯度方差大</text>
    <text x="160" y="236" text-anchor="middle" font-size="11" fill="#A03A3A">→ 模式坍缩</text>
  </g>

  <!-- Plus sign -->
  <text x="300" y="182" text-anchor="middle" font-size="32" fill="#4B8BDA" font-weight="bold">+</text>

  <!-- Expert samples (right) -->
  <g>
    <text x="440" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">专家样本 K 个 (K=2/4)</text>
    <text x="440" y="128" text-anchor="middle" font-size="11" fill="#3D4F65">来自真实点击/曝光 SID</text>
    <circle cx="410" cy="180" r="22" fill="#E8F2E4" stroke="#5A9B5E"/>
    <text x="410" y="184" text-anchor="middle" font-size="13" fill="#2F6B33" font-weight="bold">+1</text>
    <circle cx="470" cy="180" r="22" fill="#E8F2E4" stroke="#5A9B5E"/>
    <text x="470" y="184" text-anchor="middle" font-size="13" fill="#2F6B33" font-weight="bold">+1</text>
    <text x="440" y="226" text-anchor="middle" font-size="11" fill="#2F6B33">每组都有正样本兜底 → 梯度稳定</text>
  </g>

  <!-- Arrows to output -->
  <line x1="160" y1="270" x2="270" y2="335" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="440" y1="270" x2="330" y2="335" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="170" y="340" width="260" height="60" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="300" y="363" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">点击 ↑    曝光覆盖 ↑</text>
  <text x="300" y="385" text-anchor="middle" font-size="11" fill="#3D4F65">clk@1/clk@10/pvr@10 帕累托共同提升</text>
</svg>
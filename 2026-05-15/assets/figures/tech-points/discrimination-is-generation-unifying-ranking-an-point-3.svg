<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7B5EA7"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">召回时如何"借用"排序的个性化信号</text>
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#3D4F65">u2i 交叉特征 → token 级近似 (u2t)</text>

  <!-- Left: Training -->
  <g>
    <rect x="40" y="90" width="290" height="300" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="185" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">训练时 · 真实物品已知</text>

    <!-- Bucket -->
    <ellipse cx="185" cy="190" rx="95" ry="38" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="185" y="180" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">同一 token 桶</text>
    <circle cx="145" cy="205" r="6" fill="#E8A87C"/>
    <circle cx="170" cy="208" r="6" fill="#E8A87C"/>
    <circle cx="195" cy="205" r="6" fill="#E8A87C"/>
    <circle cx="220" cy="208" r="6" fill="#E8A87C"/>

    <!-- Avg arrow -->
    <line x1="185" y1="232" x2="185" y2="280" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a1)"/>
    <text x="218" y="260" font-size="11" fill="#3D4F65">平均 u2i</text>

    <!-- u2t result -->
    <rect x="115" y="285" width="140" height="50" rx="8" fill="#FFE8D6" stroke="#E8A87C" stroke-width="1.5"/>
    <text x="185" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">token 群体画像</text>
    <text x="185" y="324" text-anchor="middle" font-size="11" fill="#3D4F65">u2t (teacher)</text>

    <text x="185" y="365" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">奖励"u2i 相近的物品"同桶</text>
  </g>

  <!-- Right: Inference -->
  <g>
    <rect x="390" y="90" width="290" height="300" rx="12" fill="#F4ECFB" stroke="#7B5EA7" stroke-width="1.5"/>
    <text x="535" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">推理时 · 物品未知</text>

    <!-- Inputs -->
    <rect x="410" y="140" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.2"/>
    <text x="460" y="163" text-anchor="middle" font-size="11" fill="#1E3A5F">用户 emb</text>

    <rect x="560" y="140" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.2"/>
    <text x="610" y="163" text-anchor="middle" font-size="11" fill="#1E3A5F">SID 前缀</text>

    <!-- arrows to MLP -->
    <line x1="475" y1="176" x2="510" y2="218" stroke="#7B5EA7" stroke-width="2" marker-end="url(#a2)"/>
    <line x1="595" y1="176" x2="560" y2="218" stroke="#7B5EA7" stroke-width="2" marker-end="url(#a2)"/>

    <!-- MLP -->
    <rect x="475" y="222" width="120" height="46" rx="8" fill="#7B5EA7"/>
    <text x="535" y="243" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">MLPu2t</text>
    <text x="535" y="259" text-anchor="middle" font-size="10" fill="#FFFFFF">轻量预测器</text>

    <line x1="535" y1="268" x2="535" y2="292" stroke="#7B5EA7" stroke-width="2" marker-end="url(#a2)"/>

    <!-- Output -->
    <rect x="465" y="297" width="140" height="50" rx="8" fill="#FFE8D6" stroke="#E8A87C" stroke-width="1.5"/>
    <text x="535" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">预测 u2t</text>
    <text x="535" y="336" text-anchor="middle" font-size="11" fill="#3D4F65">代替 u2i 打分</text>

    <text x="535" y="365" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">stop-grad 蒸馏</text>
  </g>

  <!-- Bridge: distillation from teacher (left u2t) to student (right MLP output) -->
  <path d="M 255 310 C 330 420, 410 420, 465 322" fill="none" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a1)"/>
  <text x="360" y="430" text-anchor="middle" font-size="11" fill="#4B8BDA" font-weight="600">蒸馏 (teacher → student)</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97B5C"/>
    </marker>
  </defs>

  <text x="400" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">门牌号 与 住户 解耦</text>
  <text x="400" y="66" text-anchor="middle" font-size="13" fill="#3D4F65">SID address ≠ SID embedding</text>

  <!-- Item -->
  <circle cx="110" cy="260" r="42" fill="#FFF1E6" stroke="#C97B5C" stroke-width="2"/>
  <text x="110" y="256" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">物品 v</text>
  <text x="110" y="275" text-anchor="middle" font-size="11" fill="#3D4F65">item</text>

  <!-- SID code (address) -->
  <rect x="290" y="120" width="220" height="100" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="400" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">门牌号 (寻址)</text>
  <text x="400" y="178" text-anchor="middle" font-size="15" fill="#3D4F65" font-family="monospace">(12, 87, 203, 45)</text>
  <text x="400" y="202" text-anchor="middle" font-size="11" fill="#7A8AA0">码本 c · 不可微 · EMA</text>

  <!-- SID embedding (resident) -->
  <rect x="290" y="300" width="220" height="100" rx="10" fill="#FFF1E6" stroke="#C97B5C" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">住户画像 (语义)</text>
  <text x="400" y="358" text-anchor="middle" font-size="13" fill="#3D4F65">e₁ + e₂ + e₃ + e₄</text>
  <text x="400" y="382" text-anchor="middle" font-size="11" fill="#7A8AA0">可学 embedding · 梯度直通</text>

  <!-- Branches -->
  <line x1="148" y1="238" x2="288" y2="178" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="148" y1="282" x2="288" y2="342" stroke="#C97B5C" stroke-width="2" marker-end="url(#arO)"/>

  <!-- Outputs -->
  <rect x="600" y="130" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="675" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">召回路由</text>
  <text x="675" y="186" text-anchor="middle" font-size="11" fill="#3D4F65">倒排 bucket · 版本稳定</text>

  <rect x="600" y="310" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#C97B5C" stroke-width="1.5"/>
  <text x="675" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">排序打分</text>
  <text x="675" y="366" text-anchor="middle" font-size="11" fill="#3D4F65">共享 MLP · 端到端可学</text>

  <line x1="510" y1="170" x2="598" y2="170" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="510" y1="350" x2="598" y2="350" stroke="#C97B5C" stroke-width="2" marker-end="url(#arO)"/>

  <!-- Bottom note -->
  <text x="400" y="455" text-anchor="middle" font-size="12" fill="#3D4F65">寻址用整数 · 打分用 embedding —— 互不打架</text>
</svg>
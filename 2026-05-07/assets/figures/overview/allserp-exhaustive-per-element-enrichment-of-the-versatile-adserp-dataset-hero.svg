<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFD"/>
      <stop offset="1" stop-color="#EAF1F8"/>
    </linearGradient>
    <linearGradient id="serp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5FA"/>
    </linearGradient>
    <linearGradient id="heatOrg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4B8BDA" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#4B8BDA" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="heatAd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E07A5F" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#E07A5F" stop-opacity="0.35"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A5F"/>
    </marker>
    <radialGradient id="gaze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2B84B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F2B84B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="56" font-size="26" font-weight="700" fill="#1E3A5F">AllSERP：把 AdSERP 从“广告框”细化到 13 类元素级行为</text>
  <text x="60" y="82" font-size="14" fill="#3D4F65">截图锚定 CV + HTML 解析 + X+Y 点击归因，让注视/点击/回视分析下沉到每个 SERP 元素</text>

  <!-- LEFT: before -->
  <g transform="translate(60,110)">
    <text x="0" y="0" font-size="15" font-weight="700" fill="#8A5A3B">BEFORE · AdSERP 原版</text>
    <text x="0" y="20" font-size="12" fill="#3D4F65">只有广告 bbox，84.5% 点击落在未标注区域</text>

    <rect x="0" y="34" width="360" height="520" rx="8" fill="url(#serp)" stroke="#C9D6E4"/>
    <rect x="16" y="48" width="260" height="22" rx="11" fill="#E8EEF5"/>
    <circle cx="268" cy="59" r="5" fill="#C9D6E4"/>

    <!-- ad labeled -->
    <rect x="16" y="86" width="280" height="64" rx="4" fill="#FFF2EC" stroke="#E07A5F" stroke-dasharray="4 3"/>
    <text x="24" y="104" font-size="11" font-weight="700" fill="#C15A3C">AD · labeled</text>
    <rect x="24" y="112" width="180" height="8" fill="#E5B8A8"/>
    <rect x="24" y="126" width="230" height="6" fill="#EED5C9"/>
    <rect x="24" y="136" width="210" height="6" fill="#EED5C9"/>

    <!-- organic unlabeled -->
    <g font-size="11" fill="#9AA7B5">
      <rect x="16" y="166" width="280" height="46" rx="3" fill="#F4F7FB" stroke="#D8E0EA" stroke-dasharray="2 3"/>
      <text x="24" y="192">? 未标注</text>
      <rect x="16" y="222" width="280" height="46" rx="3" fill="#F4F7FB" stroke="#D8E0EA" stroke-dasharray="2 3"/>
      <text x="24" y="248">? 未标注</text>
      <rect x="16" y="278" width="280" height="70" rx="3" fill="#F4F7FB" stroke="#D8E0EA" stroke-dasharray="2 3"/>
      <text x="24" y="316">? People-Also-Ask?</text>
      <rect x="16" y="358" width="280" height="46" rx="3" fill="#F4F7FB" stroke="#D8E0EA" stroke-dasharray="2 3"/>
      <text x="24" y="384">? 未标注</text>
      <rect x="16" y="414" width="280" height="58" rx="3" fill="#F4F7FB" stroke="#D8E0EA" stroke-dasharray="2 3"/>
      <text x="24" y="446">? Knowledge panel?</text>
      <rect x="16" y="482" width="280" height="46" rx="3" fill="#F4F7FB" stroke="#D8E0EA" stroke-dasharray="2 3"/>
      <text x="24" y="508">? 未标注</text>
    </g>

    <text x="180" y="580" text-anchor="middle" font-size="13" fill="#C15A3C" font-weight="700">仅 15.5% 点击可归因</text>
  </g>

  <!-- Middle pipeline -->
  <g transform="translate(450,140)">
    <text x="150" y="0" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">AllSERP 四阶段流水线</text>

    <g transform="translate(0,20)">
      <rect x="0" y="0" width="300" height="62" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#1E3A5F">Phase A · CV 切卡</text>
      <text x="14" y="40" font-size="11" fill="#3D4F65">截图逐行 std 投影 → 卡片横条</text>
      <text x="14" y="54" font-size="11" fill="#3D4F65">广告框优先保留，复合卡再细分</text>
    </g>
    <g transform="translate(0,100)">
      <rect x="0" y="0" width="300" height="62" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#1E3A5F">Phase B · HTML 8 层优先链</text>
      <text x="14" y="40" font-size="11" fill="#3D4F65">标题文本 → 类签名 → data-attrid</text>
      <text x="14" y="54" font-size="11" fill="#3D4F65">归为 13 种语义类型之一</text>
    </g>
    <g transform="translate(0,180)">
      <rect x="0" y="0" width="300" height="62" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#1E3A5F">Phase C · 顺序绑定位置</text>
      <text x="14" y="40" font-size="11" fill="#3D4F65">主轴卡片位置 0..N，右栏/页脚 = −1</text>
      <text x="14" y="54" font-size="11" fill="#3D4F65">与原广告框 38,250 次判定 0 冲突</text>
    </g>
    <g transform="translate(0,260)">
      <rect x="0" y="0" width="300" height="62" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#1E3A5F">Phase D · typed_gapfill</text>
      <text x="14" y="40" font-size="11" fill="#3D4F65">相邻 organic 向中点延伸，填满主列</text>
      <text x="14" y="54" font-size="11" fill="#3D4F65">遇广告/widget 截断，不越界</text>
    </g>

    <g transform="translate(0,350)">
      <rect x="0" y="0" width="300" height="78" rx="8" fill="#FFF7E8" stroke="#E3A63D"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#8A5A1C">X + Y 点击归因</text>
      <text x="14" y="40" font-size="11" fill="#3D4F65">X 约束剔除右栏误判（±5/±10 容差）</text>
      <text x="14" y="55" font-size="11" fill="#3D4F65">91.7% 归因 · 231 次试验级标记</text>
      <text x="14" y="70" font-size="11" fill="#3D4F65">dd-right 67 · chrome 91 · bad 73</text>
    </g>

    <g stroke="#4B8BDA" stroke-width="1.6" fill="none" marker-end="url(#arr)">
      <line x1="150" y1="82" x2="150" y2="98"/>
      <line x1="150" y1="162" x2="150" y2="178"/>
      <line x1="150" y1="242" x2="150" y2="258"/>
      <line x1="150" y1="322" x2="150" y2="348"/>
    </g>
  </g>

  <!-- RIGHT: after -->
  <g transform="translate(780,110)">
    <text x="0" y="0" font-size="15" font-weight="700" fill="#1E3A5F">AFTER · AllSERP 富化</text>
    <text x="0" y="20" font-size="12" fill="#3D4F65">每个元素都有类型 + 像素 bbox + 行为指标</text>

    <rect x="0" y="34" width="360" height="520" rx="8" fill="url(#serp)" stroke="#C9D6E4"/>
    <rect x="16" y="48" width="260" height="22" rx="11" fill="#E8EEF5"/>
    <circle cx="268" cy="59" r="5" fill="#C9D6E4"/>

    <rect x="16" y="86" width="280" height="64" rx="4" fill="url(#heatAd)" stroke="#E07A5F"/>
    <text x="24" y="104" font-size="11" font-weight="700" fill="#C15A3C">dd-top · pos 0</text>
    <text x="288" y="104" font-size="10" text-anchor="end" fill="#C15A3C">注视 99.7% / 点击 9.6%</text>
    <circle cx="90" cy="128" r="30" fill="url(#gaze)"/>

    <rect x="16" y="158" width="280" height="48" rx="4" fill="url(#heatOrg)" stroke="#4B8BDA"/>
    <text x="24" y="176" font-size="11" font-weight="700" fill="#1E3A5F">organic · pos 1</text>
    <text x="288" y="176" font-size="10" text-anchor="end" fill="#1E3A5F">点击份额 高</text>
    <circle cx="220" cy="192" r="4" fill="#1E3A5F"/>
    <text x="230" y="196" font-size="10" fill="#1E3A5F">click</text>

    <rect x="16" y="214" width="280" height="48" rx="4" fill="url(#heatOrg)" stroke="#4B8BDA"/>
    <text x="24" y="232" font-size="11" font-weight="700" fill="#1E3A5F">organic · pos 2</text>

    <rect x="16" y="270" width="280" height="56" rx="4" fill="#F1ECFA" stroke="#8F7AB8"/>
    <text x="24" y="288" font-size="11" font-weight="700" fill="#5E4A8C">paa · pos 3</text>
    <text x="288" y="288" font-size="10" text-anchor="end" fill="#5E4A8C">注视 48% / 点击 &lt;2%</text>

    <rect x="16" y="334" width="280" height="56" rx="4" fill="#E8F4EE" stroke="#5FA37A"/>
    <text x="24" y="352" font-size="11" font-weight="700" fill="#2F6B4A">knowledge-panel</text>
    <text x="288" y="352" font-size="10" text-anchor="end" fill="#2F6B4A">扫一眼就走</text>

    <rect x="16" y="398" width="280" height="48" rx="4" fill="url(#heatAd)" stroke="#E07A5F"/>
    <text x="24" y="416" font-size="11" font-weight="700" fill="#C15A3C">native-ad</text>
    <text x="288" y="416" font-size="10" text-anchor="end" fill="#C15A3C">注视 36% / 点击 5.9%</text>

    <rect x="16" y="454" width="280" height="48" rx="4" fill="url(#heatOrg)" stroke="#4B8BDA"/>
    <text x="24" y="472" font-size="11" font-weight="700" fill="#1E3A5F">organic · pos 5</text>

    <rect x="16" y="510" width="280" height="30" rx="3" fill="#F4F7FB" stroke="#4B8BDA" stroke-dasharray="3 3"/>
    <text x="156" y="529" font-size="10" text-anchor="middle" fill="#4B8BDA">typed_gapfill · 间隙按中点劈分</text>

    <text x="180" y="580" text-anchor="middle" font-size="13" font-weight="700" fill="#2F6B4A">91.7% 点击可归因 · 13 类元素</text>
  </g>

  <!-- arrows between columns -->
  <g fill="none" stroke="#1E3A5F" stroke-width="1.6" marker-end="url(#arrDark)">
    <path d="M425,380 L448,380"/>
    <path d="M752,380 L776,380"/>
  </g>
  <text x="436" y="372" font-size="10" fill="#1E3A5F">输入</text>
  <text x="756" y="372" font-size="10" fill="#1E3A5F">输出</text>

  <!-- Bottom insight bar -->
  <g transform="translate(60,680)">
    <rect x="0" y="0" width="1080" height="56" rx="8" fill="#1E3A5F"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#F2B84B">核心洞察</text>
    <text x="20" y="44" font-size="12" fill="#EAF1F8">注视率 ≠ 点击率：dd-top 几乎人人看但只拿 9.6% 点击 · organic 才是 79.1% 点击主力 · knowledge-panel / paa 属"扫一眼就走"——位置价值需按元素类型重估。</text>
  </g>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8804A"/>
    </marker>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE9D6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE9D6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="620" fill="#FAFBFD"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">Graph-GRPO：把整链奖励拆到推理图的每个节点</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#3D4F65">电商搜索相关性 · 依赖图上的 credit assignment</text>

  <!-- LEFT: old GRPO -->
  <g>
    <text x="170" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#8A8A8A">原 GRPO：整条链一个分数</text>
    <rect x="60" y="128" width="220" height="170" rx="10" fill="#F2F3F5" stroke="#C9CED6"/>
    <text x="170" y="150" text-anchor="middle" font-size="12" fill="#6B7280">CoT reasoning chain</text>
    <g font-size="11" fill="#6B7280">
      <rect x="78" y="162" width="184" height="22" rx="4" fill="#E5E7EB"/>
      <text x="170" y="178" text-anchor="middle">query 主体 / 属性 …</text>
      <rect x="78" y="190" width="184" height="22" rx="4" fill="#E5E7EB"/>
      <text x="170" y="206" text-anchor="middle">商品 主体 / 属性 …</text>
      <rect x="78" y="218" width="184" height="22" rx="4" fill="#E5E7EB"/>
      <text x="170" y="234" text-anchor="middle">主体匹配 / 属性匹配</text>
      <rect x="78" y="246" width="184" height="22" rx="4" fill="#E5E7EB"/>
      <text x="170" y="262" text-anchor="middle">最终标签</text>
    </g>
    <text x="170" y="288" text-anchor="middle" font-size="11" fill="#9CA3AF">↓ 单一 outcome reward</text>
    <circle cx="170" cy="328" r="22" fill="#9CA3AF"/>
    <text x="170" y="333" text-anchor="middle" font-size="14" font-weight="700" fill="white">−1</text>
    <text x="170" y="372" text-anchor="middle" font-size="12" fill="#6B7280">所有 token 共享惩罚，分不清错在哪一步</text>
  </g>

  <!-- center transition arrow -->
  <path d="M295 230 Q 360 230 400 230" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="347" y="220" text-anchor="middle" font-size="11" fill="#4B8BDA">建图传播</text>

  <!-- RIGHT: dependency graph -->
  <g>
    <text x="640" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Graph-GRPO：依赖图上分锅</text>
    <ellipse cx="640" cy="285" rx="240" ry="170" fill="url(#halo)"/>

    <!-- Final label node (top) -->
    <circle cx="640" cy="170" r="32" fill="#E8804A" stroke="#C25E2A" stroke-width="1.5"/>
    <text x="640" y="167" text-anchor="middle" font-size="11" font-weight="700" fill="white">最终标签</text>
    <text x="640" y="183" text-anchor="middle" font-size="11" font-weight="700" fill="white">−1</text>

    <!-- Match scores -->
    <circle cx="540" cy="280" r="30" fill="#FFD8BF" stroke="#E8804A" stroke-width="1.5"/>
    <text x="540" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#7A3A12">主体匹配</text>
    <text x="540" y="294" text-anchor="middle" font-size="11" fill="#7A3A12">+1</text>

    <circle cx="740" cy="280" r="30" fill="#FFB98A" stroke="#C25E2A" stroke-width="1.5"/>
    <text x="740" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#5C2A08">属性匹配</text>
    <text x="740" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#5C2A08">−1</text>

    <!-- decision edges (top to match) with weights -->
    <line x1="619" y1="194" x2="558" y2="258" stroke="#E8804A" stroke-width="2" marker-end="url(#arO)"/>
    <text x="563" y="228" font-size="10" fill="#C25E2A" font-weight="600">φ1 小</text>
    <line x1="661" y1="194" x2="722" y2="258" stroke="#E8804A" stroke-width="3.2" marker-end="url(#arO)"/>
    <text x="713" y="228" font-size="10" fill="#C25E2A" font-weight="700">φ2 大</text>

    <!-- Evidence nodes -->
    <g fill="#DCEBFB" stroke="#4B8BDA" stroke-width="1.3">
      <circle cx="470" cy="400" r="26"/>
      <circle cx="580" cy="420" r="26"/>
      <circle cx="700" cy="420" r="26"/>
      <circle cx="810" cy="400" r="26"/>
    </g>
    <g font-size="10" fill="#1E3A5F" text-anchor="middle">
      <text x="470" y="397">query</text><text x="470" y="409">主体</text>
      <text x="580" y="417">商品</text><text x="580" y="429">主体</text>
      <text x="700" y="417">query</text><text x="700" y="429">属性</text>
      <text x="810" y="397">商品</text><text x="810" y="409">属性</text>
    </g>

    <!-- evidence edges -->
    <line x1="522" y1="305" x2="481" y2="376" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="554" y1="307" x2="575" y2="395" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="726" y1="307" x2="705" y2="395" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#ar)"/>
    <line x1="758" y1="305" x2="799" y2="376" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#ar)"/>

    <!-- consistency edges (dashed) -->
    <path d="M494 416 Q 525 442 556 422" stroke="#9DB6CF" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/>
    <path d="M724 422 Q 755 442 786 416" stroke="#9DB6CF" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/>
    <text x="525" y="458" font-size="9" fill="#7A8FA6" text-anchor="middle">一致性边</text>
    <text x="755" y="458" font-size="9" fill="#7A8FA6" text-anchor="middle">一致性边</text>
  </g>

  <!-- Bottom strip -->
  <g>
    <line x1="60" y1="500" x2="840" y2="500" stroke="#D6DCE5" stroke-width="1"/>

    <g transform="translate(80,520)">
      <rect width="200" height="72" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1"/>
      <text x="100" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">节点级 credit</text>
      <text x="100" y="46" text-anchor="middle" font-size="10.5" fill="#3D4F65">每个 token 只为</text>
      <text x="100" y="61" text-anchor="middle" font-size="10.5" fill="#3D4F65">所属节点的对错负责</text>
    </g>

    <g transform="translate(310,520)">
      <rect width="280" height="72" rx="8" fill="#FFF3E8" stroke="#E8804A" stroke-width="1"/>
      <text x="140" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#7A3A12">主 loss 驱动的可学习 φ</text>
      <text x="140" y="46" text-anchor="middle" font-size="10.5" fill="#5C2A08">分锅比例随训练自适应</text>
      <text x="140" y="61" text-anchor="middle" font-size="10.5" fill="#5C2A08">主体错压主体支，属性错压属性支</text>
    </g>

    <g transform="translate(620,520)">
      <rect width="200" height="72" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1"/>
      <text x="100" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">线上验证</text>
      <text x="100" y="46" text-anchor="middle" font-size="10.5" fill="#3D4F65">京东 A/B：相关性 +</text>
      <text x="100" y="61" text-anchor="middle" font-size="10.5" fill="#3D4F65">关键互动指标 +</text>
    </g>
  </g>
</svg>
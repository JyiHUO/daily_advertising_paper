<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B6FA8"/>
    </marker>
  </defs>

  <text x="400" y="38" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">LP 基准：粗模型解可 lift 到细模型</text>
  <text x="400" y="62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">细化即细分 → 单调性自然成立</text>

  <!-- Coarse table -->
  <g>
    <text x="170" y="115" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">粗模型 簇 C</text>
    <rect x="80" y="135" width="180" height="180" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2" rx="6"/>
    <text x="170" y="232" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="42" font-weight="700" fill="#1E3A5F">0.6</text>
    <text x="170" y="262" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">x(A, C)</text>
  </g>

  <!-- Lift arrow -->
  <line x1="270" y1="225" x2="405" y2="225" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="337" y="215" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#C77B3A">lift 复制</text>

  <!-- Fine table: 3 sub-cells -->
  <g>
    <text x="560" y="115" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">细模型 子簇 C1, C2, C3</text>
    <rect x="410" y="135" width="100" height="180" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5" rx="4"/>
    <text x="460" y="232" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#1E3A5F">0.6</text>
    <rect x="510" y="135" width="100" height="180" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5" rx="4"/>
    <text x="560" y="232" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#1E3A5F">0.6</text>
    <rect x="610" y="135" width="100" height="180" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5" rx="4"/>
    <text x="660" y="232" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#1E3A5F">0.6</text>
    <text x="560" y="298" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">校准性 → 约束自动继承</text>
  </g>

  <!-- Bottom conclusion -->
  <rect x="140" y="370" width="240" height="70" fill="#FDF1E4" stroke="#C77B3A" stroke-width="1.5" rx="8"/>
  <text x="260" y="398" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">福利 ≥ 粗模型最优</text>
  <text x="260" y="420" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">单调性成立</text>

  <rect x="420" y="370" width="240" height="70" fill="#F4ECF7" stroke="#8B6FA8" stroke-width="1.5" rx="8"/>
  <text x="540" y="398" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">代价：需私有信息</text>
  <text x="540" y="420" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">非激励相容</text>

  <line x1="220" y1="320" x2="250" y2="365" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="560" y1="320" x2="540" y2="365" stroke="#8B6FA8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrP)"/>
</svg>
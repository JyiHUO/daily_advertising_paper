<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E89A52"/>
    </marker>
  </defs>

  <text x="300" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">把推理图压进一个 BERT：多头蒸馏 + 一致性</text>

  <!-- Shared encoder -->
  <rect x="180" y="58" width="240" height="56" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="300" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">共享 BERT 表征 (cross-encoder)</text>
  <text x="300" y="101" text-anchor="middle" font-size="11" fill="#3D4F65">学生模型，挂三个预测头</text>

  <!-- Three heads -->
  <line x1="240" y1="114" x2="130" y2="160" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="300" y1="114" x2="300" y2="160" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="360" y1="114" x2="470" y2="160" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="55" y="166" width="150" height="62" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="130" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">主体分头 (CE+KL)</text>
  <text x="130" y="210" text-anchor="middle" font-size="11" fill="#3D4F65">示例：分=4</text>

  <rect x="225" y="166" width="150" height="62" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="300" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">属性分头 (CE+KL)</text>
  <text x="300" y="210" text-anchor="middle" font-size="11" fill="#3D4F65">示例：分=1</text>

  <rect x="395" y="166" width="150" height="62" rx="8" fill="#FFF1E6" stroke="#E89A52" stroke-width="1.8"/>
  <text x="470" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">相关性头</text>
  <text x="470" y="210" text-anchor="middle" font-size="11" fill="#3D4F65">直接预测：部分相关</text>

  <!-- Rule mapping -->
  <path d="M130,228 Q130,278 200,300" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M300,228 Q300,270 270,300" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#a)"/>

  <rect x="195" y="300" width="190" height="54" rx="8" fill="#FFFFFF" stroke="#3D4F65" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="290" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">规则映射 (4,1) → 部分相关</text>
  <text x="290" y="340" text-anchor="middle" font-size="11" fill="#3D4F65">推导版相关性</text>

  <!-- Consistency loss -->
  <path d="M385,318 Q450,290 470,228" stroke="#E89A52" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#o)"/>
  <text x="498" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#E89A52">一致性 loss</text>

  <!-- Bottom result -->
  <text x="300" y="384" text-anchor="middle" font-size="12" fill="#3D4F65">学生不仅学结论，还学"主体/属性如何合成最终标签"</text>
  <text x="300" y="404" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">京东 A/B：Bad Case Rate 11.97% → 11.65%</text>
</svg>
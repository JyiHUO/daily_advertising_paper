<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="600" height="400" fill="#FAF7F2"/>
  
  <!-- Title -->
  <text x="300" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E3A5F">模型细化 = 把箱子切得更细</text>
  <text x="300" y="60" text-anchor="middle" font-size="11" fill="#3D4F65">细模型每个簇完整落在粗模型的某个簇里</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Coarse model -->
  <text x="140" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">粗模型 M_B</text>
  <rect x="50" y="115" width="180" height="180" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2" rx="4"/>
  <line x1="50" y1="205" x2="230" y2="205" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4,3"/>
  
  <text x="140" y="170" text-anchor="middle" font-size="11" fill="#3D4F65">簇 1   p = 0.125</text>
  <text x="140" y="250" text-anchor="middle" font-size="11" fill="#3D4F65">簇 2   p = 0.01</text>

  <!-- Arrow refine -->
  <line x1="240" y1="205" x2="370" y2="205" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="305" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">refine 切更细</text>

  <!-- Fine model -->
  <text x="470" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">细模型 M_A</text>
  <rect x="380" y="115" width="180" height="180" fill="#FFF4E8" stroke="#C77B3C" stroke-width="2" rx="4"/>
  <line x1="380" y1="205" x2="560" y2="205" stroke="#C77B3C" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="470" y1="115" x2="470" y2="295" stroke="#C77B3C" stroke-width="1.5" stroke-dasharray="4,3"/>
  
  <text x="425" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#C77B3C">0.20</text>
  <text x="515" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#C77B3C">0.05</text>
  <text x="425" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#C77B3C">0.01</text>
  <text x="515" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#C77B3C">0.01</text>

  <!-- Calibration note -->
  <rect x="80" y="325" width="440" height="50" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1" rx="4"/>
  <text x="300" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">保持校准</text>
  <text x="300" y="364" text-anchor="middle" font-size="11" fill="#3D4F65">细簇加权平均 = 粗簇预测：(0.20 + 0.05) / 2 = 0.125</text>
</svg>
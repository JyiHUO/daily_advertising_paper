<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Helvetica,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E89B5C"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">让"分锅比例"自己学出来</text>
  <text x="300" y="56" text-anchor="middle" font-size="12" fill="#3D4F65">主损失梯度自动调节边权 φ（softmax 同组竞争，Σφ = 1）</text>

  <!-- top node -->
  <circle cx="300" cy="120" r="34" fill="#FFE9D6" stroke="#E89B5C" stroke-width="2"/>
  <text x="300" y="116" text-anchor="middle" font-size="11" fill="#1E3A5F">最终奖励</text>
  <text x="300" y="132" text-anchor="middle" font-size="10" fill="#3D4F65">上游节点</text>

  <!-- thick edge to left -->
  <line x1="282" y1="148" x2="186" y2="250" stroke="#4B8BDA" stroke-width="7" marker-end="url(#a)" opacity="0.9"/>
  <!-- thin edge to right -->
  <line x1="318" y1="148" x2="414" y2="250" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)" opacity="0.7"/>

  <!-- phi labels -->
  <rect x="196" y="184" width="64" height="24" rx="12" fill="#1E3A5F"/>
  <text x="228" y="201" text-anchor="middle" font-size="13" font-weight="700" fill="#FFE9D6">φ₁ ↑</text>

  <rect x="340" y="184" width="64" height="24" rx="12" fill="#EFF6FF" stroke="#4B8BDA"/>
  <text x="372" y="201" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">φ₂ ↓</text>

  <!-- left branch -->
  <circle cx="160" cy="280" r="40" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="160" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">主体匹配</text>
  <text x="160" y="293" text-anchor="middle" font-size="10" fill="#3D4F65">错误多 → 加权</text>

  <!-- right branch -->
  <circle cx="440" cy="280" r="40" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="440" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">属性匹配</text>
  <text x="440" y="293" text-anchor="middle" font-size="10" fill="#3D4F65">噪声 → 减权</text>

  <!-- gradient feedback arrow (closed loop back to top) -->
  <path d="M 160 322 Q 300 400 440 322" fill="none" stroke="#E89B5C" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 440 322 Q 520 240 336 122" fill="none" stroke="#E89B5C" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#b)"/>
  <text x="300" y="385" text-anchor="middle" font-size="12" fill="#E89B5C" font-weight="600">主损失梯度回流 · 自动重分配 φ</text>
</svg>
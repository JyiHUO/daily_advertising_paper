<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="-apple-system,Segoe UI,Helvetica,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <text x="300" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#1E3A5F">链式整体打分 → 图上分步追责</text>

  <!-- Left: GRPO blob -->
  <g>
    <text x="150" y="68" text-anchor="middle" font-size="13" fill="#3D4F65">GRPO：一句一分</text>
    <rect x="50" y="90" width="200" height="80" rx="10" fill="#FCE9E1" stroke="#D97757" stroke-width="1.5"/>
    <text x="150" y="120" text-anchor="middle" font-size="13" fill="#1E3A5F">推理整链</text>
    <text x="150" y="150" text-anchor="middle" font-size="20" fill="#D97757" font-weight="700">−1</text>
    <text x="150" y="195" text-anchor="middle" font-size="12" fill="#3D4F65">所有 token 同罚</text>
  </g>

  <!-- separator -->
  <line x1="285" y1="60" x2="285" y2="330" stroke="#D6DEE8" stroke-dasharray="4 4"/>

  <!-- Right: dependency graph -->
  <g>
    <text x="450" y="68" text-anchor="middle" font-size="13" fill="#3D4F65">Graph-GRPO：按图传播</text>

    <!-- Final label -->
    <rect x="395" y="85" width="110" height="38" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="450" y="109" text-anchor="middle" font-size="12" fill="#1E3A5F">最终标签 −1</text>

    <!-- Subject match -->
    <rect x="315" y="175" width="105" height="36" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="367" y="198" text-anchor="middle" font-size="12" fill="#1E3A5F">主体 +1</text>

    <!-- Attribute match -->
    <rect x="480" y="175" width="105" height="36" rx="8" fill="#FCE9E1" stroke="#D97757" stroke-width="1.8"/>
    <text x="532" y="198" text-anchor="middle" font-size="12" fill="#1E3A5F">属性 −2</text>

    <!-- Evidence tokens -->
    <rect x="302" y="265" width="130" height="34" rx="6" fill="#F5F8FC" stroke="#9FB8D6" stroke-width="1"/>
    <text x="367" y="286" text-anchor="middle" font-size="11" fill="#3D4F65">主体证据 token</text>

    <rect x="467" y="265" width="130" height="34" rx="6" fill="#FCE9E1" stroke="#D97757" stroke-width="1.5"/>
    <text x="532" y="286" text-anchor="middle" font-size="11" fill="#1E3A5F">属性证据 token</text>

    <!-- arrows from final to matches (split blame φ1 φ2) -->
    <path d="M425,123 L378,173" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M475,123 L522,173" stroke="#D97757" stroke-width="2" fill="none" marker-end="url(#arRed)"/>
    <text x="388" y="150" font-size="10" fill="#4B8BDA">φ₁</text>
    <text x="500" y="150" font-size="10" fill="#D97757">φ₂</text>

    <!-- match to evidence -->
    <path d="M367,211 L367,263" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M532,211 L532,263" stroke="#D97757" stroke-width="2" fill="none" marker-end="url(#arRed)"/>
    <text x="373" y="242" font-size="10" fill="#4B8BDA">φ₃</text>
    <text x="540" y="242" font-size="10" fill="#D97757">φ₅</text>
  </g>

  <!-- bottom caption -->
  <text x="300" y="370" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">奖励沿依赖图下传，错责精确到节点</text>
  <text x="300" y="392" text-anchor="middle" font-size="12" fill="#3D4F65">属性 token 重罚，主体 token 几乎不动</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8A87C"/>
    </marker>
  </defs>

  <text x="300" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1E3A5F">把推理拆成"谁依赖谁"的小图</text>
  <text x="300" y="54" text-anchor="middle" font-size="12" fill="#3D4F65">错了能顺边回溯，定位到具体推理节点</text>

  <!-- Top: 4 evidence nodes -->
  <g font-size="11.5" fill="#1E3A5F" text-anchor="middle">
    <rect x="40" y="90" width="110" height="46" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="95" y="109">Query 主体</text><text x="95" y="126" font-size="10" fill="#3D4F65">苹果</text>

    <rect x="170" y="90" width="110" height="46" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="225" y="109">Query 属性</text><text x="225" y="126" font-size="10" fill="#3D4F65">红</text>

    <rect x="320" y="90" width="110" height="46" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="375" y="109">商品 主体</text><text x="375" y="126" font-size="10" fill="#3D4F65">苹果</text>

    <rect x="450" y="90" width="110" height="46" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="505" y="109">商品 属性</text><text x="505" y="126" font-size="10" fill="#3D4F65">绿</text>
  </g>

  <!-- Consistency edges (dashed) -->
  <line x1="150" y1="113" x2="170" y2="113" stroke="#B0B8C4" stroke-dasharray="3,3"/>
  <line x1="430" y1="113" x2="450" y2="113" stroke="#B0B8C4" stroke-dasharray="3,3"/>
  <text x="160" y="84" font-size="9" fill="#8A94A6" text-anchor="middle">一致性</text>
  <text x="440" y="84" font-size="9" fill="#8A94A6" text-anchor="middle">一致性</text>

  <!-- Mid: two match scores -->
  <g font-size="12" fill="#1E3A5F" text-anchor="middle">
    <rect x="120" y="210" width="140" height="48" rx="8" fill="#FFF4E8" stroke="#E8A87C"/>
    <text x="190" y="230">主体匹配分</text><text x="190" y="248" font-size="11" fill="#A8623A">4 / 4</text>

    <rect x="340" y="210" width="140" height="48" rx="8" fill="#FFF4E8" stroke="#E8A87C" stroke-width="1.6"/>
    <text x="410" y="230">属性匹配分</text><text x="410" y="248" font-size="11" fill="#A8623A">1 / 4  ⚠</text>
  </g>

  <!-- Evidence edges: query side -> 主体匹配, 商品 side -> 主体匹配; 属性 -> 属性匹配 -->
  <line x1="110" y1="136" x2="165" y2="210" stroke="#4B8BDA" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="360" y1="136" x2="215" y2="210" stroke="#4B8BDA" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="240" y1="136" x2="385" y2="210" stroke="#4B8BDA" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="490" y1="136" x2="435" y2="210" stroke="#4B8BDA" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- Bottom: final label -->
  <rect x="220" y="320" width="160" height="52" rx="10" fill="#E8F0FF" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="300" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">最终相关性标签</text>
  <text x="300" y="360" text-anchor="middle" font-size="11" fill="#3D4F65">部分相关</text>

  <!-- Decision edges -->
  <line x1="200" y1="258" x2="260" y2="320" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="400" y1="258" x2="340" y2="320" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- Backward blame trace (orange dashed): final -> 属性匹配 -> 商品属性 -->
  <path d="M 360 320 Q 430 295 410 260" fill="none" stroke="#E8A87C" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arO)"/>
  <path d="M 450 215 Q 520 175 505 140" fill="none" stroke="#E8A87C" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arO)"/>
  <text x="560" y="200" font-size="10" fill="#A8623A" text-anchor="end">沿边回溯责任</text>

  <text x="300" y="410" text-anchor="middle" font-size="10.5" fill="#8A94A6">7 节点 · 决策边 / 证据边 / 一致性边</text>
</svg>
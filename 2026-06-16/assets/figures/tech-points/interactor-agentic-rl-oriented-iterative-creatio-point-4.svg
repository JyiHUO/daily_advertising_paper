<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97A4A"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">把"后处理过滤"融入"生成"</text>
  <text x="400" y="64" text-anchor="middle" font-size="13" fill="#3D4F65">同样算力，更多合格描述被保留</text>

  <!-- LEFT: old pipeline -->
  <text x="200" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#A06040">原方案：生成 → 筛掉</text>

  <!-- generated batch (left) -->
  <g>
    <circle cx="120" cy="180" r="14" fill="#FCE8D5" stroke="#C97A4A" stroke-width="1.5"/>
    <circle cx="160" cy="170" r="14" fill="#FCE8D5" stroke="#C97A4A" stroke-width="1.5"/>
    <circle cx="200" cy="185" r="14" fill="#FCE8D5" stroke="#C97A4A" stroke-width="1.5"/>
    <circle cx="240" cy="172" r="14" fill="#FCE8D5" stroke="#C97A4A" stroke-width="1.5"/>
    <circle cx="280" cy="185" r="14" fill="#FCE8D5" stroke="#C97A4A" stroke-width="1.5"/>
  </g>

  <!-- funnel (filter) -->
  <polygon points="120,230 280,230 220,310 180,310" fill="#FFF1E0" stroke="#C97A4A" stroke-width="1.8"/>
  <text x="200" y="275" text-anchor="middle" font-size="11" fill="#A0552A">过滤模型</text>

  <!-- survivor -->
  <circle cx="200" cy="370" r="14" fill="#FCE8D5" stroke="#5A9A5A" stroke-width="1.8"/>

  <!-- discarded -->
  <g stroke="#C97A4A" stroke-width="1.2" opacity="0.6">
    <line x1="115" y1="325" x2="135" y2="350"/>
    <line x1="135" y1="325" x2="115" y2="350"/>
    <line x1="150" y1="335" x2="170" y2="360"/>
    <line x1="170" y1="335" x2="150" y2="360"/>
    <line x1="255" y1="335" x2="275" y2="360"/>
    <line x1="275" y1="335" x2="255" y2="360"/>
    <line x1="290" y1="325" x2="310" y2="350"/>
    <line x1="310" y1="325" x2="290" y2="350"/>
  </g>
  <text x="200" y="410" text-anchor="middle" font-size="11" fill="#A06040">大量算力浪费在被丢弃的草稿上</text>

  <!-- divider -->
  <line x1="400" y1="100" x2="400" y2="430" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT: new pipeline -->
  <text x="600" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">新方案：迭代修订</text>

  <!-- iterative loop: draft -> revise -->
  <circle cx="520" cy="210" r="26" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="520" y="214" text-anchor="middle" font-size="12" fill="#1E3A5F">初稿</text>

  <circle cx="680" cy="210" r="26" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="680" y="214" text-anchor="middle" font-size="12" fill="#1E3A5F">改写</text>

  <!-- loop arrows -->
  <path d="M 546,196 Q 600,165 654,196" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M 654,224 Q 600,255 546,224" fill="none" stroke="#C97A4A" stroke-width="1.8" marker-end="url(#arrO)"/>
  <text x="600" y="160" text-anchor="middle" font-size="11" fill="#1E3A5F">生成</text>
  <text x="600" y="270" text-anchor="middle" font-size="11" fill="#A0552A">可读反馈</text>

  <!-- arrow down to final -->
  <line x1="600" y1="295" x2="600" y2="350" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- final qualified output -->
  <rect x="540" y="355" width="120" height="46" rx="8" fill="#E0F0E0" stroke="#5A9A5A" stroke-width="1.8"/>
  <text x="600" y="376" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">合格描述</text>
  <text x="600" y="393" text-anchor="middle" font-size="11" fill="#3D4F65">直接入库</text>

  <!-- bottom metrics -->
  <text x="400" y="455" text-anchor="middle" font-size="12" fill="#1E3A5F">线上 A/B：广告收入 +0.74% · 顶级描述 +7pp</text>
  <text x="400" y="475" text-anchor="middle" font-size="11" fill="#3D4F65">忠实度 0.726 → 0.872</text>
</svg>
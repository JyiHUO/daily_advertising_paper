<svg height="600" width="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8A864"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E3A5F">MMM 作为贝叶斯先验：给每个活动一个起跑线</text>
  <text x="400" y="58" text-anchor="middle" font-size="12" fill="#3D4F65">渠道平均效果 → 活动级先验均值（非负截断正态）</text>

  <!-- MMM anchor (left) -->
  <circle cx="140" cy="265" r="72" fill="#FEF3E2" stroke="#E8A864" stroke-width="2"/>
  <text x="140" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">MMM 渠道</text>
  <text x="140" y="272" text-anchor="middle" font-size="13" fill="#3D4F65">β = 5</text>
  <text x="140" y="292" text-anchor="middle" font-size="11" fill="#8A6A3A">（先验锚点）</text>

  <!-- dashed prior line across -->
  <line x1="215" y1="265" x2="710" y2="265" stroke="#E8A864" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="705" y="258" text-anchor="end" font-size="11" fill="#8A6A3A">先验均值 μ = 5</text>

  <!-- Campaign A -->
  <g>
    <text x="360" y="120" text-anchor="middle" font-size="12" fill="#3D4F65">活动 A（强信号 → 偏离）</text>
    <circle cx="360" cy="160" r="22" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="360" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">8</text>
    <line x1="360" y1="263" x2="360" y2="182" stroke="#4B8BDA" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>

  <!-- Campaign B -->
  <g>
    <text x="490" y="205" text-anchor="middle" font-size="12" fill="#3D4F65">活动 B（贴近先验）</text>
    <circle cx="490" cy="240" r="22" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="490" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">5</text>
  </g>

  <!-- Campaign C -->
  <g>
    <circle cx="620" cy="350" r="22" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="620" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">2</text>
    <text x="620" y="395" text-anchor="middle" font-size="12" fill="#3D4F65">活动 C（弱信号 → 收缩）</text>
    <line x1="620" y1="267" x2="620" y2="328" stroke="#4B8BDA" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>

  <!-- Arrows from MMM to campaigns (anchoring) -->
  <path d="M205 235 Q 280 195 336 162" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M212 258 Q 340 245 466 242" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M205 295 Q 400 345 597 348" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Aggregation back to MMM (closing loop) -->
  <path d="M400 430 Q 200 420 150 340" fill="none" stroke="#E8A864" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar2)"/>

  <!-- Bottom note -->
  <rect x="220" y="425" width="360" height="48" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="400" y="445" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">曝光加权聚合 ≈ 5</text>
  <text x="400" y="463" text-anchor="middle" font-size="11" fill="#3D4F65">活动级粒度与 MMM 渠道结论自洽</text>

  <text x="40" y="470" font-size="11" fill="#8A6A3A">约束：β ≥ 0（截断正态）</text>
</svg>
<svg height="500" width="800" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">从渠道周账 → 活动日账</text>
  <text x="400" y="66" text-anchor="middle" font-size="13" fill="#3D4F65">三阶段层层下钻，全程聚合数据</text>

  <!-- Stage 1: Channel / Week -->
  <g>
    <rect x="60" y="130" width="200" height="220" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="160" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">① MMM</text>
    <text x="160" y="176" text-anchor="middle" font-size="11" fill="#3D4F65">渠道 · 周</text>

    <rect x="90" y="200" width="140" height="120" rx="6" fill="#DCEBFB" stroke="#4B8BDA"/>
    <text x="160" y="245" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">Search</text>
    <text x="160" y="275" text-anchor="middle" font-size="18" font-weight="600" fill="#C97A3F">¥100万 / 周</text>
  </g>

  <!-- Stage 2: Daily slices via adstock -->
  <g>
    <rect x="300" y="130" width="220" height="220" rx="10" fill="#FFF4E8" stroke="#C97A3F" stroke-width="2"/>
    <text x="410" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">② Adstock 拆日</text>
    <text x="410" y="176" text-anchor="middle" font-size="11" fill="#3D4F65">周 → 日（按动力学摊）</text>

    <g fill="#E5A06A" stroke="#C97A3F">
      <rect x="324" y="280" width="20" height="40"/>
      <rect x="348" y="260" width="20" height="60"/>
      <rect x="372" y="240" width="20" height="80"/>
      <rect x="396" y="230" width="20" height="90"/>
      <rect x="420" y="250" width="20" height="70"/>
      <rect x="444" y="270" width="20" height="50"/>
      <rect x="468" y="285" width="20" height="35"/>
    </g>
    <text x="406" y="215" text-anchor="middle" font-size="11" fill="#3D4F65">周一 ··· 周日</text>
  </g>

  <!-- Stage 3: Bayesian split into campaigns -->
  <g>
    <rect x="580" y="130" width="180" height="220" rx="10" fill="#EEF6EF" stroke="#5B9466" stroke-width="2"/>
    <text x="670" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">③ 贝叶斯回归</text>
    <text x="670" y="176" text-anchor="middle" font-size="11" fill="#3D4F65">日 → 活动</text>

    <rect x="600" y="195" width="140" height="36" rx="5" fill="#D6E9D8" stroke="#5B9466"/>
    <text x="670" y="218" text-anchor="middle" font-size="12" fill="#1E3A5F">品牌词活动</text>

    <rect x="600" y="240" width="140" height="36" rx="5" fill="#D6E9D8" stroke="#5B9466"/>
    <text x="670" y="263" text-anchor="middle" font-size="12" fill="#1E3A5F">促销词活动</text>

    <rect x="600" y="285" width="140" height="36" rx="5" fill="#D6E9D8" stroke="#5B9466"/>
    <text x="670" y="308" text-anchor="middle" font-size="12" fill="#1E3A5F">商品词活动</text>
  </g>

  <!-- Arrows between stages -->
  <line x1="262" y1="240" x2="296" y2="240" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="522" y1="240" x2="576" y2="240" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Bottom anchor note -->
  <g>
    <rect x="160" y="410" width="480" height="56" rx="8" fill="#F5F0E8" stroke="#C97A3F" stroke-dasharray="4 3"/>
    <text x="400" y="434" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">逐层加总恒等于 MMM 的渠道周增量</text>
    <text x="400" y="454" text-anchor="middle" font-size="11" fill="#3D4F65">活动日和 = 渠道日；渠道日和 = 渠道周</text>
  </g>
</svg>
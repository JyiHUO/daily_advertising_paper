<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A8F6B"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C26B5C"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E3A5F">叙述说什么 ≠ 世界变什么</text>

  <!-- LLM output: prose + delta -->
  <g>
    <rect x="40" y="200" width="220" height="110" rx="10" fill="#FFF4E6" stroke="#D9A05B" stroke-width="1.5"/>
    <text x="150" y="228" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="bold">LLM 一次输出</text>
    <text x="150" y="256" text-anchor="middle" font-size="13" fill="#3D4F65">叙述 prose</text>
    <text x="150" y="278" text-anchor="middle" font-size="13" fill="#3D4F65">结构化 delta</text>
    <text x="150" y="296" text-anchor="middle" font-size="11" fill="#3D4F65">(path, op, value)</text>
  </g>

  <!-- Three-gate filter -->
  <g>
    <rect x="300" y="80" width="240" height="340" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="420" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">三重校验闸门 (PDVA)</text>

    <g>
      <rect x="325" y="130" width="190" height="60" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
      <text x="420" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">SchemaOK</text>
      <text x="420" y="178" text-anchor="middle" font-size="11" fill="#3D4F65">字段格式合法</text>
    </g>
    <g>
      <rect x="325" y="210" width="190" height="60" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
      <text x="420" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">PermOK</text>
      <text x="420" y="258" text-anchor="middle" font-size="11" fill="#3D4F65">提议者有权限</text>
    </g>
    <g>
      <rect x="325" y="290" width="190" height="60" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
      <text x="420" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">RuleOK</text>
      <text x="420" y="338" text-anchor="middle" font-size="11" fill="#3D4F65">符合游戏规则</text>
    </g>

    <text x="420" y="395" text-anchor="middle" font-size="11" fill="#3D4F65">全过 → 原子落盘 + 内容哈希</text>
  </g>

  <!-- Right side: outcomes -->
  <g>
    <rect x="600" y="110" width="170" height="80" rx="10" fill="#E8F1E8" stroke="#5A8F6B" stroke-width="1.5"/>
    <text x="685" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">✓ 提交</text>
    <text x="685" y="162" text-anchor="middle" font-size="11" fill="#3D4F65">写入事件日志</text>
    <text x="685" y="180" text-anchor="middle" font-size="11" fill="#3D4F65">可回放 / 可审计</text>
  </g>

  <g>
    <rect x="600" y="310" width="170" height="80" rx="10" fill="#FBECE8" stroke="#C26B5C" stroke-width="1.5"/>
    <text x="685" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">✗ 拒绝</text>
    <text x="685" y="362" text-anchor="middle" font-size="11" fill="#3D4F65">prose 说了不算</text>
    <text x="685" y="380" text-anchor="middle" font-size="11" fill="#3D4F65">世界状态不变</text>
  </g>

  <!-- arrows -->
  <line x1="260" y1="255" x2="298" y2="250" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="540" y1="160" x2="598" y2="150" stroke="#5A8F6B" stroke-width="2" marker-end="url(#arrGreen)"/>
  <line x1="540" y1="340" x2="598" y2="350" stroke="#C26B5C" stroke-width="2" marker-end="url(#arrRed)"/>

  <text x="400" y="470" text-anchor="middle" font-size="12" fill="#3D4F65" font-style="italic">PDVA：把“模型胡说”变成“被校验的状态变更”</text>
</svg>
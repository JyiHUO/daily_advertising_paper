<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f42c1"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8860b"/>
    </marker>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#2E86DE"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">把"一刀切下线"改成"慢慢拧小水龙头"</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#666">IEFF: serving 层渐变淡出，免重训练</text>

  <!-- LEFT: traditional -->
  <g>
    <text x="220" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">✗ 传统做法：一刀切</text>
    <rect x="80" y="125" width="280" height="130" rx="8" fill="#fdecea" stroke="#c0392b"/>
    <text x="220" y="152" text-anchor="middle" font-size="13" fill="#333">特征覆盖率 100% → 0%（断崖）</text>
    <polyline points="100,185 200,185 200,225 340,225" stroke="#c0392b" stroke-width="3" fill="none"/>
    <text x="220" y="245" text-anchor="middle" font-size="12" fill="#888">性能抖动，需重训练 3-6 个月</text>
  </g>

  <!-- RIGHT: IEFF -->
  <g>
    <text x="680" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e7e34">✓ IEFF：渐变淡出</text>
    <rect x="540" y="125" width="280" height="130" rx="8" fill="#eaf7ee" stroke="#1e7e34"/>
    <text x="680" y="152" text-anchor="middle" font-size="13" fill="#333">每天 1-2% 请求置空，平滑下降</text>
    <polyline points="560,185 620,188 720,215 810,228" stroke="#1e7e34" stroke-width="3" fill="none"/>
    <text x="680" y="245" text-anchor="middle" font-size="12" fill="#888">持续训练自然消化，改配置即可回滚</text>
  </g>

  <!-- Divider -->
  <line x1="450" y1="90" x2="450" y2="270" stroke="#ccc" stroke-dasharray="4 4"/>

  <!-- Bottom architecture -->
  <text x="450" y="305" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">核心：在 serving 层插一个 Adapter</text>

  <!-- Control plane -->
  <rect x="350" y="330" width="200" height="60" rx="8" fill="#fff3cd" stroke="#b8860b"/>
  <text x="450" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5d00">中央控制面</text>
  <text x="450" y="375" text-anchor="middle" font-size="11" fill="#666">下发淡出策略（速率 / 目标）</text>

  <!-- Feature pipeline -->
  <rect x="40" y="440" width="150" height="70" rx="8" fill="#eef2ff" stroke="#5a6acf"/>
  <text x="115" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">特征管线</text>
  <text x="115" y="490" text-anchor="middle" font-size="11" fill="#666">上游不改动</text>

  <!-- Adapter -->
  <rect x="240" y="430" width="200" height="90" rx="10" fill="url(#fade)" stroke="#2E86DE" stroke-width="2"/>
  <text x="340" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Feature Adapter</text>
  <text x="340" y="482" text-anchor="middle" font-size="11" fill="#fff">按比例置空 / 改值</text>
  <text x="340" y="502" text-anchor="middle" font-size="11" fill="#222">今天 1% → 明天 2% ...</text>

  <!-- Inference -->
  <rect x="500" y="440" width="150" height="70" rx="8" fill="#e7f5ff" stroke="#2E86DE"/>
  <text x="575" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">线上推理</text>
  <text x="575" y="490" text-anchor="middle" font-size="11" fill="#666">使用调整后的值</text>

  <!-- Logging / Recurring training -->
  <rect x="700" y="440" width="170" height="70" rx="8" fill="#f0e6ff" stroke="#6f42c1"/>
  <text x="785" y="468" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">日志 + 持续训练</text>
  <text x="785" y="488" text-anchor="middle" font-size="11" fill="#666">训练-服务一致</text>

  <!-- Arrows -->
  <line x1="190" y1="475" x2="237" y2="475" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="440" y1="475" x2="497" y2="475" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="650" y1="475" x2="697" y2="475" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Control plane to adapter -->
  <line x1="410" y1="390" x2="360" y2="428" stroke="#b8860b" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arg)"/>

  <!-- Feedback loop: training back to adapter (model adapts) -->
  <path d="M785,510 Q785,570 450,570 Q340,570 340,525" stroke="#6f42c1" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arp)"/>
  <text x="560" y="590" text-anchor="middle" font-size="11" fill="#6f42c1">模型每天自然适应小漂移，无需专门重训练</text>
</svg>
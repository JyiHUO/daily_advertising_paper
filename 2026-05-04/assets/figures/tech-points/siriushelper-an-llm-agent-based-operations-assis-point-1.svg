<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d14b4b"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a8a5f"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1c2b4a">统一入口 + 意图分诊台</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#5a6578">先问清楚，再按关键词送到对口专家</text>

  <!-- User bubble -->
  <g>
    <rect x="40" y="120" width="230" height="90" rx="14" fill="#fff3e0" stroke="#e6a23c" stroke-width="2"/>
    <text x="155" y="150" text-anchor="middle" font-size="13" fill="#7a4a00">用户</text>
    <text x="155" y="172" text-anchor="middle" font-size="13" fill="#333">“我的任务跑失败了”</text>
    <text x="155" y="194" text-anchor="middle" font-size="12" fill="#a06010" font-style="italic">（信息不全）</text>
  </g>

  <!-- Triage box -->
  <rect x="310" y="90" width="280" height="390" rx="16" fill="#eef4ff" stroke="#3d6fd6" stroke-width="2"/>
  <text x="450" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#1c3a7a">前台分诊</text>

  <!-- Stage 1: intent -->
  <rect x="335" y="135" width="230" height="58" rx="10" fill="#fff" stroke="#3d6fd6"/>
  <text x="450" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3a7a">① 是不是真要看病？</text>
  <text x="450" y="179" text-anchor="middle" font-size="11" fill="#5a6578">意图分类 · 过滤闲聊</text>

  <!-- Stage 2: clarify -->
  <rect x="335" y="210" width="230" height="72" rx="10" fill="#fff" stroke="#3d6fd6"/>
  <text x="450" y="234" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3a7a">② 反问补全关键字段</text>
  <text x="450" y="254" text-anchor="middle" font-size="11" fill="#5a6578">“请贴 task ID + 报错日志”</text>
  <text x="450" y="272" text-anchor="middle" font-size="11" fill="#c24a2a">缺什么 → 问什么</text>

  <!-- Stage 3: keyword match -->
  <rect x="335" y="299" width="230" height="80" rx="10" fill="#fff" stroke="#3d6fd6"/>
  <text x="450" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3a7a">③ 抽关键词 · 余弦匹配</text>
  <text x="450" y="342" text-anchor="middle" font-size="11" fill="#333">"LATERAL VIEW EXPLODE 列数不匹配"</text>
  <text x="450" y="362" text-anchor="middle" font-size="11" fill="#2a8a5f">→ 命中 SQL 诊断</text>

  <!-- Stage 4: dispatch -->
  <rect x="335" y="398" width="230" height="60" rx="10" fill="#e8f5ec" stroke="#2a8a5f"/>
  <text x="450" y="421" text-anchor="middle" font-size="13" font-weight="600" fill="#1a6a3f">④ 送去对口专家</text>
  <text x="450" y="441" text-anchor="middle" font-size="11" fill="#2a8a5f">结构化输入，非整段对话</text>

  <!-- Arrow from user to triage -->
  <path d="M270,165 L308,165" stroke="#334" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- Arrows inside triage -->
  <path d="M450,193 L450,208" stroke="#334" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M450,282 L450,297" stroke="#334" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M450,379 L450,396" stroke="#2a8a5f" stroke-width="2" fill="none" marker-end="url(#arG)"/>

  <!-- Right side: experts -->
  <g>
    <rect x="640" y="140" width="220" height="60" rx="10" fill="#e8f5ec" stroke="#2a8a5f" stroke-width="2"/>
    <text x="750" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#1a6a3f">SQL 诊断 Agent</text>
    <text x="750" y="185" text-anchor="middle" font-size="11" fill="#2a8a5f">查专属 SOP</text>

    <rect x="640" y="215" width="220" height="50" rx="10" fill="#fff" stroke="#6a7a92"/>
    <text x="750" y="244" text-anchor="middle" font-size="13" fill="#334">Flink 诊断 Agent</text>

    <rect x="640" y="280" width="220" height="50" rx="10" fill="#fff" stroke="#6a7a92"/>
    <text x="750" y="309" text-anchor="middle" font-size="13" fill="#334">其他专家 Agent …</text>

    <rect x="640" y="360" width="220" height="60" rx="10" fill="#fdecec" stroke="#d14b4b" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="750" y="385" text-anchor="middle" font-size="13" font-weight="600" fill="#a02020">通用 RAG 回落</text>
    <text x="750" y="404" text-anchor="middle" font-size="11" fill="#a02020">无匹配才走，避免瞎找</text>
  </g>

  <!-- dispatch arrows -->
  <path d="M565,420 C600,420 600,170 638,170" stroke="#2a8a5f" stroke-width="2.5" fill="none" marker-end="url(#arG)"/>
  <path d="M565,435 C600,435 600,390 638,390" stroke="#d14b4b" stroke-width="1.8" stroke-dasharray="5,3" fill="none" marker-end="url(#arR)"/>

  <!-- Bottom takeaway -->
  <rect x="120" y="500" width="660" height="44" rx="10" fill="#1c2b4a"/>
  <text x="450" y="528" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">模糊问题先补全 → 关键词路由到专家 → 下游拿到的是结构化输入</text>
</svg>
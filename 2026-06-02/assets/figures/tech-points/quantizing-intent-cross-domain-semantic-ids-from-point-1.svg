<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C25450"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">行为浓度越高，迁移收益越大</text>
  <text x="400" y="60" text-anchor="middle" font-size="13" fill="#3D4F65">三种用户源 → 同一量化管线 → AUC 单调递增</text>

  <!-- Source 1: Profile -->
  <g>
    <rect x="70" y="90" width="180" height="90" rx="10" fill="#FFF4E6" stroke="#E0A458" stroke-width="1.5"/>
    <text x="160" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">Profile 文本</text>
    <text x="160" y="142" text-anchor="middle" font-size="12" fill="#3D4F65">"软件工程师"</text>
    <text x="160" y="162" text-anchor="middle" font-size="11" fill="#8B6B3D">静态 · 无行为</text>
  </g>

  <!-- Source 2: Tuned -->
  <g>
    <rect x="310" y="90" width="180" height="90" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="400" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">行为微调 LLM</text>
    <text x="400" y="142" text-anchor="middle" font-size="12" fill="#3D4F65">profile + 行为对齐</text>
    <text x="400" y="162" text-anchor="middle" font-size="11" fill="#3F6FA8">间接含行为</text>
  </g>

  <!-- Source 3: Feed -->
  <g>
    <rect x="550" y="90" width="180" height="90" rx="10" fill="#E8F3EC" stroke="#4A9D6F" stroke-width="1.5"/>
    <text x="640" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">Feed 行为聚合</text>
    <text x="640" y="142" text-anchor="middle" font-size="12" fill="#3D4F65">1 年互动轨迹</text>
    <text x="640" y="162" text-anchor="middle" font-size="11" fill="#3A7B57">直接行为信号</text>
  </g>

  <!-- Funnel: quantize -->
  <path d="M 200 220 L 600 220 L 480 275 L 320 275 Z" fill="#F4F1EA" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="400" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">RQ 量化 → Semantic ID</text>
  <text x="400" y="266" text-anchor="middle" font-size="11" fill="#3D4F65">K=3 · 码本 1024</text>

  <!-- arrows from sources to funnel -->
  <line x1="160" y1="180" x2="290" y2="218" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="400" y1="180" x2="400" y2="216" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="640" y1="180" x2="510" y2="218" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- AUC bars area -->
  <g transform="translate(0,310)">
    <text x="400" y="0" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">广告 CTR AUC 增益</text>

    <!-- baseline -->
    <line x1="100" y1="124" x2="700" y2="124" stroke="#1E3A5F" stroke-width="1"/>

    <!-- bar 1 -->
    <rect x="120" y="110" width="80" height="14" fill="#E0A458"/>
    <text x="160" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">+0.036%</text>

    <!-- bar 2 -->
    <rect x="360" y="88" width="80" height="36" fill="#4B8BDA"/>
    <text x="400" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">+0.107%</text>

    <!-- bar 3 -->
    <rect x="600" y="52" width="80" height="72" fill="#4A9D6F"/>
    <text x="640" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">+0.213%</text>

    <!-- ascending dashed arrow -->
    <path d="M 200 110 Q 400 50 600 52" stroke="#C25450" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#arRed)"/>
    <text x="400" y="175" text-anchor="middle" font-size="11" fill="#C25450">最冷启用户使用 Feed SID： +1.522%</text>
  </g>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <rect width="600" height="420" fill="#FAF7F2"/>

  <text x="300" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">HDE：一个 SID，三种粒度</text>
  <text x="300" y="54" text-anchor="middle" font-size="12" fill="#3D4F65">(c₁, c₂, c₃) → 粗 / 中 / 精，三层 embedding 相加</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- SID token -->
  <rect x="40" y="180" width="130" height="64" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="105" y="206" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">SID 序列</text>
  <text x="105" y="226" text-anchor="middle" font-size="12" fill="#3D4F65">(312, 45, 901)</text>

  <!-- Arrow SID -> layers -->
  <path d="M170,212 L210,212" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- Three lookup layers as stacked boxes -->
  <!-- W1 -->
  <rect x="215" y="120" width="200" height="56" rx="8" fill="#FFF1E6" stroke="#E8A87C" stroke-width="1.5"/>
  <text x="225" y="142" font-size="12" fill="#1E3A5F" font-weight="600">unigram · 粗类</text>
  <text x="225" y="162" font-size="11" fill="#3D4F65">c₁ → W₁[c₁]</text>

  <!-- W2 -->
  <rect x="215" y="184" width="200" height="56" rx="8" fill="#FCE8D5" stroke="#D98C5F" stroke-width="1.5"/>
  <text x="225" y="206" font-size="12" fill="#1E3A5F" font-weight="600">bigram · 中类</text>
  <text x="225" y="226" font-size="11" fill="#3D4F65">hash(c₁,c₂) mod H → W₂</text>

  <!-- W3 -->
  <rect x="215" y="248" width="200" height="56" rx="8" fill="#4B8BDA" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="225" y="270" font-size="12" fill="#FFFFFF" font-weight="600">trigram · 精细组合</text>
  <text x="225" y="290" font-size="11" fill="#EFF6FF">hash(c₁,c₂,c₃) mod H → W₃</text>

  <!-- Sum node -->
  <circle cx="475" cy="212" r="22" fill="#FAF7F2" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="475" y="218" text-anchor="middle" font-size="18" fill="#1E3A5F" font-weight="700">+</text>

  <!-- Arrows from each layer to sum -->
  <path d="M415,148 L455,200" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M415,212 L451,212" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M415,276 L455,224" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- Output -->
  <rect x="430" y="330" width="130" height="50" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="495" y="352" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">用户向量</text>
  <text x="495" y="370" text-anchor="middle" font-size="11" fill="#3D4F65">送入 CTR Transformer</text>

  <path d="M475,234 L495,326" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- Footnote -->
  <text x="40" y="400" font-size="10" fill="#3D4F65">表大小 H = min(C^K/α, H_max)，padding 码 0 → 零向量；HDE 表使用更大学习率 0.02 端到端训练。</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">共享一张"用户便签"</text>
  <text x="300" y="58" text-anchor="middle" font-size="12" fill="#3D4F65">召回写入 KV，排序通过共享显存直接读取</text>

  <!-- Retrieval -->
  <rect x="40" y="120" width="170" height="150" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="125" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">召回进程</text>
  <text x="125" y="170" text-anchor="middle" font-size="11" fill="#3D4F65">编码用户长历史 O(n²)，仅算一次</text>
  <rect x="92" y="190" width="66" height="50" rx="4" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.3"/>
  <line x1="100" y1="204" x2="150" y2="204" stroke="#4B8BDA" stroke-width="1"/>
  <line x1="100" y1="215" x2="150" y2="215" stroke="#4B8BDA" stroke-width="1"/>
  <line x1="100" y1="226" x2="135" y2="226" stroke="#4B8BDA" stroke-width="1"/>
  <text x="125" y="258" text-anchor="middle" font-size="10" fill="#3D4F65">写入 KV</text>

  <!-- Shared GPU memory -->
  <rect x="240" y="155" width="120" height="110" rx="14" fill="#FFF4E6" stroke="#E8A04B" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="300" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">共享显存 (CUDA IPC)</text>
  <rect x="268" y="200" width="64" height="44" rx="3" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.3"/>
  <text x="300" y="220" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A5F">user KV</text>
  <text x="300" y="236" text-anchor="middle" font-size="9" fill="#3D4F65">同一块内存</text>

  <!-- Ranking -->
  <rect x="390" y="120" width="170" height="150" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="475" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">排序进程</text>
  <text x="475" y="170" text-anchor="middle" font-size="11" fill="#3D4F65">读取 KV，仅算候选 O(nk)</text>
  <g fill="#FDECEC" stroke="#C9534B" stroke-width="1.1">
    <circle cx="430" cy="220" r="9"/>
    <circle cx="455" cy="220" r="9"/>
    <circle cx="480" cy="220" r="9"/>
    <circle cx="505" cy="220" r="9"/>
    <circle cx="530" cy="220" r="9"/>
  </g>
  <text x="475" y="252" text-anchor="middle" font-size="10" fill="#3D4F65">候选 Pin</text>

  <!-- arrows -->
  <path d="M212 210 L238 210" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M362 210 L388 210" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- bottom result -->
  <rect x="120" y="320" width="360" height="62" rx="12" fill="#F3F8FF" stroke="#4B8BDA" stroke-width="1.3"/>
  <text x="300" y="343" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">免去重复编码 · 免去 CPU↔GPU 搬运</text>
  <text x="300" y="365" text-anchor="middle" font-size="12" fill="#C9534B" font-weight="700">排序前向最高 3.92× 加速</text>

  <line x1="300" y1="266" x2="300" y2="318" stroke="#4B8BDA" stroke-width="1.2" stroke-dasharray="3 3"/>
</svg>
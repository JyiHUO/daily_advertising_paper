    <circle cx="270" cy="278" r="2.5"/><circle cx="290" cy="278" r="2.5"/><circle cx="310" cy="278" r="2.5"/><circle cx="330" cy="278" r="2.5"/><circle cx="350" cy="278" r="2.5"/><circle cx="370" cy="278" r="2.5"/>

<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E3A5F">只换前半段，精排原封不动</text>

  <!-- Old pipeline (faded) -->
  <text x="60" y="92" font-size="12" fill="#9AA7B8">原管线</text>
  <rect x="60" y="105" width="120" height="55" rx="8" fill="#F1F3F6" stroke="#C9D2DC"/>
  <text x="120" y="130" text-anchor="middle" font-size="13" fill="#9AA7B8">召回 PinRec</text>
  <text x="120" y="148" text-anchor="middle" font-size="11" fill="#B5BFCB">L0</text>

  <rect x="200" y="105" width="120" height="55" rx="8" fill="#F1F3F6" stroke="#C9D2DC"/>
  <text x="260" y="130" text-anchor="middle" font-size="13" fill="#9AA7B8">粗排</text>
  <text x="260" y="148" text-anchor="middle" font-size="11" fill="#B5BFCB">L1</text>

  <rect x="340" y="105" width="120" height="55" rx="8" fill="#F1F3F6" stroke="#C9D2DC"/>
  <text x="400" y="138" text-anchor="middle" font-size="13" fill="#9AA7B8">精排</text>

  <rect x="480" y="105" width="120" height="55" rx="8" fill="#F1F3F6" stroke="#C9D2DC"/>
  <text x="540" y="138" text-anchor="middle" font-size="13" fill="#9AA7B8">混排</text>

  <!-- Bracket showing replacement (above new pipeline) -->
  <path d="M60 240 Q60 228 72 228 L308 228 Q320 228 320 240" fill="none" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="190" y="220" text-anchor="middle" font-size="12" fill="#4B8BDA" font-weight="700">仅替换这一段</text>

  <!-- New pipeline label -->
  <text x="60" y="265" font-size="12" fill="#1E3A5F" font-weight="700">UniPinRec</text>

  <!-- merged block -->
  <rect x="60" y="275" width="260" height="85" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="190" y="302" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">召回 + 粗排 合体</text>
  <text x="190" y="324" text-anchor="middle" font-size="12" fill="#3D4F65">共享 embedding / ANN 索引</text>
  <text x="190" y="344" text-anchor="middle" font-size="11" fill="#4B8BDA">L0 + L1（一个 backbone）</text>

  <!-- TopK arrow -->
  <line x1="320" y1="317" x2="398" y2="317" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="359" y="310" text-anchor="middle" font-size="11" fill="#1E3A5F">TopK&lt;3000</text>

  <!-- Untouched downstream -->
  <rect x="400" y="275" width="120" height="85" rx="10" fill="#FFF4E6" stroke="#E8A24A" stroke-width="1.5"/>
  <text x="460" y="312" text-anchor="middle" font-size="13" fill="#1E3A5F">精排</text>
  <text x="460" y="332" text-anchor="middle" font-size="11" fill="#7A6A50">TransActV2</text>
  <text x="460" y="350" text-anchor="middle" font-size="10" fill="#E8A24A">不动</text>

  <line x1="520" y1="317" x2="558" y2="317" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="560" y="275" width="100" height="85" rx="10" fill="#FFF4E6" stroke="#E8A24A" stroke-width="1.5"/>
  <text x="610" y="320" text-anchor="middle" font-size="13" fill="#1E3A5F">混排</text>
  <text x="610" y="350" text-anchor="middle" font-size="10" fill="#E8A24A">不动</text>

  <!-- Benefits -->
  <g font-size="12" fill="#3D4F65">
    <circle cx="80" cy="420" r="4" fill="#4B8BDA"/>
    <text x="92" y="424">独立 AB / 独立回滚</text>
    <circle cx="290" cy="420" r="4" fill="#4B8BDA"/>
    <text x="302" y="424">候选侧只需一套表征</text>
    <circle cx="540" cy="420" r="4" fill="#E8A24A"/>
    <text x="552" y="424">下游链路零改动</text>
  </g>
</svg>
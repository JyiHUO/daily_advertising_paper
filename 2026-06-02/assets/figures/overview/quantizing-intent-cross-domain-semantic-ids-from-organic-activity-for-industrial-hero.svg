<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB877"/>
      <stop offset="1" stop-color="#E87A3E"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E87A3E"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="500" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">把 Feed 行为「量化」成语义 ID，喂给广告排序</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#3D4F65">Cross-Domain Semantic IDs · 解决广告 CTR 的稀疏与冷启动</text>

  <!-- LEFT: dense organic signals -->
  <g>
    <text x="155" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Organic Feed 行为</text>
    <text x="155" y="136" text-anchor="middle" font-size="11" fill="#3D4F65">稠密 · 高维 embedding</text>
    <ellipse cx="155" cy="340" rx="120" ry="150" fill="#EFF6FF" stroke="#B8D4F0" stroke-width="1.5"/>
    <g fill="#4B8BDA" opacity="0.75">
      <circle cx="120" cy="240" r="4"/><circle cx="180" cy="260" r="5"/><circle cx="100" cy="290" r="3"/>
      <circle cx="160" cy="310" r="6"/><circle cx="200" cy="330" r="4"/><circle cx="120" cy="350" r="5"/>
      <circle cx="80" cy="370" r="4"/><circle cx="170" cy="380" r="3"/><circle cx="220" cy="370" r="4"/>
      <circle cx="140" cy="410" r="5"/><circle cx="190" cy="430" r="3"/><circle cx="110" cy="440" r="4"/>
      <circle cx="170" cy="220" r="3"/><circle cx="105" cy="330" r="3"/><circle cx="220" cy="290" r="3"/>
    </g>
    <text x="155" y="510" text-anchor="middle" font-size="11" fill="#6B7A8E" font-style="italic">点击 / 浏览 / 互动</text>
  </g>

  <!-- CENTER: RQ-FSQ quantizer -->
  <g>
    <polygon points="430,210 570,210 600,355 570,500 430,500 400,355" fill="url(#prism)" stroke="#C25B1F" stroke-width="2" opacity="0.94"/>
    <text x="500" y="335" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">RQ-FSQ</text>
    <text x="500" y="362" text-anchor="middle" font-size="12" fill="#FFF3E6">残差量化 + 标量量化</text>
    <text x="500" y="382" text-anchor="middle" font-size="11" fill="#FFF3E6">稠密 → 离散 SID</text>

    <text x="500" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">核心机制：把行为信号压成几位整数</text>
    <text x="500" y="525" text-anchor="middle" font-size="11" fill="#3D4F65">分层离散 embedding (HDE) · prefix n-gram 查表</text>
  </g>

  <!-- arrow left -> prism -->
  <line x1="278" y1="340" x2="396" y2="340" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- RIGHT -->
  <g>
    <text x="845" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">语义 ID (SID)</text>
    <text x="845" y="136" text-anchor="middle" font-size="11" fill="#3D4F65">3 位整数 · 280× 压缩</text>

    <g font-family="monospace" font-size="20" font-weight="700">
      <rect x="760" y="220" width="60" height="60" rx="8" fill="#FCE8D4" stroke="#E87A3E" stroke-width="2"/>
      <text x="790" y="258" text-anchor="middle" fill="#C25B1F">312</text>
      <rect x="830" y="220" width="60" height="60" rx="8" fill="#FCE8D4" stroke="#E87A3E" stroke-width="2"/>
      <text x="860" y="258" text-anchor="middle" fill="#C25B1F">045</text>
      <rect x="900" y="220" width="60" height="60" rx="8" fill="#FCE8D4" stroke="#E87A3E" stroke-width="2"/>
      <text x="930" y="258" text-anchor="middle" fill="#C25B1F">901</text>
    </g>
    <text x="845" y="302" text-anchor="middle" font-size="10" fill="#6B7A8E">粗类 → 中类 → 精细类</text>

    <rect x="745" y="350" width="200" height="80" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="845" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">广告 CTR 排序</text>
    <text x="845" y="403" text-anchor="middle" font-size="11" fill="#3D4F65">Decoder-only Transformer</text>
    <text x="845" y="420" text-anchor="middle" font-size="11" fill="#3D4F65">端到端微调</text>

    <rect x="745" y="455" width="200" height="60" rx="10" fill="#FFF3E6" stroke="#E87A3E" stroke-width="2"/>
    <text x="845" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#C25B1F">冷启用户 +1.522% AUC</text>
    <text x="845" y="500" text-anchor="middle" font-size="11" fill="#8B5A2B">Feed 活跃源 +0.213% · 整体提升</text>
  </g>

  <!-- arrows -->
  <line x1="600" y1="320" x2="755" y2="258" stroke="#E87A3E" stroke-width="2.5" marker-end="url(#arrO)"/>
  <line x1="845" y1="285" x2="845" y2="346" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="845" y1="432" x2="845" y2="451" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Bottom takeaway -->
  <g>
    <line x1="80" y1="595" x2="920" y2="595" stroke="#D6DEE8" stroke-width="1"/>
    <text x="500" y="622" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">关键洞察：行为浓度越高，跨域迁移收益越大</text>

    <g>
      <text x="180" y="655" font-size="11" fill="#3D4F65">Profile 文本</text>
      <rect x="180" y="665" width="12" height="8" fill="#B8D4F0"/>
      <text x="200" y="673" font-size="10" fill="#6B7A8E">+0.036%</text>
    </g>
    <g>
      <text x="420" y="655" font-size="11" fill="#3D4F65">Activity-Tuned LLaMA</text>
      <rect x="420" y="665" width="36" height="8" fill="#4B8BDA"/>
      <text x="464" y="673" font-size="10" fill="#6B7A8E">+0.107%</text>
    </g>
    <g>
      <text x="700" y="655" font-size="11" font-weight="700" fill="#C25B1F">Feed 行为 embedding</text>
      <rect x="700" y="665" width="72" height="8" fill="#E87A3E"/>
      <text x="780" y="673" font-size="10" font-weight="700" fill="#C25B1F">+0.213%</text>
    </g>
  </g>
</svg>
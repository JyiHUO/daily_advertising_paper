<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A8C5F"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97A3A"/>
    </marker>
    <marker id="arGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B0BAC8"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">对偶引导的「按请求加压」</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">只在适配该合约的流量上放大 GD 竞争力</text>

  <!-- Request A -->
  <g>
    <circle cx="120" cy="180" r="44" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="120" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">请求 A</text>
    <text x="120" y="194" text-anchor="middle" font-size="11" fill="#3D4F65">x = 0.8（契合）</text>
  </g>

  <!-- Request B -->
  <g>
    <circle cx="120" cy="360" r="44" fill="#FFF4EC" stroke="#E89A5C" stroke-width="2"/>
    <text x="120" y="354" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">请求 B</text>
    <text x="120" y="374" text-anchor="middle" font-size="11" fill="#3D4F65">x ≈ 0（不契合）</text>
  </g>

  <!-- Center: PID gate -->
  <g>
    <rect x="310" y="215" width="180" height="100" rx="10" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
    <text x="400" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">GD 加压门</text>
    <text x="400" y="272" text-anchor="middle" font-size="13" fill="#3D4F65">加压量 = x · PIDError</text>
    <text x="400" y="296" text-anchor="middle" font-size="11" fill="#7A8BA0">合约欠投越多 → 加压越强</text>
  </g>

  <!-- Arrows from requests into gate -->
  <line x1="164" y1="180" x2="308" y2="240" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="164" y1="360" x2="308" y2="295" stroke="#B0BAC8" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arGray)"/>

  <!-- Outputs -->
  <g>
    <rect x="570" y="140" width="190" height="80" rx="10" fill="#E8F2EA" stroke="#4A8C5F" stroke-width="2"/>
    <text x="665" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">GD 分数 ↑ ~24%</text>
    <text x="665" y="194" text-anchor="middle" font-size="12" fill="#3D4F65">补量、保履约</text>
  </g>

  <g>
    <rect x="570" y="320" width="190" height="80" rx="10" fill="#FBF1E8" stroke="#C97A3A" stroke-width="2"/>
    <text x="665" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">留给 RTB 竞拍</text>
    <text x="665" y="374" text-anchor="middle" font-size="12" fill="#3D4F65">不污染高价值流量</text>
  </g>

  <line x1="490" y1="240" x2="568" y2="185" stroke="#4A8C5F" stroke-width="2.5" marker-end="url(#arG)"/>
  <line x1="490" y1="290" x2="568" y2="355" stroke="#C97A3A" stroke-width="2.5" marker-end="url(#arO)"/>

  <text x="400" y="465" text-anchor="middle" font-size="12" fill="#7A8BA0">同一公式打分 · 加压只发生在「对的请求」上</text>
</svg>
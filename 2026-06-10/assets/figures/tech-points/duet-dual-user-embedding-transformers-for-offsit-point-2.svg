<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B8C4D2"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">Static profile anchors a sparse stream</text>

  <!-- Anchor / user profile -->
  <circle cx="110" cy="215" r="52" fill="#FFF1E0" stroke="#E8A055" stroke-width="2"/>
  <path d="M110 195 L110 247 M110 247 L96 263 M110 247 L124 263 M90 215 Q110 225 130 215" stroke="#B86A1F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="110" y="293" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">User profile (query)</text>

  <!-- Sparse conversion stream label -->
  <text x="430" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Sparse conversions (key / value)</text>

  <!-- relevant events -->
  <circle cx="360" cy="200" r="16" fill="#DCEBFB" stroke="#4B8BDA" stroke-width="2"/>
  <circle cx="480" cy="180" r="16" fill="#DCEBFB" stroke="#4B8BDA" stroke-width="2"/>
  <text x="360" y="240" text-anchor="middle" font-size="10" fill="#3D4F65">relevant</text>
  <text x="480" y="220" text-anchor="middle" font-size="10" fill="#3D4F65">relevant</text>

  <!-- noise event -->
  <circle cx="420" cy="280" r="12" fill="#F2F2F2" stroke="#B0B0B0" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="420" y="305" text-anchor="middle" font-size="10" fill="#8A8A8A">noise (down-weighted)</text>

  <!-- Cross-attention arrows -->
  <line x1="162" y1="208" x2="342" y2="201" stroke="#4B8BDA" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="162" y1="212" x2="462" y2="184" stroke="#4B8BDA" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="160" y1="230" x2="406" y2="275" stroke="#B8C4D2" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arGray)"/>

  <text x="285" y="160" text-anchor="middle" font-size="12" font-style="italic" fill="#1E3A5F">cross-attention: which event matches me?</text>

  <!-- bottom takeaway -->
  <rect x="100" y="350" width="400" height="48" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="300" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">Profile-as-query → calibrated sparse embedding (ConvAUE)</text>
  <text x="300" y="388" text-anchor="middle" font-size="11" fill="#3D4F65">implicit regularizer, avoids trivial &quot;no-convert&quot; pattern</text>
</svg>
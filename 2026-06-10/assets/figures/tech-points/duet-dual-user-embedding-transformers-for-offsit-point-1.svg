<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D98154"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">两种"语言"，分开学习</text>

  <!-- Click stream -->
  <rect x="50" y="70" width="200" height="84" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="150" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">点击流</text>
  <text x="150" y="122" text-anchor="middle" font-size="12" fill="#3D4F65">密集 · 短延迟</text>
  <text x="150" y="142" text-anchor="middle" font-size="12" fill="#3D4F65">负样本下采样</text>

  <!-- Conversion stream -->
  <rect x="350" y="70" width="200" height="84" rx="10" fill="#FCEFE6" stroke="#D98154" stroke-width="1.5"/>
  <text x="450" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">转化流</text>
  <text x="450" y="122" text-anchor="middle" font-size="12" fill="#3D4F65">稀疏 · 长归因</text>
  <text x="450" y="142" text-anchor="middle" font-size="12" fill="#3D4F65">含未归因弱监督</text>

  <!-- Encoders -->
  <line x1="150" y1="156" x2="150" y2="194" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="450" y1="156" x2="450" y2="194" stroke="#D98154" stroke-width="2" marker-end="url(#aro)"/>

  <circle cx="150" cy="230" r="36" fill="#4B8BDA"/>
  <text x="150" y="227" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">ClickAUN</text>
  <text x="150" y="244" text-anchor="middle" font-size="10" fill="#EFF6FF">探索画像</text>

  <circle cx="450" cy="230" r="36" fill="#D98154"/>
  <text x="450" y="227" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">ConvAUN</text>
  <text x="450" y="244" text-anchor="middle" font-size="10" fill="#FCEFE6">下单画像</text>

  <!-- Downstream ranker -->
  <rect x="190" y="325" width="220" height="68" rx="10" fill="#1E3A5F"/>
  <text x="300" y="354" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">下游 Ranker</text>
  <text x="300" y="376" text-anchor="middle" font-size="11" fill="#B7CCE5">拼接两类嵌入 · 冻结使用</text>

  <line x1="176" y1="262" x2="244" y2="322" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="424" y1="262" x2="356" y2="322" stroke="#D98154" stroke-width="2" marker-end="url(#aro)"/>
</svg>
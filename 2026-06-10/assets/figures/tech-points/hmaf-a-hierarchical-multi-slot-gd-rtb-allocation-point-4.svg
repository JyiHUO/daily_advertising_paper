<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E3A5F">新合约冷启动：用同类均值兜底</text>

  <!-- New contract icon (empty) -->
  <g>
    <rect x="50" y="100" width="140" height="150" rx="10" fill="#FFF4E6" stroke="#E5A35C" stroke-width="2"/>
    <text x="120" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">新 GD 合约</text>
    <text x="120" y="154" text-anchor="middle" font-size="12" fill="#3D4F65">北京 · 火锅</text>
    <text x="120" y="200" text-anchor="middle" font-size="34" fill="#C97A3A">∅</text>
    <text x="120" y="230" text-anchor="middle" font-size="11" fill="#3D4F65">无投放历史</text>
  </g>

  <!-- Historical pool -->
  <g>
    <rect x="230" y="100" width="160" height="150" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="310" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">城市 × 品类 历史池</text>
    <text x="310" y="200" text-anchor="middle" font-size="22" fill="#1E3A5F">ᾱ , δ̄</text>
    <text x="310" y="230" text-anchor="middle" font-size="11" fill="#3D4F65">平均稀缺度</text>
  </g>

  <!-- PID fine tune -->
  <g>
    <rect x="430" y="100" width="130" height="150" rx="10" fill="#E8F3EC" stroke="#5BA876" stroke-width="2"/>
    <text x="495" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">PID 微调</text>
    <text x="495" y="154" text-anchor="middle" font-size="12" fill="#3D4F65">在线小幅修正</text>
    <path d="M450 205 Q470 185 485 200 T540 197" fill="none" stroke="#5BA876" stroke-width="2.5"/>
    <text x="495" y="232" text-anchor="middle" font-size="11" fill="#3D4F65">曲线平滑</text>
  </g>

  <!-- arrows -->
  <line x1="190" y1="175" x2="228" y2="175" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="390" y1="175" x2="428" y2="175" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>

  <text x="209" y="168" text-anchor="middle" font-size="10" fill="#4B8BDA">借用</text>
  <text x="409" y="168" text-anchor="middle" font-size="10" fill="#4B8BDA">初始化</text>

  <!-- bottom result -->
  <g>
    <rect x="120" y="310" width="360" height="70" rx="10" fill="#F6F4EE" stroke="#B7A982" stroke-width="1.5"/>
    <text x="300" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">先按平均稀缺度参与竞价，数据进来后再修正</text>
    <text x="300" y="362" text-anchor="middle" font-size="12" fill="#3D4F65">避免冷启动抖动：一日一规划 + 在线轻校准</text>
  </g>

  <line x1="300" y1="252" x2="300" y2="308" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
</svg>
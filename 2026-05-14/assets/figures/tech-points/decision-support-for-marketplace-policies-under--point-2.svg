<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C4704A"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">OPE 高均值 ≠ 可信证据</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#3D4F65">先看支持度，再看 lift</text>

  <!-- Left: shaky tower of evidence -->
  <g transform="translate(60,110)">
    <text x="125" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">目标动作在日志中几乎没出现</text>

    <!-- sparse dots + one heavy weight -->
    <circle cx="30" cy="60" r="5" fill="#C4D9F0"/>
    <circle cx="80" cy="75" r="5" fill="#C4D9F0"/>
    <circle cx="170" cy="55" r="22" fill="#C4704A" opacity="0.85"/>
    <text x="170" y="59" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">大权重</text>
    <circle cx="220" cy="80" r="5" fill="#C4D9F0"/>

    <!-- tower of OPE estimate -->
    <g transform="translate(45,140)">
      <rect x="20" y="60" width="120" height="22" fill="#EFF6FF" stroke="#4B8BDA"/>
      <rect x="30" y="38" width="100" height="22" fill="#EFF6FF" stroke="#4B8BDA"/>
      <rect x="40" y="16" width="80" height="22" fill="#EFF6FF" stroke="#4B8BDA"/>
      <polygon points="55,16 105,16 80,-4" fill="#C4704A"/>
      <text x="80" y="32" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">DR</text>
      <text x="80" y="54" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">+50%</text>
      <text x="80" y="76" text-anchor="middle" font-size="10" fill="#3D4F65">少数样本</text>
      <text x="80" y="105" text-anchor="middle" font-size="11" fill="#3D4F65">空中楼阁式估计</text>
    </g>
  </g>

  <!-- Right: three diagnostic gates -->
  <g transform="translate(460,100)">
    <text x="120" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">支持度三道闸</text>

    <g transform="translate(0,40)">
      <rect width="260" height="50" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="16" y="22" font-size="13" fill="#1E3A5F" font-weight="600">① 动作覆盖</text>
      <text x="16" y="40" font-size="11" fill="#3D4F65">目标动作真的出现过吗？</text>
    </g>
    <g transform="translate(0,105)">
      <rect width="260" height="50" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="16" y="22" font-size="13" fill="#1E3A5F" font-weight="600">② 有效样本量 ESS</text>
      <text x="16" y="40" font-size="11" fill="#3D4F65">权重是否集中在少数样本？</text>
    </g>
    <g transform="translate(0,170)">
      <rect width="260" height="50" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="16" y="22" font-size="13" fill="#1E3A5F" font-weight="600">③ 裁剪稳定性</text>
      <text x="16" y="40" font-size="11" fill="#3D4F65">clipping 后排名是否还稳？</text>
    </g>
  </g>

  <!-- Decisions -->
  <g transform="translate(460,400)">
    <rect x="0" y="0" width="120" height="48" rx="24" fill="#E8F1E5" stroke="#6B9362"/>
    <text x="60" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">三关全过</text>
    <text x="60" y="38" text-anchor="middle" font-size="11" fill="#3D4F65">→ 值得在线验证</text>

    <rect x="140" y="0" width="120" height="48" rx="24" fill="#FBE9DC" stroke="#C4704A"/>
    <text x="200" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">任一不过</text>
    <text x="200" y="38" text-anchor="middle" font-size="11" fill="#3D4F65">→ 证据不足，hold</text>
  </g>

  <!-- Arrow from left tower to gates -->
  <path d="M320,260 C380,240 410,200 455,180" stroke="#C4704A" stroke-width="2" fill="none" marker-end="url(#arRed)"/>
  <text x="345" y="225" font-size="11" fill="#C4704A" font-style="italic">不能直接信点估计</text>

  <!-- gates to decision -->
  <path d="M590,325 L590,396" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">O(1) 查表式行为检索</text>
  <text x="400" y="62" text-anchor="middle" font-size="12" fill="#3D4F65">用哈希查表代替逐条相似度计算</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97A3F"/>
    </marker>
  </defs>

  <!-- LEFT: Old way -->
  <g>
    <text x="200" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#9A6B3F">传统：逐条比对 O(L·d)</text>

    <!-- target -->
    <circle cx="70" cy="240" r="22" fill="#FCE9D6" stroke="#C97A3F" stroke-width="2"/>
    <text x="70" y="244" text-anchor="middle" font-size="11" fill="#1E3A5F">target</text>

    <!-- behaviors stack -->
    <g fill="#F5EFE6" stroke="#B59477" stroke-width="1.3">
      <rect x="220" y="140" width="110" height="22" rx="3"/>
      <rect x="220" y="170" width="110" height="22" rx="3"/>
      <rect x="220" y="200" width="110" height="22" rx="3"/>
      <rect x="220" y="230" width="110" height="22" rx="3"/>
      <rect x="220" y="260" width="110" height="22" rx="3"/>
      <rect x="220" y="290" width="110" height="22" rx="3"/>
      <rect x="220" y="320" width="110" height="22" rx="3"/>
    </g>
    <text x="275" y="360" text-anchor="middle" font-size="11" fill="#3D4F65">L 条历史行为</text>

    <!-- comparison lines -->
    <g stroke="#C97A3F" stroke-width="1" opacity="0.55">
      <line x1="92" y1="240" x2="220" y2="151"/>
      <line x1="92" y1="240" x2="220" y2="181"/>
      <line x1="92" y1="240" x2="220" y2="211"/>
      <line x1="92" y1="240" x2="220" y2="241"/>
      <line x1="92" y1="240" x2="220" y2="271"/>
      <line x1="92" y1="240" x2="220" y2="301"/>
      <line x1="92" y1="240" x2="220" y2="331"/>
    </g>
  </g>

  <!-- divider -->
  <line x1="400" y1="90" x2="400" y2="400" stroke="#D6D9DE" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT: New way -->
  <g>
    <text x="600" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">GenLI：查表 O(1) / 条</text>

    <!-- hash table (interest distribution) -->
    <text x="600" y="135" text-anchor="middle" font-size="11" fill="#3D4F65">兴趣分布（哈希桶）</text>
    <g>
      <rect x="475" y="148" width="250" height="30" rx="3" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.4"/>
      <line x1="525" y1="148" x2="525" y2="178" stroke="#4B8BDA"/>
      <line x1="575" y1="148" x2="575" y2="178" stroke="#4B8BDA"/>
      <line x1="625" y1="148" x2="625" y2="178" stroke="#4B8BDA"/>
      <line x1="675" y1="148" x2="675" y2="178" stroke="#4B8BDA"/>
      <text x="500" y="168" text-anchor="middle" font-size="10" fill="#3D4F65">.01</text>
      <text x="550" y="168" text-anchor="middle" font-size="10" fill="#3D4F65">.04</text>
      <!-- highlighted bucket -->
      <rect x="600" y="149" width="25" height="28" fill="#FCE9D6" stroke="#C97A3F" stroke-width="1.5"/>
      <text x="612" y="168" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A5F">.21</text>
      <text x="650" y="168" text-anchor="middle" font-size="10" fill="#3D4F65">.03</text>
      <text x="700" y="168" text-anchor="middle" font-size="10" fill="#3D4F65">.02</text>
    </g>

    <!-- mod -->
    <rect x="540" y="225" width="120" height="32" rx="16" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="600" y="246" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">ID mod N</text>

    <!-- behavior -->
    <rect x="500" y="295" width="200" height="34" rx="4" fill="#F5EFE6" stroke="#B59477" stroke-width="1.4"/>
    <text x="600" y="316" text-anchor="middle" font-size="12" fill="#1E3A5F">行为 ID</text>

    <!-- behavior -> mod -->
    <line x1="600" y1="295" x2="600" y2="259" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
    <!-- mod -> bucket -->
    <line x1="600" y1="225" x2="612" y2="182" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>

    <!-- score readout -->
    <line x1="725" y1="163" x2="755" y2="163" stroke="#C97A3F" stroke-width="1.8" marker-end="url(#arO)"/>
    <text x="740" y="152" text-anchor="middle" font-size="11" fill="#C97A3F" font-weight="600">分数</text>

    <text x="600" y="362" text-anchor="middle" font-size="11" fill="#3D4F65">桶号即得分，无需算相似度</text>
  </g>

  <!-- Bottom takeaway -->
  <rect x="180" y="420" width="440" height="46" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.3"/>
  <text x="400" y="440" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">每条行为打分：O(d) → O(1)</text>
  <text x="400" y="458" text-anchor="middle" font-size="11" fill="#3D4F65">三种兴趣分布各取 top-k，长序列检索接近 O(L)</text>
</svg>
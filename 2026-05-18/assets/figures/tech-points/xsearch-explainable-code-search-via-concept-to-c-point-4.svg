<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">分布迁移：捷径学习 vs 概念对齐</text>

  <!-- Query -->
  <rect x="200" y="60" width="200" height="46" rx="6" fill="#FFF4E6" stroke="#E0A458" stroke-width="1.5"/>
  <text x="300" y="80" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">query</text>
  <text x="300" y="96" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">angle between two vectors</text>

  <!-- Bi-encoder path -->
  <g>
    <rect x="40" y="150" width="240" height="110" rx="8" fill="#FEF2F2" stroke="#D9534F" stroke-width="1.5"/>
    <text x="160" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Bi-encoder：整体相似度</text>
    <text x="160" y="206" text-anchor="middle" font-size="11" fill="#3D4F65">✓ 命中 "two vectors" 捷径</text>
    <text x="160" y="228" text-anchor="middle" font-size="11" fill="#D9534F">✗ 忽略 "angle" 真实语义</text>

    <text x="160" y="294" text-anchor="middle" font-size="12" fill="#1E3A5F">OOD MRR</text>
    <text x="160" y="324" text-anchor="middle" font-size="24" font-weight="800" fill="#D9534F">0.02</text>
    <text x="160" y="344" text-anchor="middle" font-size="10" fill="#3D4F65">分布一换就崩</text>
  </g>

  <!-- XSearch path -->
  <g>
    <rect x="320" y="150" width="240" height="110" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="440" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">XSearch：逐概念验证</text>

    <rect x="345" y="194" width="13" height="13" rx="2" fill="#fff" stroke="#4B8BDA" stroke-width="1.3"/>
    <path d="M347,201 L351,205 L356,197" fill="none" stroke="#2E8B57" stroke-width="2"/>
    <text x="365" y="205" font-size="11" fill="#3D4F65">two vectors</text>

    <rect x="455" y="194" width="13" height="13" rx="2" fill="#fff" stroke="#4B8BDA" stroke-width="1.3"/>
    <path d="M457,201 L461,205 L466,197" fill="none" stroke="#2E8B57" stroke-width="2"/>
    <text x="475" y="205" font-size="11" fill="#3D4F65">angle</text>

    <rect x="345" y="222" width="13" height="13" rx="2" fill="#fff" stroke="#4B8BDA" stroke-width="1.3"/>
    <path d="M347,229 L351,233 L356,225" fill="none" stroke="#2E8B57" stroke-width="2"/>
    <text x="365" y="233" font-size="11" fill="#3D4F65">python</text>

    <text x="475" y="233" font-size="10" fill="#2E8B57" font-style="italic">全部覆盖</text>

    <text x="440" y="294" text-anchor="middle" font-size="12" fill="#1E3A5F">OOD MRR</text>
    <text x="440" y="324" text-anchor="middle" font-size="24" font-weight="800" fill="#2E8B57">0.33</text>
    <text x="440" y="344" text-anchor="middle" font-size="10" fill="#3D4F65">125M 参数</text>
  </g>

  <!-- arrows from query -->
  <line x1="260" y1="106" x2="180" y2="148" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="340" y1="106" x2="420" y2="148" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- bottom takeaway -->
  <line x1="160" y1="370" x2="440" y2="370" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="300" y="392" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="700">演绎式逐概念匹配 → 抗分布漂移 ×15</text>
  <text x="300" y="408" text-anchor="middle" font-size="10" fill="#3D4F65">CodeSearchNet → CoSQA+</text>
</svg>
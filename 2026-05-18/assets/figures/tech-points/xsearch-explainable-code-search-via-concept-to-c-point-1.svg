<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B8956A"/>
    </marker>
  </defs>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">从整体匹配 → 逐概念对齐</text>

  <!-- LEFT: traditional -->
  <text x="160" y="72" text-anchor="middle" font-size="12" fill="#8A6A3A" font-weight="600">传统：一个向量打包整句</text>

  <rect x="40" y="90" width="240" height="56" rx="8" fill="#FFF4E6" stroke="#D9A66B" stroke-width="1.5"/>
  <text x="160" y="113" text-anchor="middle" font-size="12" fill="#1E3A5F">"delete existing collection</text>
  <text x="160" y="131" text-anchor="middle" font-size="12" fill="#1E3A5F">in CosmosDB"</text>

  <path d="M160,148 L160,196" stroke="#B8956A" stroke-width="2" marker-end="url(#b)"/>

  <circle cx="160" cy="228" r="30" fill="#3D4F65"/>
  <text x="160" y="232" text-anchor="middle" font-size="11" fill="#FFF">单向量</text>
  <text x="160" y="282" text-anchor="middle" font-size="11" fill="#8A6A3A">⚠ 捷径学习 / 黑盒打分</text>

  <text x="160" y="335" text-anchor="middle" font-size="11" fill="#3D4F65">delete / existing / collection</text>
  <text x="160" y="352" text-anchor="middle" font-size="11" fill="#3D4F65">谁重要全靠模型自己悟</text>

  <!-- divider -->
  <line x1="370" y1="70" x2="370" y2="430" stroke="#C8D4E0" stroke-dasharray="4,4"/>

  <!-- RIGHT: concept decomposition -->
  <text x="565" y="72" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">本文：拆成功能概念，逐一落点</text>

  <rect x="430" y="90" width="270" height="56" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="565" y="113" text-anchor="middle" font-size="12" fill="#1E3A5F">"delete existing collection</text>
  <text x="565" y="131" text-anchor="middle" font-size="12" fill="#1E3A5F">in CosmosDB"</text>

  <!-- split arrows -->
  <path d="M510,148 L478,192" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>
  <path d="M620,148 L652,192" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>

  <!-- concept 1 -->
  <rect x="395" y="198" width="165" height="46" rx="22" fill="#DCEBFB" stroke="#4B8BDA"/>
  <text x="477" y="218" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">概念①</text>
  <text x="477" y="234" text-anchor="middle" font-size="11" fill="#3D4F65">delete + collection</text>

  <!-- concept 2 -->
  <rect x="580" y="198" width="140" height="46" rx="22" fill="#DCEBFB" stroke="#4B8BDA"/>
  <text x="650" y="218" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">概念②</text>
  <text x="650" y="234" text-anchor="middle" font-size="11" fill="#3D4F65">CosmosDB</text>

  <!-- alignment arrows -->
  <path d="M477,244 L477,293" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>
  <path d="M650,244 L650,293" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>

  <!-- code lines -->
  <rect x="395" y="298" width="325" height="98" rx="6" fill="#F7FAFD" stroke="#A8BED4"/>
  <text x="408" y="316" font-size="11" fill="#8FA3B8" font-family="monospace">def delete():</text>

  <rect x="403" y="324" width="305" height="22" rx="3" fill="#FFE8B8"/>
  <text x="412" y="339" font-size="11" fill="#1E3A5F" font-family="monospace">self.get_conn().DeleteContainer(...)</text>

  <rect x="403" y="354" width="245" height="22" rx="3" fill="#FFD9A8"/>
  <text x="412" y="369" font-size="11" fill="#1E3A5F" font-family="monospace">get_database_name(...)</text>

  <text x="565" y="420" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">✓ 每个需求都对齐到具体代码行</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E08B4A"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">三视角兴趣 · 门控融合</text>
  <text x="300" y="54" text-anchor="middle" font-size="11" fill="#3D4F65">不同候选广告，按需放大不同视角</text>

  <!-- Three interest vectors (left) -->
  <g>
    <circle cx="90" cy="130" r="36" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
    <text x="90" y="127" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">隐式</text>
    <text x="90" y="144" text-anchor="middle" font-size="10" fill="#3D4F65">稳定刚需</text>

    <circle cx="90" cy="220" r="36" fill="#FFF1E6" stroke="#E08B4A" stroke-width="1.6"/>
    <text x="90" y="217" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">显式</text>
    <text x="90" y="234" text-anchor="middle" font-size="10" fill="#3D4F65">强辣偏好</text>

    <circle cx="90" cy="310" r="36" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
    <text x="90" y="307" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">相对</text>
    <text x="90" y="324" text-anchor="middle" font-size="10" fill="#3D4F65">对比偏好</text>
  </g>

  <!-- Gate (mixer) -->
  <g>
    <rect x="240" y="150" width="160" height="140" rx="10" fill="#FEF6E4" stroke="#1E3A5F" stroke-width="1.6"/>
    <text x="320" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">门控融合</text>
    <text x="320" y="194" text-anchor="middle" font-size="10" fill="#3D4F65">target → sigmoid</text>

    <g font-size="10" fill="#3D4F65">
      <circle cx="270" cy="222" r="6" fill="#4B8BDA"/>
      <text x="284" y="226">0.2 · 隐式</text>
      <circle cx="270" cy="248" r="6" fill="#E08B4A"/>
      <text x="284" y="252">0.7 · 显式</text>
      <circle cx="270" cy="274" r="6" fill="#4B8BDA"/>
      <text x="284" y="278">0.5 · 相对</text>
    </g>
  </g>

  <!-- Arrows from circles to gate -->
  <path d="M126,130 C180,140 210,170 240,190" fill="none" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M126,220 L240,220" fill="none" stroke="#E08B4A" stroke-width="2" marker-end="url(#ar2)"/>
  <path d="M126,310 C180,300 210,270 240,250" fill="none" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Output -->
  <g>
    <rect x="440" y="190" width="130" height="60" rx="10" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="1.6"/>
    <text x="505" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">长期兴趣 x_l</text>
    <text x="505" y="234" text-anchor="middle" font-size="10" fill="#3D4F65">送入 CTR 打分</text>
  </g>
  <path d="M400,220 L440,220" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Bottom hint -->
  <text x="300" y="385" text-anchor="middle" font-size="11" fill="#3D4F65">候选广告不同 → 门控权重不同 → 突出最相关视角</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">不看候选广告，一次画出三张兴趣热力图</text>

  <!-- Source: recent behaviors -->
  <g>
    <rect x="60" y="180" width="170" height="120" rx="14" fill="#FFF4E6" stroke="#E8A65A" stroke-width="2"/>
    <text x="145" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">最近行为</text>
    <text x="145" y="244" text-anchor="middle" font-size="12" fill="#3D4F65">奶茶 · 咖啡</text>
    <text x="145" y="262" text-anchor="middle" font-size="12" fill="#3D4F65">蛋糕 · 烧烤</text>
    <text x="145" y="285" text-anchor="middle" font-size="11" fill="#8A6A3D">（不依赖目标item）</text>
  </g>

  <!-- IGM core -->
  <g>
    <circle cx="380" cy="240" r="62" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2.5"/>
    <text x="380" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">IGM</text>
    <text x="380" y="256" text-anchor="middle" font-size="11" fill="#3D4F65">生成式</text>
    <text x="380" y="272" text-anchor="middle" font-size="11" fill="#3D4F65">兴趣分布</text>
  </g>

  <line x1="232" y1="240" x2="316" y2="240" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- Explicit -->
  <g>
    <rect x="560" y="90" width="200" height="100" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="660" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">显式兴趣</text>
    <text x="660" y="128" text-anchor="middle" font-size="10" fill="#3D4F65">真实点击监督</text>
    <g transform="translate(580,140)">
      <rect x="0" y="14" width="14" height="36" fill="#4B8BDA"/>
      <rect x="22" y="4" width="14" height="46" fill="#4B8BDA"/>
      <rect x="44" y="20" width="14" height="30" fill="#4B8BDA"/>
      <rect x="66" y="34" width="14" height="16" fill="#9FBEE3"/>
      <rect x="88" y="38" width="14" height="12" fill="#9FBEE3"/>
      <rect x="110" y="32" width="14" height="18" fill="#9FBEE3"/>
      <rect x="132" y="40" width="14" height="10" fill="#9FBEE3"/>
      <rect x="154" y="42" width="14" height="8" fill="#9FBEE3"/>
    </g>
  </g>

  <!-- Implicit -->
  <g>
    <rect x="560" y="210" width="200" height="100" rx="12" fill="#FFF4E6" stroke="#E8A65A" stroke-width="2"/>
    <text x="660" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">隐式兴趣</text>
    <text x="660" y="248" text-anchor="middle" font-size="10" fill="#3D4F65">曝光item监督</text>
    <g transform="translate(580,260)">
      <rect x="0" y="20" width="14" height="30" fill="#E8A65A"/>
      <rect x="22" y="14" width="14" height="36" fill="#E8A65A"/>
      <rect x="44" y="10" width="14" height="40" fill="#E8A65A"/>
      <rect x="66" y="6" width="14" height="44" fill="#E8A65A"/>
      <rect x="88" y="18" width="14" height="32" fill="#E8A65A"/>
      <rect x="110" y="26" width="14" height="24" fill="#F0C28E"/>
      <rect x="132" y="32" width="14" height="18" fill="#F0C28E"/>
      <rect x="154" y="38" width="14" height="12" fill="#F0C28E"/>
    </g>
  </g>

  <!-- Relative -->
  <g>
    <rect x="560" y="330" width="200" height="100" rx="12" fill="#F3EBFB" stroke="#8B6FB8" stroke-width="2"/>
    <text x="660" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">相对兴趣</text>
    <text x="660" y="368" text-anchor="middle" font-size="10" fill="#3D4F65">显式 − 隐式 → softmax</text>
    <g transform="translate(580,380)">
      <rect x="0" y="6" width="14" height="44" fill="#8B6FB8"/>
      <rect x="22" y="2" width="14" height="48" fill="#8B6FB8"/>
      <rect x="44" y="22" width="14" height="28" fill="#B89FD2"/>
      <rect x="66" y="40" width="14" height="10" fill="#B89FD2"/>
      <rect x="88" y="44" width="14" height="6" fill="#B89FD2"/>
      <rect x="110" y="42" width="14" height="8" fill="#B89FD2"/>
      <rect x="132" y="46" width="14" height="4" fill="#B89FD2"/>
      <rect x="154" y="46" width="14" height="4" fill="#B89FD2"/>
    </g>
  </g>

  <!-- Arrows from IGM to three targets (end on left edge of each box) -->
  <path d="M434,206 Q496,170 558,140" fill="none" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#ar)"/>
  <line x1="442" y1="240" x2="558" y2="260" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#ar)"/>
  <path d="M434,274 Q496,330 558,378" fill="none" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- Bottom note -->
  <text x="400" y="475" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">一次前向 · 全面覆盖兴趣面 · 不被候选item牵着走</text>
</svg>
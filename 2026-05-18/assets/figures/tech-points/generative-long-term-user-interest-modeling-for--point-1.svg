<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E0A458"/>
    </marker>
    <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B6FBF"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E3A5F">一次生成 · 三张兴趣热力图</text>
  <text x="360" y="58" text-anchor="middle" font-size="12" fill="#3D4F65">目标无关 · 每次请求只算一次 · 历史行为打分变成查表 O(1)</text>

  <!-- Source: short-term behaviors -->
  <g>
    <rect x="30" y="170" width="160" height="100" rx="10" fill="#FFF4E6" stroke="#E0A458" stroke-width="1.6"/>
    <text x="110" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">最近短期行为</text>
    <text x="110" y="225" text-anchor="middle" font-size="11" fill="#3D4F65">火锅 · 川菜 · 麻辣烫</text>
    <text x="110" y="252" text-anchor="middle" font-size="10" fill="#7A8A9A" font-style="italic">仅 10~100 条</text>
  </g>

  <!-- IGM core -->
  <g>
    <circle cx="290" cy="220" r="52" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="290" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">IGM</text>
    <text x="290" y="234" text-anchor="middle" font-size="10" fill="#3D4F65">生成式</text>
  </g>

  <!-- Arrow in -->
  <line x1="190" y1="220" x2="236" y2="220" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Explicit -->
  <g transform="translate(420,90)">
    <rect width="240" height="92" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.4"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#1E3A5F">显式兴趣 · 川渝辣味↑</text>
    <text x="14" y="38" font-size="10" fill="#3D4F65">真实点击监督</text>
    <g fill="#4B8BDA">
      <rect x="14" y="52" width="8" height="28"/>
      <rect x="26" y="58" width="8" height="22"/>
      <rect x="38" y="46" width="8" height="34"/>
      <rect x="50" y="64" width="8" height="16"/>
      <rect x="62" y="68" width="8" height="12"/>
      <rect x="74" y="72" width="8" height="8"/>
      <rect x="86" y="70" width="8" height="10"/>
      <rect x="98" y="74" width="8" height="6"/>
      <rect x="110" y="76" width="8" height="4"/>
      <rect x="122" y="74" width="8" height="6"/>
      <rect x="134" y="72" width="8" height="8"/>
      <rect x="146" y="76" width="8" height="4"/>
      <rect x="158" y="74" width="8" height="6"/>
      <rect x="170" y="76" width="8" height="4"/>
      <rect x="182" y="78" width="8" height="2"/>
      <rect x="194" y="76" width="8" height="4"/>
      <rect x="206" y="78" width="8" height="2"/>
      <rect x="218" y="77" width="8" height="3"/>
    </g>
  </g>

  <!-- Implicit -->
  <g transform="translate(420,194)">
    <rect width="240" height="92" rx="8" fill="#FEF6F0" stroke="#E0A458" stroke-width="1.4"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#1E3A5F">隐式兴趣 · 快餐/奶茶↑</text>
    <text x="14" y="38" font-size="10" fill="#3D4F65">曝光监督 · 长期默认偏好</text>
    <g fill="#E0A458">
      <rect x="14" y="68" width="8" height="12"/>
      <rect x="26" y="64" width="8" height="16"/>
      <rect x="38" y="70" width="8" height="10"/>
      <rect x="50" y="50" width="8" height="30"/>
      <rect x="62" y="44" width="8" height="36"/>
      <rect x="74" y="56" width="8" height="24"/>
      <rect x="86" y="62" width="8" height="18"/>
      <rect x="98" y="66" width="8" height="14"/>
      <rect x="110" y="70" width="8" height="10"/>
      <rect x="122" y="68" width="8" height="12"/>
      <rect x="134" y="72" width="8" height="8"/>
      <rect x="146" y="70" width="8" height="10"/>
      <rect x="158" y="74" width="8" height="6"/>
      <rect x="170" y="72" width="8" height="8"/>
      <rect x="182" y="74" width="8" height="6"/>
      <rect x="194" y="76" width="8" height="4"/>
      <rect x="206" y="74" width="8" height="6"/>
      <rect x="218" y="76" width="8" height="4"/>
    </g>
  </g>

  <!-- Relative -->
  <g transform="translate(420,298)">
    <rect width="240" height="92" rx="8" fill="#F3EEFB" stroke="#8B6FBF" stroke-width="1.4"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#1E3A5F">相对兴趣 = 显式 − 隐式</text>
    <text x="14" y="38" font-size="10" fill="#3D4F65">相对默认推荐更想点什么</text>
    <g fill="#8B6FBF">
      <rect x="14" y="58" width="8" height="22"/>
      <rect x="26" y="62" width="8" height="18"/>
      <rect x="38" y="42" width="8" height="38"/>
      <rect x="50" y="72" width="8" height="8"/>
      <rect x="62" y="76" width="8" height="4"/>
      <rect x="74" y="74" width="8" height="6"/>
      <rect x="86" y="72" width="8" height="8"/>
      <rect x="98" y="76" width="8" height="4"/>
      <rect x="110" y="78" width="8" height="2"/>
      <rect x="122" y="76" width="8" height="4"/>
      <rect x="134" y="74" width="8" height="6"/>
      <rect x="146" y="78" width="8" height="2"/>
      <rect x="158" y="76" width="8" height="4"/>
      <rect x="170" y="78" width="8" height="2"/>
      <rect x="182" y="77" width="8" height="3"/>

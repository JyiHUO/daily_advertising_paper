      <rect x="206" y="78" width="8" height="2"/>
      <rect x="218" y="79" width="8" height="1"/>
    </g>
  </g>

  <!-- Arrows from IGM to three distributions -->
  <line x1="335" y1="190" x2="418" y2="140" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="342" y1="220" x2="418" y2="240" stroke="#E0A458" stroke-width="1.8" marker-end="url(#ah2)"/>
  <line x1="335" y1="250" x2="418" y2="340" stroke="#8B6FBF" stroke-width="1.8" marker-end="url(#ah3)"/>

  <!-- Bottom note -->
  <text x="360" y="430" text-anchor="middle" font-size="11" fill="#3D4F65">每条长期历史行为 → 直接在 4096 维分布上查一下分数</text>
</svg>
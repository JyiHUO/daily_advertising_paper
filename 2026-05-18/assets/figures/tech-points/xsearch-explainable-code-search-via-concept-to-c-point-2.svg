<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8553D"/>
    </marker>
  </defs>

  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">挑出"骗过模型"的硬负样本</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#3D4F65">用独立参考模型识别伪相似，专攻易错点</text>

  <!-- Query concept -->
  <rect x="30" y="95" width="180" height="62" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
  <text x="120" y="122" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">query 概念</text>
  <text x="120" y="142" text-anchor="middle" font-size="12" fill="#3D4F65" font-style="italic">"open file handle"</text>

  <!-- Candidate -->
  <rect x="260" y="95" width="200" height="62" rx="10" fill="#FFF3E8" stroke="#E2A24A" stroke-width="1.6"/>
  <text x="360" y="120" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">候选代码：close file</text>
  <text x="360" y="142" text-anchor="middle" font-size="11" fill="#3D4F65">当前模型 cos 高 ✓（看似相关）</text>

  <line x1="210" y1="126" x2="258" y2="126" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- Reference model -->
  <g>
    <circle cx="570" cy="126" r="48" fill="#FDECEC" stroke="#C8553D" stroke-width="1.8"/>
    <text x="570" y="116" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">参考模型 mpnet</text>
    <text x="570" y="135" text-anchor="middle" font-size="11" fill="#C8553D" font-weight="700">语义不符 ✗</text>
  </g>
  <line x1="460" y1="126" x2="520" y2="126" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- Verdict -->
  <rect x="210" y="210" width="300" height="58" rx="10" fill="#FFFBEA" stroke="#C8553D" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="360" y="234" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="700">标记为硬负样本</text>
  <text x="360" y="254" text-anchor="middle" font-size="11" fill="#3D4F65">模型最容易搞错的，最值得训练</text>

  <line x1="360" y1="159" x2="360" y2="208" stroke="#C8553D" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arR)"/>
  <line x1="555" y1="172" x2="470" y2="210" stroke="#C8553D" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arR)"/>

  <!-- Push apart -->
  <text x="360" y="320" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">InfoNCE：把硬负样本从 query 概念推远，正样本拉近</text>

  <circle cx="180" cy="400" r="24" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="180" y="404" text-anchor="middle" font-size="11" fill="#1E3A5F">query</text>

  <circle cx="540" cy="400" r="24" fill="#FDECEC" stroke="#C8553D" stroke-width="2"/>
  <text x="540" y="404" text-anchor="middle" font-size="11" fill="#C8553D">hard neg</text>

  <line x1="206" y1="400" x2="514" y2="400" stroke="#C8553D" stroke-width="2" marker-end="url(#arR)" marker-start="url(#arR)"/>
  <text x="360" y="392" text-anchor="middle" font-size="11" fill="#C8553D">推远</text>

  <circle cx="360" cy="450" r="20" fill="#E8F3EC" stroke="#5BA37B" stroke-width="2"/>
  <text x="360" y="454" text-anchor="middle" font-size="10" fill="#1E3A5F">正样本</text>
  <line x1="200" y1="418" x2="343" y2="444" stroke="#5BA37B" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="260" y="442" text-anchor="middle" font-size="10" fill="#5BA37B">拉近</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="480" fill="#FAF7F2"/>
  
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E3A5F">分诊式标注 · 简单留下，难者上转</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">置信度不够 → 升级到更大模型</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Samples on the left -->
  <g>
    <circle cx="70" cy="240" r="10" fill="#4B8BDA"/>
    <circle cx="70" cy="270" r="10" fill="#4B8BDA"/>
    <circle cx="70" cy="300" r="10" fill="#4B8BDA"/>
    <text x="70" y="335" text-anchor="middle" font-size="12" fill="#3D4F65">样本</text>
  </g>

  <!-- Tier 1: small -->
  <rect x="160" y="180" width="140" height="140" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="230" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">184M cross-encoder</text>
  <text x="230" y="262" text-anchor="middle" font-size="22" font-weight="bold" fill="#D97757">74.5%</text>
  <text x="230" y="282" text-anchor="middle" font-size="11" fill="#3D4F65">在此截停</text>

  <!-- Tier 2: medium -->
  <rect x="340" y="155" width="140" height="190" rx="10" fill="#FFF4E6" stroke="#E89B4C" stroke-width="2"/>
  <text x="410" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">2B LLM</text>
  <text x="410" y="208" text-anchor="middle" font-size="11" fill="#3D4F65">LoRA 微调</text>

  <!-- Tier 3: large -->
  <rect x="520" y="125" width="160" height="250" rx="10" fill="#FFE8DC" stroke="#D97757" stroke-width="2"/>
  <text x="600" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">8B LLM</text>
  <text x="600" y="178" text-anchor="middle" font-size="11" fill="#3D4F65">最难的样本</text>

  <!-- Arrows between tiers -->
  <line x1="85" y1="270" x2="158" y2="250" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="302" y1="225" x2="338" y2="220" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="320" y="212" text-anchor="middle" font-size="10" fill="#3D4F65">不确定</text>

  <line x1="482" y1="210" x2="518" y2="205" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="500" y="197" text-anchor="middle" font-size="10" fill="#3D4F65">还不确定</text>

  <!-- Calibration callout at bottom -->
  <rect x="160" y="395" width="520" height="60" rx="8" fill="#F5EFE6" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="420" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">每档单独 isotonic 校准</text>
  <text x="420" y="440" text-anchor="middle" font-size="11" fill="#3D4F65">两端过度自信，中间档不够自信，各拟合一条曲线</text>

  <!-- agreement badge -->
  <circle cx="730" cy="80" r="42" fill="#1E3A5F"/>
  <text x="730" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#FAF7F2">89.1%</text>
  <text x="730" y="94" text-anchor="middle" font-size="10" fill="#FAF7F2">对齐人工</text>
</svg>
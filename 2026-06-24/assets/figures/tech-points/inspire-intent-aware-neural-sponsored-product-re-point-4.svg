<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-family="Helvetica,Arial" font-size="18" font-weight="700" fill="#1E3A5F">意图增强的监督分 = 相关性 + 行为护栏</text>

  <!-- Left: relevance -->
  <circle cx="130" cy="180" r="62" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="130" y="176" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="700" fill="#1E3A5F">Relevance</text>
  <text x="130" y="196" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">LLM 打分 0–4</text>

  <!-- Gate -->
  <rect x="245" y="150" width="110" height="60" rx="8" fill="#FFF4E6" stroke="#E08A3C" stroke-width="2"/>
  <text x="300" y="175" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="700" fill="#1E3A5F">护栏 gate</text>
  <text x="300" y="195" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">仅当 rel ≥ 2</text>

  <!-- Right: engagement -->
  <circle cx="470" cy="180" r="62" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="470" y="176" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="700" fill="#1E3A5F">Engagement</text>
  <text x="470" y="196" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">点击/加购/订单</text>

  <!-- arrows into gate -->
  <line x1="192" y1="180" x2="243" y2="180" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="408" y1="180" x2="357" y2="180" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- output supervision -->
  <line x1="300" y1="212" x2="300" y2="291" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#ar)"/>

  <rect x="160" y="295" width="280" height="72" rx="10" fill="#E8F0FB" stroke="#1E3A5F" stroke-width="2"/>
  <text x="300" y="322" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="700" fill="#1E3A5F">双塔 cosine ← 监督分 y</text>
  <text x="300" y="346" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">MNR 排序 + cosine 回归校准</text>

  <text x="300" y="390" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65" font-style="italic">"热门但不相关" 被挡在门外</text>
</svg>
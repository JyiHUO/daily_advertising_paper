<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">冷热分治：离线烘焙 + 在线缓存</text>

  <!-- Items side -->
  <g>
    <rect x="60" y="100" width="280" height="180" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="200" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">商品侧 · 几亿条 · 变化慢</text>

    <rect x="135" y="148" width="130" height="90" rx="8" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
    <circle cx="200" cy="193" r="22" fill="#FDE7C9" stroke="#D98F3C" stroke-width="2"/>
    <text x="200" y="198" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1E3A5F">vLLM</text>
    <rect x="155" y="225" width="90" height="6" fill="#1E3A5F"/>

    <text x="200" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">全目录批量预烘焙 · 每周刷新</text>
  </g>

  <!-- Query side -->
  <g>
    <rect x="460" y="100" width="280" height="180" rx="14" fill="#FFF4E6" stroke="#D98F3C" stroke-width="2"/>
    <text x="600" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">Query侧 · 长尾大 · 头部集中</text>

    <path d="M540 160 L540 240 Q540 250 550 250 L650 250 Q660 250 660 240 L660 160 Z" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
    <rect x="535" y="153" width="130" height="10" rx="3" fill="#1E3A5F"/>
    <circle cx="565" cy="195" r="6" fill="#4B8BDA"/>
    <circle cx="595" cy="210" r="6" fill="#4B8BDA"/>
    <circle cx="625" cy="190" r="6" fill="#4B8BDA"/>
    <circle cx="610" cy="230" r="6" fill="#D98F3C"/>
    <circle cx="575" cy="227" r="6" fill="#4B8BDA"/>

    <text x="600" y="272" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">头部命中缓存 · 长尾实时推理</text>
  </g>

  <!-- arrows to fusion -->
  <path d="M200 290 Q200 360 350 388" fill="none" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#arr)"/>
  <path d="M600 290 Q600 360 450 388" fill="none" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- fusion: two-tower -->
  <rect x="290" y="395" width="220" height="75" rx="12" fill="#1E3A5F"/>
  <text x="400" y="423" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">双塔召回</text>
  <text x="400" y="448" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#BCD4F2">意图对齐：gluten free ↔ gluten free</text>
</svg>
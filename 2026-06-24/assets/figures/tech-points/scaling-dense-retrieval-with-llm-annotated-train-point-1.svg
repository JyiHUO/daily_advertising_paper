<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">三路召回的分歧 = 训练样本金矿</text>

  <!-- Three retrieval circles (Venn-like) -->
  <circle cx="200" cy="210" r="78" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2" opacity="0.7"/>
  <circle cx="300" cy="210" r="78" fill="#FFF4E6" stroke="#E08A3C" stroke-width="2" opacity="0.65"/>
  <circle cx="250" cy="140" r="78" fill="#E8F0FA" stroke="#1E3A5F" stroke-width="2" opacity="0.55"/>

  <text x="160" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">词典</text>
  <text x="340" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">BM25</text>
  <text x="250" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">ANN</text>

  <text x="250" y="180" text-anchor="middle" font-size="11" fill="#3D4F65">三路一致 ≈13%</text>

  <!-- LLM judge -->
  <g transform="translate(490,180)">
    <circle r="42" fill="#FFFAF0" stroke="#E08A3C" stroke-width="2"/>
    <text y="-2" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">LLM 判分</text>
    <text y="16" text-anchor="middle" font-size="10" fill="#3D4F65">0–4 相关度</text>
  </g>
  <path d="M380,200 L446,185" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- Arrow down to buckets -->
  <path d="M490,225 L490,260 L300,260 L300,330" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- Section label -->
  <text x="300" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">按 “谁召回 × 排名 × LLM分” 切五档</text>

  <!-- Five buckets -->
  <g font-size="11" fill="#1E3A5F">
    <rect x="20"  y="345" width="108" height="50" rx="6" fill="#E6F4EA" stroke="#4B8BDA"/>
    <text x="74"  y="365" text-anchor="middle" font-weight="600">易正样本</text>
    <text x="74"  y="382" text-anchor="middle" font-size="10" fill="#3D4F65">三路+高分</text>

    <rect x="136" y="345" width="108" height="50" rx="6" fill="#FFF4E6" stroke="#E08A3C"/>
    <text x="190" y="365" text-anchor="middle" font-weight="600">难正样本</text>
    <text x="190" y="382" text-anchor="middle" font-size="10" fill="#3D4F65">ANN 漏召回</text>

    <rect x="252" y="345" width="108" height="50" rx="6" fill="#FDECEC" stroke="#C0504D"/>
    <text x="306" y="365" text-anchor="middle" font-weight="600">难负样本</text>
    <text x="306" y="382" text-anchor="middle" font-size="10" fill="#3D4F65">单路+低分</text>

    <rect x="368" y="345" width="108" height="50" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="422" y="365" text-anchor="middle" font-weight="600">半难负</text>
    <text x="422" y="382" text-anchor="middle" font-size="10" fill="#3D4F65">词面像，无召回</text>

    <rect x="484" y="345" width="96" height="50" rx="6" fill="#F4F4F4" stroke="#9AA3AD"/>
    <text x="532" y="365" text-anchor="middle" font-weight="600">随机负</text>
    <text x="532" y="382" text-anchor="middle" font-size="10" fill="#3D4F65">其余</text>
  </g>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="35" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">三路召回的分歧 = 训练信号</text>
  <text x="300" y="56" text-anchor="middle" font-size="11" fill="#3D4F65">三路 Top500 重合率仅 13–15%，分歧处最值得学</text>

  <!-- Three overlapping circles (Venn) -->
  <g opacity="0.55">
    <circle cx="240" cy="220" r="95" fill="#BFD7F2" stroke="#4B8BDA" stroke-width="1.5"/>
    <circle cx="340" cy="220" r="95" fill="#F6D6B8" stroke="#E0995A" stroke-width="1.5"/>
    <circle cx="290" cy="300" r="95" fill="#D9E4D0" stroke="#7BA86A" stroke-width="1.5"/>
  </g>

  <!-- Channel labels -->
  <text x="160" y="160" font-size="12" font-weight="700" fill="#1E3A5F">Lexical</text>
  <text x="420" y="160" font-size="12" font-weight="700" fill="#1E3A5F" text-anchor="end">BM25</text>
  <text x="290" y="410" font-size="12" font-weight="700" fill="#1E3A5F" text-anchor="middle">ANN</text>

  <!-- Center: all agree -->
  <text x="290" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">全员同意</text>
  <text x="290" y="263" text-anchor="middle" font-size="10" fill="#1E3A5F">→ Easy 正</text>

  <!-- Two-channel overlap hint -->
  <text x="290" y="210" text-anchor="middle" font-size="9.5" fill="#3D4F65">两路重合：Hard 正</text>

  <!-- Single channel -->
  <text x="180" y="265" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A5F">单路命中</text>
  <text x="180" y="280" text-anchor="middle" font-size="9.5" fill="#3D4F65">→ Hard 负</text>

  <!-- Outside: token similar -->
  <g>
    <circle cx="510" cy="235" r="48" fill="#FBE9E9" stroke="#C97474" stroke-width="1.5"/>
    <text x="510" y="228" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A5F">词面相似但三路都漏</text>
    <text x="510" y="245" text-anchor="middle" font-size="10" fill="#1E3A5F">→ Token-Sim 负</text>
  </g>

  <!-- LLM judge -->
  <g>
    <rect x="40" y="395" width="145" height="42" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="112" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">LLM 判定相关性</text>
    <text x="112" y="429" text-anchor="middle" font-size="10" fill="#3D4F65">把分歧切成难度档</text>
  </g>

  <!-- Arrow from LLM to venn -->
  <path d="M 185 410 Q 215 370 250 320" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- Output -->
  <g>
    <rect x="415" y="395" width="145" height="42" rx="6" fill="#FFF4E6" stroke="#E0995A" stroke-width="1.5"/>
    <text x="487" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">分层训练样本 ~240M</text>
    <text x="487" y="429" text-anchor="middle" font-size="10" fill="#3D4F65">每 query 最多 50 正 50 负</text>
  </g>

  <!-- Arrow from venn to output -->
  <path d="M 380 320 Q 430 365 455 393" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#a)"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="1440" height="960">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">三师共识 → 高置信标签</text>

  <!-- Three teachers -->
  <circle cx="120" cy="160" r="55" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="120" y="156" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1E3A5F">Gemma3 27B</text>
  <text x="120" y="178" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">brand=Schär</text>

  <circle cx="120" cy="290" r="55" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="120" y="286" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1E3A5F">LLaMA 3.1 8B</text>
  <text x="120" y="308" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">brand=Schär</text>

  <circle cx="120" cy="420" r="55" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="120" y="416" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1E3A5F">Qwen3 8B</text>
  <text x="120" y="438" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">brand=schar</text>

  <!-- Voting / consensus funnel -->
  <path d="M290,140 L470,140 L410,275 L370,275 Z" fill="#FFF4E6" stroke="#E89A3C" stroke-width="2"/>
  <text x="380" y="185" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">≥2 票一致</text>
  <text x="380" y="210" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">token overlap ≥ 0.5</text>
  <text x="380" y="227" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">cosine ≥ 0.3</text>

  <!-- Arrows teachers -> funnel -->
  <line x1="175" y1="160" x2="295" y2="160" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="175" y1="290" x2="345" y2="220" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="175" y1="420" x2="370" y2="270" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Discard hint -->
  <text x="390" y="305" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#B85450" font-style="italic">分歧字段 → 丢弃</text>

  <!-- GPT-4.1 verifier -->
  <rect x="540" y="155" width="200" height="100" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="640" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">GPT-4.1 复核</text>
  <text x="640" y="215" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">补隐式意图 · 查幻觉</text>
  <text x="640" y="235" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">低置信样本 → 人工抽检</text>

  <!-- Arrow funnel -> verifier -->
  <line x1="470" y1="200" x2="540" y2="200" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Output label -->
  <rect x="500" y="340" width="280" height="110" rx="10" fill="#E8F5E9" stroke="#5BA85B" stroke-width="2"/>
  <text x="640" y="372" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">高置信意图标签</text>
  <text x="640" y="397" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">brand · dietary · flavor · size</text>
  <text x="640" y="420" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">用于蒸馏小模型 (LoRA)</text>

  <!-- Arrow verifier -> output -->
  <line x1="640" y1="255" x2="640" y2="340" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>
  <rect width="800" height="460" fill="#FAFBFC"/>

  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="600" fill="#1E3A5F">课程式训练：由易到难（权重继承 · 损失切换）</text>

  <!-- Stage 1 -->
  <g>
    <rect x="60" y="90" width="200" height="250" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="160" y="130" text-anchor="middle" font-size="30">🎒</text>
    <text x="160" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A5F">S1 · 小学：黑白题</text>
    <line x1="90" y1="185" x2="230" y2="185" stroke="#C8D6E5" stroke-width="1"/>
    <text x="160" y="215" text-anchor="middle" font-size="12" fill="#3D4F65">易正(rating=4) + 随机负</text>
    <text x="160" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="#4B8BDA">BCE</text>
    <text x="160" y="275" text-anchor="middle" font-size="11" fill="#7A8B9D">可学温度，初值 20</text>
    <text x="160" y="315" text-anchor="middle" font-size="11" fill="#7A8B9D" font-style="italic">charger ↔ 狗粮</text>
  </g>

  <path d="M 265 215 L 295 215" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- Stage 2 -->
  <g>
    <rect x="300" y="90" width="200" height="250" rx="12" fill="#FFF4E6" stroke="#E89B4C" stroke-width="1.5"/>
    <text x="400" y="130" text-anchor="middle" font-size="30">📚</text>
    <text x="400" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A5F">S2 · 中学：排序题</text>
    <line x1="330" y1="185" x2="470" y2="185" stroke="#E8D5B7" stroke-width="1"/>
    <text x="400" y="215" text-anchor="middle" font-size="12" fill="#3D4F65">硬正 + 硬负</text>
    <text x="400" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="#E89B4C">MNR</text>
    <text x="400" y="275" text-anchor="middle" font-size="11" fill="#7A8B9D">in-batch 对比，大 batch</text>
    <text x="400" y="315" text-anchor="middle" font-size="11" fill="#7A8B9D" font-style="italic">charger ↔ 手机壳</text>
  </g>

  <path d="M 505 215 L 535 215" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- Stage 3 -->
  <g>
    <rect x="540" y="90" width="200" height="250" rx="12" fill="#FDEEF0" stroke="#C25B6B" stroke-width="1.5"/>
    <text x="640" y="130" text-anchor="middle" font-size="30">🎓</text>
    <text x="640" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A5F">S3 · 大学：辨析题</text>
    <line x1="570" y1="185" x2="710" y2="185" stroke="#E8C5CB" stroke-width="1"/>
    <text x="640" y="215" text-anchor="middle" font-size="12" fill="#3D4F65">词面相似负（token-similar）</text>
    <text x="640" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="#C25B6B">Triplet, m=0.3</text>
    <text x="640" y="275" text-anchor="middle" font-size="11" fill="#7A8B9D">embedding 强制拉开</text>
    <text x="640" y="315" text-anchor="middle" font-size="11" fill="#7A8B9D" font-style="italic">charger ↔ case</text>
  </g>

  <!-- weight inheritance arc back, indicating checkpoint flow already covered by arrows; bottom notes -->
  <text x="400" y="385" text-anchor="middle" font-size="12" fill="#3D4F65">难度递增 → 在向量空间逐层拉开语义边界</text>
  <text x="400" y="410" text-anchor="middle" font-size="11" fill="#7A8B9D">顺序不可逆：以 BCE 收尾会毁掉 ranking loss 学到的细粒度结构</text>
  <text x="400" y="435" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">三阶段 vs 单阶段：NDCG +9.5%</text>
</svg>
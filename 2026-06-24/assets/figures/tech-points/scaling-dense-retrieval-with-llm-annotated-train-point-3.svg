<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">由粗到细的三阶段课程</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">像教小孩：先分大类，再排序，最后辨细微差别</text>

  <!-- Stage 1 -->
  <g>
    <circle cx="150" cy="240" r="74" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="150" y="214" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="700">阶段 1 · 苹果 vs 板凳</text>
    <text x="150" y="240" text-anchor="middle" font-size="11" fill="#3D4F65">易正 + 随机负</text>
    <text x="150" y="270" text-anchor="middle" font-size="12" fill="#C97B3C" font-weight="700">BCE</text>
  </g>

  <!-- Stage 2 -->
  <g>
    <circle cx="400" cy="240" r="90" fill="#E8F0FB" stroke="#4B8BDA" stroke-width="2"/>
    <text x="400" y="212" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="700">阶段 2 · 苹果 vs 梨</text>
    <text x="400" y="240" text-anchor="middle" font-size="11" fill="#3D4F65">难正 + 难负</text>
    <text x="400" y="270" text-anchor="middle" font-size="12" fill="#C97B3C" font-weight="700">MNR (in-batch softmax)</text>
  </g>

  <!-- Stage 3 -->
  <g>
    <circle cx="660" cy="240" r="104" fill="#DCE8F7" stroke="#2E6BB8" stroke-width="2"/>
    <text x="660" y="208" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="700">阶段 3 · 红富士 vs 嘎啦</text>
    <text x="660" y="238" text-anchor="middle" font-size="11" fill="#3D4F65">词面相似负样本</text>
    <text x="660" y="268" text-anchor="middle" font-size="12" fill="#C97B3C" font-weight="700">Triplet  margin = 0.3</text>
  </g>

  <!-- arrows between stages -->
  <line x1="226" y1="240" x2="308" y2="240" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="492" y1="240" x2="554" y2="240" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- bottom note -->
  <text x="400" y="410" text-anchor="middle" font-size="12" fill="#3D4F65">由粗到细：颗粒度递进  ·  损失函数同步切换</text>
  <text x="400" y="432" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">顺序不可逆 — 若以 BCE 收尾，精细结构被毁 (NDCG ↓ 0.843)</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E89B5A"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">重活放离线 · 线上只查缓存</text>
  <text x="400" y="62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">Intent precomputed offline, served via cache</text>

  <!-- Divider line: offline vs online -->
  <line x1="400" y1="95" x2="400" y2="385" stroke="#B8C5D6" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="180" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#6B7C93">OFFLINE</text>
  <text x="620" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#6B7C93">ONLINE</text>

  <!-- Offline: Catalog -->
  <rect x="60" y="140" width="240" height="80" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="180" y="170" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">全目录商品 + 意图</text>
  <text x="180" y="192" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">vLLM 批量打标 · 灌入索引</text>
  <text x="180" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6B7C93">每小时增量 / 每周全量</text>

  <!-- Offline: Query Intent Cache -->
  <rect x="60" y="270" width="240" height="80" rx="8" fill="#FFF4E8" stroke="#E89B5A" stroke-width="1.8"/>
  <text x="180" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">Query Intent Cache</text>
  <text x="180" y="322" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">常见 query 意图预计算</text>
  <text x="180" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6B7C93">embedding 精确匹配</text>

  <!-- Online: user query -->
  <circle cx="475" cy="180" r="34" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="475" y="178" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1E3A5F">user</text>
  <text x="475" y="194" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">query</text>

  <!-- Cache hit arrow -->
  <path d="M300 305 Q 380 260 445 195" stroke="#E89B5A" stroke-width="2" fill="none" marker-end="url(#arO)"/>
  <text x="360" y="248" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#A66830">hit → 直接查</text>

  <!-- Miss → online inference small box -->
  <rect x="580" y="150" width="160" height="60" rx="8" fill="#FDF1F2" stroke="#C97A7E" stroke-width="1.6"/>
  <text x="660" y="175" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1E3A5F">miss → 在线推理</text>
  <text x="660" y="195" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#6B7C93">蒸馏后的小模型</text>
  <line x1="510" y1="180" x2="578" y2="180" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Dual-tower retrieval -->
  <rect x="460" y="270" width="280" height="90" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="600" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">双塔召回</text>
  <text x="600" y="322" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">(query + intent) ↔ (item + intent)</text>
  <text x="600" y="342" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6B7C93">FAISS · top-K 广告候选</text>

  <!-- Arrows into retrieval -->
  <line x1="490" y1="212" x2="540" y2="268" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="660" y1="212" x2="640" y2="268" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M300 180 Q 360 240 458 285" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="345" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#6B7C93">item index</text>

  <!-- Bottom result -->
  <text x="400" y="420" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1E3A5F">效果：Embarrassing 召回 −50%  ·  Excellent +10%</text>
  <text x="400" y="442" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6B7C93">低延迟 + 意图对齐：把推理成本压到离线，线上几乎只做查表</text>
</svg>
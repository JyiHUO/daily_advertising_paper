<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="1200" height="800">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="Helvetica" font-size="16" font-weight="bold" fill="#1E3A5F">Distill the giant, serve the small</text>
  <text x="300" y="50" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#3D4F65">teacher labels → LoRA student → full-catalog inference</text>

  <!-- Teacher (big) -->
  <circle cx="90" cy="160" r="60" fill="#FEF3E2" stroke="#E8A857" stroke-width="2"/>
  <text x="90" y="156" text-anchor="middle" font-family="Helvetica" font-size="16" font-weight="bold" fill="#1E3A5F">Teacher</text>
  <text x="90" y="176" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#3D4F65">LLM (heavy)</text>

  <!-- arrow teacher -> student -->
  <path d="M 150 160 Q 220 160 268 178" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="205" y="150" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#3D4F65">labels</text>

  <!-- Student -->
  <circle cx="300" cy="190" r="42" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="300" y="187" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="bold" fill="#1E3A5F">Student</text>
  <text x="300" y="205" text-anchor="middle" font-family="Helvetica" font-size="10" fill="#3D4F65">Phi-4-mini+LoRA</text>

  <!-- loss-on-completion strip below student -->
  <text x="300" y="270" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#3D4F65" font-style="italic">train only on completion</text>
  <g transform="translate(220,280)">
    <rect x="0" y="0" width="70" height="22" fill="#E5E7EB" rx="3"/>
    <rect x="70" y="0" width="90" height="22" fill="#FFD6A5" rx="3"/>
    <text x="35" y="15" text-anchor="middle" font-family="Helvetica" font-size="10" fill="#6B7280">prompt (ignore)</text>
    <text x="115" y="15" text-anchor="middle" font-family="Helvetica" font-size="10" fill="#1E3A5F" font-weight="bold">answer (loss)</text>
  </g>

  <!-- arrow student -> catalog -->
  <path d="M 342 190 Q 410 200 430 250" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="405" y="215" font-family="Helvetica" font-size="11" fill="#3D4F65">vLLM</text>

  <!-- Catalog -->
  <rect x="430" y="255" width="140" height="110" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2" rx="4"/>
  <text x="500" y="280" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="bold" fill="#1E3A5F">Catalog</text>
  <line x1="445" y1="292" x2="555" y2="292" stroke="#4B8BDA" stroke-width="1"/>
  <text x="500" y="315" text-anchor="middle" font-family="Helvetica" font-size="10" fill="#3D4F65">{brand, diet,</text>
  <text x="500" y="330" text-anchor="middle" font-family="Helvetica" font-size="10" fill="#3D4F65">flavor, subtype}</text>
  <text x="500" y="355" text-anchor="middle" font-family="Helvetica" font-size="10" fill="#E8A857" font-weight="bold">millions of SKUs</text>
</svg>
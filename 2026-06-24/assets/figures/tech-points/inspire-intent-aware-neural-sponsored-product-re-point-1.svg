<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <text x="300" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">给 Query 与商品贴上"意图标签卡"</text>

  <!-- Query side -->
  <rect x="50" y="70" width="200" height="58" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="150" y="92" text-anchor="middle" font-size="12" fill="#3D4F65">Query</text>
  <text x="150" y="114" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">sugar free chocolate</text>

  <rect x="70" y="158" width="160" height="48" rx="6" fill="#FFF4E6" stroke="#E89B3C" stroke-width="1.5"/>
  <text x="150" y="177" text-anchor="middle" font-size="11" fill="#8B5A1F">dietary preference</text>
  <text x="150" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">sugar free</text>

  <!-- Item A (relevant) -->
  <rect x="350" y="70" width="200" height="58" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="450" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Lily's Dark Chocolate</text>

  <rect x="370" y="158" width="160" height="48" rx="6" fill="#FFF4E6" stroke="#E89B3C" stroke-width="1.5"/>
  <text x="450" y="177" text-anchor="middle" font-size="11" fill="#8B5A1F">dietary preference</text>
  <text x="450" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">sugar free</text>

  <!-- Match line -->
  <line x1="230" y1="182" x2="370" y2="182" stroke="#2E7D4F" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="300" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D4F">match ✓  cos = 0.84</text>

  <!-- Item B (irrelevant) -->
  <rect x="350" y="252" width="200" height="58" rx="10" fill="#FAFAFA" stroke="#B8B8B8" stroke-width="1.2"/>
  <text x="450" y="286" text-anchor="middle" font-size="13" font-weight="600" fill="#3D4F65">Hershey Milk Chocolate</text>

  <rect x="370" y="328" width="160" height="48" rx="6" fill="#F5E8E8" stroke="#C77777" stroke-width="1.2"/>
  <text x="450" y="347" text-anchor="middle" font-size="11" fill="#8B3A3A">dietary preference</text>
  <text x="450" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#8B3A3A">contains sugar</text>

  <!-- Mismatch line: from query-tag right edge to item B box left edge -->
  <line x1="230" y1="206" x2="350" y2="281" stroke="#C77777" stroke-width="1.8" stroke-dasharray="3,4"/>
  <text x="248" y="258" font-size="12" font-weight="700" fill="#8B3A3A">mismatch ✗  cos = 0.45</text>

  <text x="300" y="406" text-anchor="middle" font-size="12" fill="#3D4F65">表示层显式对齐结构化意图，而非只看字面相似</text>
</svg>
<svg height="640" width="960" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'PingFang SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCE9C9"/>
      <stop offset="100%" stop-color="#F4B860"/>
    </radialGradient>
  </defs>

  <rect width="960" height="640" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">用三路检索的"分歧"造训练数据，替代点击日志</text>
  <text x="480" y="64" text-anchor="middle" font-size="13" fill="#3D4F65">Walmart 赞助搜索 · LLM 标注 + 渐进课程 · 替换点击信号的稠密召回训练</text>

  <!-- Section A label -->
  <text x="240" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">① 三路检索分歧 → 难度信号</text>
  <text x="240" y="120" text-anchor="middle" font-size="11" fill="#3D4F65">Top500 两两重合仅 13–15%，分歧即信号</text>

  <!-- Three retrieval circles (Venn-like) -->
  <g opacity="0.55">
    <circle cx="180" cy="230" r="80" fill="#7FB3E8" stroke="#4B8BDA" stroke-width="1.5"/>
    <circle cx="300" cy="230" r="80" fill="#F4B860" stroke="#D88B30" stroke-width="1.5" opacity="0.7"/>
    <circle cx="240" cy="320" r="80" fill="#A8C8A0" stroke="#5E8F50" stroke-width="1.5" opacity="0.7"/>
  </g>

  <text x="130" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">ANN 向量</text>
  <text x="350" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">词典匹配</text>
  <text x="240" y="420" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">BM25</text>

  <!-- Center: agreement = easy -->
  <text x="240" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">三路一致</text>
  <text x="240" y="278" text-anchor="middle" font-size="10" fill="#3D4F65">Easy 正样本</text>

  <!-- Disagreement labels -->
  <text x="80" y="252" text-anchor="middle" font-size="10" font-weight="600" fill="#1E3A5F">Hard 负</text>
  <text x="80" y="266" text-anchor="middle" font-size="9" fill="#3D4F65">单系统误召</text>

  <text x="400" y="252" text-anchor="middle" font-size="10" font-weight="600" fill="#1E3A5F">Hard 正</text>
  <text x="400" y="266" text-anchor="middle" font-size="9" fill="#3D4F65">ANN 漏召</text>

  <!-- Arrow Venn -> LLM cascade -->
  <line x1="380" y1="260" x2="540" y2="260" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>
  <text x="460" y="250" text-anchor="middle" font-size="10" fill="#3D4F65">候选对</text>

  <!-- Section B: LLM cascade -->
  <text x="700" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">② LLM 级联标注</text>
  <text x="700" y="120" text-anchor="middle" font-size="11" fill="#3D4F65">逐档 isotonic 校准 · 与人工一致率 89.1%</text>

  <g transform="translate(700,270)">
    <polygon points="-80,90 80,90 0,-10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <line x1="-54" y1="57" x2="54" y2="57" stroke="#4B8BDA" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="-27" y1="24" x2="27" y2="24" stroke="#4B8BDA" stroke-width="1" stroke-dasharray="3,2"/>

    <text x="0" y="15" text-anchor="middle" font-size="10" fill="#1E3A5F" font-weight="600">8B LLM</text>
    <text x="0" y="48" text-anchor="middle" font-size="10" fill="#1E3A5F" font-weight="600">2B LLM</text>
    <text x="0" y="80" text-anchor="middle" font-size="10" fill="#1E3A5F" font-weight="600">Cross-Encoder 74.5%</text>
  </g>

  <!-- Arrow cascade -> curriculum -->
  <line x1="700" y1="380" x2="700" y2="430" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>
  <text x="745" y="410" font-size="10" fill="#3D4F65">240M 样本</text>

  <!-- Section C: curriculum -->
  <text x="240" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">③ 三阶段渐进课程</text>

  <g transform="translate(60,500)">
    <!-- step 1 -->
    <rect x="0" y="60" width="140" height="44" fill="#DCE9F7" stroke="#4B8BDA" stroke-width="1.2" rx="4"/>
    <text x="70" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">S1: BCE</text>
    <text x="70" y="95" text-anchor="middle" font-size="10" fill="#3D4F65">Easy 正 + 随机负</text>

    <!-- step 2 -->
    <rect x="155" y="35" width="140" height="44" fill="#F8DDBA" stroke="#D88B30" stroke-width="1.2" rx="4"/>
    <text x="225" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">S2: MNR</text>
    <text x="225" y="70" text-anchor="middle" font-size="10" fill="#3D4F65">Hard 正/负 · in-batch</text>

    <!-- step 3 -->
    <rect x="310" y="10" width="140" height="44" fill="#C9DEC2" stroke="#5E8F50" stroke-width="1.2" rx="4"/>
    <text x="380" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">S3: Triplet</text>
    <text x="380" y="45" text-anchor="middle" font-size="10" fill="#3D4F65">词面相似负 · m=0.3</text>

    <line x1="140" y1="78" x2="155" y2="62" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ah)"/>
    <line x1="295" y1="53" x2="310" y2="37" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ah)"/>
  </g>

  <!-- Connector to result -->
  <path d="M 540 530 Q 680 540 760 560" fill="none" stroke="#4B8BDA" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ah)"/>

  <!-- Result badge -->
  <g transform="translate(840,560)">
    <circle r="60" fill="url(#core)" stroke="#D88B30" stroke-width="1.5"/>
    <text y="-26" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">线上 A/B</text>
    <text y="-8" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">NDCG +5.1%</text>
    <text y="10" text-anchor="middle" font-size="11" fill="#1E3A5F">广告花费 +2.8%</text>
    <text y="26" text-anchor="middle" font-size="11" fill="#1E3A5F">CTR +1.4%</text>
  </g>
</svg>
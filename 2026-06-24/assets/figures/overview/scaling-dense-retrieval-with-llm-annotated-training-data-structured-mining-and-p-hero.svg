<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">三路召回的"分歧"即金矿</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">用 LLM 标注替代点击信号 · Walmart 赞助搜索召回</text>

  <!-- Three retrieval channels as overlapping circles (Venn) -->
  <g opacity="0.78">
    <circle cx="330" cy="310" r="125" fill="#DBEAFE" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="510" cy="310" r="125" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <circle cx="420" cy="200" r="125" fill="#DCFCE7" stroke="#10B981" stroke-width="2"/>
  </g>

  <!-- Channel labels -->
  <text x="215" y="370" font-size="14" font-weight="700" fill="#1E40AF">词典扩展</text>
  <text x="560" y="370" font-size="14" font-weight="700" fill="#B91C1C">BM25</text>
  <text x="385" y="105" font-size="14" font-weight="700" fill="#047857">ANN 向量召回</text>

  <!-- Center: easy positive -->
  <circle cx="420" cy="270" r="36" fill="url(#core)" stroke="#B45309" stroke-width="1.5"/>
  <text x="420" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">三路共识</text>
  <text x="420" y="283" text-anchor="middle" font-size="10" fill="#1E3A5F">易正样本</text>

  <!-- Hard positive -->
  <circle cx="315" cy="235" r="20" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="315" y="239" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">难正</text>

  <!-- Hard negative -->
  <circle cx="580" cy="320" r="20" fill="#1E3A5F"/>
  <text x="580" y="324" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">难负</text>

  <circle cx="265" cy="305" r="18" fill="#1E3A5F"/>
  <text x="265" y="309" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">难负</text>

  <!-- Legend -->
  <g transform="translate(710,165)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#1E3A5F">分歧 = 信号</text>
    <line x1="0" y1="10" x2="140" y2="10" stroke="#4B8BDA" stroke-width="1.5"/>

    <circle cx="10" cy="32" r="7" fill="url(#core)"/>
    <text x="24" y="36" font-size="11" fill="#3D4F65">三路同意 → 易正</text>

    <circle cx="10" cy="58" r="7" fill="#FEF3C7" stroke="#F59E0B"/>
    <text x="24" y="62" font-size="11" fill="#3D4F65">ANN 漏召 → 难正</text>

    <circle cx="10" cy="84" r="7" fill="#1E3A5F"/>
    <text x="24" y="88" font-size="11" fill="#3D4F65">一路误召 → 难负</text>
  </g>

  <!-- LLM cascade label under venn -->
  <path d="M 540 455 Q 420 490 300 455" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="420" y="485" text-anchor="middle" font-size="11" fill="#3D4F65">LLM 三级级联打标 · 89.1% 与人工一致</text>

  <!-- Right-side outcome -->
  <g transform="translate(710,340)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#1E3A5F">线上收益</text>
    <line x1="0" y1="10" x2="140" y2="10" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="0" y="32" font-size="11" fill="#3D4F65">NDCG@10  +5.1%</text>
    <text x="0" y="52" font-size="11" fill="#3D4F65">CTR  +1.4%</text>
    <text x="0" y="72" font-size="11" fill="#3D4F65">eCPM  +2.8%</text>
    <text x="0" y="92" font-size="11" fill="#3D4F65">尴尬召回 8.7→3.5%</text>
  </g>

  <!-- pointer from venn to curriculum -->
  <path d="M 420 500 L 420 555" fill="none" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="432" y="530" font-size="10" fill="#3D4F65">2.4 亿样本 · 5 档难度</text>

  <!-- Bottom: curriculum stages -->
  <g transform="translate(110,575)">
    <rect x="0" y="0" width="190" height="34" rx="17" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="95" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">① BCE · 粗分</text>

    <rect x="225" y="0" width="190" height="34" rx="17" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="320" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">② MNR · 排序</text>

    <rect x="450" y="0" width="190" height="34" rx="17" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="545" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">③ Triplet · 细分</text>

    <line x1="190" y1="17" x2="223" y2="17" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="415" y1="17" x2="448" y2="17" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  </g>
</svg>
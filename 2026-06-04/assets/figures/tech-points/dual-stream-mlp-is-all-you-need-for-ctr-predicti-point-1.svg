<svg height="400" width="600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9883B"/>
    </marker>
  </defs>

  <text x="300" y="36" text-anchor="middle" font-family="Helvetica,Arial" font-size="18" font-weight="700" fill="#1E3A5F">让简单 MLP “看着” 复杂模型学</text>

  <!-- Teacher: complex gears -->
  <g>
    <circle cx="120" cy="200" r="78" fill="#FEF3E7" stroke="#D9883B" stroke-width="2"/>
    <circle cx="105" cy="180" r="22" fill="none" stroke="#D9883B" stroke-width="2"/>
    <circle cx="138" cy="215" r="18" fill="none" stroke="#D9883B" stroke-width="2"/>
    <circle cx="110" cy="225" r="12" fill="none" stroke="#D9883B" stroke-width="2"/>
    <text x="120" y="305" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="700" fill="#1E3A5F">教师 · 显式交叉网络</text>
    <text x="120" y="324" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">复杂 · 已冻结</text>
  </g>

  <!-- Student: simple MLP -->
  <g>
    <rect x="402" y="135" width="156" height="130" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="430" cy="180" r="6" fill="#4B8BDA"/>
    <circle cx="430" cy="200" r="6" fill="#4B8BDA"/>
    <circle cx="430" cy="220" r="6" fill="#4B8BDA"/>
    <circle cx="480" cy="180" r="6" fill="#4B8BDA"/>
    <circle cx="480" cy="200" r="6" fill="#4B8BDA"/>
    <circle cx="480" cy="220" r="6" fill="#4B8BDA"/>
    <circle cx="530" cy="200" r="6" fill="#4B8BDA"/>
    <line x1="430" y1="180" x2="480" y2="200" stroke="#4B8BDA" stroke-width="1" opacity="0.5"/>
    <line x1="430" y1="200" x2="480" y2="180" stroke="#4B8BDA" stroke-width="1" opacity="0.5"/>
    <line x1="430" y1="200" x2="480" y2="220" stroke="#4B8BDA" stroke-width="1" opacity="0.5"/>
    <line x1="430" y1="220" x2="480" y2="200" stroke="#4B8BDA" stroke-width="1" opacity="0.5"/>
    <line x1="480" y1="180" x2="530" y2="200" stroke="#4B8BDA" stroke-width="1" opacity="0.5"/>
    <line x1="480" y1="200" x2="530" y2="200" stroke="#4B8BDA" stroke-width="1" opacity="0.5"/>
    <line x1="480" y1="220" x2="530" y2="200" stroke="#4B8BDA" stroke-width="1" opacity="0.5"/>
    <text x="480" y="305" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="700" fill="#1E3A5F">学生 · 纯 MLP</text>
    <text x="480" y="324" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">三层 · 部署轻量</text>
  </g>

  <!-- distillation arrow -->
  <path d="M 200 180 Q 300 140 400 175" fill="none" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="300" y="138" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="700" fill="#4B8BDA">蒸馏：logits 对齐</text>

  <!-- inheritance label -->
  <path d="M 200 225 Q 300 265 400 235" fill="none" stroke="#D9883B" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#ar2)"/>
  <text x="300" y="278" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">继承高阶交叉能力</text>

  <text x="300" y="372" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65" font-style="italic">MLP 是万能逼近器：把交叉关系“内化”进权重</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E89A4F"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">两个学生，互补作答</text>
  <text x="300" y="60" text-anchor="middle" font-size="12" fill="#3D4F65">显式 + 隐式，平均后预测</text>

  <!-- Left student: taught -->
  <g>
    <rect x="60" y="100" width="200" height="150" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <polygon points="160,128 192,140 160,152 128,140" fill="#4B8BDA"/>
    <rect x="152" y="152" width="16" height="10" fill="#4B8BDA"/>
    <text x="160" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">main MLP</text>
    <text x="160" y="212" text-anchor="middle" font-size="11" fill="#3D4F65">被老师教过 · 擅长显式交叉</text>
  </g>

  <!-- Right student: self-taught -->
  <g>
    <rect x="340" y="100" width="200" height="150" rx="14" fill="#FFF4E6" stroke="#E89A4F" stroke-width="2"/>
    <circle cx="432" cy="138" r="14" fill="none" stroke="#E89A4F" stroke-width="3"/>
    <line x1="442" y1="148" x2="454" y2="160" stroke="#E89A4F" stroke-width="3" stroke-linecap="round"/>
    <text x="440" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">parallel MLP</text>
    <text x="440" y="212" text-anchor="middle" font-size="11" fill="#3D4F65">独立 embedding · 捕捉隐式信号</text>
  </g>

  <!-- arrows down to average -->
  <line x1="180" y1="250" x2="265" y2="318" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="420" y1="250" x2="335" y2="318" stroke="#E89A4F" stroke-width="2" marker-end="url(#a2)"/>

  <!-- Average node -->
  <rect x="220" y="320" width="160" height="60" rx="30" fill="#1E3A5F"/>
  <text x="300" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">logits 平均</text>
  <text x="300" y="366" text-anchor="middle" font-size="11" fill="#BFD4EA">γ = 0.5 → sigmoid</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">双路对齐：让两个 MLP 音量一致</text>
  <text x="300" y="56" text-anchor="middle" font-size="12" fill="#3D4F65">BN 拉平数值 + 各自 BCE 损失防止一路独大</text>

  <!-- LEFT: before alignment, seesaw tilted -->
  <g>
    <text x="155" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#B45309">未对齐</text>
    <polygon points="155,250 135,278 175,278" fill="#FCD9B6"/>
    <line x1="70" y1="200" x2="240" y2="250" stroke="#B45309" stroke-width="4" stroke-linecap="round"/>
    <rect x="48" y="150" width="64" height="42" rx="4" fill="#FDE3C7" stroke="#B45309" stroke-width="1.5"/>
    <text x="80" y="168" text-anchor="middle" font-size="11" fill="#1E3A5F">Main</text>
    <text x="80" y="184" text-anchor="middle" font-size="12" fill="#B45309" font-weight="700">5.0</text>
    <rect x="208" y="228" width="64" height="28" rx="4" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.2"/>
    <text x="240" y="247" text-anchor="middle" font-size="11" fill="#3D4F65">Parallel 0.3</text>
  </g>

  <!-- arrow -->
  <line x1="285" y1="200" x2="333" y2="200" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="309" y="190" text-anchor="middle" font-size="10" fill="#3D4F65">对齐</text>

  <!-- RIGHT: after alignment, seesaw level -->
  <g>
    <text x="465" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">对齐后</text>
    <polygon points="465,240 445,268 485,268" fill="#BBD3EE"/>
    <line x1="380" y1="220" x2="550" y2="220" stroke="#1E3A5F" stroke-width="4" stroke-linecap="round"/>
    <rect x="383" y="170" width="64" height="44" rx="4" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="415" y="188" text-anchor="middle" font-size="11" fill="#1E3A5F">Main</text>
    <text x="415" y="205" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="700">≈1.0</text>
    <rect x="483" y="170" width="64" height="44" rx="4" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="515" y="188" text-anchor="middle" font-size="11" fill="#1E3A5F">Parallel</text>
    <text x="515" y="205" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="700">≈1.0</text>
  </g>

  <!-- Bottom: two alignment mechanisms -->
  <g>
    <rect x="60" y="310" width="220" height="80" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.3"/>
    <text x="170" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">隐状态对齐</text>
    <text x="170" y="356" text-anchor="middle" font-size="11" fill="#3D4F65">Batch Norm 统一量级</text>
    <text x="170" y="374" text-anchor="middle" font-size="11" fill="#3D4F65">两路 logits 数值相近</text>

    <rect x="320" y="310" width="220" height="80" rx="8" fill="#FDE3C7" stroke="#B45309" stroke-width="1.3"/>
    <text x="430" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">预测对齐</text>
    <text x="430" y="356" text-anchor="middle" font-size="11" fill="#3D4F65">L_CTR + α·L_M + β·L_P</text>
    <text x="430" y="374" text-anchor="middle" font-size="11" fill="#3D4F65">每路单独拟合 label</text>
  </g>
</svg>
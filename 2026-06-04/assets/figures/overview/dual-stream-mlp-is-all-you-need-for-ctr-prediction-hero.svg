<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E89B5C"/>
    </marker>
    <radialGradient id="gMain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DCE9FA"/>
      <stop offset="100%" stop-color="#B8D2F0"/>
    </radialGradient>
    <radialGradient id="gPar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBE7D2"/>
      <stop offset="100%" stop-color="#F4C9A0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="620" fill="#FAFBFD"/>

  <!-- Title -->
  <text x="450" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">双流 MLP 即可胜任 CTR 预估</text>
  <text x="450" y="70" text-anchor="middle" font-size="13" fill="#3D4F65">蒸馏显式交叉 + 并行隐式 MLP，告别复杂 Cross 结构</text>

  <!-- Teacher (top, faded) -->
  <g>
    <rect x="340" y="100" width="220" height="64" rx="10" fill="#F0F2F5" stroke="#A8B4C4" stroke-dasharray="5 4"/>
    <text x="450" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#5A6A7E">教师：GDCN / DCNv2</text>
    <text x="450" y="148" text-anchor="middle" font-size="11" fill="#7A8595">显式高阶交叉（仅训练用，推理丢弃）</text>
  </g>

  <!-- Distillation arrow -->
  <path d="M 400 162 Q 340 220 290 263" stroke="#E89B5C" stroke-width="2.2" fill="none" marker-end="url(#arO)" stroke-dasharray="6 4"/>
  <text x="310" y="210" font-size="12" fill="#E89B5C" font-weight="600">知识蒸馏 λ·L_KD</text>

  <!-- Main MLP (left circle) -->
  <g>
    <circle cx="240" cy="345" r="105" fill="url(#gMain)" stroke="#4B8BDA" stroke-width="2"/>
    <text x="240" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">Main MLP</text>
    <text x="240" y="345" text-anchor="middle" font-size="12" fill="#3D4F65">继承显式交叉（学生）</text>
    <text x="240" y="372" text-anchor="middle" font-size="11" fill="#5A6A7E">3 层 · BN 对齐量级</text>
  </g>

  <!-- Parallel MLP (right circle) -->
  <g>
    <circle cx="660" cy="345" r="105" fill="url(#gPar)" stroke="#E89B5C" stroke-width="2"/>
    <text x="660" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#7A4A1F">Parallel MLP</text>
    <text x="660" y="345" text-anchor="middle" font-size="12" fill="#5A3A1F">补隐式交叉（自学）</text>
    <text x="660" y="372" text-anchor="middle" font-size="11" fill="#7A5530">3 层 · 独立 embedding</text>
  </g>

  <!-- Bridge between two -->
  <path d="M 345 345 L 555 345" stroke="#B8C2D0" stroke-width="1.5" stroke-dasharray="3 4" fill="none"/>
  <text x="450" y="338" text-anchor="middle" font-size="11" fill="#5A6A7E">联合损失</text>
  <text x="450" y="362" text-anchor="middle" font-size="11" fill="#5A6A7E">α·L_M + β·L_P</text>

  <!-- Merge to output -->
  <path d="M 295 430 Q 370 485 432 506" stroke="#4B8BDA" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
  <path d="M 605 430 Q 530 485 468 506" stroke="#E89B5C" stroke-width="2.2" fill="none" marker-end="url(#arO)"/>

  <!-- Output -->
  <g>
    <rect x="340" y="510" width="220" height="62" rx="31" fill="#1E3A5F"/>
    <text x="450" y="535" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">σ( (logit_M + logit_P) / 2 )</text>
    <text x="450" y="556" text-anchor="middle" font-size="11" fill="#B8D2F0">推理仅两路 MLP · ~59ms · SOTA AUC</text>
  </g>

  <!-- Side tags -->
  <text x="60" y="270" font-size="11" fill="#3D4F65" font-weight="600">显式分支</text>
  <text x="840" y="270" font-size="11" fill="#5A3A1F" text-anchor="end" font-weight="600">隐式分支</text>

  <!-- Bottom benchmarks -->
  <text x="450" y="595" text-anchor="middle" font-size="11" fill="#5A6A7E">Criteo · Avazu · MovieLens  →  更轻 · 更快 · 更准</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FAFBFD"/>
      <stop offset="1" stop-color="#F1F5FA"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">长尾变现指标的方差缩减</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#3D4F65">后分层 + CUPED · 在 ShareChat 排序实验中节省约 45% 流量</text>

  <!-- Left: heavy-tailed distribution -->
  <g transform="translate(60,140)">
    <text x="135" y="-10" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">原始 GMV 分布</text>
    <line x1="0" y1="240" x2="270" y2="240" stroke="#9AA8BC" stroke-width="1.2"/>
    <path d="M0,240 C10,80 25,60 55,80 C90,105 130,200 200,232 L270,238 L270,240 L0,240 Z"
          fill="#FCE3E0" stroke="#E07A6E" stroke-width="1.5"/>
    <rect x="200" y="220" width="68" height="20" fill="#E07A6E" opacity="0.35"/>
    <text x="234" y="262" text-anchor="middle" font-size="11" fill="#B8493A">前 0.01% 用户贡献绝大部分方差</text>
    <text x="135" y="288" text-anchor="middle" font-size="12" fill="#3D4F65">CLT 不收敛 · 功效严重不足</text>
  </g>

  <!-- Center: prism / mechanism -->
  <g transform="translate(380,180)">
    <text x="70" y="-30" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">分层棱镜</text>

    <polygon points="70,0 140,140 0,140" fill="#DCE9F7" stroke="#4B8BDA" stroke-width="2"/>
    <text x="70" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Post-Stratification</text>
    <text x="70" y="102" text-anchor="middle" font-size="12" font-weight="600" fill="#3D4F65">+ CUPED</text>

    <g transform="translate(-10,160)">
      <rect x="0" y="0" width="50" height="14" fill="#E07A6E"/>
      <text x="55" y="11" font-size="10" fill="#3D4F65">尾部高消费 · 权重≈0.0001</text>
      <rect x="0" y="22" width="50" height="14" fill="#7AA9E0"/>
      <text x="55" y="33" font-size="10" fill="#3D4F65">非尾部主体 · 权重≈0.7</text>
      <rect x="0" y="44" width="50" height="14" fill="#A8B8CC"/>
      <text x="55" y="55" font-size="10" fill="#3D4F65">新用户 / 未消费</text>
    </g>

    <text x="70" y="252" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">阈值在实验前冻结</text>
  </g>

  <!-- Right: tightened distribution -->
  <g transform="translate(640,140)">
    <text x="120" y="-10" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">调整后估计</text>
    <line x1="0" y1="240" x2="240" y2="240" stroke="#9AA8BC" stroke-width="1.2"/>
    <path d="M0,238 C60,238 90,90 120,90 C150,90 180,238 240,238 L240,240 L0,240 Z"
          fill="#DCEBDC" stroke="#5BA86A" stroke-width="1.5"/>
    <line x1="120" y1="90" x2="120" y2="240" stroke="#5BA86A" stroke-width="1" stroke-dasharray="3,3"/>

    <text x="120" y="262" text-anchor="middle" font-size="11" fill="#2F7A3E">方差 ↓ 99.3% · 等效流量节省 ≈ 45%</text>
  </g>

  <!-- Arrows -->
  <path d="M340,300 L376,300" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M524,300 L636,300" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- Bottom guardrail -->
  <g transform="translate(140,520)">
    <rect x="0" y="0" width="620" height="68" rx="10" fill="#FFF6E6" stroke="#E0B062" stroke-width="1.2"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#8A5A12">护栏</text>
    <text x="20" y="44" font-size="11" fill="#3D4F65">· 同时展示原始与后分层指标，方向不一致 → 效应集中在尾部，回退原始</text>
    <text x="20" y="60" font-size="11" fill="#3D4F65">· 极端值 Winsorize · 每层 ≥ 50 用户 · 面向大 R 的实验不适用</text>
  </g>
</svg>
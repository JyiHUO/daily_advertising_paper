  <text x="285" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#4B8BDA" font-weight="300">+</text>
  <text x="515" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#4B8BDA" font-weight="300">+</text>

  <path d="M195,283 L335,398" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M400,290 L400,395" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M605,283 L465,398" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="270" y="400" width="260" height="72" rx="10" fill="#FFF4E6" stroke="#C97A3A" stroke-width="2"/>
  <text x="400" y="428" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1E3A5F" font-weight="700">Joint Scaling</text>
  <text x="400" y="455" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#C97A3A" font-weight="700">+0.74%  ≈  Σ</text>

  <text x="400" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65" font-style="italic">探索代价：立方组合 → 三项相加</text>

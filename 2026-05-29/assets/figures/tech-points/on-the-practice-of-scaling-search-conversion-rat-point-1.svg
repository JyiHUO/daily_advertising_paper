    <text x="400" y="238" text-anchor="middle" font-size="13" fill="#C97A3A" font-weight="700">+0.10%</text>

    <circle cx="630" cy="220" r="70" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="630" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">Embedding</text>

<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">万能转接口：特征变了，大模型不用重训</text>

  <!-- Left: variable features -->
  <g>
    <rect x="50" y="180" width="130" height="40" rx="6" fill="#FEF3E2" stroke="#E89B45" stroke-width="1.5"/>
    <text x="115" y="205" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1E3A5F">特征 dim=500</text>

    <rect x="50" y="240" width="130" height="40" rx="6" fill="#FEF3E2" stroke="#E89B45" stroke-width="1.5"/>
    <text x="115" y="265" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1E3A5F">特征 dim=520</text>

    <rect x="50" y="300" width="130" height="40" rx="6" fill="#FEF3E2" stroke="#E89B45" stroke-width="1.5"/>
    <text x="115" y="325" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1E3A5F">特征 dim=…</text>
  </g>

  <!-- Adapter (the key idea) -->
  <g>
    <polygon points="230,170 320,260 230,350 270,260" fill="#FFE4B5" stroke="#D97706" stroke-width="2"/>
    <text x="258" y="248" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1E3A5F">投影层</text>
    <text x="258" y="268" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">仅此层重置</text>
    <text x="258" y="285" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">→ 固定 H 维</text>
  </g>

  <!-- arrows from features to adapter -->
  <line x1="180" y1="200" x2="232" y2="230" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="180" y1="260" x2="228" y2="260" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="180" y1="320" x2="232" y2="290" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Frozen big backbone -->
  <g>
    <rect x="380" y="170" width="260" height="180" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="510" y="205" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">大模型 Backbone</text>
    <text x="510" y="228" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">Cross / MMoE / Towers</text>

    <!-- lock icon -->
    <g transform="translate(492,250)">
      <rect x="0" y="14" width="36" height="28" rx="3" fill="#4B8BDA"/>
      <path d="M6 14 V8 a12 12 0 0 1 24 0 V14" fill="none" stroke="#4B8BDA" stroke-width="3"/>
      <circle cx="18" cy="28" r="3" fill="#EFF6FF"/>
    </g>
    <text x="510" y="325" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1E3A5F">权重全部继承 · warmstart</text>
  </g>

  <line x1="320" y1="260" x2="380" y2="260" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Result on the right -->
  <g>
    <text x="710" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1E3A5F">训练耗时</text>

    <rect x="660" y="220" width="100" height="22" fill="#F4B7B7" stroke="#C94A4A"/>
    <text x="710" y="236" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1E3A5F">冷启 +264%</text>

    <rect x="680" y="252" width="60" height="22" fill="#B7DDB7" stroke="#3F9D52"/>
    <text x="710" y="268" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1E3A5F">warm +36%</text>

    <text x="710" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">mAP 几乎无损</text>
  </g>

  <line x1="640" y1="260" x2="660" y2="260" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>

  <text x="400" y="430" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">特征增减 → 只重置投影层 → 后端大模型继续 warmstart</text>
</svg>
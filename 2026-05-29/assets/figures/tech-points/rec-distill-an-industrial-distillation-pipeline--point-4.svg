<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9685A"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-family="Helvetica,Arial" font-size="20" font-weight="700" fill="#1E3A5F">同一把尺子，才能比分数</text>
  <text x="400" y="62" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#3D4F65">Recalibrate teacher logit with student's debias function f_S</text>

  <!-- Teacher raw logit -->
  <circle cx="130" cy="240" r="58" fill="#FFF1E6" stroke="#E0A878" stroke-width="2"/>
  <text x="130" y="232" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#1E3A5F">T1</text>
  <text x="130" y="252" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">teacher raw logit</text>
  <text x="130" y="268" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">(r_s = 10)</text>

  <!-- Student debias ruler -->
  <rect x="310" y="185" width="180" height="110" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2.2"/>
  <text x="400" y="220" text-anchor="middle" font-family="Helvetica,Arial" font-size="16" font-weight="700" fill="#1E3A5F">f_S</text>
  <text x="400" y="242" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">student's debias ruler</text>
  <text x="400" y="260" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">(r_s = 4, p_X ...)</text>
  <line x1="330" y1="280" x2="470" y2="280" stroke="#4B8BDA" stroke-width="1.5"/>
  <line x1="340" y1="276" x2="340" y2="284" stroke="#4B8BDA" stroke-width="1.5"/>
  <line x1="370" y1="276" x2="370" y2="284" stroke="#4B8BDA" stroke-width="1.5"/>
  <line x1="400" y1="276" x2="400" y2="284" stroke="#4B8BDA" stroke-width="1.5"/>
  <line x1="430" y1="276" x2="430" y2="284" stroke="#4B8BDA" stroke-width="1.5"/>
  <line x1="460" y1="276" x2="460" y2="284" stroke="#4B8BDA" stroke-width="1.5"/>

  <!-- Aligned target -->
  <circle cx="670" cy="240" r="58" fill="#EAF3EC" stroke="#6FA678" stroke-width="2"/>
  <text x="670" y="234" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" font-weight="700" fill="#1E3A5F">T2'  ↔  S2</text>
  <text x="670" y="256" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">aligned in same space</text>

  <!-- Arrows -->
  <line x1="190" y1="240" x2="306" y2="240" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="492" y1="240" x2="608" y2="240" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Wrong path note -->
  <text x="400" y="385" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" font-weight="700" fill="#C9685A">✗ aligning T2 with S2 directly → two different rulers, extra bias</text>
  <text x="400" y="425" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">teacher ruler f_T  ≠  student ruler f_S</text>

  <text x="400" y="465" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#1E3A5F">ablation: gain  +0.44%  →  +0.34%  without this recalibration</text>
</svg>
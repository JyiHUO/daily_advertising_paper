<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97B5C"/>
    </marker>
  </defs>

  <text x="400" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">同样的算力，花在哪条轴上？</text>
  <text x="400" y="66" text-anchor="middle" font-size="13" fill="#3D4F65">Scaling axis matters more than total FLOPs</text>

  <!-- Center compute pool -->
  <circle cx="400" cy="260" r="58" fill="#FFF4E6" stroke="#E0A86B" stroke-width="2"/>
  <text x="400" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">FLOPs</text>
  <text x="400" y="276" text-anchor="middle" font-size="12" fill="#3D4F65">budget</text>

  <!-- Left: good axis (cross width / sequence length) -->
  <rect x="60" y="170" width="240" height="180" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="180" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">特征交叉轴 ✓</text>
  <text x="180" y="216" text-anchor="middle" font-size="11" fill="#3D4F65">cross width · seq length</text>

  <rect x="105" y="295" width="20" height="20" fill="#4B8BDA"/>
  <rect x="140" y="275" width="20" height="40" fill="#4B8BDA"/>
  <rect x="175" y="255" width="20" height="60" fill="#4B8BDA"/>
  <rect x="210" y="230" width="20" height="85" fill="#4B8BDA"/>
  <text x="180" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">mAP +0.64%  (算力换收益)</text>

  <!-- Right: bad axis (depth / heads) -->
  <rect x="500" y="170" width="240" height="180" rx="12" fill="#F5EDE7" stroke="#C97B5C" stroke-width="2"/>
  <text x="620" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">深度 / 层数轴 ✗</text>
  <text x="620" y="216" text-anchor="middle" font-size="11" fill="#3D4F65">depth · heads</text>

  <rect x="545" y="295" width="20" height="20" fill="#C97B5C"/>
  <rect x="580" y="293" width="20" height="22" fill="#C97B5C"/>
  <rect x="615" y="290" width="20" height="25" fill="#C97B5C"/>
  <rect x="650" y="289" width="20" height="26" fill="#C97B5C"/>
  <text x="620" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">mAP +0.01%  (算力打水漂)</text>

  <!-- arrows from compute -->
  <line x1="345" y1="248" x2="305" y2="230" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="455" y1="248" x2="495" y2="230" stroke="#C97B5C" stroke-width="2.5" marker-end="url(#arRed)"/>

  <!-- bottom takeaway -->
  <text x="400" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">高阶特征交叉 = CVR scaling 的真正驱动</text>
  <text x="400" y="434" text-anchor="middle" font-size="12" fill="#3D4F65">MaskNet 加 cross 宽度 ≫ Transformer 加层数</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">相似度 ≠ 用户反馈</text>
  <text x="400" y="64" text-anchor="middle" font-size="13" fill="#3D4F65">同一相似度桶里，不同 SemID 的 CTR 差很多</text>

  <!-- Target -->
  <circle cx="105" cy="250" r="48" fill="#FEF3E7" stroke="#E8A765" stroke-width="2"/>
  <text x="105" y="246" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Target</text>
  <text x="105" y="266" text-anchor="middle" font-size="12" fill="#3D4F65">眼影</text>

  <!-- Similarity bucket box -->
  <rect x="220" y="140" width="340" height="220" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="390" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">同一相似度桶  sim ≈ 0.9</text>

  <!-- Item A -->
  <rect x="245" y="190" width="130" height="150" rx="10" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="310" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">行为 A：口红</text>
  <text x="310" y="248" text-anchor="middle" font-size="11" fill="#3D4F65">SemID (8, 90, 74)</text>
  <text x="310" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D5B">CTR 0.74</text>

  <!-- Item B -->
  <rect x="405" y="190" width="130" height="150" rx="10" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="470" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">行为 B：衣服</text>
  <text x="470" y="248" text-anchor="middle" font-size="11" fill="#3D4F65">SemID (12, 7, 16)</text>
  <text x="470" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#C0504D">CTR 1.00</text>

  <!-- Arrows from target to items -->
  <path d="M153,235 Q200,205 243,220" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M153,265 Q280,295 403,260" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- SemID lens -->
  <g transform="translate(670,250)">
    <circle cx="0" cy="0" r="52" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="3"/>
    <line x1="38" y1="38" x2="68" y2="68" stroke="#1E3A5F" stroke-width="5" stroke-linecap="round"/>
    <text x="0" y="-4" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">SemID</text>
    <text x="0" y="16" text-anchor="middle" font-size="11" fill="#3D4F65">区分异质</text>
  </g>

  <!-- Arrow from box to lens -->
  <path d="M560,250 L614,250" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Bottom info gain -->
  <rect x="150" y="410" width="500" height="60" rx="10" fill="#F4F0E8" stroke="#C9B894" stroke-width="1.2"/>
  <text x="400" y="434" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">信息增益对比</text>
  <text x="400" y="455" text-anchor="middle" font-size="12" fill="#3D4F65">I(Y; SemID) = <tspan font-weight="700" fill="#2E7D5B">0.0195</tspan>  ≫  I(Y; Sim) = <tspan font-weight="700" fill="#C0504D">0.0056</tspan></text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">早融合 vs 后融合</text>
  <text x="360" y="52" text-anchor="middle" font-size="12" fill="#3D4F65">SIREN 在每个行为 item 上就把三类信号注入</text>

  <!-- LEFT: old way (late fusion) -->
  <g>
    <text x="170" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#8A6A3B">过去：后融合</text>

    <rect x="70" y="105" width="90" height="36" rx="6" fill="#F4ECE0" stroke="#C9A96E"/>
    <text x="115" y="128" text-anchor="middle" font-size="12" fill="#1E3A5F">ID 序列</text>

    <rect x="180" y="105" width="100" height="36" rx="6" fill="#F4ECE0" stroke="#C9A96E"/>
    <text x="230" y="128" text-anchor="middle" font-size="12" fill="#1E3A5F">多模态序列</text>

    <path d="M115,141 L160,180" stroke="#B89968" stroke-width="1.6" fill="none"/>
    <path d="M230,141 L185,180" stroke="#B89968" stroke-width="1.6" fill="none"/>

    <rect x="120" y="182" width="100" height="34" rx="6" fill="#FFFFFF" stroke="#B89968" stroke-dasharray="3,3"/>
    <text x="170" y="203" text-anchor="middle" font-size="11" fill="#8A6A3B">末端才拼接</text>

    <text x="170" y="240" text-anchor="middle" font-size="11" fill="#8A6A3B">多模态只在最后调制</text>
  </g>

  <!-- divider -->
  <line x1="360" y1="80" x2="360" y2="260" stroke="#CBD5E1" stroke-dasharray="4,4"/>

  <!-- RIGHT: new way (early fusion at item level) -->
  <g>
    <text x="550" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">SIREN：每个 item 早融合</text>

    <rect x="445" y="100" width="210" height="130" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="550" y="118" text-anchor="middle" font-size="11" fill="#3D4F65">一个行为 item</text>

    <rect x="460" y="130" width="58" height="36" rx="5" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="489" y="153" text-anchor="middle" font-size="11" fill="#1E3A5F">ID</text>

    <rect x="521" y="130" width="58" height="36" rx="5" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="550" y="148" text-anchor="middle" font-size="10" fill="#1E3A5F">SemID</text>
    <text x="550" y="160" text-anchor="middle" font-size="9" fill="#3D4F65">前缀</text>

    <rect x="582" y="130" width="58" height="36" rx="5" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="611" y="148" text-anchor="middle" font-size="10" fill="#1E3A5F">相似度</text>
    <text x="611" y="160" text-anchor="middle" font-size="9" fill="#3D4F65">桶</text>

    <text x="550" y="190" text-anchor="middle" font-size="10" fill="#3D4F65">三种粒度同时进入 item 表示</text>
    <text x="550" y="210" text-anchor="middle" font-size="10" fill="#3D4F65">而非各自独立建模</text>
  </g>

  <!-- arrow down to attention -->
  <path d="M550,232 L550,267" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- attention with target -->
  <g>
    <rect x="410" y="272" width="280" height="58" rx="10" fill="#E8D5B7" stroke="#C9A96E" stroke-width="1.6"/>
    <text x="550" y="295" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">target-aware 多头注意力</text>
    <text x="550" y="314" text-anchor="middle" font-size="11" fill="#3D4F65">相似度桶同时进 query / key</text>
  </g>

  <!-- target -->
  <circle cx="180" cy="301" r="34" fill="#FDE8E4" stroke="#D97757" stroke-width="1.8"/>
  <text x="180" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">Target</text>
  <text x="180" y="314" text-anchor="middle" font-size="10" fill="#3D4F65">广告</text>

  <path d="M215,301 L408,301" stroke="#D97757" stroke-width="1.8" fill="none" marker-end="url(#aro)" stroke-dasharray="5,3"/>

  <!-- output -->
  <path d="M550,330 L550,367" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="430" y="372" width="240" height="46" rx="8" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="1.6"/>
  <text x="550" y="392" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">用户兴趣 ⊙ Target</text>
  <text x="550" y="409" text-anchor="middle" font-size="10" fill="#3D4F65">target-conditioned 交互</text>
</svg>
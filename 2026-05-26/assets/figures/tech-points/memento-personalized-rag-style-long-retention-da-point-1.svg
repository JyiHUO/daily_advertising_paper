<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1E3A5F">把历史当文档库 · RAG式检索</text>
  <text x="400" y="60" text-anchor="middle" font-size="12" fill="#3D4F65">广告请求 = Query，用户行为 = Documents</text>

  <!-- Haystack: huge history -->
  <g>
    <circle cx="140" cy="290" r="95" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <g fill="#9BB8D9">
      <circle cx="100" cy="250" r="3"/><circle cx="120" cy="265" r="3"/><circle cx="140" cy="245" r="3"/>
      <circle cx="160" cy="270" r="3"/><circle cx="180" cy="255" r="3"/><circle cx="105" cy="285" r="3"/>
      <circle cx="135" cy="295" r="3"/><circle cx="170" cy="300" r="3"/><circle cx="115" cy="315" r="3"/>
      <circle cx="150" cy="325" r="3"/><circle cx="180" cy="320" r="3"/><circle cx="95" cy="300" r="3"/>
      <circle cx="160" cy="240" r="3"/><circle cx="125" cy="335" r="3"/><circle cx="175" cy="285" r="3"/>
    </g>
    <text x="140" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">365天历史 (~100k)</text>
  </g>

  <!-- MMR scorer (triangle) -->
  <g transform="translate(400,290)">
    <polygon points="0,-90 90,60 -90,60" fill="#FFF4E6" stroke="#E89B4A" stroke-width="1.8"/>
    <text x="0" y="-50" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">MMR 打分</text>
    <text x="0" y="-20" text-anchor="middle" font-size="11" fill="#3D4F65">α·Sim(用户,用户) + β·Sim(用户,广告)</text>
    <text x="0" y="2" text-anchor="middle" font-size="11" fill="#C0593B">− (1−α−β)·与已选最大相似</text>
    <text x="0" y="32" text-anchor="middle" font-size="10" fill="#3D4F65" font-style="italic">相关 &amp; 多样</text>
  </g>

  <!-- Selected K -->
  <g>
    <rect x="600" y="220" width="150" height="140" rx="10" fill="#EAF6EE" stroke="#4FA46A" stroke-width="1.8"/>
    <text x="675" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Top-K 片段</text>
    <g fill="#4FA46A">
      <rect x="618" y="265" width="114" height="10" rx="2"/>
      <rect x="618" y="282" width="114" height="10" rx="2"/>
      <rect x="618" y="299" width="114" height="10" rx="2"/>
      <rect x="618" y="316" width="114" height="10" rx="2"/>
    </g>
    <text x="675" y="348" text-anchor="middle" font-size="11" fill="#3D4F65">≈60 条 → 排序模型</text>
  </g>

  <!-- Query bubble (ad request) -->
  <g>
    <ellipse cx="400" cy="130" rx="160" ry="30" fill="#1E3A5F"/>
    <text x="400" y="127" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">广告请求 (Query)</text>
    <text x="400" y="144" text-anchor="middle" font-size="10" fill="#BFD4EC">户外帐篷 · 用户向量 · 品类</text>
  </g>

  <!-- Arrows -->
  <line x1="235" y1="290" x2="305" y2="290" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="400" y1="160" x2="400" y2="195" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="490" y1="290" x2="595" y2="290" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- bottom note -->
  <text x="400" y="470" text-anchor="middle" font-size="12" fill="#3D4F65">不是取最近N条，而是按"相关且不冗余"迭代检索</text>
</svg>
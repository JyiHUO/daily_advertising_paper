<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8553D"/>
    </marker>
  </defs>

  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">Data Memento：有针对性的复习</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#3D4F65">让模型不忘记一年前的长周期兴趣</text>

  <!-- 长历史书库 -->
  <g>
    <rect x="40" y="100" width="210" height="260" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="145" y="125" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">365 天历史样本</text>
    <g stroke="#4B8BDA" stroke-width="1.2" fill="#FFF">
      <rect x="70" y="145" width="150" height="22"/>
      <rect x="70" y="170" width="150" height="22" fill="#FCE8D5" stroke="#E8924A"/>
      <rect x="70" y="195" width="150" height="22"/>
      <rect x="70" y="220" width="150" height="22" fill="#FCE8D5" stroke="#E8924A"/>
      <rect x="70" y="245" width="150" height="22"/>
      <rect x="70" y="270" width="150" height="22" fill="#FCE8D5" stroke="#E8924A"/>
      <rect x="70" y="295" width="150" height="22"/>
    </g>
    <text x="145" y="340" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">橙色 = 含双11/季节性模式</text>
  </g>

  <!-- MMR 漏斗 -->
  <g>
    <polygon points="310,140 490,140 445,230 355,230" fill="#FFF6EC" stroke="#E8924A" stroke-width="1.8"/>
    <text x="400" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">MMR 检索</text>
    <text x="400" y="198" text-anchor="middle" font-size="11" fill="#3D4F65">相关 + 多样</text>
    <text x="400" y="216" text-anchor="middle" font-size="11" font-weight="600" fill="#E8924A">挑出约 25%</text>
  </g>

  <!-- 重置标签 -->
  <g>
    <rect x="310" y="290" width="180" height="60" rx="6" fill="#FDECEC" stroke="#C8553D" stroke-width="1.5"/>
    <text x="400" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#C8553D">重置 Embedding</text>
    <text x="400" y="334" text-anchor="middle" font-size="11" fill="#3D4F65">逼 dense 层学通用规律</text>
  </g>

  <!-- 箭头：历史→MMR -->
  <line x1="252" y1="200" x2="348" y2="190" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 第二轮训练模型 -->
  <g>
    <circle cx="660" cy="220" r="85" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
    <text x="660" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">第二轮训练</text>
    <text x="660" y="228" text-anchor="middle" font-size="11" fill="#3D4F65">复习题 + 最近35天</text>
    <text x="660" y="248" text-anchor="middle" font-size="11" fill="#3D4F65">放大学习率</text>
  </g>

  <!-- MMR → 模型 -->
  <line x1="490" y1="185" x2="578" y2="200" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <!-- 重置 → 模型 -->
  <line x1="490" y1="318" x2="600" y2="263" stroke="#C8553D" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arR)"/>

  <!-- 底部结果 -->
  <rect x="585" y="335" width="150" height="55" rx="6" fill="#EAF6EC" stroke="#3A8A4A" stroke-width="1.4"/>
  <text x="660" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">CVR NE −0.195%</text>
  <text x="660" y="376" text-anchor="middle" font-size="10" fill="#3D4F65">≈ 普通多轮训练的两倍</text>

  <text x="145" y="395" text-anchor="middle" font-size="11" fill="#3D4F65">把"扩历史"变成"检索复习"</text>
  <text x="145" y="412" text-anchor="middle" font-size="11" fill="#3D4F65">而不是线性堆叠 LastN</text>
</svg>
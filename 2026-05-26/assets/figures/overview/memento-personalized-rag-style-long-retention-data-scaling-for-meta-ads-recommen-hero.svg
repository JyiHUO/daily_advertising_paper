<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#F5A623"/>
    </marker>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE3B3"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </radialGradient>
  </defs>

  <rect width="960" height="640" fill="#FAFBFD"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">Memento：把 365+ 天用户历史，当作 RAG 文档库</text>
  <text x="480" y="64" text-anchor="middle" font-size="12" fill="#3D4F65">Meta 广告推荐 · 个性化检索增强 · 线上 CTR +1% / CVR +1.2%</text>

  <!-- LEFT: haystack of history -->
  <g>
    <text x="150" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">用户长历史（365+ 天）</text>
    <text x="150" y="124" text-anchor="middle" font-size="11" fill="#7A8AA0">注意力稀释 · O(n²) 算力 · 灾难性遗忘</text>

    <!-- dotted history blobs -->
    <g fill="#CBD7E6">
      <circle cx="60" cy="180" r="6"/><circle cx="95" cy="200" r="5"/><circle cx="130" cy="175" r="7"/>
      <circle cx="170" cy="195" r="4"/><circle cx="205" cy="170" r="6"/><circle cx="240" cy="205" r="5"/>
      <circle cx="75" cy="240" r="5"/><circle cx="115" cy="255" r="6"/><circle cx="155" cy="235" r="4"/>
      <circle cx="195" cy="260" r="7"/><circle cx="235" cy="245" r="5"/>
      <circle cx="55" cy="300" r="6"/><circle cx="95" cy="315" r="4"/><circle cx="140" cy="300" r="5"/>
      <circle cx="185" cy="320" r="6"/><circle cx="225" cy="300" r="5"/>
      <circle cx="80" cy="365" r="5"/><circle cx="125" cy="375" r="6"/><circle cx="170" cy="360" r="4"/>
      <circle cx="215" cy="380" r="5"/><circle cx="60" cy="425" r="4"/><circle cx="105" cy="435" r="6"/>
      <circle cx="160" cy="425" r="5"/><circle cx="210" cy="440" r="6"/>
    </g>
    <!-- highlighted relevant ones -->
    <g fill="#F5A623">
      <circle cx="130" cy="175" r="7"/>
      <circle cx="195" cy="260" r="7"/>
      <circle cx="140" cy="300" r="5"/>
      <circle cx="125" cy="375" r="6"/>
    </g>

    <text x="150" y="475" text-anchor="middle" font-size="11" fill="#7A8AA0" font-style="italic">十万条行为 · 大海捞针</text>
  </g>

  <!-- CENTER: MMR prism -->
  <g transform="translate(480 300)">
    <circle r="135" fill="url(#core)" opacity="0.18"/>
    <circle r="105" fill="url(#core)" opacity="0.35"/>

    <polygon points="0,-95 95,0 0,95 -95,0" fill="#FFFFFF" stroke="#F5A623" stroke-width="2.5"/>
    <polygon points="0,-95 95,0 0,95 -95,0" fill="url(#core)" opacity="0.55"/>

    <text x="0" y="-18" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">MMR</text>
    <text x="0" y="4" text-anchor="middle" font-size="11" fill="#1E3A5F">个性化检索</text>
    <text x="0" y="24" text-anchor="middle" font-size="10" fill="#3D4F65">α·SimUU + β·SimUA</text>
    <text x="0" y="40" text-anchor="middle" font-size="10" fill="#3D4F65">− (1−α−β)·冗余</text>

    <text x="0" y="-110" text-anchor="middle" font-size="11" font-weight="600" fill="#C77700">广告请求 = Query</text>
    <text x="0" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#C77700">相关 + 多样的 Top-K</text>
  </g>

  <!-- arrows from history into prism -->
  <path d="M 250 220 Q 330 250 385 280" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M 250 300 Q 320 300 385 300" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M 250 380 Q 330 350 385 320" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- RIGHT: two outputs -->
  <g>
    <rect x="660" y="170" width="260" height="100" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="790" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">Representation Memento</text>
    <text x="790" y="220" text-anchor="middle" font-size="11" fill="#3D4F65">检索历史 embedding → 特征增强</text>
    <text x="790" y="238" text-anchor="middle" font-size="10" fill="#3D4F65">Ember-Affine · Ember-Quadratic</text>
    <text x="790" y="256" text-anchor="middle" font-size="10" fill="#7A8AA0">7 天分块 · INT8 · 异步服务</text>

    <rect x="660" y="320" width="260" height="100" rx="10" fill="#FFF4E6" stroke="#F5A623" stroke-width="1.5"/>
    <text x="790" y="348" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">Data Memento</text>
    <text x="790" y="370" text-anchor="middle" font-size="11" fill="#3D4F65">检索历史训练样本 → 多轮训练</text>
    <text x="790" y="388" text-anchor="middle" font-size="10" fill="#3D4F65">重置稀疏参数 · 25% 老样本复习</text>
    <text x="790" y="406" text-anchor="middle" font-size="10" fill="#7A8AA0">对抗灾难性遗忘</text>
  </g>

  <!-- arrows prism -> outputs -->
  <path d="M 570 265 Q 615 230 660 220" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 570 335 Q 615 365 660 370" fill="none" stroke="#F5A623" stroke-width="2" marker-end="url(#aro)"/>

  <!-- Bottom results bar -->
  <g transform="translate(0 530)">
    <rect x="80" y="0" width="800" height="70" rx="12" fill="#1E3A5F"/>
    <text x="160" y="32" font-size="13" fill="#9DB8D9">线上收益</text>
    <text x="160" y="54" font-size="14" font-weight="700" fill="#FFFFFF">Facebook Feed/Reels</text>

    <line x1="320" y1="15" x2="320" y2="55" stroke="#4B8BDA" stroke-width="1" opacity="0.5"/>
    <text x="380" y="32" font-size="13" fill="#9DB8D9">CTR</text>
    <text x="380" y="55" font-size="20" font-weight="700" fill="#F5A623">+1.0%</text>

    <line x1="490" y1="15" x2="490" y2="55" stroke="#4B8BDA" stroke-width="1" opacity="0.5"/>
    <text x="550" y="32" font-size="13" fill="#9DB8D9">CVR</text>
    <text x="550" y="55" font-size="20" font-weight="700" fill="#F5A623">+1.2%</text>

    <line x1="660" y1="15" x2="660" y2="55" stroke="#4B8BDA" stroke-width="1" opacity="0.5"/>
    <text x="720" y="32" font-size="13" fill="#9DB8D9">资源效率</text>
    <text x="720" y="55" font-size="17" font-weight="700" fill="#FFFFFF">5–10× ↑ · &lt;10ms</text>
  </g>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97064"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">从乘法堆叠 → 加法叠加</text>

  <!-- LEFT: Before (multiplicative) -->
  <g>
    <text x="200" y="78" text-anchor="middle" font-size="14" fill="#C97064" font-weight="600">原方案：层层相乘</text>

    <circle cx="90" cy="200" r="28" fill="#FCE8E6" stroke="#C97064" stroke-width="1.5"/>
    <text x="90" y="205" text-anchor="middle" font-size="13" fill="#1E3A5F">y</text>

    <text x="135" y="208" text-anchor="middle" font-size="22" fill="#C97064">×</text>

    <circle cx="190" cy="200" r="32" fill="#FCE8E6" stroke="#C97064" stroke-width="1.5"/>
    <text x="190" y="205" text-anchor="middle" font-size="12" fill="#1E3A5F">w_ad</text>

    <text x="240" y="208" text-anchor="middle" font-size="22" fill="#C97064">×</text>

    <circle cx="295" cy="200" r="36" fill="#FCE8E6" stroke="#C97064" stroke-width="1.5"/>
    <text x="295" y="205" text-anchor="middle" font-size="12" fill="#1E3A5F">w_cs</text>

    <!-- inflated balloon -->
    <ellipse cx="200" cy="350" rx="130" ry="50" fill="#F8D7D2" stroke="#C97064" stroke-width="2"/>
    <text x="200" y="348" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="600">分数膨胀</text>
    <text x="200" y="368" text-anchor="middle" font-size="11" fill="#3D4F65">含义丢失 · 难归因</text>

    <path d="M200,240 L200,295" stroke="#C97064" stroke-width="2" marker-end="url(#arR)" fill="none"/>
  </g>

  <!-- divider -->
  <line x1="400" y1="60" x2="400" y2="450" stroke="#D8DEE6" stroke-dasharray="4,4"/>

  <!-- RIGHT: After (additive Uniboost) -->
  <g>
    <text x="600" y="78" text-anchor="middle" font-size="14" fill="#2E7D5B" font-weight="600">Uniboost：独立加法</text>

    <!-- base -->
    <rect x="555" y="115" width="90" height="44" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="600" y="135" text-anchor="middle" font-size="12" fill="#1E3A5F">基础分 y</text>
    <text x="600" y="151" text-anchor="middle" font-size="10" fill="#3D4F65">完播率语义</text>

    <!-- plus signs and boxes -->
    <text x="478" y="252" font-size="22" fill="#4B8BDA">+</text>
    <rect x="495" y="225" width="80" height="44" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="535" y="245" text-anchor="middle" font-size="12" fill="#1E3A5F">广告 PID</text>
    <text x="535" y="261" text-anchor="middle" font-size="10" fill="#3D4F65">+0.15</text>

    <text x="588" y="252" font-size="22" fill="#4B8BDA">+</text>
    <rect x="605" y="225" width="80" height="44" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="645" y="245" text-anchor="middle" font-size="12" fill="#1E3A5F">冷启 Boost</text>
    <text x="645" y="261" text-anchor="middle" font-size="10" fill="#3D4F65">+0.00</text>

    <text x="698" y="252" font-size="22" fill="#4B8BDA">+</text>
    <rect x="715" y="225" width="70" height="44" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="750" y="245" text-anchor="middle" font-size="12" fill="#1E3A5F">运营 A</text>
    <text x="750" y="261" text-anchor="middle" font-size="10" fill="#3D4F65">+0.05</text>

    <!-- result -->
    <rect x="520" y="345" width="160" height="50" rx="8" fill="#E6F4EA" stroke="#2E7D5B" stroke-width="2"/>
    <text x="600" y="365" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">r = 0.60</text>
    <text x="600" y="382" text-anchor="middle" font-size="10" fill="#3D4F65">语义清晰 · 可归因</text>

    <!-- arrows from base/boosts to result -->
    <path d="M600,159 L600,345" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#ar)"/>
    <path d="M535,269 Q555,310 585,345" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M750,269 Q705,310 670,345" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <text x="400" y="475" text-anchor="middle" font-size="12" fill="#3D4F65">每个方案独立加分 → 拿掉即可看贡献</text>
</svg>
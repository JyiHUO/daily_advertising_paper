<svg height="600" width="960" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C95B4A"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">预测准 ≠ 归因对：图神经 MMM 的"归因绕过"</text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#3D4F65">低 MSE 可能掩盖解码器根本没走过那张图</text>

  <!-- Left side: predict path -->
  <g>
    <text x="180" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">预测视角 (MSE@7)</text>

    <rect x="70" y="106" width="220" height="56" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.2"/>
    <text x="180" y="129" text-anchor="middle" font-size="12" fill="#1E3A5F">no-graph · full-graph · oracle</text>
    <text x="180" y="149" text-anchor="middle" font-size="11" fill="#3D4F65">三种图输入，同款解码器</text>

    <line x1="180" y1="162" x2="180" y2="198" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="70" y="204" width="220" height="62" rx="8" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.2"/>
    <text x="180" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">MSE ≈ 0.004</text>
    <text x="180" y="247" text-anchor="middle" font-size="11" fill="#3D4F65">三者几乎不可区分，看似都很好</text>
    <text x="180" y="262" text-anchor="middle" font-size="11" fill="#3D4F65"></text>
  </g>

  <!-- Right side: attribution path -->
  <g>
    <text x="780" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">归因视角 (AR-CIG)</text>

    <rect x="670" y="106" width="220" height="56" rx="8" fill="#FBEDE8" stroke="#C95B4A" stroke-width="1.2"/>
    <text x="780" y="129" text-anchor="middle" font-size="12" fill="#1E3A5F">扰动渠道 → 看连锁反应</text>
    <text x="780" y="149" text-anchor="middle" font-size="11" fill="#3D4F65">敏感度是否沿图传导？</text>

    <line x1="780" y1="162" x2="780" y2="198" stroke="#C95B4A" stroke-width="1.5" marker-end="url(#arRed)"/>

    <rect x="670" y="204" width="220" height="62" rx="8" fill="#FFFFFF" stroke="#C95B4A" stroke-width="1.2"/>
    <text x="780" y="224" text-anchor="middle" font-size="11" fill="#3D4F65">no-graph: −0.005</text>
    <text x="780" y="242" text-anchor="middle" font-size="11" fill="#C95B4A">full-graph: −0.047</text>
    <text x="780" y="260" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="700">oracle: 0.807</text>
  </g>

  <!-- Center: the GAP / lens -->
  <g transform="translate(480,200)">
    <circle r="70" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
    <path d="M 0,-70 A 70,70 0 0,1 0,70 Z" fill="#FBEDE8" opacity="0.7"/>
    <path d="M 0,-70 A 70,70 0 0,0 0,70 Z" fill="#EFF6FF" opacity="0.7"/>
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="0" y="-8" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">归因绕过</text>
    <text x="0" y="14" text-anchor="middle" font-size="11" fill="#3D4F65">attribution bypass</text>
  </g>

  <!-- side connectors to lens -->
  <line x1="290" y1="234" x2="412" y2="200" stroke="#4B8BDA" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="670" y1="234" x2="548" y2="200" stroke="#C95B4A" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Lower section: DICE solution -->
  <g>
    <line x1="80" y1="320" x2="880" y2="320" stroke="#D5DCE5" stroke-width="1"/>
    <text x="480" y="350" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">DICE-MMM：把"找图"和"用图"分开</text>

    <!-- Stage 1 -->
    <rect x="100" y="370" width="220" height="110" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.4"/>
    <text x="210" y="396" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">阶段 1 · 学图</text>
    <text x="210" y="418" text-anchor="middle" font-size="11" fill="#3D4F65">受限解码器 + 图编码器</text>
    <text x="210" y="436" text-anchor="middle" font-size="11" fill="#3D4F65">不让强解码器把图带偏</text>
    <text x="210" y="462" text-anchor="middle" font-size="11" fill="#1E3A5F">→ 得到邻接矩阵 A</text>

    <line x1="322" y1="425" x2="368" y2="425" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
    <text x="345" y="416" text-anchor="middle" font-size="10" fill="#3D4F65">冻结</text>

    <!-- Stage 2 -->
    <rect x="372" y="370" width="220" height="110" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.4"/>
    <text x="482" y="396" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">阶段 2 · 用图</text>
    <text x="482" y="418" text-anchor="middle" font-size="11" fill="#3D4F65">图安全的高容量解码器</text>
    <text x="482" y="436" text-anchor="middle" font-size="11" fill="#3D4F65">跨节点通信必须穿过 A</text>
    <text x="482" y="462" text-anchor="middle" font-size="11" fill="#1E3A5F">禁止全局池化 / 隐空间偷看</text>

    <line x1="594" y1="425" x2="640" y2="425" stroke="#C95B4A" stroke-width="1.8" marker-end="url(#arRed)"/>
    <text x="617" y="416" text-anchor="middle" font-size="10" fill="#3D4F65">诊断</text>

    <!-- Diagnostic -->
    <rect x="644" y="370" width="216" height="110" rx="10" fill="#FBEDE8" stroke="#C95B4A" stroke-width="1.4"/>
    <text x="752" y="396" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">图交换测试</text>
    <text x="752" y="418" text-anchor="middle" font-size="11" fill="#3D4F65">冻解码器，只换输入图</text>
    <text x="752" y="444" text-anchor="middle" font-size="11" fill="#C95B4A">学到图: −0.044</text>
    <text x="752" y="463" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">换 oracle: 0.894</text>
  </g>

  <!-- bottom note -->
  <text x="480" y="540" text-anchor="middle" font-size="12" fill="#3D4F65">真正的瓶颈不是预测能力，也不是解码器容量</text>
  <text x="480" y="562" text-anchor="middle" font-size="12" font-weight="700" fill="#C95B4A">而是稀疏图支撑的无标签选择</text>
</svg>
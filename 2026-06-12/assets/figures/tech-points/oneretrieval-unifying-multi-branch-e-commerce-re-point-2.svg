<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#FAF7F2"/>

  <text x="300" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">码本预留空槽 · 上线后可绑新词</text>

  <!-- Codebook -->
  <rect x="60" y="70" width="480" height="200" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>

  <!-- filled slots -->
  <rect x="80" y="100" width="70" height="50" rx="4" fill="#DCE9F7" stroke="#4B8BDA"/>
  <text x="115" y="130" text-anchor="middle" font-size="13" fill="#1E3A5F">连衣裙</text>

  <rect x="160" y="100" width="70" height="50" rx="4" fill="#DCE9F7" stroke="#4B8BDA"/>
  <text x="195" y="130" text-anchor="middle" font-size="13" fill="#1E3A5F">球鞋</text>

  <rect x="240" y="100" width="70" height="50" rx="4" fill="#DCE9F7" stroke="#4B8BDA"/>
  <text x="275" y="130" text-anchor="middle" font-size="13" fill="#1E3A5F">手办</text>

  <text x="330" y="132" font-size="18" fill="#3D4F65">···</text>

  <!-- reserved slots -->
  <rect x="360" y="100" width="70" height="50" rx="4" fill="#FFF6E0" stroke="#E0A040" stroke-dasharray="4,3"/>
  <text x="395" y="130" text-anchor="middle" font-size="12" fill="#A86A20">预留空槽</text>

  <rect x="440" y="100" width="70" height="50" rx="4" fill="#FFF6E0" stroke="#E0A040" stroke-dasharray="4,3"/>
  <text x="475" y="130" text-anchor="middle" font-size="12" fill="#A86A20">预留空槽</text>

  <text x="195" y="180" text-anchor="middle" font-size="12" fill="#3D4F65">训练时已学会的词</text>
  <text x="435" y="180" text-anchor="middle" font-size="12" fill="#A86A20">训练时不绑词，学会原样输出</text>

  <line x1="80" y1="205" x2="520" y2="205" stroke="#C8B8A0" stroke-width="0.8"/>
  <text x="300" y="235" text-anchor="middle" font-size="13" fill="#1E3A5F" font-style="italic">码本 = 一本字典，最后几页留白</text>

  <!-- New word -->
  <rect x="50" y="320" width="170" height="70" rx="8" fill="#FBE8E0" stroke="#D96E4B" stroke-width="1.5"/>
  <text x="135" y="348" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">新热词 LABUBU</text>
  <text x="135" y="370" text-anchor="middle" font-size="12" fill="#D96E4B">运营写入词典</text>

  <!-- arrow up to reserved slot -->
  <path d="M 175 320 Q 175 230 390 155" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="220" y="270" font-size="12" fill="#4B8BDA">填入空槽</text>

  <!-- arrow to result -->
  <path d="M 220 355 L 378 355" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="299" y="348" text-anchor="middle" font-size="11" fill="#4B8BDA">索引刷新</text>

  <!-- Result -->
  <rect x="380" y="320" width="170" height="70" rx="8" fill="#E8F0E4" stroke="#6B9D5C" stroke-width="1.5"/>
  <text x="465" y="348" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">几小时内生效</text>
  <text x="465" y="370" text-anchor="middle" font-size="12" fill="#3D4F65">无需重训模型</text>
</svg>
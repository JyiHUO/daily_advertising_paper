<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9A86A"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E3A5F">图交换诊断：解码器到底看不看图？</text>
  <text x="400" y="58" text-anchor="middle" font-size="12" fill="#3D4F65">冻结解码器权重，只替换它推断时看到的图</text>

  <!-- Left scene: learned graph -->
  <g>
    <rect x="40" y="80" width="320" height="340" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="200" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">学到的稠密图</text>

    <g stroke="#9CB4CC" stroke-width="1">
      <line x1="110" y1="170" x2="200" y2="200"/>
      <line x1="110" y1="170" x2="290" y2="180"/>
      <line x1="110" y1="170" x2="200" y2="280"/>
      <line x1="200" y1="200" x2="290" y2="180"/>
      <line x1="200" y1="200" x2="290" y2="280"/>
      <line x1="200" y1="200" x2="110" y2="290"/>
      <line x1="290" y1="180" x2="290" y2="280"/>
      <line x1="110" y1="290" x2="200" y2="280"/>
      <line x1="200" y1="280" x2="290" y2="280"/>
    </g>
    <g fill="#4B8BDA">
      <circle cx="110" cy="170" r="8"/>
      <circle cx="200" cy="200" r="8"/>
      <circle cx="290" cy="180" r="8"/>
      <circle cx="110" cy="290" r="8"/>
      <circle cx="200" cy="280" r="8"/>
      <circle cx="290" cy="280" r="8"/>
    </g>

    <rect x="80" y="350" width="240" height="50" rx="8" fill="#ffffff" stroke="#C9A86A" stroke-width="1.5"/>
    <text x="200" y="370" text-anchor="middle" font-size="12" fill="#3D4F65">AR-CIG 归一化 AUPRC</text>
    <text x="200" y="391" text-anchor="middle" font-size="16" font-weight="700" fill="#B5651D">−0.044  ≈ 随机</text>
  </g>

  <!-- Decoder (frozen) in middle -->
  <g>
    <rect x="370" y="210" width="60" height="80" rx="10" fill="#1E3A5F"/>
    <text x="400" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#EFF6FF">解码器</text>
    <text x="400" y="258" text-anchor="middle" font-size="10" fill="#9CB4CC">权重冻结</text>
    <text x="400" y="278" text-anchor="middle" font-size="14" fill="#C9A86A">🔒</text>
  </g>

  <!-- Right scene: oracle graph -->
  <g>
    <rect x="440" y="80" width="320" height="340" rx="14" fill="#FBF5EA" stroke="#C9A86A" stroke-width="1.5"/>
    <text x="600" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">替换为 Oracle 真图</text>

    <g stroke="#C9A86A" stroke-width="2">
      <line x1="510" y1="170" x2="600" y2="200"/>
      <line x1="600" y1="200" x2="690" y2="180"/>
      <line x1="600" y1="200" x2="600" y2="280"/>
      <line x1="600" y1="280" x2="690" y2="280"/>
    </g>
    <g fill="#C9A86A">
      <circle cx="510" cy="170" r="8"/>
      <circle cx="600" cy="200" r="8"/>
      <circle cx="690" cy="180" r="8"/>
      <circle cx="510" cy="290" r="8"/>
      <circle cx="600" cy="280" r="8"/>
      <circle cx="690" cy="280" r="8"/>
    </g>

    <rect x="480" y="350" width="240" height="50" rx="8" fill="#ffffff" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="600" y="370" text-anchor="middle" font-size="12" fill="#3D4F65">AR-CIG 归一化 AUPRC</text>
    <text x="600" y="391" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">0.894  跳变 ↑</text>
  </g>

  <!-- arrows from graphs into frozen decoder -->
  <line x1="335" y1="250" x2="368" y2="250" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="465" y1="250" x2="432" y2="250" stroke="#C9A86A" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- bottom conclusion -->
  <text x="400" y="450" text-anchor="middle" font-size="13" fill="#1E3A5F"><tspan font-weight="700">瓶颈定位：</tspan>解码器有能力用图，问题出在“图本身学得太弱”</text>
</svg>
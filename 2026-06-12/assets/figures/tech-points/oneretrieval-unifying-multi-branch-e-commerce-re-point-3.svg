<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E89B4B"/>
    </marker>
  </defs>

  <text x="300" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E3A5F">先教字典，再教行为</text>
  <text x="300" y="52" text-anchor="middle" font-size="11" fill="#3D4F65">两件事必须分开训，否则互相干扰</text>

  <!-- Stage 1: dictionary -->
  <g>
    <rect x="60" y="90" width="200" height="180" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="160" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#4B8BDA">Stage 1 · 教字典</text>

    <!-- book icon -->
    <rect x="125" y="130" width="70" height="50" rx="3" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.3"/>
    <line x1="160" y1="130" x2="160" y2="180" stroke="#1E3A5F" stroke-width="1.3"/>
    <line x1="135" y1="144" x2="155" y2="144" stroke="#3D4F65" stroke-width="0.8"/>
    <line x1="135" y1="156" x2="155" y2="156" stroke="#3D4F65" stroke-width="0.8"/>
    <line x1="165" y1="144" x2="185" y2="144" stroke="#3D4F65" stroke-width="0.8"/>
    <line x1="165" y1="156" x2="185" y2="156" stroke="#3D4F65" stroke-width="0.8"/>

    <text x="160" y="210" text-anchor="middle" font-size="11" fill="#1E3A5F">码槽 ↔ 属性词</text>
    <text x="160" y="240" text-anchor="middle" font-size="10" fill="#3D4F65" font-style="italic">主管：召回质量</text>
  </g>

  <!-- Stage 2: behavior / routing -->
  <g>
    <rect x="340" y="90" width="200" height="180" rx="10" fill="#FFF4E6" stroke="#E89B4B" stroke-width="1.5"/>
    <text x="440" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#C97A2E">Stage 2 · 教行为</text>

    <text x="440" y="138" text-anchor="middle" font-size="10" fill="#3D4F65">点击/下单共现</text>

    <circle cx="395" cy="170" r="14" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.3"/>
    <text x="395" y="174" text-anchor="middle" font-size="10" fill="#1E3A5F">Q</text>
    <circle cx="485" cy="170" r="14" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.3"/>
    <text x="485" y="174" text-anchor="middle" font-size="10" fill="#1E3A5F">I</text>
    <line x1="409" y1="166" x2="471" y2="166" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="471" y1="178" x2="409" y2="178" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>

    <text x="440" y="210" text-anchor="middle" font-size="11" fill="#1E3A5F">query SID ↔ item SID</text>
    <text x="440" y="240" text-anchor="middle" font-size="10" fill="#3D4F65" font-style="italic">主管：编辑能力</text>
  </g>

  <!-- orthogonal indicator -->
  <line x1="260" y1="180" x2="340" y2="180" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="300" y="174" text-anchor="middle" font-size="10" fill="#1E3A5F" font-weight="bold">几乎正交</text>

  <!-- Bottom outcome -->
  <rect x="150" y="330" width="300" height="60" rx="8" fill="#F5F0FA" stroke="#7A5BA8" stroke-width="1.3"/>
  <text x="300" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">召回质量 + 实时可编辑</text>
  <text x="300" y="375" text-anchor="middle" font-size="10" fill="#3D4F65">缺一个，能力就塌</text>

  <line x1="180" y1="272" x2="240" y2="328" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="272" x2="360" y2="328" stroke="#E89B4B" stroke-width="1.5" marker-end="url(#arrO)"/>
</svg>
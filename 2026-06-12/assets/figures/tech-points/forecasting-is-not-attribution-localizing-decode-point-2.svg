<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A5F"/>
    </marker>
  </defs>

  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1E3A5F">DICE：先画对图，再上强解码器</text>

  <!-- Stage 1 -->
  <g>
    <rect x="50" y="60" width="320" height="360" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="210" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">阶段 1 · 学图</text>
    <text x="210" y="112" text-anchor="middle" font-size="11" fill="#3D4F65">弱解码器 + VAE 目标（重构 + KL）</text>

    <!-- pencil -->
    <text x="92" y="260" font-size="34">✏️</text>

    <!-- graph being drawn -->
    <g transform="translate(220,200)">
      <circle cx="0" cy="0" r="14" fill="#fff" stroke="#1E3A5F" stroke-width="1.5"/>
      <circle cx="70" cy="40" r="14" fill="#fff" stroke="#1E3A5F" stroke-width="1.5"/>
      <circle cx="20" cy="100" r="14" fill="#fff" stroke="#1E3A5F" stroke-width="1.5"/>
      <circle cx="90" cy="-30" r="14" fill="#fff" stroke="#1E3A5F" stroke-width="1.5"/>
      <line x1="11" y1="8" x2="56" y2="35" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
      <line x1="63" y1="52" x2="33" y2="88" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
      <line x1="14" y1="-8" x2="74" y2="-24" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
    </g>

    <text x="210" y="360" text-anchor="middle" font-size="12" fill="#3D4F65" font-style="italic">渠道有向边概率逐渐浮现</text>
    <text x="210" y="392" text-anchor="middle" font-size="11" fill="#3D4F65">弱解码器无力走捷径，梯度只能改图</text>
  </g>

  <!-- arrow between stages -->
  <path d="M375,240 L435,240" stroke="#1E3A5F" stroke-width="2" fill="none" marker-end="url(#arD)"/>
  <text x="405" y="230" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">冻结图与编码器</text>

  <!-- Stage 2 -->
  <g>
    <rect x="430" y="60" width="320" height="360" rx="14" fill="#FFF4EC" stroke="#D97757" stroke-width="1.5"/>
    <text x="590" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">阶段 2 · 用图预测</text>
    <text x="590" y="112" text-anchor="middle" font-size="11" fill="#3D4F65">强解码器，但消息只能走冻结的边</text>

    <!-- frozen graph with pins -->
    <g transform="translate(550,200)">
      <line x1="11" y1="8" x2="56" y2="35" stroke="#1E3A5F" stroke-width="2"/>
      <line x1="63" y1="52" x2="33" y2="88" stroke="#1E3A5F" stroke-width="2"/>
      <line x1="14" y1="-8" x2="74" y2="-24" stroke="#1E3A5F" stroke-width="2"/>
      <circle cx="0" cy="0" r="14" fill="#fff" stroke="#1E3A5F" stroke-width="1.5"/>
      <circle cx="70" cy="40" r="14" fill="#fff" stroke="#1E3A5F" stroke-width="1.5"/>
      <circle cx="20" cy="100" r="14" fill="#fff" stroke="#1E3A5F" stroke-width="1.5"/>
      <circle cx="90" cy="-30" r="14" fill="#fff" stroke="#1E3A5F" stroke-width="1.5"/>
      <text x="-8" y="-14" font-size="13">📌</text>
      <text x="62" y="26" font-size="13">📌</text>
      <text x="12" y="86" font-size="13">📌</text>
      <text x="82" y="-44" font-size="13">📌</text>
    </g>

    <!-- forbidden global pool -->
    <g transform="translate(470,348)">
      <ellipse cx="50" cy="10" rx="48" ry="13" fill="none" stroke="#D97757" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="50" y="14" text-anchor="middle" font-size="10" fill="#D97757">全局池化 / 跨节点偷看</text>
      <line x1="0" y1="-4" x2="100" y2="24" stroke="#D97757" stroke-width="2.2"/>
    </g>
    <text x="590" y="394" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">节点专属时序与记忆，预测必经此图</text>
  </g>

  <!-- bottom takeaway -->
  <text x="400" y="450" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">把"发现图"与"用图预测"分离 → 阻断归因绕过</text>
</svg>
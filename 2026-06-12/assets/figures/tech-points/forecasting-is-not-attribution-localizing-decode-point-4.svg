<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0504D"/>
    </marker>
  </defs>

  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">瓶颈：稀疏支撑选择</text>
  <text x="360" y="52" text-anchor="middle" font-size="12" fill="#3D4F65">边的后验排序里有信号，却筛不出真正的因果图</text>

  <!-- Left: dense edge soup -->
  <g>
    <circle cx="140" cy="250" r="92" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="140" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">候选边后验</text>
    <circle cx="100" cy="220" r="6" fill="#1E3A5F"/>
    <circle cx="180" cy="220" r="6" fill="#1E3A5F"/>
    <circle cx="100" cy="290" r="6" fill="#1E3A5F"/>
    <circle cx="180" cy="290" r="6" fill="#1E3A5F"/>
    <circle cx="140" cy="255" r="6" fill="#1E3A5F"/>
    <g stroke="#4B8BDA" stroke-width="1" opacity="0.55">
      <line x1="100" y1="220" x2="180" y2="220"/>
      <line x1="100" y1="220" x2="180" y2="290"/>
      <line x1="100" y1="220" x2="140" y2="255"/>
      <line x1="100" y1="220" x2="100" y2="290"/>
      <line x1="180" y1="220" x2="180" y2="290"/>
      <line x1="180" y1="220" x2="140" y2="255"/>
      <line x1="180" y1="220" x2="100" y2="290"/>
      <line x1="140" y1="255" x2="100" y2="290"/>
      <line x1="140" y1="255" x2="180" y2="290"/>
      <line x1="100" y1="290" x2="180" y2="290"/>
    </g>
  </g>

  <!-- Arrow left -> funnel -->
  <line x1="235" y1="250" x2="305" y2="240" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Filter (funnel) -->
  <g transform="translate(320,180)">
    <polygon points="0,20 140,20 100,100 40,100" fill="#FFF4E6" stroke="#E89B3C" stroke-width="1.5"/>
    <text x="70" y="10" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">筛选规则</text>
    <text x="70" y="50" text-anchor="middle" font-size="10.5" fill="#3D4F65">阈值 / 温度软化</text>
    <text x="70" y="66" text-anchor="middle" font-size="10.5" fill="#3D4F65">MSE容忍 / 稳定性</text>
    <text x="70" y="82" text-anchor="middle" font-size="10.5" fill="#3D4F65">（label-free）</text>
  </g>

  <!-- Right: outcome -->
  <g>
    <rect x="510" y="95" width="185" height="125" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="602" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">oracle 上限</text>
    <text x="602" y="162" text-anchor="middle" font-size="26" font-weight="700" fill="#2E7D4F">0.807</text>
    <text x="602" y="186" text-anchor="middle" font-size="11" fill="#3D4F65">真实图密度 top-k</text>
    <text x="602" y="203" text-anchor="middle" font-size="11" fill="#3D4F65">（不可部署）</text>

    <rect x="510" y="255" width="185" height="125" rx="8" fill="#FBECEC" stroke="#C0504D" stroke-width="1.5"/>
    <text x="602" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">label-free 实测</text>
    <text x="602" y="322" text-anchor="middle" font-size="26" font-weight="700" fill="#C0504D">≈ 0</text>
    <text x="602" y="346" text-anchor="middle" font-size="11" fill="#3D4F65">稳定性最佳仅 0.091</text>
    <text x="602" y="363" text-anchor="middle" font-size="11" fill="#3D4F65">硬阈值 → 近全连接</text>
  </g>

  <!-- Arrows from funnel -->
  <path d="M400,225 C450,195 480,170 508,158" fill="none" stroke="#4B8BDA" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  <path d="M400,260 C450,290 480,310 508,318" fill="none" stroke="#C0504D" stroke-width="2" marker-end="url(#arR)"/>

  <text x="360" y="432" text-anchor="middle" font-size="12" fill="#1E3A5F" font-style="italic">归因绕过的真正瓶颈：不是预测，不是解码器，而是这一道筛子</text>
</svg>
<svg height="960" width="1440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C75B5B"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">预测正确 ≠ 归因正确</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#3D4F65">解码器绕过渠道图，照样把 MSE 压低</text>

  <!-- Channel Graph -->
  <g>
    <rect x="60" y="120" width="220" height="260" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="170" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">渠道关系图</text>

    <line x1="110" y1="232" x2="162" y2="300" stroke="#4B8BDA" stroke-width="1.4"/>
    <line x1="230" y1="232" x2="178" y2="300" stroke="#4B8BDA" stroke-width="1.4"/>
    <line x1="132" y1="210" x2="208" y2="210" stroke="#4B8BDA" stroke-width="1.4" stroke-dasharray="3,3"/>

    <circle cx="110" cy="210" r="22" fill="#DCE9F7" stroke="#4B8BDA"/>
    <text x="110" y="214" text-anchor="middle" font-size="11" fill="#1E3A5F">抖音</text>

    <circle cx="230" cy="210" r="22" fill="#DCE9F7" stroke="#4B8BDA"/>
    <text x="230" y="214" text-anchor="middle" font-size="11" fill="#1E3A5F">搜索</text>

    <circle cx="170" cy="320" r="22" fill="#DCE9F7" stroke="#4B8BDA"/>
    <text x="170" y="324" text-anchor="middle" font-size="11" fill="#1E3A5F">品类</text>
  </g>

  <!-- Bypass arrow (red, curving over the graph to KPI) -->
  <path d="M 170,120 Q 380,80 540,210" fill="none" stroke="#C75B5B" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arRed)"/>
  <text x="380" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#C75B5B">捷径：自回归 / 共动，绕开图</text>

  <!-- Faint legitimate path -->
  <path d="M 282,260 L 536,260" fill="none" stroke="#4B8BDA" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#ar)"/>
  <text x="409" y="252" text-anchor="middle" font-size="11" fill="#4B8BDA" fill-opacity="0.7">本应走的因果路径</text>

  <!-- KPI -->
  <g>
    <rect x="540" y="200" width="200" height="120" rx="12" fill="#FFF4E6" stroke="#E0A458" stroke-width="1.5"/>
    <text x="640" y="232" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">KPI 预测</text>
    <text x="640" y="266" text-anchor="middle" font-size="12" fill="#3D4F65">MSE ≈ 0.004  ✓</text>
    <text x="640" y="292" text-anchor="middle" font-size="12" fill="#C75B5B">归因 AUPRC ≈ 0  ✗</text>
  </g>

  <!-- Bottom diagnosis -->
  <rect x="120" y="410" width="560" height="60" rx="10" fill="#F4F1EC" stroke="#8A7B6B" stroke-width="1.2"/>
  <text x="400" y="434" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">AR-CIG 诊断：扰动每个渠道，看预测如何变化</text>
  <text x="400" y="455" text-anchor="middle" font-size="11" fill="#3D4F65">敏感度图 vs 真实图 → 暴露解码器实际依赖的路径</text>
</svg>